<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>קורס אופציות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Amatic+SC:wght@700&display=swap">
<style>:root{
  --bg:#F3F7F6; --card:#FFFFFF; --ink:#12201E; --muted:#4F5E5B; --line:#DAE4E2; --axis:#93A3A0;
  --pri:#0E6B63; --pri-dark:#094C46; --pri-tint:#D6EFEB; --pri-track:#3B8A82; --pri-sub:#D3F0EC;
  --acc:#BF3F2B; --acc-ring:#F2A193; --streak:#AE3726;
  --loss:#AE3726; --loss-dark:#882A1C; --loss-tint:#FBE2DC; --disabled:#6B7976;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif}
button{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:100dvh}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px}
.stat{display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px}
.stat.streak{color:var(--streak);font-weight:800}
.stat.xp{color:var(--pri)}
.banner{margin:4px 20px 0;background:var(--pri);color:#fff;border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.banner .sub{font-size:13px;font-weight:500;color:var(--pri-sub)}
.banner h1{margin:0;font-size:24px;font-weight:800}
.bar{flex:1;height:8px;background:var(--pri-track);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:#fff;border-radius:99px}
.path{flex:1;display:flex;flex-direction:column;gap:12px;padding:22px 20px 10px}
.node{display:flex;align-items:center;gap:14px;border:0;background:transparent;text-align:right;padding:0;color:inherit;min-height:56px}
.node .dot{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.node.done .dot{background:var(--pri)}
.node.ready .dot{background:var(--acc);box-shadow:0 0 0 4px var(--acc-ring)}
.node.locked .dot{background:var(--line)}
.node .lbl{display:flex;flex-direction:column;gap:2px;font-size:15px;font-weight:500}
.node.locked .lbl{color:var(--muted)}
.node .lbl small{font-size:13px;color:var(--muted);font-weight:400}
.node.ready .lbl{font-weight:800;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.review{margin:0 20px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.btn{min-height:48px;border-radius:14px;border:0;font-weight:800;font-size:17px;padding:0 20px;cursor:pointer}
.btn.pri{background:var(--pri);color:#fff}
.btn.acc{background:var(--acc);color:#fff}
.btn.ghost{background:var(--card);color:var(--pri);border:2px solid var(--pri)}
.btn.ghost-loss{background:var(--card);color:var(--loss-dark);border:2px solid var(--loss)}
.btn.block{width:100%}
.btn:disabled{background:var(--disabled);color:#fff;cursor:default}
.lesson-top{display:flex;align-items:center;gap:12px;padding:14px 14px 6px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ltrack{flex:1;height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.ltrack>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.lbody{flex:1;display:flex;flex-direction:column;gap:14px;padding:8px 20px 12px}
.kicker{font-size:13px;font-weight:700;color:var(--pri)}
.prompt{margin:0;font-size:19px;font-weight:800;line-height:1.4}
.concept h2{margin:0 0 8px;font-size:22px;font-weight:800}
.concept p{margin:0 0 10px;font-size:17px;line-height:1.6}
.src{font-size:12px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.text{grid-template-columns:1fr}
.opt{min-height:54px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;font-weight:700;font-size:17px;padding:8px 12px;cursor:pointer;text-align:center}
.opts.text .opt{text-align:right;font-weight:500;font-size:16px}
.opt.sel{border-color:var(--pri);background:var(--pri-tint)}
.opt.right{border-color:var(--pri);background:var(--pri-tint);color:var(--pri-dark)}
.opt.wrong{border-color:var(--loss);background:var(--loss-tint);color:var(--loss-dark)}
.chart{display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart label{display:flex;justify-content:space-between;font-size:15px}
.chart input[type=range]{width:100%;min-height:36px;accent-color:var(--pri)}
.hint{font-size:13px;color:var(--muted)}
.foot{padding:12px 20px 22px}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fb.right{background:var(--pri-tint)}
.fb.wrong{background:var(--loss-tint)}
.fb b.t{font-size:18px;font-weight:800}
.fb.right b.t{color:var(--pri-dark)}
.fb.wrong b.t{color:var(--loss-dark)}
.fb p{margin:0;font-size:15px;line-height:1.55}
.done-wrap{flex:1;display:flex;flex-direction:column;gap:16px;padding:40px 20px 24px}
.big-check{width:96px;height:96px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;margin:0 auto}
.center{text-align:center}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats3 .card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px}
.stats3 b{font-size:22px;font-weight:800}
.stats3 span{font-size:12px;color:var(--muted);text-align:center}
.list p{margin:0 0 8px;font-size:15px;line-height:1.5}
.disc{font-size:12px;color:var(--muted);text-align:center}
.grow{flex:1}
.f{font-weight:700;white-space:nowrap}
.foot{position:sticky;bottom:0;background:var(--bg);z-index:2}
.chart input[type=range]{height:44px;margin:0}
.chart input[type=range]::-webkit-slider-thumb{width:30px;height:30px}
.chart input[type=range]::-moz-range-thumb{width:30px;height:30px}
.sheet-wrap{position:fixed;inset:0;background:rgba(18,32,30,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px 20px 28px;display:flex;flex-direction:column;gap:12px}
.node.open .dot{background:var(--pri-tint);border:2px solid var(--pri)}
.opts.charts .opt{padding:6px;min-height:96px}
.mini{width:100%;height:auto;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ext{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.ext b.neg{color:var(--loss-dark)} .ext b.pos{color:var(--pri-dark)}
.opts.charts .opt{position:relative}
.mini-l{position:absolute;top:6px;right:8px;font-size:14px;font-weight:800;color:var(--muted)}
.actions{position:sticky;bottom:0;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:10px 0 4px}
.analogy{border-color:var(--acc-ring)}
.an-k{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--streak);margin-bottom:6px}
.breaks{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:4px}
.breaks b{font-size:14px;color:var(--ink)} .breaks p{margin:4px 0 0;font-size:15px;line-height:1.55}

/* משחקים */
.vrange{display:flex;align-items:center;gap:10px}
.vrange input{flex:1;min-height:44px;accent-color:var(--acc)}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.term{min-height:84px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:10px;text-align:right;font-family:inherit;color:var(--ink);display:flex;flex-direction:column;gap:4px;cursor:pointer}
.term b{font-size:16px} .term small{font-size:12px;color:var(--muted)}
.term.got{border-color:var(--pri)} .term.locked{background:var(--line);color:var(--muted);cursor:default}
.term.open{background:var(--pri-tint)}
.post{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.post .who{display:flex;align-items:center;gap:8px;font-weight:800}
.post .av{width:36px;height:36px;border-radius:50%;background:#E9C46A}
.claim{display:block;width:100%;text-align:right;border:2px dashed transparent;background:transparent;border-radius:10px;padding:8px;font-family:inherit;font-size:16px;line-height:1.5;color:var(--ink);cursor:pointer}
.claim.mark{border-color:var(--acc);background:var(--loss-tint)}
.claim.hit{border-color:var(--pri);border-style:solid;background:var(--pri-tint)}
.claim.miss{border-color:var(--loss);border-style:solid}
.claim .why{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;color:var(--ink)}
.seg button.on{border-color:var(--pri);background:var(--pri-tint);color:var(--pri-dark)}

.lesson-top b{flex:1;text-align:center}
.term-link{font:inherit;font-weight:700;color:var(--pri-dark);background:none;border:0;padding:0;margin:0;cursor:pointer;text-decoration:underline dotted;text-decoration-thickness:2px;text-underline-offset:4px}
.prompt .term-link{font-weight:800}
/* סיכום מונפש */
.rc-segs{display:flex;gap:4px;padding:10px 14px 0}
.rc-seg{flex:1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.rc-seg i{display:block;height:100%;background:var(--pri);width:0}
.rc-title{margin:4px 0 0;font-size:26px;font-weight:800}
.rc-text{margin:0;font-size:18px;line-height:1.65;animation:rcIn .5s ease both}
.rc-chart{animation:rcIn .4s ease both}
.rc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;animation:rcIn .4s ease both}
.rc-mini{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px}
.rc-mini b{font-size:15px}
.rc-big{width:96px;height:96px;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;margin:24px auto 8px;animation:rcPop .6s ease both}
.rc-ctrl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px}
.rc-ctrl .btn{padding:0;font-size:22px}
.rc-ctrl #rc-play,.rc-ctrl #rc-again{font-size:17px}
.rc-be{transition:opacity .4s}
@keyframes rcIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rcPop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.rc-text,.rc-chart,.rc-grid,.rc-big{animation:none}}
/* גמא והלוח */
.board{--chalk:#F4F1E6;--axis:rgba(244,241,230,.45);--muted:rgba(244,241,230,.8);--ink:#F4F1E6;--pri:#F7D774;--pri-dark:#F7D774;--loss-tint:rgba(242,161,147,.18);--loss-dark:#F6B4A6;--line:rgba(244,241,230,.25);
  background:#1E3B37;border:8px solid #8B5E34;border-radius:14px;padding:12px 14px 14px;color:var(--chalk);box-shadow:inset 0 0 30px rgba(0,0,0,.35)}
.chalk-title{margin:0 0 4px;font-family:'Amatic SC','Heebo',sans-serif;font-size:34px;font-weight:700;color:#F7D774;letter-spacing:.5px}
.chalk-text{display:flex;flex-direction:column;gap:2px}
.chalk-line{margin:0;font-family:'Amatic SC','Heebo',sans-serif;font-weight:700;font-size:25px;line-height:1.35;color:var(--chalk);clip-path:inset(0 0 0 100%);animation:chalkWrite 1.2s ease-out forwards}
.chalk-line .f,.chalk-line b{color:#F7D774}
.board .term-link{color:#F7D774;text-decoration-color:rgba(247,215,116,.7)}
.board .rc-chart svg polyline{stroke-width:5;filter:drop-shadow(0 0 1px rgba(255,255,255,.4))}
.board .rc-mini{background:rgba(255,255,255,.06);border:1px dashed rgba(244,241,230,.35);border-radius:10px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;animation:rcIn .5s ease forwards}
.board .rc-mini b{font-family:'Amatic SC','Heebo',sans-serif;font-size:22px;color:var(--chalk)}
@keyframes chalkWrite{to{clip-path:inset(0 0 0 0)}}
.host{display:flex;align-items:flex-end;gap:8px;margin-top:-4px}
.gamma{width:96px;height:auto;flex:none;overflow:visible}
.gamma .g-body{transform-origin:62px 150px;animation:gBob 2.6s ease-in-out infinite}
.gamma .g-eyes{transform-origin:62px 50px;animation:gBlink 4.2s infinite}
.gamma.talking .g-mouth{animation:gTalk .28s ease-in-out infinite alternate}
.host.point .g-stick{transform-origin:104px 24px;animation:gPoint 1.6s ease-in-out infinite}
.host.wave .g-stick{transform-origin:104px 24px;animation:gWave .9s ease-in-out 3}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:16px 16px 4px 16px;padding:10px 12px;font-size:15px;line-height:1.5;margin-bottom:28px;animation:rcIn .4s ease both}
.bubble b{color:var(--streak)}
.screen.rc.paused .gamma *, .screen.rc.paused .chalk-line, .screen.rc.paused .rc-mini{animation-play-state:paused}
@keyframes gBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes gBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes gTalk{from{transform:scaleY(.4)}to{transform:scaleY(1.3)}}
.gamma .g-mouth{transform-box:fill-box;transform-origin:center}
@keyframes gPoint{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes gWave{0%,100%{transform:rotate(0)}50%{transform:rotate(-30deg)}}
@media (prefers-reduced-motion: reduce){.chalk-line{animation:none;clip-path:none}.gamma *{animation:none!important}.board .rc-mini{animation:none;opacity:1}}
.host.wave .gamma{width:150px}.host.wave{justify-content:flex-start}
/* גמא כעוזרת הוראה */
.g-say{display:flex;align-items:flex-end;gap:6px}
.g-say .gamma{width:52px}
.g-say.g-md .gamma{width:76px}
.g-say .bubble{margin-bottom:6px;font-size:14px;padding:8px 10px}
.fb .g-say .bubble{background:rgba(255,255,255,.75)}
.done-gamma{display:flex;flex-direction:column;align-items:center;gap:6px;width:auto;height:auto;background:none;border-radius:0;margin:0 auto}
.done-gamma .gamma{width:120px}
.done-gamma .bubble{margin-bottom:0}
.f-he{white-space:normal}
.term-link{display:inline}
.g-mini{font-size:14px;line-height:1.5;color:var(--ink);background:var(--pri-tint);border-radius:10px;padding:6px 10px;margin-bottom:6px}
.opts.charts .opt{min-height:80px}
.guru-how{font-size:15px;color:var(--ink);font-weight:600;margin-bottom:6px}
.claim.unmarked{border:2px solid var(--line);background:var(--card);margin-bottom:6px}
.claim.mark{margin-bottom:6px}
.claim.unmarked::before,.claim.mark::before{content:"";display:inline-block;width:16px;height:16px;border:2px solid var(--muted);border-radius:4px;vertical-align:-3px;margin-left:8px}
.claim.mark::before{background:var(--acc);border-color:var(--acc)}
.term small{font-size:14px;line-height:1.5} .term small b{font-size:inherit}
.card.out{border:2px solid var(--loss);margin:0 16px 10px}
.node.nohearts .dot{background:var(--loss-tint)}
.node.nohearts .lbl{color:var(--muted)}
.cmcq svg{max-height:190px} .cmcq{gap:4px;padding-top:8px;padding-bottom:8px}
.screen.rc.paused .chalk-line{animation:none;clip-path:none}
/* שרשרת אופציות */
.chainbox{padding:10px 8px;gap:8px;display:flex;flex-direction:column}
.ch-head{display:flex;align-items:baseline;gap:8px;font-size:17px;padding:0 4px}
.ch-head span:not(.ch-note){font-weight:700}
.ch-note{margin-left:auto;font-size:12px;color:var(--muted);direction:rtl}
.ch-exps{display:flex;gap:6px;padding:0 4px}
.chip{min-height:36px;padding:0 14px;border-radius:18px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:700;font-size:14px;color:var(--ink)}
.chip.on{border-color:var(--pri);background:var(--pri-tint);color:var(--pri-dark)}
.chip:disabled,.ch-views button:disabled{opacity:.45}
.ch-views button{min-height:40px;font-size:15px}
table.chain{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;table-layout:fixed}
table.chain th{font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 2px;text-align:right;border-bottom:1px solid var(--line)}
table.chain th:first-child{text-align:left}
table.chain td{padding:0 2px;height:40px;text-align:right;border-bottom:1px solid var(--line)}
table.chain td.k{text-align:left;font-weight:800}
table.chain tr.itm td{background:var(--pri-tint)}
table.chain tr.hl td{box-shadow:inset 0 2px 0 var(--acc),inset 0 -2px 0 var(--acc)}
table.chain td button{width:100%;height:38px;border:2px solid transparent;border-radius:8px;background:none;font:inherit;color:var(--ink);text-align:right;padding:0 3px;cursor:pointer}
table.chain td button:not(:disabled){border-color:var(--line);background:rgba(255,255,255,.7)}
table.chain td.sel button{border-color:var(--pri);background:var(--card);font-weight:800}
table.chain td.right button{border-color:var(--pri);background:var(--pri);color:#fff;font-weight:800}
table.chain td.wrong button{border-color:var(--loss);background:var(--loss-tint);font-weight:800}
table.chain tr.pxline td{height:auto;padding:0;border-bottom:0}
table.chain tr.pxline span{display:block;border-top:2px solid var(--acc);color:var(--acc);font-size:12px;font-weight:800;text-align:left;padding:1px 4px}
.ch-legend{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 4px}
.ch-legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--pri-tint);border:1px solid var(--pri)}
.nw{white-space:nowrap}
bdi{white-space:nowrap}
table.chain td.k button{text-align:left;font-weight:800}
.t-read{display:flex;justify-content:space-between;gap:8px;font-size:14px;flex-wrap:wrap}
.vrange-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ticket{display:flex;flex-direction:column;gap:8px}
.tk-name{font-size:20px;font-weight:800;text-align:center;color:var(--pri-dark);padding:6px 0}
.pricer{display:flex;flex-direction:column;gap:10px}
.pc-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.pc span{font-size:13px;color:var(--muted)} .pc b{font-size:24px} .pc small{font-size:13px;font-weight:700}
.pc small.up{color:var(--pri-dark)} .pc small.down{color:var(--loss-dark)}
.psl{display:flex;flex-direction:column;gap:2px;font-size:14px}
.psl input{width:100%;min-height:36px;accent-color:var(--pri)}
.pg{display:flex;flex-direction:column;gap:1px;margin-top:4px;font-size:13px;font-variant-numeric:tabular-nums}
.pg i{font-style:normal;color:var(--muted);display:inline-block;min-width:46px}
.gtab td,.gtab th{text-align:right}
.gtab td:first-child,.gtab th:first-child{text-align:left;font-weight:700}
.gtab tr.tot td{font-weight:800;border-top:2px solid var(--ink)}

.back-btn{color:var(--pri)}
.back-btn[disabled]{opacity:.25;cursor:default}
.peek-note{font-size:13px;color:var(--mute,#5b6b68);text-align:center;margin-bottom:8px}
.peeknav{display:flex;gap:10px;margin-top:10px}
.peeknav .btn{flex:1}
.peeknav .btn[disabled]{opacity:.4}

.pctx{margin:0;font-size:17px;line-height:1.55;color:var(--ink)}
.term-link{white-space:nowrap}
.foot::before{content:'';position:absolute;left:0;right:0;top:-18px;height:18px;background:linear-gradient(to bottom,rgba(243,247,246,0),var(--bg));pointer-events:none}

.hint.legs{display:flex;flex-direction:column;gap:1px}

/* סיכומי יחידה: עמודות, קו "היום", סימון */
.rc-bars{display:flex;flex-direction:column;gap:10px;margin:6px 0 8px;animation:rcIn .4s ease both}
.rc-bar{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px;row-gap:3px}
.rc-bar span{grid-column:1 / -1;font-family:'Amatic SC','Heebo',sans-serif;font-weight:700;font-size:23px;color:var(--chalk);line-height:1.2}
.rc-bar .trk{height:18px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden}
.rc-bar .trk i{display:block;height:100%;width:0;border-radius:6px;background:#F7D774;animation:rcBar .9s ease-out forwards}
.rc-bar.neg .trk i{background:#F6B4A6}
.rc-bar b{font-size:17px;color:var(--chalk);min-width:64px;text-align:left}
@keyframes rcBar{to{width:var(--w)}}
.rc-leg{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--muted);margin-top:-2px}
.rc-leg span::before{content:'';display:inline-block;width:22px;margin-inline-end:6px;vertical-align:middle;border-top:4px solid #F7D774}
.rc-leg .l2::before{border-top:3px dashed var(--chalk)}
.rc-mark{transition:opacity .4s}
.screen.rc.paused .rc-bar .trk i{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.rc-bar .trk i{animation:none;width:var(--w)}.rc-bars{animation:none}}

/* קלף מילון פתוח: רוחב מלא, הגדרה ואחריה הסבר במילים אחרות */
.term.open{grid-column:1/-1}
.term small .alt{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--ink)}
.term small .from{display:block;margin-top:8px}

/* סיכום יחידה במסך נמוך (טלפון קטן): מצמצמים כדי שהלוח והבועה ייכנסו מעל הכפתורים בלי גלילה */
@media (max-height:700px){
  .screen.rc .lesson-top{padding-top:4px;padding-bottom:4px}
  .screen.rc .board{padding:8px 12px 10px;border-width:6px}
  .screen.rc .chalk-title{font-size:26px;margin:0}
  .screen.rc .chalk-line{font-size:20px;line-height:1.3}
  .screen.rc .rc-chart svg{max-height:172px}
  .screen.rc .host .gamma{display:none}
  .screen.rc .host{margin-top:6px}
  .screen.rc .bubble{margin-bottom:0;border-radius:14px;font-size:14px;padding:8px 10px}
  .screen.rc .rc-bar{margin:2px 0}
}
/* יעדי לחיצה: לפחות 44 פיקסלים */
.chip{min-height:44px}

ות, זמן**.\nאין מבנה שמרוויח בכל מצב.","say":"לכל גרף שראיתם יש אזור של הפסד. תמיד תחפשו אותו."},{"kind":"end","dur":4500,"title":"מה הלאה?","text":"יחידה 6: מסחר בפועל.","say":"מצוין! ביחידה 6 נראה איך כל זה נראה אצל הברוקר."}]},"lessonIds":["5.1","5.2","5.3","5.4","5.5","5.6","5.7","5.8","5.9","5.10"]},{"id":"6","track":"מסלול בסיס","title":"מסחר בפועל","recap":{"id":"recap-6","unit":"6","title":"יחידה 6 בפחות מדקה","host":"גמא","scenes":[{"kind":"title","dur":4000,"title":"יחידה 6 בפחות מדקה","text":"מהתיאוריה למסך של הברוקר.","say":"היחידה האחרונה במסלול הבסיס. בואו נסכם."},{"kind":"bars","dur":8500,"bars":[{"label":"קניתם ב־Ask","v":230},{"label":"מכרתם מיד ב־Bid","v":220,"tone":"neg"}],"title":"השרשרת","text":"קונים ב־**Ask**: {b0}. מוכרים ב־**Bid**: {b1}.\nההפרש הוא עלות, בכל רגל.","say":"המחירים בשרשרת הם לאופציה. חוזה מכסה מאה מניות."},{"kind":"text","dur":9000,"title":"הפקודות","text":"**Buy to Open** ואז **Sell to Close**: קונים, וסוגרים.\n**Sell to Open** ואז **Buy to Close**: כותבים, וסוגרים.\nפקודה **מוגבלת** קובעת מחיר. פקודת שוק לא.","say":"באופציות, פקודת שוק יכולה לעלות ביוקר."},{"kind":"bars","dur":8500,"bars":[{"label":"רווח מקסימלי של Iron Condor","v":200},{"label":"עמלות ומרווחים","v":48,"tone":"neg"}],"title":"עלויות","text":"רווח מקסימלי: {b0}. עלויות: {b1}.\nארבע רגליים: עמלה ומרווח על כל אחת, הלוך וחזור.","say":"העלויות כמעט ודאיות. הרווח המקסימלי לא."},{"kind":"bars","dur":8500,"bars":[{"label":"הביטחונות שהברוקר נועל","fn":"nakedMargin","args":{"type":"put","S":100,"K":95,"prem":2}},{"label":"ההפסד המקסימלי","fn":"maxLoss","args":{"type":"put","side":"short","K":95,"prem":2,"mult":100},"tone":"neg"}],"title":"ביטחונות","text":"הברוקר נועל {b0}. ההפסד המקסימלי: {b1}.\nביטחונות הם **לא** תקרת ההפסד.","say":"והדרישה עולה בדיוק כשהמניה זזה נגדכם."},{"kind":"text","dur":9000,"title":"פקיעה והקצאה","text":"בתוך הכסף בסנט אחד: **מימוש אוטומטי**.\nבאופציה אמריקאית, כותב יכול לקבל **הקצאה** בכל יום.\nקרוב למימוש בפקיעה: **Pin Risk**.","say":"מי שלא רוצה הפתעות, סוגר לפני הפקיעה."},{"kind":"text","dur":7500,"title":"היווניות בשרשרת","text":"IV, Delta, Theta ו־Vega הן עמודות בשרשרת.\nהיווניות מוצגות **לאופציה**. לחוזה: כפול מאה.\nה־IV היא אחוז שנתי, ואותה לא מכפילים.","say":"ויווניות של פוזיציה שלמה הן סכום הרגליים."},{"kind":"end","dur":5000,"title":"סיימתם את מסלול הבסיס","text":"הבא בתור: המסלול המתקדם.","say":"כל הכבוד! עברתם דרך ארוכה. אני גאה בכם."}]},"lessonIds":["6.1","6.2","6.3","6.4","6.5","6.6","6.7","6.8","6.9","6.10","6.11","6.12"]}],"lessons":[{"id":"1.0","title":"מה הקורס הזה, ומה הוא לא","minutes":3,"objective":"לדעת שהקורס מלמד להבין ולא מוכר שיטה, שאין בו המלצות לפעולה ואינו ייעוץ השקעות, שהמספרים לפני עמלות, ואיך השיעורים עובדים.","items":[{"id":"1.0-c1","type":"concept","title":"מה תמצאו כאן, ומה לא","body":"הקורס הזה מלמד **להבין** אופציות: איך הן עובדות, כמה הן עולות ואיך מפסידים בהן. הוא **לא מוכר שיטה** ולא מבטיח רווח.\n\nאין כאן **המלצות לפעולה**: לא נגיד לכם מה לקנות, מה למכור או מתי. התוכן **חינוכי בלבד ואינו ייעוץ השקעות**.\n\nבכל אסטרטגיה נראה גם **מתי היא מפסידה** ומה ההפסד המקסימלי שלה. כל המספרים בדוגמאות הם **לפני עמלות**, ובלי הפער בין מחיר הקנייה למחיר המכירה במסך (נלמד עליו ביחידה 2).","source":"עקרונות הקורס"},{"id":"1.0-q1","type":"mcq","prompt":"מה המטרה של הקורס הזה?","options":[{"text":"ללמד להבין איך אופציות עובדות, כולל איך מפסידים בהן"},{"text":"ללמד שיטה שמייצרת רווח קבוע"},{"text":"להמליץ על אופציות לקנות השבוע"}],"correct":0,"explain":{"right":"הקורס מלמד הבנה. הוא לא מבטיח רווח, ולכן גם לא מוכר שיטה.","wrong":"אין כאן שיטה שמבטיחה רווח, ואין המלצות על מה לקנות. המטרה היא להבין איך אופציות עובדות, כולל מתי ואיך מפסידים בהן."},"source":"עקרונות הקורס","tip":"היי, אני גמא! אני אלווה אתכם לאורך הקורס עם טיפים קטנים."},{"id":"1.0-q2","type":"mcq","prompt":"באחד השיעורים מופיעה עסקה לדוגמה שמסתיימת ברווח. מה זה אומר לגביכם?","options":[{"text":"זו דוגמה ללימוד. היא לא המלצה ולא ייעוץ השקעות"},{"text":"זו המלצה לפתוח עכשיו את אותה עסקה"},{"text":"זה הרווח שאפשר לצפות לו בעסקה כזו"}],"correct":0,"explain":{"right":"הדוגמאות נועדו להבין את החישוב. באותו שיעור תראו גם מתי אותה עסקה מפסידה.","wrong":"דוגמה בשיעור היא תרגיל בחישוב, לא המלצה ולא תחזית. אותה עסקה יכולה גם להפסיד, ובכל שיעור נראה מתי. הקורס חינוכי בלבד ואינו ייעוץ השקעות."},"source":"עקרונות הקורס"},{"id":"1.0-c2","type":"concept","title":"איך השיעורים עובדים","body":"כל שיעור קצר, **3–5 דקות**: כרטיס הסבר, ואחריו שאלות עם משוב מיידי.\n\n**טעיתם?** תקבלו הסבר, והשאלה **תחזור בסוף השיעור**. היא תיכנס גם ל**תרגול החוזר**. כל טעות בשיעור עולה **לב** אחד. בתרגול החוזר טעות לא עולה לב, וכל תשובה נכונה מחזירה לב. הלבבות מתמלאים מחדש כל יום.\n\n**XP** מקבלים על כל שיעור שמסיימים, ועוד נקודה על כל תשובה נכונה בניסיון הראשון. **רצף (Streak)** סופר כמה ימים ברציפות למדתם. שניהם מודדים התמדה בלמידה, לא הצלחה במסחר.\n\n**מונח עם קו מקווקו מתחתיו?** לחצו עליו, ותקפוץ כרטיסייה קצרה שמסבירה אותו.","source":"עקרונות הקורס"},{"id":"1.0-q4","type":"mcq","prompt":"עניתם לא נכון על שאלה. מה קורה עכשיו?","options":[{"text":"מקבלים הסבר, והשאלה חוזרת בסוף השיעור ובתרגול החוזר"},{"text":"השיעור נפסל ומתחילים אותו מההתחלה"},{"text":"ממשיכים הלאה, והשאלה לא תופיע שוב"}],"correct":0,"explain":{"right":"טעות היא חלק מהלמידה. ההסבר מגיע מיד, והשאלה חוזרת כדי שתוכלו לנסות שוב.","wrong":"טעות לא פוסלת את השיעור, וגם לא נעלמת. מקבלים הסבר, והשאלה חוזרת בסוף השיעור ונכנסת לתרגול החוזר. הטעות עולה לב אחד."},"source":"עקרונות הקורס"}],"summary":["הקורס מלמד **להבין** אופציות. הוא לא מוכר שיטה ולא מבטיח רווח.","אין בו **המלצות לפעולה**, והוא **אינו ייעוץ השקעות**.","המספרים בדוגמאות הם **לפני עמלות**.","טעות עולה לב, והשאלה **חוזרת** בסוף השיעור ובתרגול החוזר."],"ready":true,"unit":"1"},{"id":"1.1","title":"מה זו אופציה","minutes":4,"objective":"להסביר את ההבדל בין הזכות של הקונה לחובה של המוכר, מהי פרמיה, ומהם נכס בסיס, מחיר מימוש, תאריך פקיעה, Call ו־Put.","items":[{"id":"1.1-c1","type":"concept","title":"זכות מול חובה","body":"אופציה (Option) היא **חוזה** שנותן זכות **לקנות או למכור** נכס מסוים, למשל 100 מניות של Apple, במחיר שנקבע מראש. הנכס נקרא **נכס הבסיס (Underlying)**.\n\n**הקונה (Buyer)**, שנקרא גם **מחזיק (Holder)**, מקבל **זכות, לא חובה**. הוא מחליט אם להשתמש בה.\nהצד השני, שיוצר את האופציה ומוכר אותה, נקרא **כותב (Writer)**, והוא מקבל **חובה**: אם משתמשים בזכות, הוא חייב לעמוד בחוזה.\n\nעל הזכות הקונה משלם מחיר שנקרא **פרמיה (Premium)**. הפרמיה נשארת אצל הכותב, גם אם לא ישתמשו בזכות.","source":"OCC, Characteristics and Risks of Standardized Options: הגדרות"},{"id":"1.1-a1","type":"analogy","title":"שובר שנועל מחיר","body":"נניח שטלוויזיה עולה היום **$2,000**, וקניתם תמורת $50 **שובר** שמאפשר לקנות אותה במחיר $2,000 עד סוף החודש, גם אם המחיר בחנות יעלה.\n\nהשובר נותן לכם **זכות, לא חובה**: אם הטלוויזיה תתייקר עד $2,400, תשתמשו בו. אם היא תוזל עד $1,800, פשוט לא תשתמשו בו.\n\n$50 הם ה**פרמיה**. $2,000 הוא **מחיר המימוש**. סוף החודש הוא **תאריך הפקיעה**. והחנות שחייבת לכבד את השובר היא ה**כותב**. (זה מקביל ל־Call, זכות לקנות. זכות למכור, Put, נלמד בשיעור 1.3.)","breaks":"שובר בדרך כלל אי אפשר למכור למישהו אחר, ואת האופציה אפשר למכור בשוק בכל רגע עד הפקיעה. ובבורסה ה\"חנות\" היא לא החברה עצמה: כל משקיע שהברוקר אישר לו יכול לכתוב אופציה."},{"id":"1.1-l1","type":"mcq","life":true,"prompt":"קניתם במחיר $50 שובר שמאפשר לקנות טלוויזיה במחיר $2,000 עד סוף החודש. בסוף החודש היא עולה בחנות $1,900. מה הכי הגיוני לעשות?","options":[{"text":"לא להשתמש בשובר. ההפסד שלי הוא $50 ששילמתי עליו"},{"text":"לקנות במחיר $2,000, כי התחייבתי"},{"text":"לבקש מהחנות להחזיר לי את $50"},{"text":"לקנות במחיר $1,900 ולקבל מהחנות עוד $100"}],"correct":0,"explain":{"right":"לשובר יש **זכות, לא חובה**. אם המחיר בחנות נמוך ממחיר השובר, פשוט לא משתמשים בו, וזה בדיוק מה שקורה ל־Call כשהמניה מתחת למימוש: הוא פוקע, ומפסידים רק את הפרמיה.","wrong":"השובר נותן **זכות, לא חובה**, ואת הכסף ששילמתם עליו לא מקבלים בחזרה. כשהטלוויזיה זולה יותר בחנות, לא משתמשים בשובר ומפסידים רק את $50. כך גם Call שפוקע מתחת למימוש."},"source":"דוגמה מהחיים"},{"id":"1.1-q1","type":"mcq","prompt":"מה מקבל מי שקונה אופציה?","options":[{"text":"זכות, לא חובה"},{"text":"חובה לעמוד בחוזה"},{"text":"את נכס הבסיס עצמו, מיד"},{"text":"החזר של הפרמיה אם לא ישתמש בזכות"}],"correct":0,"explain":{"right":"הקונה מחליט אם להשתמש בזכות. החובה נמצאת אצל הצד השני: המוכר.","wrong":"קונה האופציה מקבל זכות, לא חובה: הוא בוחר אם להשתמש בה. את נכס הבסיס הוא לא מקבל מראש, ואת הפרמיה הוא לא מקבל בחזרה."},"source":"OCC ODD: הגדרות בסיסיות"},{"id":"1.1-q2","type":"mcq","prompt":"הקונה החליט להשתמש בזכות שלו. מה המצב של הכותב?","options":[{"text":"הוא חייב לעמוד בחוזה"},{"text":"הוא יכול לסרב"},{"text":"הוא מחזיר לקונה את הפרמיה ויוצא מהחוזה"}],"correct":0,"explain":{"right":"הכותב קיבל פרמיה, ובתמורה לקח על עצמו חובה. כשמממשים והוא מקבל הקצאה, הוא לא יכול לסרב.","wrong":"כותב האופציה מקבל חובה, לא זכות. הוא לא יכול לסרב, והפרמיה נשארת אצלו: זו התמורה שקיבל על החובה."},"source":"OCC ODD: הגדרות בסיסיות"},{"id":"1.1-c2","type":"concept","title":"מימוש, פקיעה ו־100 מניות","body":"בכל חוזה כתובים שני פרטים קבועים:\n**מחיר המימוש (Strike)**: המחיר הקבוע שבו אפשר לקנות או למכור את נכס הבסיס.\n**תאריך הפקיעה (Expiration)**: עד מתי הזכות קיימת. אחריו האופציה **פוקעת** והזכות נעלמת.\n\nלהשתמש בזכות נקרא **לממש (Exercise)**.\n\nחוזה אופציות על מניה בארה\"ב הוא בדרך כלל על **100 מניות**, והפרמיה שמופיעה במסך הברוקר היא **לאופציה אחת**, כלומר על מניה אחת מתוך ה־100.\n\nשני דברים חשובים: אפשר פשוט **למכור את האופציה** בשוק לפני הפקיעה, וזו הדרך הנפוצה לצאת ממנה. ואופציה ששווה במימוש ביום הפקיעה לפחות סנט אחד **ממומשת אוטומטית**, גם אם העסקה כולה בהפסד, אלא אם הוריתם לברוקר אחרת. נרחיב ביחידה 6.\n\nבבורסה, מסלקה בשם **OCC** עומדת בין הקונים לכותבים ומבטיחה את קיום החוזה גם אם צד אחד לא עומד בו.","source":"OCC, Characteristics and Risks of Standardized Options: הגדרות; Cboe: מפרט חוזה, מכפיל 100"},{"id":"1.1-q3","type":"mcq","prompt":"מה זה מחיר המימוש (Strike)?","options":[{"text":"המחיר הקבוע בחוזה, שבו אפשר לקנות או למכור את נכס הבסיס"},{"text":"המחיר שמשלמים על האופציה עצמה"},{"text":"מחיר המניה בשוק ביום הפקיעה"}],"correct":0,"explain":{"right":"מחיר המימוש קבוע בחוזה, ולא זז כשמחיר המניה בשוק זז. (הוא יכול להשתנות רק בהתאמה לאירוע מיוחד בחברה, כמו פיצול מניות.)","wrong":"המחיר שמשלמים על האופציה הוא הפרמיה, ומחיר המניה בשוק משתנה כל הזמן. מחיר המימוש הוא המחיר הקבוע שכתוב בחוזה, שבו אפשר לקנות או למכור את נכס הבסיס."},"source":"OCC ODD: הגדרות בסיסיות"},{"id":"1.1-q4","type":"mcq","prompt":"ליד אופציה על מניה מופיעה במסך פרמיה של $2. כמה תשלמו על חוזה אחד?","fmt":"usd","options":[{"v":2},{"v":20},{"v":200},{"v":2000}],"correct":2,"check":{"fn":"premiumCost","args":{"prem":2,"mult":100}},"explain":{"right":"הפרמיה במסך היא לאופציה אחת, וחוזה מכסה 100 מניות: `$2 × 100 = $200`, לפני עמלות.","wrong":"המחיר במסך הוא לאופציה אחת, אבל חוזה אחד מכסה 100 מניות. לכן משלמים `$2 × 100 = $200`, לפני עמלות."},"source":"Cboe, מפרט חוזה אופציות על מניות: מכפיל 100"},{"id":"1.1-q5","type":"mcq","prompt":"מה קורה לזכות של הקונה אחרי תאריך הפקיעה?","options":[{"text":"האופציה פוקעת, והזכות כבר לא קיימת"},{"text":"היא מתחדשת אוטומטית לתאריך הבא"},{"text":"היא נשארת בתוקף כל עוד המניה נסחרת"}],"correct":0,"explain":{"right":"לכל אופציה יש תאריך סיום. אחריו אי אפשר עוד לממש אותה.","wrong":"אופציה לא מתחדשת מעצמה. אחרי תאריך הפקיעה היא פוקעת, והזכות כבר לא קיימת."},"source":"OCC ODD: הגדרות בסיסיות"},{"id":"1.1-c3","type":"concept","title":"שני סוגים: Call ו־Put","body":"**Call**: זכות **לקנות** את נכס הבסיס במחיר המימוש.\n**Put**: זכות **למכור** את נכס הבסיס במחיר המימוש.\n\nבשני הסוגים הקונה מקבל זכות, והמוכר מקבל חובה.\n\nמשתמשים באופציות בדרך כלל כדי **להגן** על נכס שכבר מחזיקים, או כדי לבטא **השקפה על הכיוון** של המחיר. בשני המקרים יש מחיר וסיכון, ואין הבטחה לרווח.\n\nאת ה־Call נפרק בשיעור הבא, ואת ה־Put בשיעור שאחריו.","source":"OCC, Characteristics and Risks of Standardized Options: סוגי אופציות"},{"id":"1.1-q6","type":"mcq","prompt":"מה ההבדל בין Call ל־Put?","options":[{"text":"Call: זכות לקנות. Put: זכות למכור"},{"text":"Call: זכות למכור. Put: זכות לקנות"},{"text":"Call: זכות. Put: חובה"},{"text":"Call על מניות, Put על תעודות סל"}],"correct":0,"explain":{"right":"ההבדל הוא בכיוון. בשניהם הקונה מקבל זכות, והמוכר מקבל חובה.","wrong":"גם Call וגם Put הם זכות למי שקונה אותם, ויש את שניהם גם על מניות וגם על תעודות סל. ההבדל הוא בכיוון: Call הוא זכות לקנות, ו־Put הוא זכות למכור."},"source":"OCC ODD: סוגי אופציות"}],"summary":["קונה האופציה מקבל **זכות, לא חובה**, ומשלם עליה **פרמיה**.","המוכר (הכותב) מקבל את הפרמיה, ובתמורה **חובה** לעמוד בחוזה.","בכל חוזה יש **נכס בסיס**, **מחיר מימוש** ו**תאריך פקיעה**. חוזה על מניה הוא בדרך כלל על 100 מניות.","**Call** = זכות לקנות. **Put** = זכות למכור."],"ready":true,"unit":"1"},{"id":"1.2","title":"אופציית Call","minutes":5,"ready":true,"objective":"לחשב רווח והפסד ונקודת איזון של Long Call בפקיעה, כולל מכפיל 100.","params":{"pos":{"type":"call","side":"long","K":100,"prem":3,"mult":100}},"items":[{"id":"1.2-c1","type":"concept","title":"מה זה Call?","body":"Call נותן לקונה זכות **לקנות** את המניה במחיר קבוע מראש, **מחיר המימוש**, עד **תאריך הפקיעה**. להשתמש בזכות הזו נקרא **לממש**.\n\nחוזה אחד = **100 מניות**. המחיר שמופיע במסך הברוקר הוא **לאופציה אחת**, על מניה אחת. לחוזה כופלים ב־100.\n\nמי שקנה Call מחזיק פוזיציה שנקראת **Long Call**. המילה **Long** אומרת קנייה. (את ההפך, Short, נכיר בשיעור 1.4.)","source":"OCC, Characteristics and Risks of Standardized Options; Cboe: מפרט חוזה, מכפיל 100"},{"id":"1.2-a1","type":"analogy","title":"דמי אופציה על דירה","body":"מצאתם דירה במחיר **$2 מיליון**. שילמתם למוכר **$100,000**, שלא יקוזזו מהמחיר, כדי שיתחייב למכור לכם אותה במחיר $2 מיליון בכל רגע בחצי השנה הקרובה.\n\nאם בינתיים הדירה שווה $2.3 מיליון, קונים במחיר $2 מיליון: חסכתם $300,000, ואחרי $100,000 ששילמתם הרווחתם $200,000. אם היא לא התייקרה, מוותרים ומפסידים **רק את $100,000**.\n\nזה בדיוק Call: משלמים פרמיה תמורת הזכות לקנות במחיר קבוע (המימוש) עד תאריך מסוים (הפקיעה). וכדי להרוויח, המחיר צריך לעלות מעל **מימוש + פרמיה**.","breaks":"דירה זזה במחיר לאט, ומניה יכולה לזוז 10% ביום. ככל שהנכס תנודתי יותר, הזכות שווה יותר והפרמיה יקרה יותר (יחידה 2). ובדירה יש מוכר אחד מסוים, ואילו את ה־Call אפשר למכור למישהו אחר לפני המועד."},{"id":"1.2-l1","type":"mcq","life":true,"fmt":"pnl","prompt":"שילמתם $100,000 דמי אופציה כדי לקנות דירה במחיר $2,000,000. בסוף התקופה הדירה שווה $2,050,000. אם תממשו ותקנו, מה התוצאה הכוללת שלכם?","options":[{"v":-50000},{"v":50000},{"v":-100000},{"v":0}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"call","side":"long","K":2000000,"prem":100000,"mult":1,"S":2050000}},"explain":{"right":"חסכתם $50,000 בקנייה, אבל שילמתם $100,000 דמי אופציה: `50,000 − 100,000 = −50,000`. כדי להרוויח, הדירה צריכה להיות שווה יותר מ**מימוש + פרמיה**, כלומר $2,100,000. בדיוק כמו ב־Call.","wrong":"הקנייה חוסכת $50,000 (הדירה שווה $2,050,000 ואתם משלמים $2,000,000), אבל את דמי האופציה, $100,000, כבר שילמתם: `50,000 − 100,000 = −50,000`. נקודת האיזון היא **מימוש + פרמיה**."},"source":"דוגמה מהחיים"},{"id":"1.2-q1","type":"mcq","prompt":"מה מקבל מי שקונה אופציית Call?","options":[{"text":"זכות לקנות 100 מניות במחיר המימוש"},{"text":"חובה לקנות 100 מניות במחיר המימוש"},{"text":"זכות למכור 100 מניות במחיר המימוש"},{"text":"את המניות עצמן, בהנחה"}],"correct":0,"explain":{"right":"הקונה מחליט אם לממש. החובה נמצאת אצל הצד השני: מי שמכר לו את האופציה.","wrong":"Call הוא זכות ולא חובה, והיא זכות לקנות ולא למכור. את המניות עצמן מקבלים רק אם מחליטים לממש."},"source":"OCC ODD: הגדרות בסיסיות"},{"id":"1.2-c2","type":"concept","title":"כמה שווה ה־Call בפקיעה?","body":"אם המניה **מעל** מחיר המימוש, ה־Call שווה את ההפרש ביניהם, **כפול 100** לחוזה.\nאם היא **מתחת**, ה־Call פוקע **בלי ערך**: אף אחד לא יממש זכות לקנות ביוקר את מה שזול יותר בשוק.\n\n**רווח או הפסד של העסקה = שווי בפקיעה − הפרמיה ששילמתם**\n\nדוגמה: מימוש $100, פרמיה $3, ובפקיעה המניה במחיר $108. שווי: `($108 − $100) × 100 = $800`. רווח: `$800 − $300 = +$500`.\n\nסוחרים קוראים לעסקה פתוחה **פוזיציה (Position)**.\n\nכל המספרים בשיעור הם **לפני עמלות**.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.2-q3","type":"mcq","prompt":"קניתם Call: מימוש $100, פרמיה $3. ביום הפקיעה המניה נסחרת במחיר $110. מה הרווח או ההפסד לחוזה?","fmt":"pnl","options":[{"v":1000},{"v":700},{"v":1300},{"v":-300}],"correct":1,"check":{"fn":"positionPnL","args":{"type":"call","side":"long","S":110,"K":100,"prem":3,"mult":100}},"explain":{"right":"שווי בפקיעה: `($110 − $100) × 100 = $1,000`. פחות הפרמיה, $300, נשארים +$700.","wrong":"שווי ה־Call בפקיעה הוא `($110 − $100) × 100 = $1,000`, אבל צריך להחסיר את הפרמיה ששילמתם, $300. התוצאה: +$700."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.2-q4","type":"mcq","prompt":"אותו Call (מימוש $100, פרמיה $3), אבל ביום הפקיעה המניה נסחרת במחיר $95. מה התוצאה לחוזה?","fmt":"pnl","options":[{"v":-300},{"v":-500},{"v":-800},{"v":0}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"call","side":"long","S":95,"K":100,"prem":3,"mult":100}},"explain":{"right":"לא תממשו זכות לקנות במחיר $100 מניה שעולה בשוק $95. האופציה פוקעת בלי ערך, וההפסד הוא הפרמיה: $300.","wrong":"מתחת למימוש לא מממשים: למה לקנות במחיר $100 מה שעולה בשוק $95? האופציה פוקעת בלי ערך, ומפסידים רק את הפרמיה: $300. לא את הירידה של המניה, כי לא החזקתם מניה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.2-g1","type":"chart-guess","prompt":"נחשו לפני שמגלים: אותו Call (מימוש $100, פרמיה $3). ביום הפקיעה המניה במחיר $107. איפה תהיה העסקה?","S":107,"check":{"fn":"positionPnL","args":{"type":"call","side":"long","K":100,"prem":3,"mult":100,"S":107},"expect":400},"explain":{"right":"שווי בפקיעה: `($107 − $100) × 100 = $700`. פחות הפרמיה, $300: `+$400`.","wrong":"שווי בפקיעה: `($107 − $100) × 100 = $700`, ומחסירים את הפרמיה ששילמתם, $300. התוצאה: `+$400`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.2-q5","type":"chart-mcq","prompt":"באיזה מחיר מניה בפקיעה הפוזיציה מגיעה לאיזון, בלי רווח ובלי הפסד?","hint":"הזיזו את המחיר ומצאו איפה הקו חוצה את קו האפס ($0).","fmt":"price","start":95,"options":[{"v":97,"why":"$97 זה מימוש **פחות** פרמיה, כמו ב־Put. ב־Call צריך שהמניה תעלה מספיק כדי להחזיר את הפרמיה: מימוש + פרמיה, `$100 + $3 = $103`."},{"v":100,"why":"במחיר $100 האופציה רק מתחילה להיות שווה משהו, אבל כבר שילמתם $3 פרמיה. נקודת האיזון היא מימוש + פרמיה: `$100 + $3 = $103`."},{"v":103},{"v":106,"why":"$106 זה מימוש + פעמיים הפרמיה. מספיק להחזיר את הפרמיה פעם אחת: `$100 + $3 = $103`."}],"correct":2,"check":{"fn":"breakeven","args":{"type":"call","K":100,"prem":3}},"explain":{"right":"מימוש + פרמיה: `$100 + $3 = $103`. מתחת לזה מפסידים, ומעל לזה מרוויחים.","wrong":"במחיר $100 האופציה רק מתחילה להיות שווה משהו, אבל כבר שילמתם $3 פרמיה. נקודת האיזון היא מימוש + פרמיה: $103."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10","tip":"נקודת איזון = המקום שבו הקו חוצה את קו האפס."},{"id":"1.2-q6","type":"chart-target","prompt":"הזיזו את מחיר המניה עד שהרווח יהיה בדיוק +$500 לחוזה.","start":100,"target":500,"check":{"fn":"priceForPnL","args":{"type":"call","side":"long","K":100,"prem":3,"mult":100,"target":500},"expect":108},"explain":{"right":"$108. כל דולר מעל נקודת האיזון ($103) מוסיף $100 לחוזה, וחמישה דולרים מעליה הם +$500.","wrong":"מעל נקודת האיזון ($103) כל דולר מוסיף $100 לחוזה. בשביל +$500 צריך חמישה דולרים מעליה: `$103 + $5 = $108`. נסו שוב כשהשאלה תחזור."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.2-q7","type":"mcq","prompt":"מה ההפסד המקסימלי על חוזה Long Call (מימוש $100, פרמיה $3)?","options":[{"v":300,"fmtv":"usd"},{"text":"בלתי מוגבל","unlimited":true},{"v":10000,"fmtv":"usd"},{"v":10300,"fmtv":"usd"}],"correct":0,"check":{"fn":"maxLoss","args":{"type":"call","side":"long","K":100,"prem":3,"mult":100}},"explain":{"right":"$300, הפרמיה ששילמתם, גם אם המניה צונחת עד אפס. אבל שימו לב: מוגבל לא אומר קטן. זה 100% מהכסף ששמתם בעסקה.","wrong":"ב־Long Call, הכי גרוע שיכול לקרות, גם אם המניה צונחת עד אפס, הוא שהאופציה פוקעת בלי ערך. אז מפסידים את הפרמיה: $300. הפסד בלתי מוגבל שייך לכותב Naked Call, ועל זה נדבר בשיעור 1.4."},"source":"OCC ODD, סיכוני קונה אופציה; Hull, פרק 10"}],"summary":["נקודת האיזון של Long Call היא **מימוש + פרמיה**.","ההפסד המקסימלי הוא **הפרמיה ששילמתם**, כפול 100 לכל חוזה.","בפקיעה, מעל נקודת האיזון, כל דולר עלייה במניה מוסיף **$100 לחוזה**.","המספרים בשיעור הם לפני עמלות. עמלות מגדילות את ההפסד ומקטינות את הרווח."],"unit":"1"},{"id":"1.3","title":"אופציית Put","minutes":5,"ready":true,"objective":"לחשב רווח והפסד ונקודת איזון של Long Put בפקיעה, כולל מכפיל 100.","params":{"pos":{"type":"put","side":"long","K":100,"prem":4,"mult":100}},"items":[{"id":"1.3-c1","type":"concept","title":"מה זה Put?","body":"Put נותן לקונה זכות **למכור** את המניה במחיר המימוש, עד תאריך הפקיעה. זו תמונת המראה של Call, שנותן זכות לקנות.\n\nגם כאן: חוזה אחד = **100 מניות**, והמחיר במסך הוא **לאופציה אחת**. לא חייבים להחזיק את המניה כדי לקנות Put. (אבל אם Put כזה ממומש, למשל אוטומטית בפקיעה, תמכרו 100 מניות שאין לכם, ותישארו חייבים אותן לברוקר. לכן נהוג למכור את ה־Put לפני הפקיעה. נרחיב ביחידות 2 ו־6.)\n\nמי שכבר מחזיק מניות יכול להשתמש ב־Put גם כהגנה עליהן. לזה קוראים **Protective Put**, ונפרט עליו בשיעור 5.2.","source":"OCC, Characteristics and Risks of Standardized Options: הגדרות; Cboe: מפרט חוזה, מכפיל 100"},{"id":"1.3-a1","type":"analogy","title":"ביטוח רכב","body":"משלמים פרמיה על **ביטוח מקיף**. אם הרכב נפגע, הביטוח משלם על הנזק מעבר ל**השתתפות העצמית**. אם לא קרה כלום, הפרמיה \"נשרפה\", וזה בסדר: שילמתם על שקט נפשי.\n\nב־Put, המרחק בין מחיר המניה היום למחיר המימוש הוא כמו ההשתתפות העצמית: את הירידה עד המימוש אתם סופגים בעצמכם. מתחת למימוש, ה־Put מפצה על כל דולר ירידה. אם היא נשארת מעל המימוש, מפסידים את כל הפרמיה.","breaks":"ביטוח קונים רק על רכב שיש לכם, ו־Put אפשר לקנות גם בלי מניה, ואז הוא הימור על ירידה. ביטוח משלם על נזק, ו־Put משלם על כל ירידה מתחת למימוש, מכל סיבה. ובשביל רווח על ה־Put, המניה צריכה לרדת מתחת ל**מימוש − פרמיה**."},{"id":"1.3-l1","type":"mcq","life":true,"fmt":"pnl","prompt":"ביטוח מיוחד: תמורת $3,000, חברת הביטוח מתחייבת לקנות מכם את הרכב במחיר $60,000 בכל רגע בשנה הקרובה, גם אם הוא נפגע. בסוף השנה הרכב שווה רק $50,000, ואתם משתמשים בביטוח. מה הרווח או ההפסד שלכם מהביטוח הזה?","options":[{"v":7000},{"v":10000},{"v":-3000},{"v":13000}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"put","side":"long","K":60000,"prem":3000,"mult":1,"S":50000}},"explain":{"right":"מוכרים במחיר $60,000 רכב ששווה $50,000: הגנה של $10,000, פחות $3,000 ששילמתם: `10,000 − 3,000 = +7,000`. זה בדיוק **Put**: זכות למכור במחיר קבוע.","wrong":"ההתחייבות שווה את ההפרש, `60,000 − 50,000 = 10,000`, אבל צריך להחסיר את מה ששילמתם עליה, $3,000. התוצאה: `+7,000`. כך מחשבים Put: שווי בפקיעה פחות הפרמיה."},"source":"דוגמה מהחיים"},{"id":"1.3-q1","type":"mcq","prompt":"מה מקבל מי שקונה אופציית Put?","options":[{"text":"זכות למכור 100 מניות במחיר המימוש"},{"text":"חובה למכור 100 מניות במחיר המימוש"},{"text":"זכות לקנות 100 מניות במחיר המימוש"},{"text":"חובה לקנות 100 מניות במחיר המימוש"}],"correct":0,"explain":{"right":"הקונה מחליט אם לממש. ב־Put הזכות היא למכור, וב־Call היא לקנות.","wrong":"Put הוא זכות ולא חובה, והיא זכות למכור ולא לקנות. זכות לקנות היא Call, מהשיעור הקודם."},"source":"OCC ODD: הגדרות בסיסיות"},{"id":"1.3-c2","type":"concept","title":"כמה שווה ה־Put בפקיעה?","body":"אם המניה **מתחת** למחיר המימוש, ה־Put שווה את ההפרש ביניהם, **כפול 100** לחוזה. למשל, מימוש $100 ומניה במחיר $90: `($100 − $90) × 100 = $1,000`.\nאם המניה **מעל** המימוש, ה־Put פוקע **בלי ערך**: אף אחד לא יממש זכות למכור בזול את מה שאפשר למכור ביוקר בשוק.\n\n**רווח או הפסד = שווי בפקיעה − הפרמיה ששילמתם**\n\nזו אותה נוסחה כמו ב־Call, רק בכיוון ההפוך: Long Put מרוויח כשהמניה **יורדת** מספיק, ומפסיד כשהיא לא יורדת מספיק.\n\nכל המספרים בשיעור הם **לפני עמלות**.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.3-q2","type":"mcq","prompt":"קניתם Put: מימוש $100, פרמיה $4. ביום הפקיעה המניה נסחרת במחיר $92. מה הרווח או ההפסד לחוזה?","fmt":"pnl","options":[{"v":800},{"v":400},{"v":1200},{"v":-400}],"correct":1,"check":{"fn":"positionPnL","args":{"type":"put","side":"long","S":92,"K":100,"prem":4,"mult":100}},"explain":{"right":"שווי בפקיעה: `($100 − $92) × 100 = $800`. פחות הפרמיה, $400, נשארים +$400.","wrong":"שווי ה־Put בפקיעה הוא `($100 − $92) × 100 = $800`, אבל צריך להחסיר את הפרמיה ששילמתם: `$4 × 100 = $400`. התוצאה: +$400."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.3-q3","type":"mcq","prompt":"אותו Put (מימוש $100, פרמיה $4), אבל ביום הפקיעה המניה נסחרת במחיר $108. מה התוצאה לחוזה?","fmt":"pnl","options":[{"v":-800},{"v":-1200},{"v":-400},{"v":0}],"correct":2,"check":{"fn":"positionPnL","args":{"type":"put","side":"long","S":108,"K":100,"prem":4,"mult":100}},"explain":{"right":"לא תממשו זכות למכור במחיר $100 מניה שאפשר למכור בשוק במחיר $108. ה־Put פוקע בלי ערך, וההפסד הוא הפרמיה: $400.","wrong":"מעל המימוש לא מממשים: למה למכור במחיר $100 מה שאפשר למכור בשוק במחיר $108? ה־Put פוקע בלי ערך, ומפסידים רק את הפרמיה: $400. העלייה של המניה לא מוסיפה הפסד מעבר לזה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.3-g1","type":"chart-guess","prompt":"נחשו לפני שמגלים: אותו Put (מימוש $100, פרמיה $4). ביום הפקיעה המניה במחיר $97, מתחת למימוש. איפה תהיה העסקה?","S":97,"check":{"fn":"positionPnL","args":{"type":"put","side":"long","K":100,"prem":4,"mult":100,"S":97},"expect":-100},"explain":{"right":"ה־Put שווה `($100 − $97) × 100 = $300`, אבל שילמתם $400. התוצאה: `−$100`. המניה מתחת למימוש, ועדיין מפסידים, כי היא לא מתחת לנקודת האיזון ($96).","wrong":"ה־Put שווה `($100 − $97) × 100 = $300`, אבל שילמתם עליו $400. התוצאה: `−$100`. כדי להרוויח, המניה צריכה לרדת מתחת ל־`$100 − $4 = $96`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.3-q4","type":"chart-mcq","prompt":"באיזה מחיר מניה בפקיעה ה־Put מגיע לאיזון, בלי רווח ובלי הפסד?","hint":"הזיזו את המחיר ומצאו איפה הקו חוצה את קו האפס ($0).","fmt":"price","start":105,"options":[{"v":92,"why":"$92 זה מימוש פחות פעמיים הפרמיה. מספיק להחזיר את הפרמיה פעם אחת: `$100 − $4 = $96`."},{"v":96},{"v":100,"why":"במחיר $100 ה־Put רק מתחיל להיות שווה משהו, אבל כבר שילמתם $4 פרמיה. ב־Put צריך שהמניה תרד מספיק: `$100 − $4 = $96`."},{"v":104,"why":"$104 זה מימוש **ועוד** פרמיה, כמו ב־Call. Put מרוויח כשהמניה **יורדת**, ולכן מחסירים: `$100 − $4 = $96`."}],"correct":1,"check":{"fn":"breakeven","args":{"type":"put","K":100,"prem":4}},"explain":{"right":"מימוש − פרמיה: `$100 − $4 = $96`. מעל זה מפסידים, ומתחת לזה מרוויחים.","wrong":"במחיר $100 ה־Put רק מתחיל להיות שווה משהו, אבל כבר שילמתם $4 פרמיה. המניה צריכה לרדת עוד $4, ולכן נקודת האיזון היא מימוש − פרמיה: $96. ב־Call מוסיפים את הפרמיה, וב־Put מחסירים אותה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10","tip":"ב־Put, חשבו לאיזה כיוון המניה צריכה לזוז כדי להחזיר את הפרמיה."},{"id":"1.3-q5","type":"chart-target","prompt":"הזיזו את מחיר המניה עד שהרווח יהיה בדיוק +$600 לחוזה.","start":100,"target":600,"check":{"fn":"priceForPnL","args":{"type":"put","side":"long","K":100,"prem":4,"mult":100,"target":600},"expect":90},"explain":{"right":"$90. מתחת לנקודת האיזון ($96) כל דולר ירידה מוסיף $100 לחוזה, ושישה דולרים מתחתיה הם +$600.","wrong":"מתחת לנקודת האיזון ($96) כל דולר ירידה מוסיף $100 לחוזה. בשביל +$600 צריך שישה דולרים מתחתיה: `$96 − $6 = $90`. נסו שוב כשהשאלה תחזור."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.3-q6","type":"mcq","prompt":"מה ההפסד המקסימלי על חוזה Long Put (מימוש $100, פרמיה $4)?","fmt":"usd","options":[{"v":4},{"v":400},{"v":9600},{"text":"בלתי מוגבל","unlimited":true}],"correct":1,"check":{"fn":"maxLoss","args":{"type":"put","side":"long","K":100,"prem":4,"mult":100}},"explain":{"right":"$400, הפרמיה ששילמתם, גם אם המניה מזנקת. אבל מוגבל לא אומר קטן: זה 100% מהכסף ששמתם בעסקה.","wrong":"ב־Long Put, הכי גרוע שיכול לקרות, גם אם המניה מזנקת, הוא שה־Put פוקע בלי ערך. אז מפסידים את הפרמיה: `$4 × 100 = $400`. $4 הוא המחיר לאופציה אחת, לא לחוזה."},"source":"OCC ODD, סיכוני קונה אופציה; Hull, פרק 10"},{"id":"1.3-c3","type":"concept","title":"יש רצפה: $0","body":"מניה יכולה לעלות בלי גבול, אבל היא לא יכולה לרדת מתחת ל**אפס**. לכן גם לרווח של Long Put יש תקרה.\n\nהרווח הגדול ביותר מגיע רק בתרחיש הקיצוני שבו המניה צונחת עד $0:\n**רווח מקסימלי = (מימוש − פרמיה) × 100**","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.3-q7","type":"mcq","prompt":"מה הרווח המקסימלי על חוזה Long Put (מימוש $100, פרמיה $4)?","fmt":"usd","options":[{"text":"בלתי מוגבל","unlimited":true},{"v":10000},{"v":9600},{"v":400}],"correct":2,"check":{"fn":"maxProfit","args":{"type":"put","side":"long","K":100,"prem":4,"mult":100}},"explain":{"right":"אם המניה יורדת עד $0, ה־Put שווה `$100 × 100 = $10,000`. פחות הפרמיה, $400, נשארים $9,600. זה סכום גדול אבל מוגבל, והוא מגיע רק בתרחיש קיצוני.","wrong":"מניה לא יורדת מתחת לאפס, ולכן הרווח מוגבל. במחיר $0 ה־Put שווה `$100 × 100 = $10,000`, אבל צריך להחסיר את הפרמיה, $400. הרווח המקסימלי: `($100 − $4) × 100 = $9,600`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["Put נותן זכות **למכור** במחיר המימוש. בפקיעה הוא שווה משהו רק כשהמניה **מתחת** למימוש.","נקודת האיזון של Long Put היא **מימוש − פרמיה**. מעליה מפסידים, ובפקיעה, מתחת לה, כל דולר ירידה מוסיף **$100 לחוזה**.","ההפסד המקסימלי הוא **הפרמיה ששילמתם**. הרווח המקסימלי גדול אבל **מוגבל**: (מימוש − פרמיה) × 100, רק אם המניה יורדת עד $0.","המספרים בשיעור הם לפני עמלות. עמלות מגדילות את ההפסד ומקטינות את הרווח."],"unit":"1"},{"id":"1.4","title":"הצד השני: כתיבת אופציות","minutes":5,"objective":"להבין שכותב אופציה מקבל פרמיה ולוקח על עצמו חובה, ולחשב את הרווח המקסימלי, נקודת האיזון וההפסד המקסימלי של Short Call ושל Short Put.","params":{"pos":{"type":"call","side":"short","K":100,"prem":3,"mult":100}},"items":[{"id":"1.4-c1","type":"concept","title":"מי מוכר לכם את האופציה?","body":"על כל אופציה שמישהו קונה, יש מישהו שמוכר. מי שמוכר אופציה שלא הייתה לו קודם נקרא **כותב (Writer)**, והפוזיציה שלו נקראת **Short**: Short Call או Short Put.\n\nהכותב **מקבל את הפרמיה מיד**, ובתמורה לוקח על עצמו **חובה**:\nכותב Call מתחייב **למכור** 100 מניות במחיר המימוש.\nכותב Put מתחייב **לקנות** 100 מניות במחיר המימוש.\n\nההחלטה אם לממש היא של המחזיק בלבד. כשמחזיק כלשהו מממש, המסלקה OCC מקצה את המימוש **באקראי** לאחד הברוקרים שיש להם לקוחות כותבים באותה אופציה, והברוקר מקצה אותו לאחד מהלקוחות האלה (באקראי או בשיטה הוגנת אחרת). זו **הקצאה (Assignment)**, ומי שקיבל אותה חייב לקיים את ההתחייבות. באופציות על מניות זה יכול לקרות **בכל יום** עד הפקיעה, לא רק בסופה. הפרטים ביחידה 6.","source":"OCC, Characteristics and Risks of Standardized Options: הגדרות, כותב והקצאה"},{"id":"1.4-a1","type":"analogy","title":"להיות חברת הביטוח","body":"**כותב Put** הוא כמו חברת ביטוח: גובה פרמיה מראש. אם לא קרה כלום, הפרמיה נשארת אצלו. אבל ביום של אסון הוא משלם הרבה יותר ממה שגבה.\n\n**כותב Call בלי מניות** דומה לספסר שגובה ממעריץ $30 תמורת הבטחה: \"אם תרצה, אמכור לך כרטיס במחיר $300\", כרטיס שעוד אין לו. אם ההופעה לא מבוקשת, המעריץ לא משתמש בהבטחה, והספסר נשאר עם $30 בלבד. אם היא הופכת ללהיט והכרטיסים נמכרים במחיר $2,000, הוא חייב לקנות במחיר הזה ולמכור במחיר $300. ולמחיר הזה אין תקרה.","breaks":"חברת ביטוח מתמחרת סיכון לפי נתונים על מיליוני מקרים, ומבטחת לקוחות שאסון אחד לא פוגע בכולם באותו יום. כותב פרטי לא יודע אם הפרמיה שקיבל מכסה את הסיכון, ונפילה חדה בשוק פוגעת בכל האופציות שכתב **בבת אחת**."},{"id":"1.4-l1","type":"mcq","life":true,"fmt":"pnl","prompt":"הספסר גבה $30 על הבטחה למכור כרטיס במחיר $300, כרטיס שעוד אין לו. ההופעה הפכה ללהיט, והכרטיס עולה עכשיו $900. המעריץ דורש את הכרטיס. מה התוצאה של הספסר?","options":[{"v":-570},{"v":30},{"v":-600},{"v":-870}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"call","side":"short","K":300,"prem":30,"mult":1,"S":900}},"explain":{"right":"הוא קונה במחיר $900 ומוכר במחיר $300: הפסד של $600. $30 שגבה מקטינים אותו ל־`−570`. ככה נראה **Naked Call**: רווח מוגבל, והפסד שגדל עם המחיר.","wrong":"הספסר חייב לקנות במחיר $900 ולמכור במחיר $300, הפסד של $600. $30 שקיבל מראש נשארים אצלו ומקטינים את ההפסד: `−600 + 30 = −570`."},"source":"דוגמה מהחיים"},{"id":"1.4-q1","type":"mcq","prompt":"מה קורה למי שכותב (מוכר) אופציית Call?","options":[{"text":"מקבל פרמיה עכשיו, ומתחייב למכור 100 מניות במחיר המימוש אם הקונה יממש"},{"text":"משלם פרמיה, ומקבל זכות למכור 100 מניות במחיר המימוש"},{"text":"מקבל פרמיה עכשיו, ויכול להחליט בעצמו אם למכור את המניות"},{"text":"מקבל פרמיה עכשיו, ומתחייב לקנות 100 מניות במחיר המימוש אם הקונה יממש"}],"correct":0,"explain":{"right":"הזכות אצל הקונה, והחובה אצלכם. הקונה מחליט אם לממש, ואתם צריכים למכור לו אם יבחר בזה.","wrong":"הכותב מקבל את הפרמיה ולא משלם אותה, והוא לא מחליט כלום: ההחלטה אם לממש היא של הקונה. כותב Call מתחייב **למכור** 100 מניות במחיר המימוש. ההתחייבות **לקנות** שייכת לכותב Put."},"source":"OCC ODD: הגדרות בסיסיות; Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.4-c2","type":"concept","title":"תמונת מראה","body":"בפקיעה, מה שהקונה מרוויח, הכותב מפסיד, ולהפך (לפני עמלות). לכן הגרף של הכותב הוא **הגרף של הקונה, הפוך**.\n\nמה זה אומר על הכותב:\n**הרווח המקסימלי הוא הפרמיה שקיבלתם.** הכי טוב שיכול לקרות הוא שהאופציה פוקעת בלי ערך, ואתם נשארים עם הפרמיה.\n**נקודת האיזון זהה לזו של הקונה.** מאותה נקודה שבה הקונה מתחיל להרוויח, הכותב מתחיל להפסיד.\n\nהפרמיה שקיבלתם היא לא רווח שכבר בכיס: היא התשלום על החובה שלקחתם, וכל עוד האופציה פתוחה, ההתחייבות פתוחה.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10: ארבעה סוגי פוזיציות באופציות"},{"id":"1.4-q2","type":"mcq","prompt":"כתבתם Call: מימוש $100, פרמיה $3. מה הרווח המקסימלי לחוזה?","fmt":"usd","options":[{"v":3},{"v":300},{"v":1000},{"text":"בלתי מוגבל","unlimited":true}],"correct":1,"check":{"fn":"maxProfit","args":{"type":"call","side":"short","K":100,"prem":3,"mult":100}},"explain":{"right":"הפרמיה שקיבלתם: `$3 × 100 = $300`. אם בפקיעה המניה במחיר $100 או מתחת לו, הקונה לא מממש ואתם נשארים עם הפרמיה. יותר מזה אין לכם מה להרוויח, גם אם המניה צונחת.","wrong":"מתחת למימוש, ירידה נוספת של המניה כבר לא מוסיפה לכותב ה־Call כלום. הכי טוב שיכול לקרות הוא שהאופציה פוקעת בלי ערך ואתם נשארים עם הפרמיה, כפול 100: `$3 × 100 = $300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.4-q3","type":"mcq","prompt":"כתבתם Call: מימוש $100, פרמיה $3. ביום הפקיעה המניה נסחרת במחיר $110. מה הרווח או ההפסד לחוזה?","fmt":"pnl","options":[{"v":-700},{"v":300},{"v":-1000},{"v":700}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"call","side":"short","S":110,"K":100,"prem":3,"mult":100}},"explain":{"right":"הקונה יממש, ואתם חייבים למכור במחיר $100 מניות ששוות $110: הפסד של `$10 × 100 = $1,000` לפני הפרמיה. אחרי הפרמיה שקיבלתם, $300, נשארים −$700. בדיוק ההפך מהקונה בשיעור 1.2.","wrong":"הקונה יממש, כי זכות לקנות במחיר $100 מניה שעולה $110 שווה `$10 × 100 = $1,000`. זה ההפסד שלכם לפני הפרמיה. הפרמיה שקיבלתם, $300, מקטינה אותו: −$700. הקונה מרוויח באותו מצב +$700."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.4-q4","type":"chart-mcq","prompt":"זה הגרף של Short Call: מימוש $100, פרמיה $3. באיזה מחיר מניה בפקיעה אתם באיזון, בלי רווח ובלי הפסד?","hint":"הזיזו את המחיר ומצאו איפה הקו חוצה את קו האפס ($0).","fmt":"price","start":95,"options":[{"v":97,"why":"$97 זה מימוש פחות פרמיה, כמו ב־Put. ב־Call, כתוב או קנוי, נקודת האיזון היא מימוש + פרמיה: `$100 + $3 = $103`."},{"v":100,"why":"עד $100 הקונה לא יממש ואתם שומרים את כל הפרמיה. מעל $100 מתחילים להחזיר אותה, ורק במחיר `$100 + $3 = $103` היא נגמרת."},{"v":103},{"v":106,"why":"$106 זה מימוש + פעמיים הפרמיה. הפרמיה שקיבלתם, $3, מכסה רק $3 של עלייה מעל המימוש: `$100 + $3 = $103`."}],"correct":2,"check":{"fn":"breakeven","args":{"type":"call","K":100,"prem":3}},"explain":{"right":"אותה נקודת איזון כמו של הקונה: `$100 + $3 = $103`. מתחת לה אתם ברווח ומעליה בהפסד, ההפך מהקונה.","wrong":"במחיר $100 הקונה עדיין לא מממש, ואתם עדיין מחזיקים את כל הפרמיה. מעל המימוש ההתחייבות מתחילה לעלות לכם כסף, והפרמיה מכסה את שלושת הדולרים הראשונים. נקודת האיזון: `$100 + $3 = $103`, בדיוק כמו של הקונה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.4-q5","type":"mcq","prompt":"כתבתם Call בלי להחזיק את המניה: מימוש $100, פרמיה $3. מה ההפסד המקסימלי לחוזה?","options":[{"v":300,"fmtv":"usd"},{"v":10000,"fmtv":"usd"},{"text":"בלתי מוגבל","unlimited":true},{"v":10300,"fmtv":"usd"}],"correct":2,"check":{"fn":"maxLoss","args":{"type":"call","side":"short","K":100,"prem":3,"mult":100}},"explain":{"right":"למחיר של מניה אין תקרה, וכל דולר מעל $103 עולה לכם עוד $100 לחוזה. כתיבה כזו, בלי להחזיק את המניה, נקראת **כתיבה חשופה (Uncovered, או Naked)**. מי שמחזיק את 100 המניות נמצא בתמונה אחרת, ועל זה נדבר בשיעור 5.1.","wrong":"$300 הוא ההפסד המקסימלי של הקונה, ואצלכם זה הרווח המקסימלי. ההפסד של כותב ה־Call גדל עם כל דולר שהמניה עולה מעל $103, ולמניה אין תקרה. גם $10,000 הוא לא גבול, כי מניה יכולה גם להכפיל את עצמה ויותר. לכן ההפסד התיאורטי **בלתי מוגבל**."},"source":"OCC ODD, סיכונים של כותבי אופציות: Naked Call; Hull, פרק 10"},{"id":"1.4-c3","type":"concept","title":"Short Put: מוגבל, אבל לא קטן","body":"כותב Put מתחייב **לקנות** 100 מניות במחיר המימוש. מניה לא יכולה לרדת מתחת לאפס, ולכן ההפסד מוגבל. אבל הוא יכול להיות גדול מאוד:\n\n**הפסד מקסימלי של Short Put = (מימוש − פרמיה) × 100**\n\nזה קורה אם המניה צונחת לאפס: אתם קונים במחיר המימוש מניות שלא שוות כלום, והפרמיה שקיבלתם מקטינה את ההפסד רק קצת.\n\nבגלל הסיכון, כתיבה **חשופה** (בלי מניות או מזומן שמכסים את ההתחייבות) דורשת **אישור מיוחד מהברוקר** וכסף שמופקד כ**ביטחונות (Margin)**. אם השוק זז נגדכם תצטרכו להוסיף ביטחונות, ואם לא, הברוקר רשאי **לסגור את הפוזיציה בהפסד בלי לשאול**. נרחיב ביחידה 6.","source":"OCC ODD, סיכונים של כותבי אופציות: Naked Put ודרישות ביטחונות; Hull, פרק 10"},{"id":"1.4-q6","type":"mcq","prompt":"כתבתם Put: מימוש $50, פרמיה $2. מה ההפסד המקסימלי לחוזה?","pos":{"type":"put","side":"short","K":50,"prem":2,"mult":100},"options":[{"v":4800,"fmtv":"usd"},{"v":5000,"fmtv":"usd"},{"v":200,"fmtv":"usd"},{"text":"בלתי מוגבל","unlimited":true}],"correct":0,"check":{"fn":"maxLoss","args":{"type":"put","side":"short","K":50,"prem":2,"mult":100}},"explain":{"right":"אם המניה צונחת לאפס, תקנו במחיר $50 מניות ששוות $0. הפרמיה שקיבלתם, $200, מקטינה את ההפסד: `($50 − $2) × 100 = $4,800`. מוגבל, אבל פי 24 מהרווח המקסימלי.","wrong":"מניה לא יורדת מתחת לאפס, ולכן ההפסד מוגבל, אבל הוא לא רק הפרמיה. במקרה הגרוע תקנו במחיר $50 מניות ששוות $0, ותשמרו את הפרמיה, $2 לאופציה. ההפסד המקסימלי: `($50 − $2) × 100 = $4,800`."},"source":"OCC ODD, סיכונים של כותבי אופציות: Naked Put; Hull, פרק 10","tip":"מה יקרה אם המניה תצנח עד אפס?"},{"id":"1.4-g1","type":"chart-guess","prompt":"נחשו לפני שמגלים: כתבתם Put, מימוש $50, פרמיה $2. ביום הפקיעה המניה במחיר $46. איפה תהיה העסקה?","pos":{"type":"put","side":"short","K":50,"prem":2,"mult":100},"S":46,"check":{"fn":"positionPnL","args":{"type":"put","side":"short","K":50,"prem":2,"mult":100,"S":46},"expect":-200},"explain":{"right":"אתם חייבים לקנות במחיר $50 מניות ששוות $46: `($50 − $46) × 100 = $400` הפסד. הפרמיה שקיבלתם, $200, מקטינה אותו ל־`−$200`.","wrong":"הקונה יממש, ואתם קונים במחיר $50 מניות ששוות $46: הפסד של `$4 × 100 = $400`. הפרמיה שקיבלתם, $200, מקטינה אותו: `−$200`."},"source":"OCC ODD, סיכוני כותבי אופציות; Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.4-q7","type":"chart-mcq","readFromChart":true,"prompt":"זה הגרף של Short Put: מימוש $50, פרמיה $2. ביום הפקיעה המניה נסחרת במחיר $40. מה הרווח או ההפסד לחוזה?","hint":"חשבו את התוצאה: כמה שווה ה־Put בפקיעה, ומה ההפרש מהפרמיה שקיבלתם? הגרף עוזר לראות את הכיוון.","pos":{"type":"put","side":"short","K":50,"prem":2,"mult":100},"fmt":"pnl","start":50,"options":[{"v":-800},{"v":-1000},{"v":-1200},{"v":200}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"put","side":"short","S":40,"K":50,"prem":2,"mult":100}},"explain":{"right":"הקונה יממש, ואתם תקנו במחיר $50 מניה שנסחרת במחיר $40: `($50 − $40) × 100 = $1,000`. אחרי הפרמיה שקיבלתם, $200, נשארים −$800.","wrong":"ההתחייבות לקנות במחיר $50 מניה ששווה $40 עולה לכם `($50 − $40) × 100 = $1,000`. את הפרמיה, $200, קיבלתם מראש והיא נשארת אצלכם, ולכן היא מקטינה את ההפסד: −$800."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["כותב אופציה **מקבל את הפרמיה מראש** ולוקח על עצמו **חובה**. כותב שמקבל הקצאה חייב לקיים אותה.","הגרף של הכותב הוא **תמונת מראה** של הקונה: אותה נקודת איזון, והרווח המקסימלי הוא **הפרמיה שקיבלתם**.","ב־Naked Call ההפסד התיאורטי **בלתי מוגבל**, כי למחיר המניה אין תקרה.","ב־Short Put ההפסד מוגבל, אבל יכול להיות גדול מאוד: **(מימוש − פרמיה) × 100** אם המניה צונחת לאפס."],"ready":true,"unit":"1"},{"id":"1.5","title":"בתוך הכסף, מחוץ לכסף, על הכסף","minutes":5,"objective":"לסווג Call ו־Put כבתוך הכסף, על הכסף או מחוץ לכסף, ולפרק מחיר של אופציה לפני הפקיעה לערך פנימי ולערך זמן.","items":[{"id":"1.5-c1","type":"concept","title":"איפה המניה ביחס למימוש?","body":"סוחרים מתארים אופציה לפי המקום של המניה ביחס למחיר המימוש:\n\n**בתוך הכסף (In the Money, ITM):** לאופציה יש **ערך פנימי**: מימוש מיידי היה שווה משהו.\n**מחוץ לכסף (Out of the Money, OTM):** מימוש מיידי לא היה שווה כלום.\n**על הכסף (At the Money, ATM):** המניה עומדת על מחיר המימוש.\n\n**Call** בתוך הכסף כשהמניה **מעל** המימוש. **Put** בתוך הכסף כשהמניה **מתחת** למימוש. ב־Put הכול **הפוך**.\n\nבפועל סוחרים קוראים \"על הכסף\" גם למימוש **הקרוב ביותר** למחיר המניה, כי המניה כמעט אף פעם לא עומדת בדיוק עליו. בשאלות כאן, \"על הכסף\" = המניה **בדיוק** במחיר המימוש.","source":"OCC, Characteristics and Risks of Standardized Options: הגדרות; Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.5-q1","type":"mcq","prompt":"Call במימוש $100. המניה נסחרת במחיר $108. איפה האופציה?","options":[{"text":"בתוך הכסף","key":"ITM"},{"text":"על הכסף","key":"ATM"},{"text":"מחוץ לכסף","key":"OTM"}],"correct":0,"check":{"fn":"moneyness","args":{"type":"call","S":108,"K":100}},"explain":{"right":"Call הוא זכות לקנות במחיר $100. כשהמניה עולה בשוק $108, הזכות הזו שווה משהו: המניה מעל המימוש, אז ה־Call בתוך הכסף.","wrong":"Call הוא זכות **לקנות** במחיר $100. כשהמניה עולה בשוק $108, לזכות הזו יש ערך פנימי. Call שהמניה שלו מעל המימוש נמצא **בתוך הכסף**."},"source":"OCC ODD: הגדרות; Hull, פרק 10"},{"id":"1.5-q2","type":"mcq","prompt":"אותה מניה, אותו מימוש, אבל הפעם Put: מימוש $100, המניה נסחרת במחיר $108. איפה האופציה?","options":[{"text":"בתוך הכסף","key":"ITM"},{"text":"על הכסף","key":"ATM"},{"text":"מחוץ לכסף","key":"OTM"}],"correct":2,"check":{"fn":"moneyness","args":{"type":"put","S":108,"K":100}},"explain":{"right":"Put הוא זכות **למכור** במחיר $100. אף אחד לא ימכור במחיר $100 מניה שאפשר למכור בשוק במחיר $108. אותם מספרים, תשובה הפוכה מה־Call.","wrong":"זו המלכודת הנפוצה: \"המניה מעל המימוש\" נשמע כמו בתוך הכסף, אבל זה נכון רק ל־Call. Put הוא זכות **למכור** במחיר $100, ובשוק מקבלים $108. לכן ה־Put **מחוץ לכסף**."},"source":"OCC ODD: הגדרות; Hull, פרק 10","tip":"שימו לב: הפעם זה Put, לא Call."},{"id":"1.5-q3","type":"mcq","prompt":"Put במימוש $50. המניה נסחרת במחיר $50 בדיוק. איפה האופציה?","options":[{"text":"בתוך הכסף","key":"ITM"},{"text":"על הכסף","key":"ATM"},{"text":"מחוץ לכסף","key":"OTM"}],"correct":1,"check":{"fn":"moneyness","args":{"type":"put","S":50,"K":50}},"explain":{"right":"המניה בדיוק על המימוש, אז האופציה על הכסף. כאן אין היפוך: זה נכון גם ל־Call וגם ל־Put.","wrong":"כשמחיר המניה שווה בדיוק למחיר המימוש, האופציה **על הכסף**, גם ב־Call וגם ב־Put. ההיפוך בין Call ל־Put קובע רק מה נחשב בתוך הכסף ומה מחוץ לכסף."},"source":"OCC ODD: הגדרות; Hull, פרק 10"},{"id":"1.5-c2","type":"concept","title":"מה יש בתוך המחיר?","body":"עד עכשיו חישבנו שווי **בפקיעה**. לפני הפקיעה לאופציה יש מחיר בשוק, כלומר **הפרמיה** שמשלמים עליה היום. אפשר לפרק אותו לשני חלקים:\n\n**ערך פנימי (Intrinsic Value):** כמה שווה מימוש עכשיו, בלי להתחשב בפרמיה ששילמתם. ב־Call: מחיר המניה − המימוש. ב־Put: המימוש − מחיר המניה. אם יוצא מספר שלילי, הערך הפנימי הוא **אפס**, לא מינוס.\n\n**ערך זמן (Time Value):** כל השאר. `ערך זמן = מחיר האופציה − ערך פנימי`\n\nדוגמה: Call במימוש $100, המניה $105, האופציה נסחרת במחיר $7. ערך פנימי: `$105 − $100 = $5`. ערך זמן: `$7 − $5 = $2`.\n\nהמספרים כאן הם **לאופציה**. לחוזה כופלים ב־100, כמו קודם.\n\nולכן: \"בתוך הכסף\" לא אומר שכדאי לממש. מימוש לפני הפקיעה מוותר על ערך הזמן, ובדרך כלל עדיף למכור את האופציה בשוק.","source":"OCC ODD: הגדרות, ערך פנימי וערך זמן; Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.5-a1","type":"analogy","title":"השובר שווה יותר ממה שחוסכים בו היום","body":"נחזור לשובר: הוא מאפשר לקנות טלוויזיה במחיר $2,000 עד סוף החודש, והיום היא עולה בחנות **$2,080**.\n\nהשובר שווה **לפחות $80**, כי זה מה שתחסכו אם תשתמשו בו עכשיו. זה ה**ערך הפנימי**.\n\nאבל מישהו אולי ישלם עליו **$120** (נניח שמותר להעביר אותו): אם המחיר יעלה, השובר ישווה יותר, ואם המחיר יירד, הוא לא יפסיד יותר ממה ששילם. ה־40 דולר הנוספים הם ה**ערך הזמן**. ביום האחרון כבר אין זמן שהמחיר ישתנה, והשובר שווה בדיוק את מה שחוסכים בו.","breaks":"ערך הזמן לא תלוי בניחוש שהמחיר יעלה. גם אם עלייה וירידה סבירות באותה מידה, יש לו ערך, כי מעלייה מרוויחים ומירידה ההפסד מוגבל. לכן יותר תנועה צפויה = יותר ערך זמן. והוא נשחק ככל שהפקיעה מתקרבת, ובאופציה שעל הכסף, מהר יותר לקראת הסוף."},{"id":"1.5-l1","type":"mcq","life":true,"fmt":"usd","prompt":"שובר מאפשר לקנות טלוויזיה במחיר $2,000 עד סוף החודש. היום היא עולה בחנות $2,150, ומישהו מוכן לשלם על השובר $200. כמה מתוך $200 האלה הם ערך זמן?","options":[{"v":50},{"v":150},{"v":200},{"v":0}],"correct":0,"check":{"fn":"timeValue","args":{"type":"call","S":2150,"K":2000,"price":200}},"explain":{"right":"הערך הפנימי הוא מה שחוסכים בשימוש עכשיו: `2,150 − 2,000 = 150`. כל השאר, `200 − 150 = 50`, הוא **ערך זמן**: מה שמשלמים על הסיכוי שהמחיר ישתנה עד סוף החודש.","wrong":"קודם הערך הפנימי: שימוש בשובר עכשיו חוסך `2,150 − 2,000 = 150`. ערך הזמן הוא כל השאר: `200 − 150 = 50`."},"source":"דוגמה מהחיים"},{"id":"1.5-q4","type":"mcq","prompt":"Put במימוש $50. המניה נסחרת במחיר $44, והאופציה נסחרת במחיר $8. מה הערך הפנימי לאופציה?","fmt":"usd","options":[{"v":0},{"v":6},{"v":2},{"v":8}],"correct":1,"check":{"fn":"intrinsic","args":{"type":"put","S":44,"K":50}},"explain":{"right":"ב־Put: מימוש − מחיר המניה. `$50 − $44 = $6`. שאר המחיר, $2, הוא ערך זמן.","wrong":"ב־Put הערך הפנימי הוא מימוש − מחיר המניה: `$50 − $44 = $6`. אם יצא לכם אפס, חישבתם כמו ב־Call. המחיר כולו הוא $8, וערך הזמן הוא $2."},"source":"OCC ODD: ערך פנימי; Hull, פרק 10"},{"id":"1.5-q5","type":"mcq","prompt":"Call במימוש $200. המניה נסחרת במחיר $210, והאופציה נסחרת במחיר $13. מה ערך הזמן לאופציה?","fmt":"usd","options":[{"v":10},{"v":13},{"v":3},{"v":23}],"correct":2,"check":{"fn":"timeValue","args":{"type":"call","S":210,"K":200,"price":13}},"explain":{"right":"ערך פנימי: `$210 − $200 = $10`. ערך זמן: `$13 − $10 = $3`.","wrong":"קודם מחשבים ערך פנימי: `$210 − $200 = $10`. ערך הזמן הוא מה שנשאר מהמחיר: `$13 − $10 = $3`. אל תעצרו בערך הפנימי ($10) ואל תספרו את המחיר כולו ($13)."},"source":"OCC ODD: ערך זמן; Hull, פרק 10"},{"id":"1.5-c3","type":"concept","title":"מחוץ לכסף: הכול ערך זמן","body":"באופציה **מחוץ לכסף** הערך הפנימי הוא אפס, ולכן **כל המחיר** שלה הוא ערך זמן. מה שאתם משלמים עליה הוא האפשרות שהמניה תזוז לטובתכם לפני הפקיעה.\n\n**בפקיעה עצמה ערך הזמן הוא אפס**, והשווי שווה לערך הפנימי. (רגע לפני הסגירה הוא כבר קרוב מאוד לאפס.) לכן בשיעורים 1.2–1.4 הספיק לחשב שווי בפקיעה.\n\nמה קובע כמה ערך זמן יש? נראה **בהמשך**, ביחידה 2. בינתיים: בדרך כלל, יותר זמן עד הפקיעה ויותר תנועה צפויה במניה = יותר ערך זמן.","source":"Hull, Options, Futures, and Other Derivatives, פרקים 10–11"},{"id":"1.5-q6","type":"mcq","prompt":"Put במימוש $50. המניה נסחרת במחיר $53, והאופציה נסחרת במחיר $1. מה ערך הזמן לאופציה?","fmt":"usd","options":[{"v":0},{"v":1},{"v":3},{"v":4}],"correct":1,"check":{"fn":"timeValue","args":{"type":"put","S":53,"K":50,"price":1}},"explain":{"right":"המניה מעל המימוש, אז ה־Put מחוץ לכסף והערך הפנימי שלו אפס. כל המחיר, $1, הוא ערך זמן.","wrong":"Put כשהמניה מעל המימוש הוא מחוץ לכסף, והערך הפנימי שלו **אפס**, לא מינוס $3. לכן כל המחיר, $1, הוא ערך זמן. אם יצא לכם $4, הפכתם את הערך הפנימי למספר שלילי."},"source":"OCC ODD: ערך זמן; Hull, פרק 10"},{"id":"1.5-q7","type":"mcq","prompt":"בפקיעה עצמה: מה נכון לגבי השווי של כל אופציה?","options":[{"text":"השווי שווה לערך הפנימי, כי ערך הזמן התאפס"},{"text":"השווי שווה לערך הזמן, כי הערך הפנימי התאפס"},{"text":"השווי הוא אפס בכל אופציה"},{"text":"השווי לא קשור לערך הפנימי"}],"correct":0,"explain":{"right":"אין יותר זמן, אז אין ערך זמן. מה שנשאר הוא הערך הפנימי: אופציה בתוך הכסף שווה את ההפרש, ואופציה מחוץ לכסף שווה אפס. בדיוק החישוב שעשינו בשיעורים 1.2–1.4.","wrong":"מה שנעלם בפקיעה הוא **ערך הזמן**, לא הערך הפנימי. לכן בפקיעה השווי שווה לערך הפנימי: אופציה בתוך הכסף שווה את ההפרש, ורק אופציה מחוץ לכסף שווה אפס."},"source":"Hull, Options, Futures, and Other Derivatives, פרקים 10–11"}],"summary":["**Call** בתוך הכסף כשהמניה מעל המימוש. **Put** בתוך הכסף כשהמניה מתחת למימוש.","**מחיר האופציה = ערך פנימי + ערך זמן.** הערך הפנימי לא יורד מתחת לאפס.","באופציה מחוץ לכסף **כל המחיר הוא ערך זמן**.","בפקיעה ערך הזמן הוא אפס, ולכן המחיר שווה לערך הפנימי."],"ready":true,"unit":"1"},{"id":"1.6","title":"מפרט החוזה","minutes":5,"objective":"להכיר את פרטי החוזה: נכס בסיס, מכפיל, מימוש, תאריך פקיעה, מימוש אמריקאי מול אירופאי וסילוק במניות מול סילוק במזומן.","params":{"pos":{"type":"call","side":"long","K":100,"prem":3,"mult":100}},"items":[{"id":"1.6-c1","type":"concept","title":"מה כתוב בחוזה?","body":"אופציה שנסחרת בבורסה היא **חוזה סטנדרטי**: הבורסה קובעת מראש את הפרטים שלו, וכך כולם סוחרים באותו מוצר.\n\n**נכס הבסיס:** המניה או תעודת הסל שעליה האופציה. למשל SPY, תעודת סל (ETF) שעוקבת אחרי מדד S&P 500.\n**גודל החוזה (מכפיל):** בדרך כלל **100 מניות**.\n**מחיר המימוש:** המחיר שבו קונים (ב־Call) או מוכרים (ב־Put) אם מממשים.\n**תאריך הפקיעה:** היום האחרון של הזכות. אופציה חודשית רגילה על מניה פוקעת ב**יום שישי השלישי של החודש**. לחלק מהמניות ותעודות הסל יש גם **פקיעות שבועיות**.\n\nבמסך הברוקר החוזה מופיע בשורה אחת, למשל `SPY 18-DEC-2026 600 CALL`: נכס הבסיס, תאריך הפקיעה, מחיר המימוש והסוג (Call או Put).","source":"OCC, Characteristics and Risks of Standardized Options: אופציות סטנדרטיות; Cboe, מפרט חוזה אופציות על מניות ועל תעודות סל"},{"id":"1.6-a1","type":"analogy","title":"מחיר למטר","body":"במודעה כתוב **$10,000 למ\"ר**, אבל לא קונים מטר אחד: קונים דירה של **100 מ\"ר**, כלומר $1 מיליון.\n\nבאופציות זה אותו דבר: המחיר במסך הוא **לאופציה אחת**, וחוזה מכסה **100 מניות**. פרמיה של $3 = $300 לחוזה. וזה נכון גם לתנועה: אם הפרמיה עולה בדולר אחד, החוזה שלכם עלה במאה דולר.","breaks":"בדירות הגודל משתנה מדירה לדירה, ובחוזה אופציה הוא כמעט תמיד 100. אבל אחרי פיצול לא עגול, מיזוג או דיבידנד מיוחד, החוזה \"מותאם\" ויכול לכסות מספר אחר של מניות. ב־SPX המכפיל הוא $100 לכל נקודת מדד, לא מניות."},{"id":"1.6-l1","type":"mcq","life":true,"fmt":"usd","prompt":"דירה מפורסמת במחיר $8,000 למ\"ר, ושטחה 100 מ\"ר. כמה עולה הדירה כולה?","options":[{"v":800000},{"v":8000},{"v":80000},{"v":8000000}],"correct":0,"check":{"fn":"premiumCost","args":{"prem":8000,"mult":100}},"explain":{"right":"`$8,000 × 100 = $800,000`. בדיוק כמו פרמיה של אופציה: המחיר במסך הוא לאופציה אחת, וחוזה מכסה 100 מניות.","wrong":"המחיר במודעה הוא למטר אחד, והדירה היא 100 מטרים: `$8,000 × 100 = $800,000`. כך גם באופציות: מחיר לאופציה, כפול 100 לחוזה."},"source":"דוגמה מהחיים"},{"id":"1.6-q1","type":"mcq","prompt":"מתי פוקעת אופציה חודשית רגילה על מניה?","options":[{"text":"ביום שישי השלישי של החודש"},{"text":"ביום המסחר האחרון של החודש"},{"text":"ביום שני הראשון של החודש"},{"text":"30 יום בדיוק אחרי שקניתם אותה"}],"correct":0,"explain":{"right":"זה המועד הקבוע של הפקיעות החודשיות. אם הבורסה סגורה באותו יום שישי, הפקיעה מוקדמת ליום המסחר שלפניו.","wrong":"תאריך הפקיעה קבוע בחוזה ולא תלוי מתי קניתם. בפקיעה החודשית הרגילה זה יום שישי השלישי של החודש. יש גם פקיעות שבועיות, אבל הן חוזים אחרים עם תאריך משלהם."},"source":"Cboe, מפרט חוזה אופציות על מניות: תאריך פקיעה"},{"id":"1.6-q2","type":"mcq","prompt":"במסך הברוקר מופיעה השורה `AAPL 15-JAN-2027 250 PUT`. מה המספר 250?","options":[{"text":"מחיר המימוש"},{"text":"הפרמיה לחוזה"},{"text":"מחיר AAPL היום"},{"text":"מספר המניות בחוזה"}],"correct":0,"explain":{"right":"השורה מתארת את החוזה: נכס הבסיס (AAPL), תאריך הפקיעה (15 בינואר 2027, יום שישי השלישי של החודש), מחיר המימוש (250) והסוג (Put). הפרמיה מופיעה בנפרד, ליד השורה.","wrong":"השורה מתארת את פרטי החוזה ולא את המחיר שלו: AAPL הוא נכס הבסיס, `15-JAN-2027` הוא תאריך הפקיעה, 250 הוא מחיר המימוש ו־PUT הוא הסוג. הפרמיה מופיעה בנפרד."},"source":"OCC, Characteristics and Risks of Standardized Options: תנאי החוזה הסטנדרטי"},{"id":"1.6-c2","type":"concept","title":"מתי מותר לממש?","body":"**אמריקאי (American):** אפשר לממש **בכל יום עד הפקיעה**. כך אופציות על מניות ועל תעודות סל בארה\"ב, למשל SPY.\n**אירופאי (European):** אפשר לממש **רק בפקיעה**. כך אופציות על המדד SPX.\n\nבשני המקרים אפשר **למכור** את האופציה בשוק בכל יום מסחר. והשמות לא קשורים למקום: גם SPX נסחר בארה\"ב.","source":"OCC, Characteristics and Risks of Standardized Options: סגנון מימוש וסילוק; Cboe, מפרט חוזה SPX ומפרט אופציות על תעודות סל; Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.6-q3","type":"mcq","prompt":"מתי אפשר לממש אופציה בסגנון אמריקאי?","options":[{"text":"בכל יום מסחר עד הפקיעה"},{"text":"רק ביום הפקיעה"},{"text":"רק אם המניה עלתה מאז שקניתם"},{"text":"רק אחרי הפקיעה"}],"correct":0,"explain":{"right":"זה ההבדל מאופציה אירופאית, שאפשר לממש רק בפקיעה. השם \"אמריקאי\" מתאר מתי מותר לממש, ולא איפה סוחרים.","wrong":"אופציה אמריקאית אפשר לממש בכל יום עד הפקיעה. \"רק בפקיעה\" זו אופציה אירופאית. והשמות לא קשורים למקום, אלא רק למועד המימוש."},"source":"OCC, Characteristics and Risks of Standardized Options: American-style; Hull, פרק 10"},{"id":"1.6-c3","type":"concept","title":"ומה מקבלים כשמממשים?","body":"**סילוק פיזי:** המניות עוברות בפועל. כך ב־SPY: מימוש Call = קונים 100 מניות במחיר המימוש.\n**סילוק במזומן:** אין מניות. אם האופציה שווה משהו, הקונה מקבל את ההפרש בכסף, **כפול 100**. כך ב־SPX, כי אי אפשר למסור \"מדד\". ההפרש מחושב לפי **ערך סילוק**: המספר שהבורסה קובעת למדד ביום הפקיעה.\n\nפרט קטן שכדאי להכיר: ב־SPX החודשי הרגיל המסחר נגמר בדרך כלל ביום חמישי, וערך הסילוק נקבע לפי מחירי הפתיחה ביום שישי.","source":"Cboe, SPX Options Specifications; OCC, Equity Options Product Specifications"},{"id":"1.6-a2","type":"analogy","title":"לקבל את המוצר, או רק את ההפרש","body":"**סילוק פיזי** הוא כמו שובר שבו **מקבלים את הטלוויזיה עצמה**. משלמים $2,000, ולוקחים אותה הביתה.\n\n**סילוק במזומן** הוא כמו שובר שבו החנות **מעבירה לכם את ההפרש** בין המחיר בחנות למחיר בשובר, ואתם לא מקבלים שום טלוויזיה.","breaks":"טלוויזיה נשארת טלוויזיה, אבל מניות שקיבלתם בסילוק פיזי ממשיכות לעלות ולרדת, וצריך את כל הסכום בחשבון: חוזה Call על SPY במימוש $600 דורש `$600 × 100 = $60,000` בחשבון. ו־Put שמומש בלי מניות בחשבון משאיר אתכם במכירה של מניות שאין לכם. בסילוק במזומן עובר רק ההפרש."},{"id":"1.6-l2","type":"mcq","life":true,"fmt":"usd","prompt":"יש לכם שובר \"החזר הפרש\" לטלוויזיה במחיר $2,000. ביום האחרון היא עולה בחנות $2,300. כמה כסף תקבלו?","options":[{"v":300},{"v":2300},{"v":2000},{"v":0}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"call","side":"long","K":2000,"prem":0,"mult":1,"S":2300}},"explain":{"right":"מקבלים רק את ההפרש, `2,300 − 2,000 = 300`, בלי טלוויזיה. זה **סילוק במזומן**, כמו ב־SPX.","wrong":"בשובר \"החזר הפרש\" לא מקבלים את המוצר, רק את ההפרש: `2,300 − 2,000 = 300`. זה **סילוק במזומן**."},"source":"דוגמה מהחיים"},{"id":"1.6-q4","type":"mcq","prompt":"איזה משפט נכון לגבי אופציות על המדד SPX?","options":[{"text":"מימוש אירופאי, סילוק במזומן"},{"text":"מימוש אמריקאי, סילוק במניות"},{"text":"מימוש אירופאי, סילוק במניות"},{"text":"מימוש אמריקאי, סילוק במזומן"}],"correct":0,"explain":{"right":"SPX הוא מדד, ואי אפשר למסור אותו. לכן הסילוק הוא במזומן. והמימוש אפשרי רק בפקיעה.","wrong":"את המדד SPX אי אפשר למסור כמו מניה, ולכן הסילוק הוא במזומן. וסגנון המימוש שלו אירופאי: רק בפקיעה. מימוש אמריקאי וסילוק במניות הם המאפיינים של SPY."},"source":"Cboe, מפרט חוזה SPX: European, cash-settled"},{"id":"1.6-q5","type":"mcq","prompt":"מימשתם חוזה Call אחד על SPY עם מימוש $600. מה קורה?","options":[{"text":"לחשבון שלכם נכנסות 100 מניות SPY, ואתם משלמים $600 על כל אחת"},{"text":"מקבלים במזומן את ההפרש בין המחיר בשוק לבין המימוש"},{"text":"קונים מניית SPY אחת במחיר $600"},{"text":"מוכרים 100 מניות SPY במחיר $600 לכל אחת"}],"correct":0,"explain":{"right":"ב־SPY הסילוק פיזי: המניות עוברות בפועל. חוזה אחד הוא 100 מניות: `$600 × 100 = $60,000`, שצריכים להיות בחשבון. זו סיבה לבדוק מראש מה מימוש ידרוש מהחשבון, ולזכור שאפשר גם **למכור** את האופציה במקום לממש.","wrong":"ב־SPY הסילוק פיזי, ולא במזומן: מימוש Call פירושו לקנות בפועל 100 מניות (חוזה אחד) במחיר המימוש, $600 לכל אחת. מכירה במחיר המימוש שייכת ל־Put."},"source":"Cboe, מפרט אופציות על תעודות סל: 100 מניות, מסירה פיזית"},{"id":"1.6-q6","type":"mcq","prompt":"קניתם Call על SPX עם מימוש 6,000. ביום הפקיעה נקבע למדד **ערך סילוק** של 6,030. כמה מזומן נכנס לחשבון, לפני שמחסירים את הפרמיה ששילמתם?","fmt":"usd","options":[{"v":30},{"v":300},{"v":3000},{"v":30000}],"correct":2,"check":{"fn":"positionPnL","args":{"type":"call","side":"long","S":6030,"K":6000,"prem":0,"mult":100}},"explain":{"right":"ההפרש כפול 100: `(6,030 − 6,000) × 100 = $3,000`. אין מניות שעוברות, רק כסף. הרווח או ההפסד של העסקה = הסכום הזה פחות הפרמיה ששילמתם.","wrong":"בסילוק במזומן מקבלים את ההפרש בין ערך הסילוק למימוש, כפול 100: `(6,030 − 6,000) × 100 = $3,000`. כמו במניות, גם כאן המכפיל הוא 100."},"source":"Cboe, מפרט חוזה SPX: מכפיל $100, סילוק במזומן; OCC, Characteristics and Risks of Standardized Options: אופציות בסילוק במזומן"}],"summary":["כל חוזה מגדיר **נכס בסיס, מכפיל (בדרך כלל 100 מניות; ב־SPX, $100 לכל נקודת מדד), מחיר מימוש ותאריך פקיעה**. פקיעה חודשית רגילה: **יום שישי השלישי** של החודש.","**אמריקאי:** מממשים בכל יום עד הפקיעה (SPY). **אירופאי:** רק בפקיעה (SPX), אבל אפשר למכור את האופציה לפני כן.","**סילוק פיזי:** המניות עוברות (SPY). **סילוק במזומן:** מקבלים רק את ההפרש, כפול 100 (SPX).","הפרטים האלה כתובים בחוזה ובמפרט של הבורסה, ולא צריך לנחש אותם."],"ready":true,"unit":"1"},{"id":"1.7","title":"חזרה: ארבע הפוזיציות","minutes":5,"objective":"לזהות בגרף כל אחת מארבע הפוזיציות הבסיסיות, מתי היא מרוויחה ומה ההפסד המקסימלי שלה.","params":{"pos":{"type":"put","side":"short",
