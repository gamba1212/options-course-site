ממשו. הכותב יכול לקבל הקצאה."},"source":"FINRA Rule 2360(b)(23)"},{"id":"6.8-s1","type":"spot-guru","prompt":"מצאו את המשפטים המטעים בפוסט על יום הפקיעה. יש בו גם משפטים נכונים.","channel":"ערוץ \"פקיעה בכיף\"","claims":[{"t":"אופציה על מניה שפוקעת בתוך הכסף פשוט מעבירה את הרווח לחשבון במזומן.","bad":true,"why":"באופציות על מניות ותעודות סל הסילוק פיזי: מימוש הוא קנייה או מכירה של 100 מניות במחיר המימוש. (באופציות על מדדים, כמו SPX, הסילוק במזומן.)"},{"t":"אופציה בתוך הכסף בסכום של $0.01 ומעלה ממומשת אוטומטית, אלא אם ביקשתם אחרת.","bad":false,"why":"נכון. זה הכלל של OCC למימוש אוטומטי."},{"t":"אני לא סוגר כלום לפני הפקיעה. מה כבר יכול לקרות בשעה אחת?","bad":true,"why":"בחשבון יכולות להופיע 100 מניות לחוזה, או דרישת ביטחונות, והמניה ממשיכה לזוז גם אחרי הסגירה."},{"t":"כותב של אופציה יכול לקבל הקצאה גם כשהמניה נסגרה קצת מחוץ לכסף.","bad":false,"why":"נכון. מחזיקים יכולים לבקש לממש אחרי הסגירה, למשל אם המניה זזה במסחר המאוחר."}],"explain":{"right":"זיהיתם את שני המשפטים המטעים: \"הרווח עובר במזומן\" ו\"מה כבר יכול לקרות\".","wrong":"המטעים: באופציות על מניות לא מקבלים מזומן אלא מניות, ויום הפקיעה יכול להפתיע. שני המשפטים האחרים נכונים."},"source":"OCC, Characteristics and Risks of Standardized Options"}],"summary":["בפקיעה, אופציה בתוך הכסף בסכום של **$0.01 ומעלה ממומשת אוטומטית**, אלא אם ביקשתם אחרת.","מימוש של חוזה אחד הוא עסקה של **100 מניות** במחיר המימוש. בחשבון קטן זה יכול ליצור דרישת ביטחונות.","המניה **ממשיכה לזוז אחרי הסגירה**, ומחזיקים יכולים לבקש לממש גם אופציה שנסגרה מחוץ לכסף.","מי שלא רוצה מניות בחשבון יכול למכור את האופציה לפני הסגירה ביום הפקיעה."],"ready":true,"unit":"6"},{"id":"6.9","title":"מימוש והקצאה בפועל","minutes":7,"objective":"להבין שכותב של אופציה אמריקאית יכול לקבל הקצאה בכל יום עד הפקיעה, מה קורה בחשבון במימוש ובהקצאה, ולמה מימוש מוקדם בדרך כלל מוותר על ערך זמן.","timeSet":{"type":"call","K":100,"S0":100,"days0":45,"r":0.04,"iv":0.3,"mult":100},"items":[{"id":"6.9-c1","type":"concept","title":"בכל יום, לא רק בפקיעה","body":"אופציות על מניות בארה\"ב הן **אמריקאיות** (שיעור 1.6): המחזיק יכול לממש בכל יום מסחר עד הפקיעה.\n\nכשמחזיק מממש, המסלקה מגרילה ברוקר, והברוקר בוחר אחד מהלקוחות שלו שכתבו את אותה אופציה. לכן **כותב יכול לקבל הקצאה בכל יום**, בלי התראה מראש. ההודעה מגיעה אחרי מעשה, לרוב בבוקר שאחרי.\n\nמה קורה בחשבון, לחוזה אחד:\n**הקצאה על Short Call**: מוכרים (מוסרים) 100 מניות במחיר המימוש. אם אין לכם מניות, נפתחת פוזיציית Short במניה (מכירה בחסר, שיעור 6.8).\n**הקצאה על Short Put**: קונים 100 מניות במחיר המימוש.","source":"OCC, Characteristics and Risks of Standardized Options: Exercise and assignment"},{"id":"6.9-q1","type":"mcq","fmt":"usd","prompt":"כתבתם Put במימוש $95 וקיבלתם הקצאה. כמה תשלמו על המניות, לחוזה אחד?","options":[{"v":9500},{"v":95},{"v":950}],"correct":0,"check":{"fn":"notional","args":{"K":95,"mult":100}},"explain":{"right":"בהקצאה על Short Put קונים 100 מניות במחיר המימוש: `$95 × 100 = $9,500`, גם אם המניה נסחרת עכשיו במחיר נמוך יותר.","wrong":"חוזה הוא 100 מניות, והקנייה היא במחיר המימוש: `$95 × 100 = $9,500`."},"source":"OCC, Characteristics and Risks of Standardized Options: Exercise and assignment"},{"id":"6.9-q2","type":"mcq","prompt":"כתבתם Call במימוש $100 **בלי שיש לכם מניות**, וקיבלתם הקצאה. מה מופיע בחשבון?","options":[{"text":"פוזיציית Short של 100 מניות, שמכרתם במחיר $100"},{"text":"100 מניות שקניתם במחיר $100"},{"text":"שום דבר. ה־Call פשוט נסגר"}],"correct":0,"explain":{"right":"הייתם חייבים למסור 100 מניות במחיר $100. בלי מניות, הן נמכרות בחסר, ומעכשיו אתם Short על המניה, עם סיכון אם היא תמשיך לעלות.","wrong":"בהקצאה על Short Call **מוסרים** מניות. כשאין מניות, הברוקר מוכר אותן בחסר, ובחשבון מופיעה פוזיציית Short של 100 מניות."},"source":"OCC, Characteristics and Risks of Standardized Options: Exercise and assignment"},{"id":"6.9-q3","type":"mcq","prompt":"כתבתם Call שפוקע בעוד חודש. מתי יכולים להקצות לכם אותו?","options":[{"text":"בכל יום מסחר עד הפקיעה"},{"text":"רק ביום הפקיעה"},{"text":"רק אם תסכימו מראש"}],"correct":0,"explain":{"right":"באופציה אמריקאית המחזיק יכול לממש בכל יום, והכותב יכול לקבל הקצאה בכל יום. מי שרוצה לסיים את ההתחייבות יכול לקנות את האופציה בחזרה ולסגור את הפוזיציה.","wrong":"אופציות על מניות בארה\"ב הן אמריקאיות: מימוש, ולכן גם הקצאה, אפשריים בכל יום מסחר עד הפקיעה, בלי לשאול את הכותב."},"source":"OCC, Characteristics and Risks of Standardized Options: Exercise and assignment"},{"id":"6.9-c2","type":"concept","title":"למה רוב המחזיקים לא מממשים מוקדם","body":"מי שמממש מוקדם מקבל רק את **הערך הפנימי**. מי שמוכר את האופציה בשוק מקבל ערך פנימי **ועוד ערך זמן**.\n\nבדוגמה משיעור 2.1: Call במימוש $100, המניה במחיר $106 ונשארו 30 ימים. הערך הפנימי {intr@106} לאופציה, אבל המחיר שלה בשוק {v30@106}. ההפרש הוא ערך הזמן: בערך {tv30@106} לחוזה. מי שמממש עכשיו מוותר עליו.\n\nלכן, ב־Call על מניה בלי דיבידנד, מימוש מוקדם בדרך כלל לא משתלם. יש שני מצבים שבהם מימוש מוקדם כן משתלם. נלמד אותם בשיעור 6.10.","time":{"S":106,"days":30,"lock":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"6.9-q4","type":"mcq","prompt":"Call במימוש $100, המניה במחיר $106 ונשארו 30 ימים (IV 30%). הערך הפנימי {intr@106} לאופציה, והמחיר שלה בשוק {v30@106}. מה ההבדל בין **מימוש עכשיו** ל**מכירת האופציה** בשוק?","options":[{"text":"במכירה מקבלים גם את ערך הזמן, {tv30@106} לחוזה. במימוש מוותרים עליו"},{"text":"אין הבדל. בשני המקרים מקבלים {intr@106} לאופציה"},{"text":"מימוש תמיד עדיף, כי מקבלים מניות"}],"correct":0,"explain":{"right":"מימוש נותן רק ערך פנימי, {intr@106} לאופציה. מכירה נותנת את כל השווי, {v30@106}, כולל ערך הזמן.","wrong":"במימוש מקבלים רק את הערך הפנימי. האופציה בשוק שווה יותר, {v30@106} לאופציה, כי יש לה עוד ערך זמן. ההפרש הוא {tv30@106} לחוזה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"6.9-q5","type":"mcq","prompt":"קיבלתם הקצאה על Short Put. מתי בדרך כלל תגלו?","options":[{"text":"אחרי מעשה, בדרך כלל בהודעה מהברוקר בבוקר שאחרי"},{"text":"יום לפני, כדי שתספיקו להתכונן"},{"text":"רק בפקיעה, כשכל ההקצאות מתבצעות יחד"}],"correct":0,"explain":{"right":"הקצאה לא מגיעה עם התראה מראש. מגלים אותה בחשבון, בדרך כלל ביום המסחר שאחרי המימוש.","wrong":"אין התראה מראש, וההקצאה לא מחכה לפקיעה. המחזיק מממש, והכותב מגלה בדיעבד, לרוב בבוקר שאחרי."},"source":"OCC, Characteristics and Risks of Standardized Options: Exercise and assignment"},{"id":"6.9-q6","type":"mcq","prompt":"יש לכם Bull Call Spread (שיעור 5.4): Long Call במימוש $100 ו־Short Call במימוש $105. יום לפני הפקיעה המניה במחיר $108. מה נכון לגבי הרגל שכתבתם?","options":[{"text":"היא בתוך הכסף, ואפשר להקצות לכם אותה כמו כל Call כתוב"},{"text":"אי אפשר להקצות אותה, כי היא חלק מ־Spread והברוקר מקזז את הרגליים"},{"text":"הברוקר סוגר את ה־Spread אוטומטית ברגע שהוא מגיע לרווח המקסימלי"}],"correct":0,"explain":{"right":"כל רגל היא אופציה נפרדת. ה־Call שכתבתם יכול לקבל הקצאה בכל יום, ואז נשארתם עם Short במניה ועם Call קנוי. ה־Call שקניתם עדיין מגן, אבל לא אוטומטית: צריך לממש אותו, או לסגור את שתי הפוזיציות.","wrong":"המסלקה לא יודעת שהאופציות שלכם הן Spread. כל רגל עומדת בפני עצמה, והרגל הכתובה יכולה לקבל הקצאה לפני הפקיעה או בה."},"source":"OCC, Characteristics and Risks of Standardized Options"}],"summary":["באופציה אמריקאית אפשר לממש **בכל יום**, ולכן כותב יכול לקבל **הקצאה בכל יום**, בלי התראה מראש.","הקצאה על **Short Call**: מוסרים 100 מניות. בלי מניות נפתח Short במניה.","הקצאה על **Short Put**: קונים 100 מניות במחיר המימוש.","מימוש מוקדם נותן רק ערך פנימי. מכירה בשוק נותנת גם **ערך זמן**."],"ready":true,"unit":"6"},{"id":"6.10","title":"מתי הקצאה מוקדמת סבירה","minutes":8,"objective":"לזהות את שני המצבים שבהם כותב צפוי לקבל הקצאה לפני הפקיעה: Call בתוך הכסף לפני יום האקס־דיבידנד, ו־Put עמוק בתוך הכסף. ולהכיר את Pin Risk.","items":[{"id":"6.10-c1","type":"concept","title":"הכלל: כל עוד יש ערך זמן","body":"בשיעור 6.9 ראינו שמימוש מוקדם בדרך כלל לא משתלם: מי שמממש מקבל רק ערך פנימי, ומוותר על ערך הזמן.\n\nמכאן נובע כלל פשוט לכותב:\n\n**כל עוד באופציה שכתבתם נשאר ערך זמן משמעותי, הקצאה מוקדמת לא סבירה.**\n\nיש שני מצבים שבהם הכלל מתהפך. נעבור עליהם אחד אחד.","source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"6.10-c1b","type":"concept","title":"מצב 1: Call לפני דיבידנד","body":"**דיבידנד** הוא מזומן שחברה מחלקת לבעלי המניות שלה.\n\nמי מקבל אותו? רק מי שמחזיק את המניה לפני **יום האקס־דיבידנד**. מי שקונה את המניה ביום הזה או אחריו כבר לא מקבל. ומי שמחזיק Call לא מקבל בכלל.\n\nלכן, יום לפני האקס, מחזיק של Call בתוך הכסף שואל: מה שווה יותר, הדיבידנד או ערך הזמן שנשאר לי ב־Call?\n\n**אם הדיבידנד גדול מערך הזמן,** משתלם לו לממש: הוא מקבל את המניה ואיתה את הדיבידנד. הכותב מקבל הקצאה.\n\nועוד דבר שכותב צריך לדעת: מי שנמצא ב־Short במניה ביום האקס משלם את הדיבידנד מכיסו. את המניות שמכר הוא שאל, והדיבידנד מגיע למי שהשאיל אותן.","source":"Hull, Options, Futures, and Other Derivatives, פרק 17"},{"id":"6.10-q1","type":"mcq","prompt":"כתבתם Call במימוש $100. המניה נסחרת במחיר $108, וה־Call נסחר במחיר $8.10. מחר יום האקס־דיבידנד, והדיבידנד הוא $0.50 למניה. האם הקצאה הלילה סבירה?","options":[{"text":"כן. ערך הזמן הוא רק $0.10, פחות מהדיבידנד של $0.50"},{"text":"לא. ערך הזמן הוא $8.10, הרבה יותר מהדיבידנד של $0.50"},{"text":"לא. הדיבידנד של $0.50 קטן בהרבה מהערך הפנימי של $8"}],"correct":0,"explain":{"right":"הערך הפנימי הוא $8, ולכן ערך הזמן הוא `$8.10 − $8 = $0.10`. מחזיק שמממש מוותר על $0.10 ומקבל דיבידנד של $0.50. משתלם לו, ולכן הקצאה סבירה.","wrong":"משווים את ערך הזמן לדיבידנד. ערך הזמן: `$8.10 − $8 = $0.10`. הדיבידנד: $0.50. מחזיק שמממש מוותר על מעט ומקבל יותר, ולכן הקצאה הלילה סבירה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 17"},{"id":"6.10-q2","type":"mcq","prompt":"כתבתם Call במימוש $100. המניה נסחרת במחיר $102, וה־Call נסחר במחיר $4. מחר יום האקס־דיבידנד, והדיבידנד הוא $0.50 למניה. האם הקצאה הלילה סבירה?","options":[{"text":"לא סבירה. ערך הזמן הוא $2, הרבה יותר מהדיבידנד"},{"text":"סבירה מאוד. ה־Call בתוך הכסף בסכום של $2, יותר מהדיבידנד"},{"text":"ודאית. לפני דיבידנד המסלקה מממשת אוטומטית כל Call בתוך הכסף"}],"correct":0,"explain":{"right":"ערך הזמן הוא `$4 − $2 = $2`. מחזיק שמממש מוותר על $2 כדי לקבל $0.50. לא משתלם לו, ולכן הקצאה לא סבירה. לא סבירה, אבל לא בלתי אפשרית.","wrong":"הערך הפנימי הוא $2, ולכן ערך הזמן הוא `$4 − $2 = $2`. מחזיק שמממש מפסיד $2 כדי לקבל דיבידנד של $0.50, ולכן הקצאה לא סבירה. מימוש אוטומטי קיים רק בפקיעה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 17"},{"id":"6.10-q3","type":"mcq","prompt":"כתבתם Call בלי שיש לכם מניות, וקיבלתם הקצאה בערב שלפני יום האקס־דיבידנד. מה קורה בחשבון?","options":[{"text":"נפתחה פוזיציית Short במניה, ואתם גם חייבים את הדיבידנד"},{"text":"נפתחה פוזיציית Short במניה, והדיבידנד לא נוגע לכם"},{"text":"קיבלתם 100 מניות ואת הדיבידנד"}],"correct":0,"explain":{"right":"בהקצאה על Call מוסרים 100 מניות. בלי מניות נפתח Short, ומי שנמצא ב־Short ביום האקס־דיבידנד משלם את הדיבידנד מכיסו.","wrong":"בהקצאה על Call מוסרים מניות, לא מקבלים. בלי מניות נפתח Short, ומי שב־Short ביום האקס־דיבידנד חייב לשלם את הדיבידנד. זו עלות נוספת מעבר להקצאה עצמה."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"6.10-q7","type":"mcq","prompt":"Covered Call (שיעור 5.1): יש לכם 100 מניות וכתבתם עליהן Call במימוש $105. המניה עלתה למחיר $112, ב־Call כמעט לא נשאר ערך זמן, ומחר יום האקס־דיבידנד. מה סביר שיקרה הלילה?","options":[{"text":"תקבלו הקצאה: המניות יימכרו במחיר $105, והדיבידנד יעבור לקונה"},{"text":"שום דבר, כי ב־Covered Call אי אפשר לקבל הקצאה לפני הפקיעה"},{"text":"תקבלו גם את הדיבידנד וגם את המשך העלייה"}],"correct":0,"explain":{"right":"Call בתוך הכסף, ערך זמן קטן מהדיבידנד, יום לפני האקס. למחזיק משתלם לממש, ואתם מוסרים את המניות לפני שקיבלתם את הדיבידנד.","wrong":"גם Covered Call הוא Short Call אמריקאי, ואפשר להקצות אותו בכל יום. כשערך הזמן קטן מהדיבידנד, הקצאה בערב שלפני האקס סבירה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 17"},{"id":"6.10-c1c","type":"concept","title":"מצב 2: Put עמוק בתוך הכסף","body":"כשהמניה ירדה הרבה מתחת למימוש, ב־Put כמעט לא נשאר ערך זמן.\n\nדוגמה: Put במימוש $100 כשהמניה במחיר $60. הערך הפנימי הוא $40, והאופציה נסחרת במחיר $40. ערך הזמן: אפס.\n\nלמחזיק אין סיבה לחכות. אם יממש עכשיו, יקבל `$100 × 100 = $10,000` במזומן כבר היום, במקום בעוד חודש. כסף היום שווה יותר מכסף בעוד חודש, כי אפשר לקבל עליו ריבית.\n\nלכן כותב של Put עמוק בתוך הכסף צריך להיות מוכן להקצאה בכל יום.","source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"6.10-q4","type":"mcq","prompt":"כתבתם שלוש אופציות, ולכולן נשאר חודש לפקיעה. באיזו מהן הקצאה מוקדמת הכי סבירה?","options":[{"text":"Put במימוש $100 כשהמניה במחיר $60, שנסחר במחיר $40 בדיוק"},{"text":"Put במימוש $100 כשהמניה במחיר $98, שנסחר במחיר $5"},{"text":"Call במימוש $100 כשהמניה במחיר $95, שנסחר במחיר $1.50"}],"correct":0,"explain":{"right":"ב־Put הראשון הערך הפנימי הוא $40, והמחיר $40: אין ערך זמן בכלל. למחזיק עדיף לממש ולקבל `$100 × 100 = $10,000` במזומן כבר עכשיו.","wrong":"מחפשים את האופציה שלא נשאר בה ערך זמן. ב־Put העמוק בתוך הכסף המחיר ($40) שווה לערך הפנימי ($40), ולכן מימוש לא מוותר על כלום. בשתי האחרות יש ערך זמן, וה־Call בכלל מחוץ לכסף."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"6.10-c2","type":"concept","title":"Pin Risk: כשהמניה נסגרת על המימוש","body":"ביום הפקיעה, אם המניה נסגרת רחוק מהמימוש, ברור מה יקרה. אבל מה אם היא נסגרת ממש עליו, נניח $100.02 כשהמימוש הוא $100?\n\nלפי הכלל משיעור 6.8, Call כזה אמור להתממש אוטומטית. אבל המחזיק רשאי לבקש שלא לממש, ויש לו זמן להחליט אחרי הסגירה, כשהמניה ממשיכה לזוז במסחר המאוחר. חלק יממשו, חלק לא.\n\nלכן הכותב **לא יודע** אם יקבל הקצאה. ההודעה מגיעה רק אחרי סגירת המסחר, ואי אפשר לפעול עד הפתיחה הבאה. בפקיעה של יום שישי זה אומר יום שני בבוקר.\n\nאם קיבלתם הקצאה, יש לכם פוזיציה במניה שלא תכננתם, אחרי סוף שבוע שבו יכלו לצאת חדשות.\n\nלמצב הזה קוראים **Pin Risk**.","source":"Natenberg, Option Volatility and Pricing; OCC, Characteristics and Risks of Standardized Options"},{"id":"6.10-q5","type":"mcq","prompt":"כתבתם Call במימוש $100, בלי מניות. ביום הפקיעה המניה נסגרת במחיר $100.02. מה תדעו בסוף יום המסחר?","options":[{"text":"לא תדעו בוודאות אם קיבלתם הקצאה. תגלו רק לפני פתיחת המסחר הבא"},{"text":"שקיבלתם הקצאה על כל החוזים, כי ה־Call בתוך הכסף"},{"text":"שלא קיבלתם הקצאה, כי ההפרש קטן מדי"}],"correct":0,"explain":{"right":"המימוש האוטומטי הוא רק ברירת מחדל, ומחזיקים יכולים לבקש לא לממש אם המניה ירדה במסחר המאוחר. לכן אי אפשר לדעת, ואתם עלולים לפתוח את השבוע עם Short של 100 מניות.","wrong":"קרוב למימוש אין ודאות. מחזיקים יכולים לבקש לממש או לא לממש אחרי הסגירה, לפי מה שקרה במסחר המאוחר. הכותב מגלה רק אחר כך. זה Pin Risk."},"source":"FINRA Rule 2360(b)(23); OCC Rule 805"},{"id":"6.10-q6","type":"mcq","prompt":"סוחר כתב Put במימוש $50. ביום הפקיעה, שעה לפני הסגירה, המניה נסחרת במחיר $50.05 וה־Put נסחר במחיר $0.10. מה יסיר ממנו את אי הוודאות לגבי הקצאה?","options":[{"text":"לקנות את ה־Put בחזרה (Buy to Close) לפני הסגירה"},{"text":"להציב פקודת Stop על המניה"},{"text":"לחכות: אם המניה תיסגר מעל $50, הקצאה בלתי אפשרית"}],"correct":0,"explain":{"right":"מי שסגר את הפוזיציה כבר לא כותב, ולכן לא יכול לקבל הקצאה. זה עולה $10 ועמלה. מי שמחכה חוסך אותם, ולוקח על עצמו את אי הוודאות של סוף השבוע.","wrong":"רק סגירת הפוזיציה מסירה את החובה. גם אם המניה נסגרת מעט מעל $50, מחזיקים יכולים לממש אם היא יורדת במסחר המאוחר, ופקודת Stop על המניה לא נוגעת לחובה שלכם ככותבים."},"source":"FINRA Rule 2360(b)(23); OCC Rule 805"},{"id":"6.10-c2b","type":"concept","title":"Pin Risk בפוזיציה של כמה רגליים","body":"**ב־Spread זה חמור יותר.** הרגל שכתבתם עלולה לקבל הקצאה, בזמן שהרגל שקניתם פוקעת בלי ערך. ההפסד המקסימלי שחישבנו ביחידה 5 נכון רק כל עוד שתי הרגליים קיימות.\n\nוב־Butterfly (שיעור 5.9), נקודת הרווח המקסימלי היא בדיוק המקום שבו ה־Pin Risk הכי גדול: שני ה־Calls שכתבתם נמצאים על הכסף.","source":"Natenberg, Option Volatility and Pricing; OCC, Characteristics and Risks of Standardized Options"},{"id":"6.10-q8","type":"mcq","prompt":"Iron Condor (שיעור 5.8) עם Short Call במימוש $105 ו־Long Call במימוש $110. ביום הפקיעה המניה נסגרת במחיר $105.03. מה הסיכון?","options":[{"text":"ה־Short Call עלול לקבל הקצאה בזמן שה־Long Call פוקע, ותישארו עם Short במניה"},{"text":"אין סיכון: ההפסד המקסימלי של Iron Condor הוא תמיד $300, בכל מצב"},{"text":"שתי הרגליים ימומשו אוטומטית בפקיעה ויקזזו זו את זו"}],"correct":0,"explain":{"right":"ההפסד המקסימלי של $300 נכון רק כל עוד שתי הרגליים קיימות. אחרי הפקיעה ה־Call במימוש $110 נעלם, ואם קיבלתם הקצאה, יש לכם Short במניה עד הפתיחה הבאה.","wrong":"ה־Call במימוש $110 מחוץ לכסף ופוקע בלי ערך. ה־Call במימוש $105 בתוך הכסף, ועלול לקבל הקצאה. ההגנה נעלמה, והפוזיציה במניה נשארה."},"source":"FINRA Rule 2360(b)(23); OCC Rule 805"}],"summary":["כל עוד באופציה שכתבתם יש **ערך זמן** משמעותי, הקצאה מוקדמת לא סבירה.","**Call לפני יום האקס־דיבידנד:** הקצאה סבירה כשהדיבידנד גדול מערך הזמן.","**Put עמוק בתוך הכסף:** כמעט בלי ערך זמן, ולכן הקצאה מוקדמת סבירה.","**Pin Risk:** כשהמניה נסגרת על המימוש, הכותב לא יודע אם קיבל הקצאה עד שמאוחר מדי לפעול."],"ready":true,"unit":"6"},{"id":"6.11","title":"IV והיווניות בשרשרת","minutes":8,"objective":"למצוא בשרשרת האופציות את עמודות ה־IV, Delta, Theta ו־Vega, לקרוא אותן נכון (לאופציה, לא לחוזה), ולהשתמש בהן כדי להעריך מה יקרה לאופציה.","chainSetFrom":"6.1","pins":{"30:c105.iv":27.4,"30:c105.delta":0.41,"30:c105.theta":-0.056,"30:c105.vega":0.11,"30:c100.theta":-0.059,"30:c90.delta":0.94},"items":[{"id":"6.11-c1","type":"concept","title":"העמודות שעוד לא ראיתם","chain":{"exp":"30","view":"call","cols":["bid","ask","iv","delta"]},"body":"בשיעור 6.1 קראתם בשרשרת מחירים: Bid, Ask, Last, Volume ו־OI.\n\nברוב מסכי המסחר אפשר להוסיף לשרשרת עוד עמודות: **IV**, **Delta**, **Theta** ו־**Vega**. אלה בדיוק המספרים שלמדתם ביחידות 2 ו־3. עכשיו נראה איפה הם יושבים על המסך.\n\n**מאיפה המספרים מגיעים?** הברוקר מחשב אותם ממודל תמחור, לפי המחיר של כל אופציה בשוק, בדרך כלל מחיר האמצע. לכן ברוקרים שונים יציגו מספרים מעט שונים לאותה אופציה. אלה הערכות, לא נתוני שוק.\n\nבשרשרת למטה יש עכשיו עמודת IV ועמודת Delta, ליד ה־Bid וה־Ask.","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q1","type":"chain-tap","chain":{"exp":"30","view":"call","cols":["bid","ask","iv","delta"],"lockExp":true,"lockView":true},"answer":{"exp":"30","type":"call","K":105,"col":"iv"},"prompt":"מצאו את ה־IV של Call במימוש $105, בפקיעה של 30 יום, ולחצו עליה.","explain":{"right":"ה־IV של ה־Call הזה היא {c105.iv}. זו התנודתיות השנתית שהשוק מתמחר במחיר שלו (שיעור 2.3).","wrong":"מחפשים את השורה של המימוש $105, ואת העמודה IV. הערך שם: {c105.iv}."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"6.11-c2","type":"concept","title":"לכל אופציה יש IV משלה","chain":{"exp":"30","view":"call","cols":["ask","iv"],"lockExp":true},"body":"עד עכשיו דיברנו על \"ה־IV של המניה\" כאילו יש רק אחת. בשרשרת רואים שזה לא מדויק: **לכל מימוש יש IV משלו.**\n\nהסתכלו על העמודה: במימוש $90 ה־IV היא {c90.iv}, ובמימוש $115 היא {c115.iv}. במניות, המימושים הנמוכים נסחרים בדרך כלל ב־IV גבוהה יותר. לתופעה הזו קוראים **Skew**, ונלמד עליה במסלול המתקדם.\n\nועוד דבר:\n**ל־Call ול־Put באותו מימוש יש כמעט אותה IV.** עברו ל־Puts ותראו. זה נובע מהקשר ביניהם (שיעור 2.6).","source":"Hull, Options, Futures, and Other Derivatives, פרק 20"},{"id":"6.11-q2","type":"mcq","prompt":"בשרשרת של XYZ, בפקיעה של 30 יום: ה־IV של Call במימוש $90 היא {c90.iv}, ושל Call במימוש $115 היא {c115.iv}. מה נכון?","options":[{"text":"זה רגיל: לכל מימוש יש IV משלו, ואין מספר אחד לכל המניה"},{"text":"יש טעות בנתונים: לכל האופציות על אותה מניה חייבת להיות אותה IV"},{"text":"ה־Call במימוש $90 זול יותר, כי ה־IV שלו גבוהה יותר"}],"correct":0,"explain":{"right":"ה־IV נגזרת מהמחיר של כל אופציה בנפרד, והשוק לא מתמחר את כל המימושים באותה תנודתיות. כשמדברים על \"ה־IV של המניה\" מתכוונים בדרך כלל לאופציות שעל הכסף.","wrong":"IV מחושבת לכל אופציה לחוד, מהמחיר שלה בשוק, ולכן היא שונה ממימוש למימוש. IV גבוהה יותר אומרת שהשוק מתמחר במימוש הזה תנודתיות גבוהה יותר. היא לא אומרת שהאופציה זולה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 20"},{"id":"6.11-q3","type":"mcq","prompt":"ב־XYZ, בפקיעה של 30 יום, ה־IV של Call במימוש $105 היא {c105.iv}. לפי כלל ה־16 משיעור 2.4, מה סטיית התקן היומית שהשוק מתמחר, בערך?","options":[{"text":"בערך 1.7% ביום"},{"text":"בערך 27% ביום"},{"text":"בערך 0.1% ביום"},{"text":"בערך 4.4% ביום"}],"correct":0,"explain":{"right":"`27.4% ÷ 16 ≈ 1.7%`. על מניה במחיר {S} זו תנועה יומית של בערך $1.75, למעלה או למטה.","wrong":"IV היא שנתית. ליום מחלקים ב־16: `27.4% ÷ 16 ≈ 1.7%`."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"6.11-c3","type":"concept","title":"Delta: בכמה זז המחיר","chain":{"exp":"30","view":"call","cols":["bid","ask","delta"],"lockExp":true},"body":"עמודת ה־**Delta** אומרת בכמה ישתנה מחיר האופציה כשהמניה עולה בדולר אחד (שיעור 3.1).\n\n**ב־Calls** הדלתא בין 0 לבין 1: קרובה ל־1 עמוק בתוך הכסף, וקרובה ל־0 רחוק מחוץ לכסף.\n**ב־Puts** היא שלילית, בין −1 לבין 0. עברו ל־Puts ותראו.\n\n**שימו לב ליחידות.** כמו המחירים בשרשרת, גם הדלתא היא **לאופציה**. Call במימוש $105 עם Delta של {c105.delta}: אם המניה עולה בדולר אחד, מחיר האופציה עולה בערך $0.41, והחוזה כולו, 100 מניות, בערך $41.","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q4","type":"chain-tap","chain":{"exp":"30","view":"call","cols":["bid","ask","delta"],"lockExp":true,"lockView":true},"answer":{"exp":"30","type":"call","K":90,"col":"row"},"prompt":"נניח שהמניה תעלה מחר בדולר אחד.\n\nלפי עמודת ה־Delta, איזה Call ירוויח הכי הרבה דולרים לחוזה? לחצו על השורה שלו.","explain":{"right":"ל־Call במימוש $90 יש הדלתא הגבוהה ביותר, {c90.delta}: הוא עמוק בתוך הכסף וזז כמעט כמו המניה. הוא גם היקר ביותר, {c90.ask} לאופציה.","wrong":"מחפשים את הדלתא הגבוהה ביותר בעמודה. זה ה־Call במימוש $90, עם Delta של {c90.delta}: הוא עמוק בתוך הכסף וזז כמעט כמו המניה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q5","type":"mcq","fmt":"usd","chain":{"exp":"30","view":"call","cols":["bid","ask","delta"],"lockExp":true,"lockView":true,"highlight":{"type":"call","K":105}},"prompt":"קניתם חוזה אחד של Call במימוש $105 (30 יום). ה־Delta שלו בשרשרת: {c105.delta}. המניה עולה מיד בשני דולרים. בכמה בערך יעלה שווי החוזה?","options":[{"v":82},{"v":41},{"v":200},{"v":8}],"correct":0,"check":{"fn":"greekMove","args":{"greek":"@c105.delta","by":2}},"explain":{"right":"הדלתא היא לאופציה: `0.41 × $2 = $0.82`. לחוזה, כפול 100: בערך $82. זו הערכה: בתנועה גדולה הדלתא עצמה משתנה (גמא, שיעור 3.2).","wrong":"מכפילים את הדלתא בתנועה, ואז ב־100: `0.41 × $2 × 100 = $82`. הסכום $41 הוא לתנועה של $1 בלבד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-c4","type":"concept","title":"Theta ו־Vega: גם הן לאופציה","chain":{"exp":"30","view":"call","cols":["ask","theta","vega"],"lockView":true},"body":"ביחידה 3 הצגנו תטא ווגה **לחוזה**, בדולרים. בשרשרת הן מוצגות **לאופציה**, כמו המחירים, ולכן המספרים נראים קטנים פי 100.\n\n**תטא (Theta):** ב־Call במימוש $105 היא {c105.theta}. כלומר האופציה מאבדת בערך $0.056 לאופציה ביום, שהם בערך {c105.thetaDay} לחוזה, אם שום דבר אחר לא משתנה.\n\n**וגה (Vega):** באותו Call היא {c105.vega}. כלומר על כל נקודת IV שה־IV עולה, המחיר עולה בערך $0.11 לאופציה, שהם {c105.vegaPt} לחוזה.\n\n**עברו בין הפקיעות** והשוו את המימושים שקרובים לכסף, $95 עד $110: בפקיעה הרחוקה האופציה מאבדת פחות ביום, ורגישה יותר ל־IV.\n\n(בקצוות, במימוש $90 ובמימוש $115, זה מתהפך: בפקיעה הקרובה כמעט לא נשאר שם ערך זמן לאבד.)","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q6","type":"mcq","fmt":"usd","chain":{"exp":"30","view":"call","cols":["ask","theta","vega"],"lockExp":true,"lockView":true,"highlight":{"type":"call","K":100}},"prompt":"Call במימוש $100, בפקיעה של 30 יום. ה־Theta שלו בשרשרת: {c100.theta}. כמה מאבד חוזה אחד ביום, בערך, אם המניה וה־IV לא זזות?","options":[{"v":6},{"v":59},{"v":1},{"v":600}],"correct":0,"check":{"fn":"greekMove","args":{"greek":"@c100.theta"}},"explain":{"right":"התטא בשרשרת היא לאופציה: $0.059 ביום. לחוזה, כפול 100: בערך $6 ביום.","wrong":"התטא בשרשרת היא לאופציה. מכפילים ב־100 כדי לקבל חוזה: `$0.059 × 100 ≈ $6` ביום."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q7","type":"chain-tap","chain":{"exp":"30","view":"call","cols":["ask","theta","vega"],"lockView":true},"answer":{"exp":"58","type":"call","K":105,"col":"vega"},"prompt":"עברו לפקיעה של **58 יום**, ולחצו על ה־Vega של Call במימוש $105.","explain":{"right":"בפקיעה של 58 יום ה־Vega היא {58:c105.vega}, לעומת {30:c105.vega} בפקיעה של 30 יום. ככל שנשאר יותר זמן, האופציה רגישה יותר ל־IV (שיעור 3.4).","wrong":"קודם בוחרים את הפקיעה של 58 יום למעלה, ואז מחפשים את המימוש $105 ואת העמודה Vega. הערך שם: {58:c105.vega}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q8","type":"mcq","prompt":"Call במימוש $105 על XYZ. בפקיעה של 30 יום: Theta {30:c105.theta}, Vega {30:c105.vega}. בפקיעה של 58 יום: Theta {58:c105.theta}, Vega {58:c105.vega}. מה ההבדל בין שתי הפקיעות?","options":[{"text":"הרחוקה מאבדת פחות ביום, ורגישה יותר לשינוי ב־IV"},{"text":"הרחוקה מאבדת יותר ביום, ורגישה פחות לשינוי ב־IV"},{"text":"אין הבדל של ממש: אותו מימוש, אותה מניה"}],"correct":0,"explain":{"right":"באופציה שקרובה לכסף, בפקיעה רחוקה הדעיכה היומית איטית יותר (שיעור 2.5), אבל יש יותר ערך זמן שתלוי ב־IV, ולכן הווגה גדולה יותר (שיעור 3.4).","wrong":"משווים את העמודות: התטא של 58 יום קרובה יותר לאפס (פחות דעיכה ביום), והווגה גדולה יותר (יותר רגישות ל־IV)."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.11-q9","type":"mcq","fmt":"usd","chain":{"exp":"30","view":"call","cols":["bid","ask","iv","vega"],"lockExp":true,"lockView":true,"highlight":{"type":"call","K":105}},"prompt":"קניתם חוזה אחד של Call במימוש $105 (30 יום), יום לפני דוח. ה־Vega שלו בשרשרת: {c105.vega}. אחרי הדוח המניה לא זזה, וה־IV ירדה ב־5 נקודות IV. כמה בערך הפסיד החוזה בגלל ה־IV?","options":[{"v":55},{"v":11},{"v":5},{"v":550}],"correct":0,"check":{"fn":"greekMove","args":{"greek":"@c105.vega","by":5}},"explain":{"right":"`0.11 × 5 = $0.55` לאופציה, כלומר בערך $55 לחוזה. שילמתם {c105.cost} על החוזה, אז כמעט רבע ממנו נעלם בלי שהמניה זזה. זה IV Crush (שיעור 3.4), ועכשיו אפשר לקרוא אותו ישר מהשרשרת.","wrong":"מכפילים את הווגה במספר הנקודות, ואז ב־100: `0.11 × 5 × 100 = $55`."},"source":"Natenberg, Option Volatility and Pricing"}],"summary":["בשרשרת אפשר להוסיף עמודות של **IV**, **Delta**, **Theta** ו־**Vega**. הברוקר מחשב אותן ממודל, והן הערכות.","**לכל מימוש יש IV משלו.** אין מספר אחד לכל המניה.","היווניות בשרשרת הן **לאופציה**, כמו המחירים. לחוזה: כפול 100.","באופציות שקרובות לכסף, בפקיעה רחוקה: פחות תטא ביום, יותר וגה."],"ready":true,"unit":"6","chainSet":{"ticker":"XYZ","S":102.4,"r":0.04,"iv":0.28,"strikes":[90,95,100,105,110,115],"expiries":[{"id":"30","label":"30 יום","days":30,"call":{"vol":[12,48,1320,2450,860,0],"oi":[410,950,5200,8730,3100,1240],"last":{"115":0.6}},"put":{"vol":[35,410,1880,620,95,8],"oi":[2050,4300,6900,2700,640,150]}},{"id":"58","label":"58 יום","days":58,"call":{"vol":[5,20,240,610,310,140],"oi":[300,820,2900,4100,2200,1050]},"put":{"vol":[10,90,330,150,40,2],"oi":[900,1600,3100,1300,400,90]}}],"skew":0.25}},{"id":"6.12","title":"בונים אסטרטגיות בשרשרת","minutes":8,"objective":"למצוא בשרשרת את הרגליים של Covered Call, Iron Condor ו־Straddle, לחשב את המחיר נטו לפי Bid ו־Ask, ולקרוא את היווניות של הפוזיציה כולה.","chainSetFrom":"6.1","chainStrats":{"cc":{"name":"Covered Call","K":100,"exp":"30","legs":[{"type":"stock","side":"long"},{"type":"call","side":"short","K":105}]},"ic":{"name":"Iron Condor","K":100,"exp":"30","legs":[{"type":"put","side":"short","K":95},{"type":"put","side":"long","K":90},{"type":"call","side":"short","K":110},{"type":"call","side":"long","K":115}]},"ls":{"name":"Long Straddle","K":100,"exp":"30","legs":[{"type":"call","side":"long","K":100},{"type":"put","side":"long","K":100}]}},"pins":{"30:c105.delta":0.41,"30:c100.delta":0.64,"30:p100.delta":-0.36,"30:c105.bid":2.2},"items":[{"id":"6.12-c1","type":"concept","title":"אותה שיטה, לכל מבנה","chain":{"exp":"30","view":"call","cols":["bid","ask","delta"],"lockExp":true},"body":"בשיעור 6.4 בניתם Bull Call Spread מתוך השרשרת. אותה שיטה עובדת לכל מבנה מיחידה 5:\n\n**1. מוצאים את השורה של כל רגל:** פקיעה, סוג ומימוש.\n**2. קוראים את המחיר הנכון:** רגל שקונים, ב־Ask. רגל שכותבים, ב־Bid.\n**3. מחשבים נטו:** מה ששילמתם פחות מה שקיבלתם.\n**4. מסכמים את היווניות** של הרגליים, כדי לדעת איך הפוזיציה כולה מתנהגת.\n\nביחידה 5 המחירים היו עגולים. כאן הם מחירי השרשרת של XYZ, שנסחרת במחיר {S}, עם מרווח בין Bid ל־Ask בכל רגל.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.12-q1","type":"chain-tap","chain":{"exp":"30","view":"call","cols":["bid","ask","delta"],"lockExp":true,"lockView":true},"answer":{"exp":"30","type":"call","K":105,"col":"bid"},"prompt":"יש לכם 100 מניות XYZ, ואתם רוצים לבנות Covered Call: לכתוב עליהן Call במימוש $105, בפקיעה של 30 יום. לחצו על המחיר שתקבלו בכתיבה מיידית.","explain":{"right":"כותבים ב־Bid: {c105.bid} לאופציה, כלומר {c105.proceeds} לחוזה.","wrong":"כתיבה היא מכירה, ומוכרים מיד ב־Bid: {c105.bid}. ה־Ask הוא המחיר למי שקונה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.12-q2","type":"chart-mcq","fmt":"usd","strat":"cc","start":110,"prompt":"Covered Call על XYZ: קניתם 100 מניות במחיר {S}, וכתבתם Call במימוש $105 במחיר {c105.bid}. מה הרווח המקסימלי?","hint":"הזיזו את המחוון ימינה, מעבר למחיר $105.","options":[{"v":480},{"v":220},{"v":260},{"text":"בלתי מוגבל","unlimited":true}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"cc","what":"maxProfit"}},"explain":{"right":"מעל $105 מוכרים את המניות במחיר $105, ומוסיפים את הפרמיה: `($105 − {S} + {c105.bid}) × 100 = {st:cc.maxProfit}`. ההפסד המקסימלי, אם המניה יורדת לאפס: {st:cc.maxLoss}.","wrong":"הרווח נעצר במימוש: מוכרים במחיר $105 מניות שנקנו במחיר {S}, ומוסיפים את הפרמיה. `($105 − {S} + {c105.bid}) × 100 = {st:cc.maxProfit}`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.12-c2","type":"concept","title":"הדלתא של פוזיציה שלמה","chain":{"exp":"30","view":"call","cols":["bid","ask","delta"],"lockExp":true,"lockView":true,"highlight":{"type":"call","K":105}},"body":"בשיעור 3.6 ראינו שהיווניות של פוזיציה הן סכום היווניות של הרגליים. עכשיו עושים את זה מהשרשרת.\n\n**הפוזיציה:** Covered Call, כלומר 100 מניות ועוד Short Call במימוש $105.\n\n**המניות:** דלתא של 100.\n**ה־Call שכתבתם:** הדלתא שלו בשרשרת {c105.delta}. לחוזה: 41. הוא כתוב, ולכן מחסירים.\n\n**ביחד: {st:cc.delta}.** הפוזיציה מתנהגת עכשיו כמו 59 מניות, לא 100.\n\nהכלל: רגל קנויה מוסיפים, רגל כתובה מחסירים.","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.12-q3","type":"mcq","prompt":"Covered Call: 100 מניות, ועוד Short Call במימוש $105 שה־Delta שלו בשרשרת {c105.delta}. מה הדלתא של הפוזיציה כולה, במונחי מניות?","options":[{"text":"{st:cc.delta}"},{"text":"+141"},{"text":"+100"},{"text":"−41"}],"correct":0,"explain":{"right":"המניות תורמות 100. ה־Call כתוב, ולכן מחסירים את הדלתא שלו: `100 − 0.41 × 100 = 59`. אם המניה יורדת בדולר אחד, הפוזיציה מפסידה בערך $59, לא $100.","wrong":"רגל כתובה מחסירים: `100 − 0.41 × 100 = 59`. התוצאה +141 יוצאת אם מוסיפים במקום להחסיר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.12-c3","type":"concept","title":"וגם תטא ווגה","chain":{"exp":"30","view":"call","cols":["bid","theta","vega"],"lockExp":true,"lockView":true,"highlight":{"type":"call","K":105}},"body":"אותו חשבון עובד לתטא ולווגה. למניות אין תטא ואין וגה, אז נשאר רק ה־Call שכתבתם.\n\n**תטא (Theta):** כתבתם אופציה, אז הזמן עובד בשבילכם: בערך **{st:cc.theta} ביום**.\n\n**וגה (Vega):** אם ה־IV עולה, ה־Call שכתבתם מתייקר, וזה נגדכם: בערך **{st:cc.vega}** לכל נקודת IV.\n\nשלושה מספרים, ותמונה של הפוזיציה היום: היא מתנהגת כמו 59 מניות, מרוויחה מעט מכל יום שעובר, ומפסידה מעט אם ה־IV עולה.","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.12-q4","type":"chain-tap","chain":{"exp":"30","view":"call","cols":["bid","ask"],"lockExp":true},"answer":{"exp":"30","type":"put","K":95,"col":"bid"},"prompt":"בונים Iron Condor על XYZ. מתחילים בצד של ה־Puts: כותבים Put במימוש $95, בפקיעה של 30 יום. עברו ל־Puts ולחצו על המחיר שתקבלו בכתיבה מיידית.","explain":{"right":"כותבים ב־Bid: {p95.bid}. את ה־Put במימוש $90, שמגן, קונים ב־Ask: {p90.ask}.","wrong":"קודם עוברים ל־Puts למעלה. כותבים ב־Bid, ולכן המחיר הוא {p95.bid}, בשורה של המימוש $95."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.12-q5","type":"mcq","fmt":"usd","prompt":"Iron Condor על XYZ, בפקיעה של 30 יום:\nכתבתם Put במימוש $95 ב־Bid, {p95.bid}\nקניתם Put במימוש $90 ב־Ask, {p90.ask}\nכתבתם Call במימוש $110 ב־Bid, {c110.bid}\nקניתם Call במימוש $115 ב־Ask, {c115.ask}\n\nמה הקרדיט נטו, כשסוחרים חוזה אחד בכל רגל?","options":[{"v":95},{"v":150},{"v":205},{"v":55}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ic","what":"credit"}},"explain":{"right":"קיבלתם {p95.bid} ועוד {c110.bid}, ושילמתם {p90.ask} ועוד {c115.ask}. נשאר {st:ic.net} נטו, כלומר {st:ic.netCost}.","wrong":"מסכמים את מה שקיבלתם על שתי הרגליים הכתובות, ומחסירים את מה ששילמתם על שתי הקנויות. נשאר {st:ic.net} נטו, כלומר {st:ic.netCost}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.12-q6","type":"chart-mcq","fmt":"usd","strat":"ic","start":88,"prompt":"Iron Condor על XYZ, בפקיעה של 30 יום:\nPut כתוב במימוש $95, Put קנוי במימוש $90\nCall כתוב במימוש $110, Call קנוי במימוש $115\nהקרדיט נטו: {st:ic.net} (לפני הכפלה ב־100).\n\nמה ההפסד המקסימלי?","hint":"הזיזו את המחוון לקצה, ימינה או שמאלה.","options":[{"v":405},{"v":95},{"v":500},{"v":905}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ic","what":"maxLoss"}},"explain":{"right":"ההפרש בין המימושים בכל צד הוא $5, פחות הקרדיט: `($5 − {st:ic.net}) × 100 = {st:ic.maxLoss}`. מסכנים {st:ic.maxLoss} כדי להרוויח לכל היותר {st:ic.maxProfit}.","wrong":"מפסידים את ההפרש בין המימושים של צד אחד, פחות הקרדיט: `($5 − {st:ic.net}) × 100 = {st:ic.maxLoss}`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.12-q7","type":"mcq","prompt":"ב־Iron Condor שבניתם קיבלתם קרדיט של {st:ic.netCost}, כי כתבתם ב־Bid וקניתם ב־Ask. לפי מחירי האמצע של ארבע הרגליים, הקרדיט היה יוצא {st:ic.midNet}. מה ההפרש הזה אומר?","options":[{"text":"{st:ic.slip} הלכו על המרווחים כבר בכניסה, עוד לפני עמלות"},{"text":"שמחירי האמצע שגויים, והמחיר האמיתי הוא תמיד ה־Bid"},{"text":"שום דבר: את ההפרש מקבלים בחזרה כשסוגרים את הפוזיציה"}],"correct":0,"explain":{"right":"ארבע רגליים, ארבעה מרווחים. {st:ic.slip} מתוך קרדיט אפשרי של {st:ic.midNet} נשארו אצל עושי השוק. ואם סוגרים לפני הפקיעה, משלמים את המרווחים פעם נוספת (שיעור 6.5).","wrong":"ההפרש הוא עלות המרווחים: כתבתם מתחת למחיר האמצע וקניתם מעליו, בכל אחת מארבע הרגליים. את הכסף הזה לא מקבלים בחזרה, ובסגירה משלמים מרווח שוב (שיעור 6.5)."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.12-q8","type":"mcq","prompt":"סיכמתם את היווניות של ה־Iron Condor מהשרשרת: Delta {st:ic.delta}, Theta {st:ic.theta} ביום, Vega {st:ic.vega} לנקודת IV. מה המספרים האלה אומרים על הפוזיציה?","options":[{"text":"כמעט בלי כיוון. מרוויחה מכל יום שעובר, ומפסידה אם ה־IV עולה"},{"text":"הימור על עלייה. מפסידה מכל יום שעובר, ומרוויחה אם ה־IV עולה"},{"text":"כמעט בלי כיוון. מפסידה מכל יום שעובר, ומרוויחה אם ה־IV עולה"}],"correct":0,"explain":{"right":"דלתא קרובה לאפס: אין הימור על כיוון. תטא חיובית ווגה שלילית: זה הימור על שקט, בדיוק כמו שראינו בשיעור 5.8. היווניות מספרות את אותו סיפור כמו הגרף, רק לפני הפקיעה.","wrong":"קוראים את הסימנים: דלתא קרובה לאפס (בלי כיוון), תטא חיובית (הזמן בשבילכם), וגה שלילית (עליית IV נגדכם). זה הימור על שקט."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"6.12-q9","type":"mcq","prompt":"Long Straddle על XYZ, שנסחרת במחיר {S}: קניתם Call במימוש $100 (Delta {c100.delta}) וגם Put במימוש $100 (Delta {p100.delta}). הדלתא של הפוזיציה: {st:ls.delta}. למה היא לא אפס, אם Straddle הוא הימור בלי כיוון?","options":[{"text":"כי המניה מעל המימוש: ה־Call בתוך הכסף והדלתא שלו גדולה מזו של ה־Put"},{"text":"כי ב־Straddle תמיד יש הטיה כלפי מעלה"},{"text":"כי יש טעות בשרשרת: הדלתאות של Call ו־Put באותו מימוש חייבות להתקזז"}],"correct":0,"explain":{"right":"`0.64 × 100 − 0.36 × 100 = 28`. ה־Straddle בלי כיוון רק כשהמניה קרובה למימוש. כאן היא כבר $2.40 מעליו, ולכן הפוזיציה מתנהגת כמו 28 מניות. הגרף בפקיעה סימטרי, אבל היום הפוזיציה נוטה למעלה. העלות, שהיא גם ההפסד המקסימלי: {st:ls.netCost}.","wrong":"הדלתאות מתקזזות בערך, כשהמניה קרובה למימוש. כאן המניה במחיר {S}, מעל $100: ה־Call בתוך הכסף עם Delta של {c100.delta}, וה־Put מחוץ לכסף עם {p100.delta}. הסכום: {st:ls.delta}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["לכל מבנה: מוצאים כל רגל בשרשרת. קונים ב־**Ask**, כותבים ב־**Bid**, ומחשבים נטו.","**היווניות של הפוזיציה** הן סכום הרגליים: קנויה מוסיפים, כתובה מחסירים.","במחירי שרשרת אמיתיים, חלק מהקרדיט או מהרווח הולך על **המרווחים**, בכל רגל.","היווניות מספרות איך הפוזיציה מתנהגת **היום**. הגרף מספר מה יקרה **בפקיעה**."],"ready":true,"unit":"6","chainSet":{"ticker":"XYZ","S":102.4,"r":0.04,"iv":0.28,"strikes":[90,95,100,105,110,115],"expiries":[{"id":"30","label":"30 יום","days":30,"call":{"vol":[12,48,1320,2450,860,0],"oi":[410,950,5200,8730,3100,1240],"last":{"115":0.6}},"put":{"vol":[35,410,1880,620,95,8],"oi":[2050,4300,6900,2700,640,150]}},{"id":"58","label":"58 יום","days":58,"call":{"vol":[5,20,240,610,310,140],"oi":[300,820,2900,4100,2200,1050]},"put":{"vol":[10,90,330,150,40,2],"oi":[900,1600,3100,1300,400,90]}}],"skew":0.25}}],"glossary":[{"term":"עמלות","def":"התשלום לברוקר על כל עסקה. המספרים בקורס הם לפני עמלות. במציאות עמלות מקטינות רווח ומגדילות הפסד.","lesson":"1.0","keys":["לפני עמלות","עמלות"],"alt":"כמו עמלת המרה בכרטיס אשראי: סכום קטן בכל פעולה, שמצטבר. משלמים אותה גם בכניסה וגם ביציאה, ולכן עסקה שנראית רווחית על הנייר יכולה להיגמר בהפסד קטן."},{"term":"אופציה (Option)","def":"חוזה שנותן זכות, לא חובה, לקנות או למכור נכס במחיר קבוע עד תאריך מסוים.","lesson":"1.1","keys":["אופציה","אופציות"],"alt":"משלמים סכום קטן עכשיו, כדי לשמור לעצמכם אפשרות להחליט אחר כך. אם המחיר ילך לטובתכם, תשתמשו באפשרות. אם לא, תוותרו עליה, ותפסידו רק את מה ששילמתם."},{"term":"נכס בסיס (Underlying)","def":"המניה, תעודת הסל או המדד שעליהם האופציה.","lesson":"1.1","keys":["נכס הבסיס","נכס בסיס"],"alt":"האופציה לא עומדת בפני עצמה: המחיר שלה נגזר ממחיר של משהו אחר. המשהו הזה הוא נכס הבסיס. באופציה על Apple, נכס הבסיס הוא מניית Apple."},{"term":"פרמיה (Premium)","def":"המחיר שמשלמים על האופציה. מוצגת **לאופציה**, וכפול 100 לחוזה.","lesson":"1.1","keys":["פרמיה"],"alt":"תג המחיר של האופציה. הקונה משלם אותה לכותב ברגע העסקה, והיא לא חוזרת, גם אם האופציה לא שימשה לכלום. במסך כתוב $2? חוזה אחד עולה $200.","altChk":[["2*100","$200"]]},{"term":"מחיר מימוש (Strike)","def":"המחיר הקבוע בחוזה שבו אפשר לקנות (Call) או למכור (Put).","lesson":"1.1","keys":["מחיר המימוש","מחיר מימוש"],"alt":"המחיר ש\"כתוב בחוזה\". לא משנה כמה המניה תעלה או תרד בשוק, העסקה שהאופציה מאפשרת תהיה במחיר הזה. הוא נקבע כשהחוזה נוצר, ולא זז גם כשהמניה זזה."},{"term":"פקיעה (Expiration)","def":"היום האחרון של הזכות. אופציה חודשית רגילה פוקעת ביום שישי השלישי של החודש.","lesson":"1.1","keys":["פקיעה","תאריך הפקיעה","פוקעת","פקיעות שבועיות","יום שישי השלישי של החודש"],"alt":"תאריך התפוגה של האופציה. עד סוף אותו יום הזכות בתוקף, ואחריו היא לא קיימת. מה שלא קרה עד אז כבר לא עוזר: מניה שעלתה יום אחרי הפקיעה לא שווה לכם כלום."},{"term":"זכות, לא חובה","def":"מי שקנה אופציה רשאי להשתמש בה, אבל לא חייב. החובה נמצאת אצל הכותב.","lesson":"1.1","keys":["זכות, לא חובה"],"alt":"לקונה יש בחירה, ולכותב אין. הקונה מחליט אם להשתמש באופציה, לפי מה שמשתלם לו. הכותב מחכה להחלטה, וחייב לבצע אם הקונה בחר לממש. על חוסר הסימטריה הזה הקונה משלם את הפרמיה."},{"term":"חוזה (Contract)","def":"יחידת המסחר באופציות: בדרך כלל **100 מניות**. המחיר במסך הוא לאופציה אחת (על מניה אחת), ולכן לחוזה כופלים ב־100.","lesson":"1.1","keys":["חוזה","חוזה סטנדרטי","100 מניות","כפול 100","לאופציה","לאופציה אחת","אופציה אחת"],"alt":"חוזה הוא \"אריזה\": הוא מכסה 100 מניות, ואי אפשר לקנות חצי ממנו. המחיר במסך הוא לאופציה אחת, על מניה אחת מתוך ה־100. לכן מחיר של $3 במסך הוא $300 לחוזה.","altChk":[["3*100","$300"]]},{"term":"מחזיק (Holder)","def":"מי שקנה את האופציה ומחזיק בזכות. נקרא גם הקונה.","lesson":"1.1","keys":["קונה","מחזיק"],"alt":"הצד שקנה את האופציה ושילם פרמיה. ההחלטות אצלו: לממש, למכור את האופציה בשוק, או לתת לה לפקוע. הכי הרבה שהוא יכול להפסיד זה מה ששילם."},{"term":"מימוש (Exercise)","def":"להשתמש בזכות: לקנות (ב־Call) או למכור (ב־Put) במחיר המימוש. אפשר גם לצאת בלי לממש, במכירת האופציה בשוק. לפני הפקיעה זה לרוב שומר על ערך הזמן (שיעור 1.5).","lesson":"1.1","keys":["לממש","מימוש"],"alt":"הרגע שבו הזכות הופכת לעסקה אמיתית במניות: קונים או מוכרים 100 מניות במחיר שכתוב בחוזה, לפי סוג האופציה. אפשר גם לא להגיע לזה, ולמכור את האופציה עצמה בשוק."},{"term":"מסלקה (OCC)","def":"הגוף שעומד בין כל קונה לכל כותב בבורסה בארה\"ב, ומבטיח את קיום החוזה גם אם צד אחד לא עומד בו.","lesson":"1.1","keys":["OCC"],"alt":"הגוף שעומד מאחורי כל עסקה (לא הברוקר שלכם). אתם לא צריכים להכיר את מי שכתב את האופציה שקניתם, או לסמוך עליו: אם הוא לא יעמוד בהתחייבות, המסלקה תעמוד בה במקומו."},{"term":"מימוש אוטומטי","def":"אופציה ששווה במימוש ביום הפקיעה לפחות סנט אחד ממומשת אוטומטית, גם אם העסקה כולה בהפסד, אלא אם הוריתם לברוקר אחרת.","lesson":"1.1","keys":["ממומשת אוטומטית","מימוש אוטומטי"],"alt":"ברירת המחדל בפקיעה. אם מימוש האופציה שלכם שווה אפילו סנט אחד, היא תמומש בלי שתעשו כלום, ותמצאו בחשבון עסקה של 100 מניות. מי שלא רוצה בזה מוכר את האופציה לפני הסגירה, או מודיע לברוקר."},{"term":"Call","def":"זכות **לקנות** במחיר המימוש. נקודת איזון בפקיעה: **מימוש + פרמיה**.","lesson":"1.2","keys":["Call","Long Call"],"alt":"זכות לקנות במחיר קבוע. מי שקונה Call מרוויח כשהמניה עולה מספיק מעל המימוש. אם זה לא קורה, הוא מפסיד לכל היותר את הפרמיה. דרך לזכור: Call up, Put down. קונה Call רוצה עלייה, קונה Put רוצה ירידה."},{"term":"פוזיציה (Position)","def":"עסקה פתוחה. למשל Long Call או Short Put.","lesson":"1.2","keys":["פוזיציה"],"alt":"מה שפתוח אצלכם בחשבון כרגע. קניתם Call ועוד לא מכרתם אותו? יש לכם פוזיציה. כשמוכרים אותו, או כשהוא פוקע, הפוזיציה נסגרת."},{"term":"נקודת איזון","def":"מחיר המניה בפקיעה שבו אין רווח ואין הפסד. Call: **מימוש + פרמיה**. Put: **מימוש − פרמיה**.","lesson":"1.2","keys":["מימוש + פרמיה","מימוש − פרמיה","נקודת האיזון","נקודת איזון"],"alt":"המחיר שבו העסקה \"מחזירה את עצמה\". קניתם Call במימוש $100 ושילמתם $3? המניה צריכה להגיע בפקיעה למחיר $103 רק כדי שלא תפסידו. הרווח מתחיל מעל זה.","altChk":[["100+3","$103"]]},{"term":"Put","def":"זכות **למכור** במחיר המימוש. נקודת איזון בפקיעה: **מימוש − פרמיה**.","lesson":"1.3","keys":["Put","Long Put"],"alt":"זכות למכור במחיר קבוע. מי שקונה Put מרוויח כשהמניה יורדת מספיק מתחת למימוש. אם זה לא קורה, הוא מפסיד לכל היותר את הפרמיה. דרך לזכור: Call up, Put down. קונה Call רוצה עלייה, קונה Put רוצה ירידה."},{"term":"Protective Put","def":"קניית Put על מניה שמחזיקים, כביטוח מפני ירידה. ההפסד המקסימלי: המרחק עד המימוש ועוד הפרמיה.","lesson":"1.3","keys":["Protective Put"],"alt":"רצפה למניה שלכם. אתם ממשיכים להחזיק את המניה ולהרוויח אם היא עולה, אבל קבעתם מחיר שמתחתיו לא תפסידו יותר, עד הפקיעה. המחיר של הרצפה הוא הפרמיה."},{"term":"כותב (Writer)","def":"מי שמוכר אופציה שלא הייתה לו. מקבל פרמיה ולוקח על עצמו חובה.","lesson":"1.4","keys":["כותב","כותב Put","Short Put","Short Call"],"alt":"הצד שמקבל כסף עכשיו, ולוקח התחייבות לאחר כך. על המימוש הוא לא מחליט: אם המחזיק מממש, הכותב חייב לבצע. מה שכן בידיו: לקנות את האופציה בחזרה ולסגור. הרווח שלו מוגבל לפרמיה, וההפסד יכול להיות גדול ממנה בהרבה."},{"term":"הקצאה (Assignment)","def":"כשמחזיק מממש, המסלקה מקצה את המימוש לברוקר של אחד הכותבים, והברוקר מקצה אותו לאחד מלקוחותיו הכותבים. מי שקיבל הקצאה חייב לקיים את ההתחייבות.","lesson":"1.4","keys":["הקצאה"],"alt":"ההודעה שכותב מקבל כשמישהו מימש: \"עכשיו תורך לקיים\". כותב Call שקיבל הקצאה מוכר 100 מניות במחיר המימוש. כותב Put קונה 100 מניות במחיר המימוש. אי אפשר לסרב."},{"term":"Naked Call","def":"כתיבת Call בלי להחזיק את המניה. ההפסד **בלתי מוגבל**.","lesson":"1.4","keys":["Naked Call","כותב Call בלי מניות","בלתי מוגבל"],"alt":"התחייבתם למכור מניות שאין לכם. אם המניה תזנק, תצטרכו לקנות אותן בשוק בכל מחיר, כדי למסור אותן במחיר המימוש. למניה אין תקרה, ולכן גם להפסד אין."},{"term":"Short / Long","def":"**Short**: הפוזיציה של מי שמכר משהו שלא היה לו. באופציות: הכותב. במניות: מכירה בחסר. **Long**: הפוזיציה של מי שקנה.","lesson":"1.2","keys":["Short","Long"],"alt":"פוזיציית Long: קניתם משהו, ואתם רוצים שהמחיר שלו יעלה. פוזיציית Short: מכרתם משהו שלא היה לכם, ואתם רוצים שהמחיר שלו ירד. שימו לב: Long Put הוא קנייה של Put, ולכן הוא מרוויח דווקא כשהמניה יורדת."},{"term":"ביטחונות (Margin)","def":"כסף שהברוקר דורש להשאיר בחשבון כשכותבים אופציות בלי כיסוי. אם השוק זז נגדכם, ייתכן שתידרשו להוסיף.","lesson":"1.4","keys":["ביטחונות"],"alt":"כמו פיקדון: הברוקר \"נועל\" חלק מהכסף בחשבון, כדי לוודא שתוכלו לעמוד בהתחייבות שכתבתם. בשונה מפיקדון רגיל, הסכום לא קבוע: הוא גדל כשהשוק זז נגדכם. וזו לא תקרת ההפסד: אפשר להפסיד יותר ממנו."},{"term":"בתוך הכסף (ITM)","def":"לאופציה יש ערך פנימי. Call: המניה מעל המימוש. Put: מתחת. זה לא אומר שכדאי לממש.","lesson":"1.5","keys":["בתוך הכסף"],"alt":"אם הייתם מממשים ברגע זה, הייתם מקבלים משהו. למשל Call במימוש $100 כשהמניה במחיר $108: קונים במחיר $100 משהו ששווה $108. זה עדיין לא אומר שהעסקה ברווח, כי שילמתם פרמיה."},{"term":"ערך פנימי","def":"כמה שווה מימוש עכשיו, בלי להתחשב בפרמיה. אף פעם לא פחות מאפס.","lesson":"1.5","keys":["ערך פנימי","ערך הפנימי"],"alt":"החלק במחיר האופציה שהוא \"כסף אמיתי\" כבר עכשיו. למשל Call במימוש $100 כשהמניה במחיר $108: ערך פנימי של $8. כשהמניה מתחת למימוש, הערך הפנימי של ה־Call הוא אפס, לא מספר שלילי.","altChk":[["108-100","$8"]]},{"term":"ערך זמן","def":"`מחיר האופציה − ערך פנימי`. בדרך כלל נשחק ככל שהפקיעה מתקרבת, ובפקיעה מתאפס.","lesson":"1.5","keys":["ערך זמן","ערך הזמן"],"alt":"מה שמשלמים מעבר לערך הפנימי, על הסיכוי שעד הפקיעה יקרה עוד משהו טוב. אופציה שמחירה $10 עם ערך פנימי של $8: ערך הזמן הוא $2. ככל שנשאר פחות זמן, הסיכוי קטן, והחלק הזה מתכווץ.","altChk":[["10-8","$2"]]},{"term":"מחוץ לכסף (OTM)","def":"אין לאופציה ערך פנימי. Call: המניה מתחת למימוש. Put: מעליו. כל המחיר שלה הוא ערך זמן.","lesson":"1.5","keys":["מחוץ לכסף"],"alt":"אם הייתם מממשים ברגע זה, לא הייתם מקבלים כלום. למשל Call במימוש $100 כשהמניה במחיר $95: אף אחד לא יקנה במחיר $100 מה שעולה $95 בשוק. לאופציה עדיין יש מחיר, כי עד הפקיעה המניה יכולה לזוז."},{"term":"על הכסף (ATM)","def":"המניה עומדת על מחיר המימוש. בפועל: המימוש הקרוב ביותר למחיר המניה.","lesson":"1.5","keys":["על הכסף"],"alt":"נקודת האמצע: המניה והמימוש כמעט באותו מחיר, והאופציה \"על הקצה\" בין שווה משהו במימוש לבין לא שווה כלום. המניה במחיר $100.30? האופציות במימוש $100 נחשבות על הכסף."},{"term":"מכפיל","def":"בדרך כלל 100 מניות לחוזה. ב־SPX, $100 לכל נקודת מדד.","lesson":"1.6","keys":["מכפיל","גודל החוזה"],"alt":"המספר שבו כופלים את המחיר במסך כדי לקבל את הסכום האמיתי. ברוב האופציות על מניות הוא 100. מחיר של $2.50 במסך הוא $250 לחוזה.","altChk":[["2.5*100","$250"]]},{"term":"אמריקאי מול אירופאי","def":"אמריקאי: מממשים בכל יום עד הפקיעה. אירופאי: רק בפקיעה. את שניהם אפשר למכור בכל יום.","lesson":"1.6","keys":["אמריקאי","אירופאי"],"alt":"ההבדל הוא רק בשאלה מתי מותר לממש. באמריקאי הדלת פתוחה כל הזמן עד הפקיעה. באירופאי היא נפתחת רק בסוף. לסחור, כלומר לקנות ולמכור את האופציה עצמה, אפשר בשניהם בכל יום."},{"term":"סילוק פיזי מול במזומן","def":"פיזי: המניות עוברות (SPY). במזומן: עובר רק ההפרש כפול 100 (SPX).","lesson":"1.6","keys":["סילוק פיזי","סילוק במזומן"],"alt":"מה עובר מיד ליד בסוף. בסילוק פיזי אתם מסיימים עם עסקה במניות עצמן: קניתם או מכרתם 100 מניות. בסילוק במזומן אף מניה לא זזה, ורק ההפרש עובר, בכסף."},{"term":"ערך סילוק","def":"המספר שהבורסה קובעת למדד ביום הפקיעה, ולפיו מחשבים את התשלום בסילוק במזומן.","lesson":"1.6","keys":["ערך סילוק"],"alt":"המספר הרשמי שלפיו \"סוגרים חשבון\" באופציות על מדד. הוא נקבע פעם אחת ביום הפקיעה, וכל האופציות על המדד מחושבות לפיו, גם אם המדד זז אחר כך."},{"term":"שרשרת אופציות (Option Chain)","def":"הטבלה אצל הברוקר שמציגה, לכל פקיעה ולכל מחיר מימוש, את המחירים של Call ו־Put על נכס בסיס אחד.","lesson":"6.1","keys":["שרשרת אופציות","שרשרת אופציות (Option Chain)","Option Chain"],"alt":"ה\"תפריט\" של האופציות על מניה אחת. כל שורה היא מימוש אחר, לכל תאריך פקיעה יש עמוד משלו, ובכל שורה כתוב בכמה אפשר לקנות ובכמה אפשר למכור."},{"term":"Bid","def":"המחיר הגבוה ביותר שמישהו מוכן לשלם עכשיו. מי שמוכר מיד מקבל את ה־Bid (לפעמים מקבלים מחיר קצת טוב יותר).","lesson":"2.7","keys":["Bid"],"alt":"המחיר שתקבלו אם אתם מוכרים ברגע זה. זה הנמוך מבין שני המחירים במסך. דרך לזכור: ה־Bid הוא ההצעה של הקונים, ולכן מי שמוכר פוגש אותה."},{"term":"Ask","def":"המחיר הנמוך ביותר שמישהו מוכן למכור בו עכשיו. מי שקונה מיד משלם את ה־Ask (לפעמים מקבלים מחיר קצת טוב יותר).","lesson":"2.7","keys":["Ask"],"alt":"המחיר שתשלמו אם אתם קונים ברגע זה. זה הגבוה מבין שני המחירים במסך. דרך לזכור: ה־Ask הוא מה שהמוכרים מבקשים, ולכן מי שקונה פוגש אותו."},{"term":"מרווח (Bid-Ask Spread)","def":"ההפרש בין Ask ל־Bid. מי שקונה מיד ומוכר מיד מפסיד אותו, גם אם המחיר לא זז.","lesson":"2.7","keys":["מרווח (Bid-Ask Spread)","Bid-Ask Spread","מרווח Bid-Ask"],"alt":"העלות של \"להיכנס ולצאת\". אם ה־Bid הוא $2.20 וה־Ask הוא $2.30, קנייה ומכירה מיידיות עולות לכם $0.10 לאופציה, כלומר $10 לחוזה, עוד לפני שהמניה זזה.","altChk":[["Math.round((2.30-2.20)*100)","$10 לחוזה"]]},{"term":"Last","def":"המחיר של העסקה האחרונה שבוצעה. היא יכולה להיות ישנה, ולכן Last לא בהכרח המחיר שאפשר לסחור בו עכשיו.","lesson":"6.1","keys":["Last"],"alt":"כמו לשמוע בכמה השכן מכר את הרכב שלו בשנה שעברה: מידע אמיתי, אבל לא בהכרח המחיר של היום. כדי לדעת בכמה אפשר לסחור עכשיו, מסתכלים על Bid ו־Ask."},{"term":"Volume","def":"כמה חוזים נסחרו היום. מתחיל מאפס בכל יום מסחר.","lesson":"6.1","keys":["Volume"],"alt":"מד הפעילות של היום. מספר גבוה אומר שהרבה חוזים החליפו ידיים היום. אפס אומר שאף אחד עוד לא סחר באופציה הזו היום, ולכן ה־Last שלה ישן."},{"term":"Open Interest (OI)","def":"כמה חוזים היו פתוחים בסוף יום המסחר הקודם: נפתחו ועדיין קיימים, כלומר לא נסגרו, לא מומשו ולא פקעו. המסלקה מחשבת אותו פעם ביום, אחרי הסגירה.","lesson":"6.1","keys":["Open Interest","Open Interest (OI)","OI"],"alt":"כמה חוזים \"חיים\": מישהו מחזיק אותם, ומישהו כתב אותם. ה־Volume סופר עסקאות של היום. ה־OI סופר פוזיציות שנשארו פתוחות, ומתעדכן פעם ביום. חוזה שנפתח ונסגר באותו יום מעלה את ה־Volume, ולא משנה את ה־OI."},{"term":"Buy to Open / Sell to Close","def":"Buy to Open: קונים אופציה ופותחים Long. Sell to Close: מוכרים את האופציה שקניתם, והפוזיציה נסגרת.","lesson":"6.2","keys":["Buy to Open","Sell to Close"],"alt":"הזוג של הקונה. נכנסים בקנייה (Buy to Open), ויוצאים במכירה (Sell to Close). כמו לקנות כרטיס להופעה ואחר כך למכור אותו למישהו אחר: אחרי המכירה לא נשאר לכם כלום, לא זכות ולא חובה."},{"term":"Sell to Open / Buy to Close","def":"Sell to Open: כותבים אופציה ופותחים Short, עם התחייבות. Buy to Close: קונים אותה בחזרה, וההתחייבות נגמרת.","lesson":"6.2","keys":["Sell to Open","Buy to Close"],"alt":"הזוג של הכותב. נכנסים במכירה (Sell to Open): מקבלים פרמיה, יחד עם התחייבות. יוצאים בקנייה (Buy to Close): קונים בחזרה את אותה אופציה, וההתחייבות נמחקת. התוצאה היא ההפרש בין שני המחירים."},{"term":"פקודת שוק (Market)","def":"פקודה שמתבצעת מיד במחיר הטוב ביותר שיש. הביצוע כמעט מובטח, המחיר לא.","lesson":"4.1","keys":["פקודת שוק","פקודת שוק (Market)"],"alt":"אתם אומרים לברוקר: \"העיקר שזה יתבצע עכשיו\". הוא מבצע מיד מול מי שעומד בצד השני, במחיר שלו. באופציה עם מרווח רחב, המחיר הזה יכול להפתיע לרעה."},{"term":"פקודה מוגבלת (Limit)","def":"פקודה שמתבצעת רק במחיר שקבעתם או טוב ממנו. המחיר מובטח, הביצוע לא.","lesson":"6.3","keys":["פקודה מוגבלת","פקודה מוגבלת (Limit)"],"alt":"אתם אומרים לברוקר: \"רק במחיר שלי, או טוב ממנו\". אם השוק לא מגיע למחיר, הפקודה מחכה, ואולי לא תתבצע בכלל. אתם שולטים במחיר, ומוותרים על הוודאות שהעסקה תקרה."},{"term":"פקודה משולבת (Combo)","def":"פקודה אחת לכמה רגליים, עם מחיר נטו אחד. בפקודה מובטחת כל הרגליים מתבצעות יחד, במחיר הנטו או טוב ממנו, או שאף אחת לא.","lesson":"6.3","keys":["פקודה משולבת","פקודה משולבת (Combo)"],"alt":"בדרך כלל \"הכול או כלום\" לכמה אופציות יחד. במקום לקנות רגל אחת ולקוות שגם השנייה תתבצע, שולחים את כולן כחבילה אחת עם מחיר אחד. כך לא נשארים עם חצי פוזיציה."},{"term":"רמת הרשאה לאופציות","def":"הרמה שהברוקר מאשר לכם, ומגדירה אילו פעולות באופציות מותרות בחשבון. הרמות שונות בין ברוקרים.","lesson":"6.7","keys":["רמת הרשאה","רמות הרשאה","רמת הרשאה לאופציות"],"alt":"רשימת ה\"מותר\" של החשבון. בדרך כלל ברמה הראשונה: כתיבה שמכוסה במלואה, כמו Covered Call. אחריה קניית אופציות, אחריה Spreads, ובסוף כתיבה חשופה. הברוקר מחליט, לפי הניסיון והמצב הכספי שדיווחתם."},{"term":"Covered Call","def":"100 מניות ועוד Short Call עליהן. מקבלים פרמיה ומוותרים על העלייה מעל המימוש. סיכון הירידה של המניה נשאר.","lesson":"5.1","keys":["Covered Call"],"alt":"מקבלים כסף עכשיו, בתמורה לוויתור על חלק מהעלייה. אם המניה תעלה מעל המימוש, תמכרו אותה במימוש ולא תיהנו מההמשך. אם היא תרד, תפסידו כמו כל בעל מניה, פחות הפרמיה שקיבלתם."},{"term":"Bull Call Spread","def":"קונים Call וכותבים Call במימוש גבוה יותר, באותה פקיעה. עולה פחות מ־Long Call, וההפסד מוגבל למה ששילמתם נטו, אבל יש תקרה על הרווח.","lesson":"5.4","keys":["Bull Call Spread"],"alt":"הימור על עלייה מתונה, במחיר מוזל. קונים Call, ומממנים חלק ממנו בכתיבת Call רחוק יותר. מה שמשלמים על ההוזלה: מעל המימוש הגבוה כבר לא מרוויחים יותר."},{"term":"רגל (Leg)","def":"כל אופציה אחת מתוך פוזיציה שבנויה מכמה אופציות, כמו Spread.","lesson":"5.4","keys":["רגל","רגליים","רגל (Leg)"],"alt":"אבן בניין אחת של פוזיציה. קניתם Call אחד וכתבתם Call אחר? יש לכם פוזיציה של שתי רגליים. לכל רגל יש מחיר, מימוש וכיוון (קנייה או כתיבה) משלה."},{"term":"תנודתיות משתמעת (IV)","def":"סטיית התקן השנתית של תשואות המניה, כפי שהיא משתמעת ממחיר האופציה בשוק: כמה תנועה השוק מתמחר. גבוהה = אופציות יקרות. לא מצביעה על כיוון.","lesson":"2.3","keys":["תנודתיות משתמעת","תנודתיות משתמעת (IV)","IV"],"alt":"מד הציפיות לתנועה. כשסוחרים מצפים לתנועות גדולות, הם מוכנים לשלם יותר על אופציות, וה־IV עולה. כשרגוע, היא יורדת. היא אומרת כמה תנועה מתומחרת. היא לא אומרת לאיזה כיוון, ולא שהתנועה באמת תקרה."},{"term":"דלתא (Delta)","def":"בכמה מחיר האופציה זז כשהמניה זזה בדולר אחד. Call: בין 0 ל־1. Put: בין 0 למינוס 1. כפול 100: מספר המניות השקול.","lesson":"3.1","keys":["דלתא","דלתא (Delta)","Delta"],"alt":"כמה מהתנועה של המניה \"עוברת\" לאופציה. דלתא 0.30: המניה עלתה בדולר אחד, והאופציה עלתה בערך 30 סנט, כלומר בערך $30 לחוזה. חוזה כזה מתנהג כרגע בערך כמו 30 מניות.","altChk":[["0.30*100","$30"]]},{"term":"גמא (Gamma)","def":"בכמה הדלתא משתנה כשהמניה זזה בדולר אחד. הכי גבוהה על הכסף קרוב לפקיעה. למחזיק חיובית, לכותב שלילית.","lesson":"3.2","keys":["גמא","גמא (Gamma)","Gamma"],"alt":"כמה מהר האופציה \"מחליפה אופי\". אופציה עם גמא גבוהה יכולה להתנהג היום כמו 30 מניות ומחר כמו 70, אחרי תנועה לא גדולה במניה. לקונה זה עובד לטובתו. לכותב זה אומר שההפסד מאיץ."},{"term":"תטא (Theta)","def":"בכמה האופציה משתנה כשעובר יום, אם שום דבר אחר לא זז. המחזיק משלם אותה, הכותב מקבל, בתמורה לסיכון.","lesson":"3.3","keys":["תטא","תטא (Theta)","Theta"],"alt":"המחיר של יום המתנה. אופציה עם תטא של $5 לחוזה ליום: אם מחר המניה וה־IV יהיו בדיוק כמו היום, האופציה תהיה שווה בערך $5 פחות. מה שהמחזיק מאבד, הכותב מרוויח."},{"term":"וגה (Vega)","def":"בכמה האופציה משתנה כשה־IV זזה בנקודה אחת. למחזיק חיובית, לכותב שלילית. גדולה בפקיעות רחוקות וליד המימוש.","lesson":"3.4","keys":["וגה","וגה (Vega)","Vega"],"alt":"כמה האופציה רגישה ל\"מצב הרוח\" של השוק. וגה של $10 לחוזה: ה־IV עלתה מ־25% ל־26%, והאופציה התייקרה בערך בסכום של $10, גם אם המניה לא זזה בכלל. ה־IV ירדה בנקודה? האופציה הוזלה בערך באותו סכום."},{"term":"Spread (פוזיציה)","def":"פוזיציה שבנויה מכמה אופציות (רגליים) על אותו נכס. לא לבלבל עם המרווח בין Bid ל־Ask.","lesson":"5.4","keys":["Spread"],"alt":"חבילה של כמה אופציות שפותחים יחד, כך שאחת מקזזת חלק מהמחיר או מהסיכון של האחרת. מסתכלים על החבילה כולה, לא על כל אופציה לבד: יש לה מחיר, רווח מקסימלי והפסד מקסימלי משלה."},{"term":"מחיר נטו","def":"כמה משלמים (דביט) או מקבלים (קרדיט) על כל הרגליים של פוזיציה יחד.","lesson":"5.4","keys":["מחיר נטו"],"alt":"השורה התחתונה של הקופה. שילמתם $6 על רגל אחת, וקיבלתם $1 על השנייה? המחיר נטו הוא $5 שיצאו מהכיס, וכפול 100: $500.","altChk":[["6-1","$5"],["(6-1)*100","$500"]]},{"term":"מכירה בחסר","def":"מכירה של מניות שאין לכם. אם המניה עולה, ההפסד בלי תקרה. דורשת חשבון מרג'ין.","lesson":"6.8","keys":["מכירה בחסר"],"alt":"מוכרים עכשיו מניות ששאלתם מהברוקר, בתקווה לקנות אותן בחזרה בזול ולהחזיר לו. אם המחיר ירד, ההפרש שלכם. אם הוא עלה, תקנו ביוקר, ואין גבול לכמה."},{"term":"כתיבה חשופה","def":"כתיבת אופציה בלי כיסוי: Call בלי מניות, או Put בלי הכסף לקניית המניות. נמצאת ברמת ההרשאה הגבוהה.","lesson":"1.4","keys":["כתיבה חשופה"],"alt":"התחייבות בלי גב. כותב \"מכוסה\" כבר מחזיק את מה שיידרש ממנו: מניות למסירה, או מזומן לקנייה. כותב \"חשוף\" לא מחזיק, ויצטרך להשיג אותם דווקא ביום שבו זה הכי יקר."},{"term":"Skew","def":"","unit":"7"},{"term":"IV Crush","def":"","unit":"7"},{"term":"נזילות","def":"כמה קל לקנות ולמכור בלי לשלם הרבה על המעבר. באופציה נזילה המרווח צר ויש הרבה מסחר.","lesson":"2.7","keys":["נזילות","אופציה נזילה","נזילה"],"alt":"כמה קל למצוא צד שני לעסקה, במחיר הוגן. באופציה נזילה יש תור של קונים ומוכרים, וההפרש בין המחירים שלהם קטן. באופציה לא נזילה אולי תמצאו קונה, אבל במחיר שהוא קובע."},{"term":"Black-Scholes","def":"מודל תמחור שמקבל את מחיר המניה, המימוש, הזמן, התנודתיות, הריבית והדיבידנד, ומחזיר מחיר תאורטי לאופציה.","lesson":"2.2","keys":["Black-Scholes"],"alt":"מחשבון. מכניסים לו נתונים, והוא מחזיר כמה האופציה \"אמורה\" להיות שווה. רוב הנתונים ידועים. מה שלא ידוע הוא כמה המניה תזוז בעתיד, ולכן המחיר שהמודל נותן טוב רק כמו ההערכה שהכנסתם."},{"term":"תנודתיות היסטורית (HV)","def":"כמה המניה זזה בפועל בתקופה האחרונה, באחוז שנתי. מחושבת מהמחירים בעבר.","lesson":"2.3","keys":["תנודתיות היסטורית","תנודתיות היסטורית (HV)","HV"],"alt":"מבט במראה האחורית: כמה המניה קפצה בפועל בשבועות האחרונים. מניה שזזה 3% ביום היא עם HV גבוהה, ומניה שבקושי זזה היא עם HV נמוכה. זה מה שקרה, לא מה שיקרה."},{"term":"דעיכת זמן (Time Decay)","def":"השחיקה של ערך הזמן ככל שהפקיעה מתקרבת. באופציה על הכסף היא מואצת לקראת הסוף.","lesson":"2.5","keys":["דעיכת זמן","דעיכת זמן (Time Decay)"],"alt":"כמו קוביית קרח ביום חם: היא נמסה כל הזמן, והכי מהר בסוף. אופציה על הכסף מאבדת בשבוע האחרון הרבה יותר ערך זמן מאשר בשבוע רגיל חודשיים לפני הפקיעה."},{"term":"Put-Call Parity","def":"הקשר בין מחירי Call, Put ומניה: Long Call ועוד Short Put באותו מימוש ובאותה פקיעה מתנהגים כמו החזקת המניה. באופציות אמריקאיות הקשר מתקיים בקירוב.","lesson":"2.6","keys":["Put-Call Parity"],"alt":"קונים Call וכותבים Put באותו מימוש, והשניים יחד מתנהגים כמו המניה עצמה. לכן המחירים של Call, של Put ושל המניה קשורים זה לזה. אם אחד מהם היה זול מדי, סוחרים גדולים היו קונים את הזול ומוכרים את היקר, עד שהפער נסגר."},{"term":"עושה שוק (Market Maker)","def":"גוף שמציג כל הזמן מחיר לקנייה (Bid) ולמכירה (Ask). המרווח הוא התמורה שלו על הסיכון.","lesson":"2.7","keys":["עושי שוק","עושה שוק","עושי שוק (Market Makers)","עושה שוק (Market Maker)"],"alt":"הסוחר שתמיד נמצא שם. הוא מוכן גם לקנות מכם וגם למכור לכם, בכל רגע, ולכן יש לכם עם מי לסחור. בדרך כלל הוא לא מהמר על כיוון: הוא מתפרנס מההפרש בין מחיר הקנייה למחיר המכירה שלו."},{"term":"ריו (Rho)","def":"בכמה האופציה משתנה כשהריבית עולה בנקודת אחוז אחת. Call: חיובית, Put: שלילית. חשובה בעיקר בפקיעות רחוקות.","lesson":"3.5","keys":["ריו","ריו (Rho)","Rho"],"alt":"כמה האופציה רגישה לריבית. מי שקונה Call \"מחזיק\" את המניה בלי לשלם עליה היום את כל הסכום, והכסף שנשאר אצלו צובר ריבית. לכן בריבית גבוהה Call שווה יותר. ההשפעה מורגשת בעיקר באופציות של שנה ויותר."},{"term":"IV Crush","def":"ירידה חדה ב־IV אחרי אירוע, כמו דוח. יכולה לגרום להפסד גם למי שצדק בכיוון.","lesson":"3.4","keys":["IV Crush"],"alt":"אחרי שהחדשות יוצאות, אי־הוודאות נעלמת, ואיתה חלק מהמחיר של האופציות. קניתם Call לפני דוח, המניה עלתה קצת, ובכל זאת ה־Call שווה פחות: מה שהרווחתם מהכיוון קטן ממה שאיבדתם מירידת ה־IV."},{"term":"סטיית תקן (σ)","def":"מדד לפיזור: כמה התוצאה רחוקה בדרך כלל מהממוצע. במודל, כשני שלישים מהתוצאות בטווח של סטיית תקן אחת. IV היא סטיית תקן שנתית.","lesson":"2.4","keys":["סטיית תקן","סטיית התקן","סטיית תקן (σ)"],"alt":"מודדת מה נחשב תנועה \"רגילה\". מניה עם סטיית תקן יומית של 1%: יום של חצי אחוז הוא שגרה, יום של 1% הוא רגיל, ויום של 3% הוא חריג מאוד. ככל שסטיית התקן גדולה יותר, תנועות גדולות יותר נחשבות רגילות."},{"term":"פער פתיחה (Gap)","def":"מצב שבו המניה נפתחת במחיר רחוק ממחיר הסגירה, בלי עסקאות באמצע. נפוץ אחרי דוחות וחדשות.","lesson":"4.1","keys":["פער פתיחה","פער פתיחה (Gap)","Gap"],"alt":"המחיר \"קופץ\" בלי לעבור בדרך. השוק סגור בלילה, אבל החדשות לא: דוח שיצא אחרי הסגירה כבר נמצא בתוך מחיר הפתיחה. מי שתכנן לצאת באמצע הדרך מגלה שלא הייתה דרך."},{"term":"פקודת Stop","def":"הוראה למכור (או לקנות) כשהמחיר מגיע לרמה מסוימת. ברגע שהרמה נחצית היא הופכת לפקודת שוק, ולכן בפער היא מתבצעת במחיר הזמין ולא במחיר שנקבע.","lesson":"4.1","keys":["פקודת Stop","Stop"],"alt":"הבקשה: \"אם המחיר מגיע לשם, תוציא אותי\". זו בקשה להתחיל למכור כשהמחיר נוגע ברמה, לא הבטחה למכור בה. ביום רגיל תצאו קרוב לרמה שקבעתם. בפער תצאו במחיר שבו השוק נפתח."},{"term":"גודל פוזיציה","def":"כמה חוזים פותחים. נקבע לפי ההפסד המקסימלי ביחס לחשבון: תקציב הסיכון חלקי ההפסד המקסימלי לחוזה.","lesson":"4.2","keys":["גודל פוזיציה","גודל הפוזיציה"],"alt":"השאלה \"כמה\", שבאה אחרי השאלה \"מה\". אותה עסקה יכולה להיות סבירה בחוזה אחד ומסוכנת בעשרה. מחשבים מהסוף: מוכנים להפסיד $1,000, וחוזה אחד יכול להפסיד $400? פותחים 2 חוזים, לא יותר.","altChk":[["Math.floor(1000/400)","2 חוזים"]]},{"term":"תקציב סיכון","def":"הסכום המרבי שמוכנים להפסיד בעסקה אחת, כאחוז מהחשבון. נקבע מראש.","lesson":"4.2","keys":["תקציב סיכון","תקציב הסיכון"],"alt":"הקו האדום שקובעים לפני העסקה, כשהראש קר. חשבון של $10,000 ותקציב סיכון של 2%: בעסקה אחת מוכנים להפסיד עד $200. המטרה: שרצף של הפסדים לא יוציא אתכם מהמשחק.","altChk":[["10000*0.02","$200"]]},{"term":"Margin Call","def":"דרישה מהברוקר להפקיד כסף או לצמצם פוזיציות, כששווי החשבון יורד מתחת לדרישת הביטחונות. הברוקר רשאי לסגור פוזיציות בלי לשאול.","lesson":"6.6","keys":["Margin Call"],"alt":"הברוקר אומר: \"הפיקדון כבר לא מספיק\". הפוזיציה הפסידה, והכסף בחשבון לא מכסה את הדרישה. מוסיפים כסף או מקטינים פוזיציות, מהר. אם לא, הברוקר יסגור בעצמו, במחיר שיהיה באותו רגע."},{"term":"כוח קנייה (Buying Power)","def":"כמה הברוקר מרשה לפתוח היום, לפי דרישת הביטחונות. זה הגבול של הברוקר, לא מדד לסיכון מתאים.","lesson":"6.6","keys":["כוח קנייה","Buying Power"],"alt":"כמו מסגרת בכרטיס אשראי: היא אומרת כמה הבנק מרשה לכם להוציא, לא כמה נכון לכם להוציא. גם כאן: זה שהברוקר מרשה לפתוח 10 חוזים לא אומר שהחשבון יעמוד בהפסד שלהם."},{"term":"Put מגובה מזומן","def":"Short Put כשבחשבון מוחזק כל הסכום שיידרש לקניית המניות בהקצאה (מימוש × 100).","lesson":"5.3","keys":["Put מגובה מזומן"],"alt":"מתחייבים לקנות מניה במחיר מסוים, ושמים בצד את כל הכסף לקנייה. אם תקבלו הקצאה, הכסף כבר שם, ואין הפתעות מהברוקר. ההפסד האפשרי עדיין גדול: תחזיקו מניה שירדה."},{"term":"יום האקס־דיבידנד","def":"היום שממנו מי שקונה את המניה כבר לא מקבל את הדיבידנד הקרוב. Call בתוך הכסף עלול להיות ממומש יום לפניו.","lesson":"6.10","keys":["יום האקס־דיבידנד","אקס־דיבידנד"],"alt":"היום הראשון שבו המניה נסחרת בלי הזכות לדיבידנד הקרוב. קניתם את המניה יום לפניו? תקבלו את הדיבידנד. קניתם באותו יום או אחריו? לא תקבלו. לכן מחזיק Call בתוך הכסף עשוי לממש יום קודם, כדי להחזיק את המניה בזמן."},{"term":"Pin Risk","def":"אי ודאות של כותב כשהמניה נסגרת ביום הפקיעה קרוב מאוד למימוש: הוא לא יודע אם קיבל הקצאה עד אחרי סוף השבוע.","lesson":"6.10","keys":["Pin Risk"],"alt":"חוסר ודאות של סוף שבוע. המניה נסגרה כמעט בדיוק על המימוש, והכותב לא יודע אם המחזיק יממש. הוא יגלה רק אחרי סגירת המסחר, ויוכל לפעול רק בפתיחה הבאה. בינתיים המחיר יכול לזוז."},{"term":"תוחלת","def":"התוצאה הממוצעת לעסקה לאורך הרבה חזרות: (סיכוי לרווח × רווח ממוצע) − (סיכוי להפסד × הפסד ממוצע).","lesson":"4.3","keys":["תוחלת","התוחלת"],"alt":"מה יוצא \"בממוצע לעסקה\" אם חוזרים על אותה עסקה הרבה פעמים. 9 עסקאות שמרוויחות $100 כל אחת, ואחת שמפסידה $1,000: בסך הכול הפסד של $100 בעשר עסקאות, כלומר הפסד של $10 לעסקה. תוחלת שלילית, למרות 90% הצלחה.","altChk":[["-(9*100-1000)","$100 בעשר"],["-(9*100-1000)/10","$10 לעסקה"]]},{"term":"יומן מסחר","def":"רישום של כל העסקאות, כולל המפסידות, אחרי עמלות. ממנו מחשבים אחוז הצלחה, רווח והפסד ממוצעים ותוחלת.","lesson":"4.3","keys":["יומן מסחר","יומן מסחר: למדוד את עצמכם"],"alt":"הזיכרון לא אמין: זוכרים את הניצחונות ושוכחים את ההפסדים. היומן הוא הרישום שלא שוכח. כותבים בו כל עסקה, כולל עמלות, ורק ממנו אפשר לדעת אם אתם מרוויחים באמת."},{"term":"דביט וקרדיט","def":"Spread בדביט: משלמים נטו בכניסה, וזה ההפסד המקסימלי. Spread בקרדיט: מקבלים נטו בכניסה, וזה הרווח המקסימלי.","lesson":"5.4","keys":["דביט","קרדיט"],"alt":"לאיזה כיוון הכסף זז ביום הפתיחה. בדביט הוא יוצא מהחשבון, ובקרדיט הוא נכנס. במבנים הנפוצים, מחוץ לכסף: בדביט צריך שמשהו יקרה כדי להרוויח, ובקרדיט צריך שמשהו לא יקרה כדי לשמור את הכסף."},{"term":"Bear Put Spread","def":"קונים Put וכותבים Put במימוש נמוך יותר. הימור על ירידה, עם הפסד ורווח מוגבלים.","lesson":"5.4","keys":["Bear Put Spread"],"alt":"הימור על ירידה מתונה, במחיר מוזל. קונים Put, ומממנים חלק ממנו בכתיבת Put רחוק יותר. מה שמשלמים על ההוזלה: מתחת למימוש הנמוך כבר לא מרוויחים יותר."},{"term":"Bull Put Spread","def":"כותבים Put וקונים Put במימוש נמוך יותר. מקבלים קרדיט, ומפסידים אם המניה יורדת מתחת לנקודת האיזון.","lesson":"5.5","keys":["Bull Put Spread"],"alt":"מקבלים כסף על ההנחה שהמניה לא תרד הרבה. כותבים Put, וקונים Put זול יותר מתחתיו כהגנה. אם המניה נשארת מעל, הקרדיט שלכם. אם היא צונחת, ההפסד מפסיק לגדול במימוש הנמוך."},{"term":"Bear Call Spread","def":"כותבים Call וקונים Call במימוש גבוה יותר. מקבלים קרדיט, ומפסידים אם המניה עולה מעל נקודת האיזון.","lesson":"5.5","keys":["Bear Call Spread"],"alt":"מקבלים כסף על ההנחה שהמניה לא תעלה הרבה. כותבים Call, וקונים Call זול יותר מעליו כהגנה. אם המניה נשארת מתחת, הקרדיט שלכם. אם היא מזנקת, ההפסד מפסיק לגדול במימוש הגבוה."},{"term":"Straddle","def":"Call ועוד Put באותו מימוש. Long: הימור על תנועה גדולה לכל כיוון. Short: הימור על שקט, עם הפסד בלתי מוגבל.","lesson":"5.6","keys":["Straddle","Long Straddle","Short Straddle"],"alt":"לא שואלים \"לאן\", שואלים \"כמה\". הקונה מרוויח אם המניה זזה הרבה, למעלה או למטה, יותר ממה ששילם על שתי האופציות יחד. אם היא נשארת במקום, שתי האופציות מאבדות ערך."},{"term":"Strangle","def":"Put ו־Call במימושים שונים, שניהם מחוץ לכסף. זול מ־Straddle ודורש תנועה גדולה יותר. ב־Short: סיכון זנב.","lesson":"5.7","keys":["Strangle","Long Strangle","Short Strangle"],"alt":"כמו Straddle, אבל עם \"אזור מת\" רחב יותר באמצע. האופציות זולות יותר כי הן רחוקות מהמחיר הנוכחי, ולכן המניה צריכה לזוז יותר כדי שהקונה ירוויח. לכותב: טווח רווח רחב, והפסד גדול מחוץ לו, בלי תקרה כלפי מעלה."},{"term":"Iron Condor","def":"Bull Put Spread ועוד Bear Call Spread. מרוויח כשהמניה נשארת בטווח, עם הפסד מוגבל בשני הצדדים.","lesson":"5.8","keys":["Iron Condor"],"alt":"מקבלים כסף על ההנחה שהמניה תישאר בתוך טווח. כותבים אופציה מכל צד של המחיר, וקונים אופציה רחוקה יותר מכל צד כהגנה. המניה נשארה בטווח? הקרדיט שלכם. יצאה ממנו? ההפסד מוגבל, אבל בדרך כלל גדול מהקרדיט."},{"term":"Butterfly","def":"קונים מימוש נמוך, כותבים פעמיים את האמצעי, קונים מימוש גבוה. הימור זול על מחיר יעד, עם רווח מלא רק בנקודה אחת.","lesson":"5.9","keys":["Butterfly"],"alt":"הימור זול על \"נקודה\". הרווח המלא מגיע רק אם המניה נוחתת בפקיעה בדיוק על המימוש האמצעי, והוא קטן ככל שמתרחקים ממנו. רחוק מהאמצע מפסידים את מה ששילמתם, ולא יותר."},{"term":"סיכון זנב","def":"סיכון להפסד נדיר וגדול מאוד, כמו פער פתיחה חד נגד פוזיציה כתובה. לא רואים אותו ברוב החודשים.","lesson":"5.7","keys":["סיכון זנב"],"alt":"האירוע שקורה פעם בהרבה זמן, ומוחק חודשים של רווחים. הוא לא מופיע בתוצאות עד היום שבו הוא מגיע, ולכן קל לשכוח שהוא קיים. רצף ארוך של רווחים קטנים לא מוכיח שהסיכון נעלם."},{"term":"Bull / Bear","def":"בשמות של מבנים: Bull מרוויח כשהמניה עולה, Bear כשהיא יורדת. המילה שאחריהן (Call או Put) אומרת מאילו אופציות המבנה בנוי.","lesson":"5.4","keys":["Bull","Bear"],"alt":"דרך לזכור: שור (Bull) תוקף בקרניים מלמטה למעלה, ודוב (Bear) מכה בכף מלמעלה למטה. מבנה Bull רוצה שהמניה תעלה. מבנה Bear רוצה שהיא תרד."},{"term":"Skew","def":"ההבדל ב־IV בין מימושים שונים של אותה פקיעה. במניות, המימושים הנמוכים נסחרים בדרך כלל ב־IV גבוהה יותר.","lesson":"6.11","keys":["Skew"],"alt":"לא כל האופציות על אותה מניה \"יקרות\" באותה מידה. במניות, המימושים הנמוכים נסחרים בדרך כלל ב־IV גבוהה יותר, כי הרבה משקיעים מוכנים לשלם על הגנה מפני נפילה חדה."}],"recap":{"id":"recap-1","unit":"1","title":"יחידה 1 בפחות מדקה","scenes":[{"kind":"title","dur":4000,"title":"יחידה 1 בפחות מדקה","text":"ארבע פוזיציות. גרף אחד שמתהפך.","say":"היי, אני גמא! בואו נחזור ביחד על מה שלמדנו ביחידה 1."},{"kind":"chart","dur":10000,"pos":{"type":"call","side":"long","K":100,"prem":3,"mult":100},"title":"Long Call","text":"משלמים **פרמיה** של {prem} לחוזה ומקבלים זכות לקנות.\nהפסד מקסימלי: {maxLoss}. רווח מקסימלי: {maxProfit}.\n**נקודת איזון**: מימוש + פרמיה = {be}.","say":"שימו לב לנקודה שבה הקו חוצה את האפס. שם נמצאת נקודת האיזון."},{"kind":"chart","dur":10000,"pos":{"type":"call","side":"short","K":100,"prem":3,"mult":100},"title":"Short Call","text":"אותו חוזה מהצד השני: הגרף מתהפך.\nמקבלים {prem}, וזה גם הרווח המקסימלי.\nבלי מניות, ההפסד **בלתי מוגבל**.","say":"אותו חוזה בדיוק, רק מהצד השני. ראיתם איך הגרף מתהפך?"},{"kind":"chart","dur":10000,"pos":{"type":"put","side":"long","K":100,"prem":3,"mult":100},"title":"Long Put","text":"זכות **למכור**. מרוויחים כשהמניה יורדת מתחת ל**מימוש − פרמיה** = {be}.\nהפסד מקסימלי: {maxLoss}. רווח מקסימלי: {maxProfit}, אם המניה צונחת עד אפס.","say":"Put מרוויח כשהמניה יורדת. עם מניה ביד זה ביטוח, ובלי מניה זה הימור על ירידה."},{"kind":"chart","dur":10000,"pos":{"type":"put","side":"short","K":100,"prem":3,"mult":100},"title":"Short Put","text":"מקבלים {prem} ומתחייבים לקנות.\nאם המניה צונחת עד אפס, ההפסד מגיע עד {maxLoss}.","say":"פרמיה קטנה, אחריות גדולה. תזכרו את זה."},{"kind":"grid","dur":9000,"title":"הכלל של היחידה","text":"**קונים** משלמים פרמיה, ו**כותבים** מקבלים אותה.\nמוגבל לא אומר קטן. וכל המספרים כאן **לפני עמלות**.","say":"אם תזכרו רק דבר אחד מהיחידה, תזכרו את זה."},{"kind":"end","dur":5000,"title":"מה הלאה?","text":"יחידה 2: מה קובע את מחיר האופציה.","say":"כל הכבוד! נתראה ביחידה 2."}],"host":"גמא"},"id":"1","title":"Call ו־Put, היסודות","track":"מסלול בסיס"};</script>
<script>// מודול חישוב. כל מספר שמוצג בקורס מחושב כאן, ולא נכתב ביד.
// מקורות: Hull, Options, Futures, and Other Derivatives, פרקים 10–11; OCC, Characteristics and Risks of Standardized Options.
// pos = { type: 'call'|'put', side: 'long'|'short', K: מימוש, prem: פרמיה למניה, mult: מכפיל (100) }
var Calc = (function () {
  function valueAtExpiry(type, S, K) { if (type === 'stock') return S; return type === 'call' ? Math.max(S - K, 0) : Math.max(K - S, 0); } // stock: רגל של מניה, prem הוא מחיר הקנייה
  function sign(side) { return side === 'short' ? -1 : 1; }

  // רווח והפסד בפקיעה לחוזה, לכל אחת מארבע הפוזיציות
  function positionPnL(a) { return sign(a.side) * (valueAtExpiry(a.type, a.S, a.K) - a.prem) * a.mult; }
  // נקודת איזון בפקיעה: קול = מימוש + פרמיה, פוט = מימוש − פרמיה (זהה לקונה ולמוכר)
  function breakeven(a) { return a.type === 'call' ? a.K + a.prem : a.K - a.prem; }
  // הפסד מקסימלי לחוזה (מספר חיובי). Infinity = לא מוגבל.
  function maxLoss(a) {
    if (a.side === 'long') return a.prem * a.mult;
    return a.type === 'call' ? Infinity : (a.K - a.prem) * a.mult; // מניה יכולה לרדת עד 0
  }
  // רווח מקסימלי לחוזה. Infinity = לא מוגבל.
  function maxProfit(a) {
    if (a.side === 'short') return a.prem * a.mult;
    return a.type === 'call' ? Infinity : (a.K - a.prem) * a.mult;
  }
  // ערך פנימי למניה, ערך זמן למניה
  function intrinsic(a) { return valueAtExpiry(a.type, a.S, a.K); }
  function timeValue(a) { return Math.round((a.price - intrinsic(a)) * 100) / 100; }
  // 'ITM' | 'ATM' | 'OTM'
  function moneyness(a) {
    if (a.S === a.K) return 'ATM';
    var itm = a.type === 'call' ? a.S > a.K : a.S < a.K;
    return itm ? 'ITM' : 'OTM';
  }
  function premiumCost(a) { return a.prem * a.mult; }
  // מחיר מניה שבו פוזיציה מגיעה לרווח יעד, בצד הליניארי שמעבר למימוש
  function priceForPnL(a) {
    var perShare = a.target / a.mult / sign(a.side);
    return a.type === 'call' ? a.K + a.prem + perShare : a.K - a.prem - perShare;
  }

  // תאימות לאחור לשיעור 1.2
  function longCallPnL(a) { return positionPnL({ type: 'call', side: 'long', S: a.S, K: a.K, prem: a.prem, mult: a.mult }); }
  function longCallBreakeven(a) { return breakeven({ type: 'call', K: a.K, prem: a.prem }); }
  function longCallMaxLoss(a) { return maxLoss({ type: 'call', side: 'long', K: a.K || 0, prem: a.prem, mult: a.mult }); }
  function longCallPriceForPnL(a) { return priceForPnL({ type: 'call', side: 'long', K: a.K, prem: a.prem, mult: a.mult, target: a.target }); }

  // ---------- שרשרת אופציות (יחידה 2) ----------
  // מחיר תאורטי לפי Black-Scholes (Hull פרק 15), עם תשואת דיבידנד q (ברירת מחדל 0). T בשנים, r ו־iv כשבר עשרוני.
  function normCdf(x) { // Abramowitz & Stegun 7.1.26, דיוק של כ־1e-7
    var t = 1 / (1 + 0.2316419 * Math.abs(x)), d = 0.3989422804014327 * Math.exp(-x * x / 2);
    var p = d * t * (0.31938153 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
    return x >= 0 ? 1 - p : p;
  }
  function bsPrice(a) {
    var T = a.days / 365, sq = a.iv * Math.sqrt(T);
    var q = a.q || 0, Sq = a.S * Math.exp(-q * T); // q: תשואת דיבידנד שנתית רציפה (Hull פרק 17)
    var d1 = (Math.log(a.S / a.K) + (a.r - q + a.iv * a.iv / 2) * T) / sq, d2 = d1 - sq, disc = Math.exp(-a.r * T);
    return a.type === 'call' ? Sq * normCdf(d1) - a.K * disc * normCdf(d2) : a.K * disc * normCdf(-d2) - Sq * normCdf(-d1);
  }
  function r2(x) { return Math.round(x * 100) / 100; }
  function tick(x, up) { var n = x * 20; n = up ? Math.ceil(n - 1e-9) : Math.floor(n + 1e-9); return r2(n / 20); } // רשת של $0.05
  // ציטוט אחד: Bid/Ask סביב המחיר התאורטי, מרווח של כ־3% (לפחות $0.05), מעוגל לרשת של $0.05
  function quote(a) {
    // אופציה אמריקאית לא נסחרת מתחת לערך הפנימי, לכן התאורטי לפחות הערך הפנימי (Hull פרק 11)
    var intr = r2(valueAtExpiry(a.type, a.S, a.K)), theo = Math.max(bsPrice(a), intr), half = Math.max(0.025, theo * 0.015);
    var bid = Math.max(0, tick(theo - half, false), tick(intr, false)), ask = tick(theo + half, true);
    if (ask - bid < 0.05 - 1e-9) ask = r2(bid + 0.05);
    var spread = r2(ask - bid);
    var last = a.last != null ? a.last : (spread >= 0.1 ? r2(ask - 0.05) : bid);
    return { K: a.K, type: a.type, theo: theo, bid: bid, ask: ask, last: last, spread: spread, mid: r2((bid + ask) / 2), vol: a.vol || 0, oi: a.oi || 0 };
  }
  // שרשרת לפקיעה אחת: def = { S, r, iv, days, strikes:[...], call:{vol:[...],oi:[...],last:{K:price}}, put:{...} }
  function chain(def) {
    var out = { S: def.S, days: def.days, label: def.label, call: [], put: [] };
    ['call', 'put'].forEach(function (type) {
      var side = def[type] || {};
      def.strikes.forEach(function (K, i) {
        // Skew מתון: תנודתיות משתמעת גבוהה יותר במימושים נמוכים, כמו ברוב המניות (Hull פרק 20)
        var iv = def.iv + (def.skew || 0) * (def.S - K) / def.S;
        var q = quote({ S: def.S, K: K, r: def.r, iv: iv, days: def.days, type: type,
          vol: side.vol && side.vol[i], oi: side.oi && side.oi[i], last: side.last && side.last[K] });

        var g = greeksOf({ S: def.S, K: K, days: def.days, iv: iv, r: def.r }, type);
