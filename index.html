"K":100,"prem":3,"mult":100}},"items":[{"id":"1.7-c1","type":"concept","title":"ארבע הפוזיציות במבט אחד","body":"**Long Call:** משלמים פרמיה. מרוויחים כשהמניה עולה מעל נקודת האיזון. הפסד מקסימלי: הפרמיה.\n**Long Put:** משלמים פרמיה. מרוויחים כשהמניה יורדת מתחת לנקודת האיזון. הפסד מקסימלי: הפרמיה.\n**Short Call** (בלי להחזיק את המניה, כלומר Naked Call): מקבלים פרמיה. מפסידים כשהמניה עולה מעל נקודת האיזון. הפסד מקסימלי: **בלתי מוגבל**.\n**Short Put:** מקבלים פרמיה. מפסידים כשהמניה יורדת מתחת לנקודת האיזון. הפסד מקסימלי: **(מימוש − פרמיה) × 100**, מוגבל אבל גדול.\n\nנקודת האיזון זהה לקונה ולכותב: ב־Call **מימוש + פרמיה**, ב־Put **מימוש − פרמיה**.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10; OCC, Characteristics and Risks of Standardized Options"},{"id":"1.7-q1","type":"mcq","prompt":"כל הגרפים הם רווח והפסד בפקיעה, עם מימוש $100 ופרמיה $3. איזה גרף מראה **Short Put**?","options":[{"pos":{"type":"call","side":"long","K":100,"prem":3,"mult":100},"label":"גרף א"},{"pos":{"type":"put","side":"long","K":100,"prem":3,"mult":100},"label":"גרף ב"},{"pos":{"type":"call","side":"short","K":100,"prem":3,"mult":100},"label":"גרף ג"},{"pos":{"type":"put","side":"short","K":100,"prem":3,"mult":100},"label":"גרף ד"}],"correct":3,"explain":{"right":"מימין למימוש הקו שטוח מעל האפס: המניה לא ירדה, והכותב שומר את הפרמיה. משמאל הקו יורד: ככל שהמניה נמוכה יותר, ההפסד גדל.","wrong":"ב־Short Put מקבלים פרמיה, ולכן הקו השטוח נמצא **מעל** האפס. הוא שטוח כשהמניה גבוהה (מימין), ויורד כשהמניה יורדת (משמאל), כי אז הכותב חייב לקנות ביוקר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10: ארבע הפוזיציות"},{"id":"1.7-q2","type":"mcq","prompt":"באיזה גרף ההפסד **בלתי מוגבל**? (מימוש $100, פרמיה $3)","options":[{"pos":{"type":"put","side":"short","K":100,"prem":3,"mult":100},"label":"גרף א"},{"pos":{"type":"call","side":"short","K":100,"prem":3,"mult":100},"label":"גרף ב"},{"pos":{"type":"put","side":"long","K":100,"prem":3,"mult":100},"label":"גרף ג"},{"pos":{"type":"call","side":"long","K":100,"prem":3,"mult":100},"label":"גרף ד"}],"correct":1,"explain":{"right":"זה Short Call בלי מניות (Naked Call): הקו יורד ככל שהמניה עולה, ולמחיר של מניה אין תקרה. לכן גם להפסד אין תקרה.","wrong":"גם ב־Short Put הקו יורד, אבל מניה לא יכולה לרדת מתחת לאפס, ולכן ההפסד שם מוגבל. בלתי מוגבל הוא רק הקו שיורד כשהמניה **עולה**: Short Call."},"source":"OCC, Characteristics and Risks of Standardized Options: סיכוני כותב Naked Call"},{"id":"1.7-q3","type":"mcq","prompt":"מי מקבל את הפרמיה כשנפתחת עסקת אופציה?","options":[{"text":"הכותב, הצד שמוכר את האופציה"},{"text":"הקונה, הצד שמקבל את הזכות"},{"text":"הבורסה"},{"text":"שניהם, כל אחד חצי"}],"correct":0,"explain":{"right":"הקונה משלם את הפרמיה בתמורה לזכות, והכותב מקבל אותה בתמורה לחובה. זה נכון גם ב־Call וגם ב־Put.","wrong":"הקונה **משלם** את הפרמיה כדי לקבל זכות. הכותב **מקבל** אותה, ובתמורה לוקח על עצמו חובה. הבורסה לא מקבלת את הפרמיה (עמלות הן נושא אחר)."},"source":"OCC, Characteristics and Risks of Standardized Options: הגדרות"},{"id":"1.7-q4","type":"mcq","prompt":"כתבתם Call בלי להחזיק את המניה: מימוש $100, פרמיה $3. מה ההפסד המקסימלי לחוזה?","fmt":"usd","options":[{"v":300},{"v":9700},{"v":10300},{"text":"בלתי מוגבל","unlimited":true}],"correct":3,"check":{"fn":"maxLoss","args":{"type":"call","side":"short","K":100,"prem":3,"mult":100}},"explain":{"right":"כתבתם התחייבות למכור במחיר $100, ולמחיר של מניה אין תקרה. כל דולר מעל $103 עולה לכם $100 לחוזה.","wrong":"$300 הוא הרווח **המקסימלי** של הכותב: הפרמיה. ההפסד ב־Naked Call אינו מוגבל, כי המניה יכולה לעלות בלי תקרה ואתם חייבים למכור במחיר $100."},"source":"OCC, Characteristics and Risks of Standardized Options: סיכוני כותב Naked Call; Hull, פרק 10"},{"id":"1.7-q5","type":"mcq","prompt":"כתבתם Put: מימוש $100, פרמיה $3. מה ההפסד המקסימלי לחוזה?","fmt":"usd","options":[{"v":300},{"v":9700},{"v":10000},{"text":"בלתי מוגבל","unlimited":true}],"correct":1,"check":{"fn":"maxLoss","args":{"type":"put","side":"short","K":100,"prem":3,"mult":100}},"explain":{"right":"התרחיש הגרוע: המניה צונחת לאפס, ואתם חייבים לקנות אותה במחיר $100. פחות הפרמיה שקיבלתם: `($100 − $3) × 100 = $9,700`. מוגבל, אבל גדול בהרבה מהפרמיה שקיבלתם.","wrong":"מניה לא יורדת מתחת לאפס, ולכן ההפסד מוגבל. אבל הוא לא $300: בתרחיש הגרוע קונים במחיר $100 מניה ששווה אפס, ומקזזים את הפרמיה. `($100 − $3) × 100 = $9,700`."},"source":"OCC, Characteristics and Risks of Standardized Options: סיכוני כותב Put; Hull, פרק 10"},{"id":"1.7-q6","type":"chart-mcq","pos":{"type":"put","side":"long","K":100,"prem":4,"mult":100},"prompt":"קניתם Put: מימוש $100, פרמיה $4. באיזה מחיר מניה בפקיעה הפוזיציה מגיעה לאיזון?","hint":"הזיזו את המחיר ומצאו איפה הקו חוצה את קו האפס ($0).","fmt":"price","start":100,"options":[{"v":92,"why":"$92 זה מימוש פחות פעמיים הפרמיה. ב־Put מחסירים את הפרמיה פעם אחת: `$100 − $4 = $96`."},{"v":96},{"v":100,"why":"במחיר $100 ה־Put רק מתחיל להיות שווה משהו, אבל הפרמיה עוד לא הוחזרה: `$100 − $4 = $96`."},{"v":104,"why":"$104 זה מימוש ועוד פרמיה, החישוב של Call. ב־Put מחסירים: `$100 − $4 = $96`."}],"correct":1,"check":{"fn":"breakeven","args":{"type":"put","K":100,"prem":4}},"explain":{"right":"ב־Put נקודת האיזון היא מימוש − פרמיה: `$100 − $4 = $96`. מתחת לזה מרוויחים, ומעל לזה מפסידים.","wrong":"ב־Put מרוויחים כשהמניה יורדת, ולכן נקודת האיזון נמצאת **מתחת** למימוש: `$100 − $4 = $96`. $104 הוא מימוש + פרמיה, נקודת האיזון של Call."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.7-q7","type":"mcq","prompt":"כתבתם Call: מימוש $100, פרמיה $5. מה נקודת האיזון בפקיעה?","fmt":"price","options":[{"v":95},{"v":100},{"v":105},{"v":110}],"correct":2,"check":{"fn":"breakeven","args":{"type":"call","K":100,"prem":5}},"explain":{"right":"ב־Call נקודת האיזון היא מימוש + פרמיה, גם לקונה וגם לכותב: `$100 + $5 = $105`. מעל לזה הכותב מפסיד.","wrong":"נקודת האיזון לא משתנה כשעוברים לצד הכותב. ב־Call היא תמיד מימוש + פרמיה: `$100 + $5 = $105`. עד המחיר הזה הפרמיה שקיבלתם מכסה את מה שאתם חייבים."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.7-q8","type":"mcq","prompt":"כתבתם Put: מימוש $100, פרמיה $3. ביום הפקיעה המניה נסחרת במחיר $90. מה הרווח או ההפסד לחוזה?","fmt":"pnl","options":[{"v":300},{"v":-700},{"v":-1000},{"v":-1300}],"correct":1,"check":{"fn":"positionPnL","args":{"type":"put","side":"short","S":90,"K":100,"prem":3,"mult":100}},"explain":{"right":"אתם חייבים לקנות במחיר $100 מניה ששווה $90: `($100 − $90) × 100 = $1,000` הפסד. הפרמיה שקיבלתם, $300, מקטינה אותו. ההפסד נטו: −$700.","wrong":"המניה ירדה מתחת למימוש, ולכן ה־Put ימומש נגדכם: `($100 − $90) × 100 = $1,000`. אבל כבר קיבלתם $300 פרמיה, אז ההפסד נטו הוא −$700."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.7-b1","type":"build-pos","prompt":"בנו את הגרף: בחרו צד (קנייה או כתיבה) וסוג (Call או Put) כך שהקו המקווקו יתלבש על הקו הרציף.","target":{"type":"put","side":"short","K":100,"prem":3,"mult":100},"explain":{"right":"זה Short Put: למעלה שטוח (הפרמיה שקיבלתם), ולמטה ההפסד גדל ככל שהמניה יורדת.","wrong":"הסתכלו על הצד השטוח: אם הוא למעלה, מקבלים פרמיה, כלומר כתיבה. ואם ההפסד גדל כשהמניה **יורדת**, זה Put. היעד הוא Short Put."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.7-b2","type":"build-pos","prompt":"עוד אחד: בנו פוזיציה שהגרף שלה ייראה כמו הקו הרציף.","target":{"type":"call","side":"short","K":100,"prem":3,"mult":100},"explain":{"right":"זה Short Call: למעלה שטוח (הפרמיה), וכשהמניה עולה ההפסד גדל בלי תקרה.","wrong":"צד שטוח למעלה = מקבלים פרמיה = כתיבה. וההפסד גדל כשהמניה **עולה**, כלומר זה Call. היעד הוא Short Call."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"1.7-s1","type":"spot-guru","prompt":"מצאו את הגורו: סמנו כל משפט מטעה בפוסט. יש בו גם משפטים נכונים.","channel":"ערוץ \"כסף קל עם אופציות\"","claims":[{"t":"השיטה שלי: מוכרים Puts כל שבוע ומקבלים **הכנסה קבועה**.","bad":true,"why":"המילה המטעה היא \"קבועה\". הפרמיה היא תשלום על חובה לקנות מניה שעלולה לצנוח, ושבוע רע אחד יכול למחוק פרמיות של חודשים (שיעור 1.4)."},{"t":"מי שכותב Put ומקבל הקצאה חייב לקנות 100 מניות במחיר המימוש.","bad":false,"why":"זו בדיוק החובה שהכותב לוקח על עצמו."},{"t":"ההפסד המקסימלי? הוא כמעט אף פעם לא קורה, אז לא צריך לחשוב עליו.","bad":true,"why":"נדיר זה לא קטן. ב־Short Put ההפסד המקסימלי הוא (מימוש − פרמיה) × 100, ואם קורה, הוא מוחק הרבה פרמיות."},{"t":"צילום מסך: +$4,200 החודש!","bad":true,"why":"חודש טוב אחד לא מראה את החודשים הרעים, ולא את גודל החשבון."},{"t":"הרווח המקסימלי של כותב Put הוא הפרמיה שקיבל.","bad":false,"why":"וזה בדיוק מה שהופך את היחס בין הסיכון לסיכוי לחשוב כל כך."},{"t":"Short Call בלי מניות הוא אסטרטגיה בטוחה למתחילים.","bad":true,"why":"ב־Naked Call ההפסד **בלתי מוגבל** (שיעור 1.4)."},{"t":"הצטרפו לערוץ הפרימיום ב־99 דולר לחודש וקבלו את העסקאות שלי.","bad":true,"why":"מנוי לעסקאות של מישהו אחר הוא העתקת פעולות, לא לימוד, וזו המלצה לפעולה. וצילומי רווח לא מחליפים תיעוד מלא של כל העסקאות, כולל המפסידות."}],"explain":{"right":"מצאתם את כל הטענות המטעות, בלי לסמן את הנכונות. כך נראה גורו: הבטחות, צילומי רווח, והסתרה של ההפסד המקסימלי.","wrong":"עברו על ההסברים ליד כל משפט. משפט מטעה מבטיח, מסתיר סיכון, או מוכר משהו. משפט נכון מתאר את החוזה כמו שהוא."},"source":"עקרונות הקורס; שיעורים 1.4 ו־1.7"}],"summary":["**קונים** משלמים פרמיה, וההפסד המקסימלי שלהם הוא **הפרמיה**.","**כותבים** מקבלים פרמיה. ב־Naked Call ההפסד **בלתי מוגבל**. ב־Short Put הוא **(מימוש − פרמיה) × 100**.","נקודת האיזון זהה לשני הצדדים: ב־Call **מימוש + פרמיה**, ב־Put **מימוש − פרמיה**.","המספרים בשיעור הם לפני עמלות."],"ready":true,"unit":"1"},{"id":"2.1","title":"לא חייבים לחכות לפקיעה","minutes":6,"objective":"להבין שאפשר למכור אופציה בכל רגע עד הפקיעה, שלפני הפקיעה היא שווה ערך פנימי ועוד ערך זמן, ושגרף \"בפקיעה\" הוא רק תמונה של היום האחרון.","timeSet":{"type":"call","K":100,"S0":100,"days0":45,"r":0.04,"iv":0.3,"mult":100},"items":[{"id":"2.1-c1","type":"concept","title":"הגרף בפקיעה הוא רק היום האחרון","body":"עד עכשיו ראינו גרפים **בפקיעה**. אבל אפשר למכור אופציה בכל רגע לפני כן, במחיר שהיא שווה בשוק באותו רגע.\n\nלפני הפקיעה אופציה שווה **ערך פנימי ועוד ערך זמן** (שיעור 1.5). לכן הקו של \"היום\" נמצא מעל הקו של הפקיעה.\n\nבדוגמה: קניתם Call במימוש $100, כשנשארו 45 ימים, ושילמתם {prem} לאופציה ({premCost} לחוזה). **הזיזו את המחוון** ותראו איך הקו הרציף מתקרב לקו המקווקו ככל שהזמן עובר.\n\nהמספרים כאן הם **שווי תאורטי**, בהנחה שהתמחור בשוק (התנודתיות) לא משתנה. במכירה בפועל מקבלים קצת פחות, בגלל ההפרש בין מחיר הקנייה למחיר המכירה בשוק (שיעור 2.7).","time":{"S":100,"days":45},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.1-a1","type":"analogy","title":"השובר באמצע החודש","body":"זוכרים את השובר משיעור 1.1? הוא מאפשר לקנות טלוויזיה במחיר $2,000 עד סוף החודש.\n\nעכשיו אמצע החודש, והטלוויזיה עולה בחנות בדיוק $2,000. אם השובר היה פוקע היום, הוא היה שווה $0: אין טעם להשתמש בו.\n\nאבל נשארו שבועיים, ואולי המחיר יעלה. לכן חבר שרוצה את השובר מוכן לשלם עליו משהו. הסכום הזה הוא **ערך הזמן**.","breaks":"שובר קשה למכור, ואופציה אפשר למכור בשוק בכל רגע. ועוד הבדל: שווי האופציה משתנה כל רגע יחד עם המניה, ולא רק לפי מחיר בחנות פעם ביום. בהמשך היחידה נלמד מה עוד משפיע עליו."},{"id":"2.1-l1","type":"mcq","life":true,"prompt":"אמצע החודש. הטלוויזיה עולה בדיוק $2,000, והשובר מאפשר לקנות אותה במחיר $2,000 עד סוף החודש. חבר מציע לקנות מכם את השובר. למה הוא מוכן לשלם עליו משהו?","options":[{"text":"כי נשארו שבועיים, ואולי המחיר בחנות יעלה"},{"text":"כי השובר מוריד את מחיר הטלוויזיה כבר היום"},{"text":"כי בסוף החודש השובר יהיה שווה יותר בכל מקרה"},{"text":"אין סיבה. שובר כזה שווה $0"}],"correct":0,"explain":{"right":"היום אין לו ערך פנימי, אבל יש לו **ערך זמן**: הסיכוי שהמחיר יעלה לפני סוף החודש.","wrong":"כרגע השובר לא חוסך כלום, כי המחיר בחנות שווה למחיר שבשובר. מה שהחבר קונה הוא **זמן**: אולי המחיר יעלה עד סוף החודש. אם לא, השובר יפקע בלי ערך."},"source":"דוגמה מהחיים"},{"id":"2.1-q1","type":"mcq","prompt":"קניתם Call במימוש $100 כשהמניה הייתה במחיר $100 ונשארו 45 ימים (IV 30%), ושילמתם {prem} לאופציה ({premCost} לחוזה). עברו 15 ימים (נשארו 30), והמניה עלתה למחיר $106. אם הייתם מחכים לפקיעה והמניה הייתה נשארת $106, הרווח היה {pnl0@106} לחוזה. אם תמכרו **עכשיו** בשוק, כמה תרוויחו בערך?","time":{"S":106,"days":30,"hide":true,"lock":true},"options":[{"text":"{pnl30@106}"},{"text":"{pnl0@106}"},{"text":"$0. רווח נוצר רק בפקיעה"}],"correct":0,"explain":{"right":"לפני הפקיעה האופציה שווה {v30@106}: ערך פנימי {intr@106} ועוד ערך זמן. לכן מכירה עכשיו נותנת {pnl30@106}, יותר מהגרף בפקיעה.","wrong":"{pnl0@106} זה הרווח **בפקיעה**. עכשיו נשארו 30 ימים, ולאופציה יש גם ערך זמן, ולכן המחיר שלה {v30@106}. מכירה עכשיו נותנת {pnl30@106} לחוזה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.1-q2","type":"mcq","prompt":"קניתם Call במימוש $100 כשהמניה הייתה במחיר $100 ונשארו 45 ימים (IV 30%), ושילמתם {prem} לאופציה ({premCost} לחוזה). עברו 15 ימים (נשארו 30), והמניה ירדה למחיר $97, מתחת למימוש. אם הייתם מחכים לפקיעה והמניה הייתה נשארת שם, הייתם מפסידים את כל הפרמיה. אם תמכרו **עכשיו**, מה יקרה?","time":{"S":97,"days":30,"hide":true,"lock":true},"options":[{"text":"הפסד של בערך {loss30@97}, פחות מכל הפרמיה"},{"text":"הפסד של כל הפרמיה, {premCost}"},{"text":"אי אפשר למכור אופציה מחוץ לכסף"}],"correct":0,"explain":{"right":"ל־Call מחוץ לכסף אין ערך פנימי, אבל כשנשארו 30 ימים יש לו ערך זמן: {v30@97} לאופציה. מכירה עכשיו מחזירה חלק מהפרמיה.","wrong":"הפסד של כל הפרמיה קורה רק אם מחכים לפקיעה והמניה נשארת מתחת למימוש. עכשיו לאופציה יש ערך זמן, {v30@97}, ואפשר למכור אותה ולהפסיד בערך {loss30@97} בלבד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.1-q3","type":"mcq","tip":"הזיזו את המחוון עד הסוף ימינה ושימו לב לשווי האופציה.","prompt":"קניתם Call במימוש $100 כשהמניה הייתה במחיר $100 ונשארו 45 ימים (IV 30%), ושילמתם {prem} לאופציה ({premCost} לחוזה). נניח שהמניה נשארת בדיוק במחיר $100, על המימוש, עד הפקיעה. מה קורה לשווי האופציה?","time":{"S":100,"days":45},"options":[{"text":"הוא יורד עם הזמן, עד $0 בפקיעה"},{"text":"הוא נשאר {prem}, כי המניה לא זזה"},{"text":"הוא עולה ככל שמתקרבים לפקיעה"}],"correct":0,"explain":{"right":"על המימוש אין ערך פנימי, וכל השווי הוא ערך זמן. הוא נשחק עם הזמן, ובפקיעה מתאפס. שימו לב שהירידה מואצת לקראת הסוף.","wrong":"גם כשהמניה לא זזה, ערך הזמן נשחק. במימוש $100 ומניה במחיר $100 אין ערך פנימי, ולכן בפקיעה האופציה שווה $0."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.1-c2","type":"concept","title":"למכור עכשיו או להחזיק?","body":"בכל רגע עד הפקיעה יש שתי אפשרויות:\n\n**למכור עכשיו**: מקבלים את השווי הנוכחי, כולל ערך הזמן, והתוצאה ידועה.\n**להחזיק**: התוצאה תלויה במחיר המניה בהמשך. היא יכולה להיות טובה יותר או גרועה יותר, וערך הזמן ממשיך להישחק.\n\nאין כאן תשובה נכונה אחת. זו החלטה על סיכון. מה שחשוב לדעת: **הגרף בפקיעה לא מראה את מה שאפשר לקבל היום**.","source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.1-q4","type":"mcq","prompt":"קניתם Call במימוש $100 כשהמניה הייתה במחיר $100 ונשארו 45 ימים (IV 30%), ושילמתם {prem} לאופציה ({premCost} לחוזה). עכשיו המניה במחיר $106 ונשארו 30 ימים. אם תחזיקו עד הפקיעה והמניה תישאר $106, הרווח יהיה {pnl0@106} לחוזה. אם תמכרו עכשיו, {pnl30@106}. מאיפה ההפרש?","options":[{"text":"מערך הזמן שנשאר באופציה, {tv30@106} לחוזה"},{"text":"מהעמלות שחוסכים כשמוכרים מוקדם"},{"text":"מההפרש בין מחיר הקנייה למחיר המכירה בשוק"},{"text":"מדיבידנד שהמניה משלמת"}],"correct":0,"explain":{"right":"שני המצבים זהים בערך הפנימי. ההפרש הוא ערך הזמן, {tv30@106} לחוזה, שעד הפקיעה יישחק.","wrong":"הערך הפנימי זהה בשני המצבים. מה שנשאר באופציה כשיש עוד 30 ימים, ונעלם בפקיעה, הוא **ערך הזמן**: {tv30@106} לחוזה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.1-q5","type":"mcq","prompt":"קניתם Call במימוש $100 כשהמניה הייתה במחיר $100 ונשארו 45 ימים (IV 30%), ושילמתם {prem} לאופציה ({premCost} לחוזה). המניה קפצה למחיר $106 ונשארו 30 ימים. אם תמכרו עכשיו, תרוויחו {pnl30@106} לחוזה. מה מהבאים נכון?","options":[{"text":"אפשר למכור עכשיו ולקבל את השווי הנוכחי. אפשר גם להחזיק, ואז התוצאה תלויה במחיר בהמשך"},{"text":"חייבים להחזיק עד הפקיעה כדי לממש את הרווח"},{"text":"אם תחזיקו, הרווח רק יגדל, כי המניה במגמת עלייה"},{"text":"מכירה לפני הפקיעה אפשרית רק כשיש הפסד"}],"correct":0,"explain":{"right":"שתי האפשרויות פתוחות. מכירה נועלת את השווי הנוכחי. החזקה משאירה את הסיכון והסיכוי, וערך הזמן ממשיך להישחק.","wrong":"אפשר למכור בכל רגע, ברווח או בהפסד. ואף אחד לא יודע לאן המניה תלך: החזקה יכולה להגדיל את הרווח או להקטין אותו."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["אפשר למכור אופציה **בכל רגע** עד הפקיעה, במחיר שלה בשוק.","לפני הפקיעה אופציה שווה **ערך פנימי ועוד ערך זמן**. לכן הקו של היום מעל הקו של הפקיעה.","ערך הזמן **נשחק** עם הזמן ומתאפס בפקיעה.","הגרף בפקיעה הוא תמונה של **היום האחרון** בלבד."],"ready":true,"unit":"2"},{"id":"2.2","title":"שישה גורמים","minutes":6,"objective":"לדעת לאיזה כיוון כל אחד משישת הגורמים (מחיר המניה, מימוש, זמן, תנודתיות, ריבית, דיבידנד) מזיז את המחיר של Call ושל Put.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"2.2-c1","type":"concept","title":"ממה עשוי מחיר של אופציה","body":"בשיעור הקודם ראינו שלפני הפקיעה אופציה שווה ערך פנימי ועוד ערך זמן. אבל מה קובע כמה בדיוק?\n\nשישה גורמים:\n**1. מחיר המניה.**\n**2. מחיר המימוש.**\n**3. הזמן עד הפקיעה.**\n**4. התנודתיות (IV)**: כמה תנועה השוק מתמחר. נרחיב עליה בשיעור הבא.\n**5. הריבית.**\n**6. הדיבידנד.**\n\nמודל התמחור הנפוץ, **Black-Scholes**, מקבל את ששת הגורמים ומחזיר מחיר. הוא נבנה לאופציות אירופאיות, ולאופציות על מניות בארה\"ב הוא נותן קירוב טוב. כאן משתמשים בו כמחשבון. **הזיזו את המחוונים** ותראו מה קורה ל־Call ול־Put.","price":{"sliders":["S","days","iv"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.2-a1","type":"analogy","title":"פרמיה של ביטוח רכב","body":"מה קובע כמה תשלמו על ביטוח רכב?\n\n**שווי הרכב**: רכב יקר, ביטוח יקר.\n**ההשתתפות העצמית**: ככל שהיא גבוהה, הביטוח זול יותר.\n**תקופת הביטוח**: שנתיים עולות יותר משנה.\n**כמה מסוכן הנהג**: נהג צעיר וחסר ניסיון משלם יותר, כי הסיכוי לתאונה גבוה.\n\nבאופציות: מחיר המניה, מחיר המימוש, הזמן והתנודתיות עושים תפקיד דומה.","breaks":"ביטוח דומה יותר ל־Put. ב־Call חלק מהכיוונים הפוכים: מחיר מניה גבוה מייקר Call ומוזיל Put. ותנודתיות מייקרת את שניהם מסיבה אחת: ההפסד של המחזיק מוגבל לפרמיה, ותנועה חזקה לכיוון שלו שווה לו הרבה. ועוד: בביטוח חברה אחת קובעת את המחיר, ובאופציות המחיר נקבע בשוק."},{"id":"2.2-l1","type":"mcq","life":true,"prompt":"אותו רכב, אותו נהג. פוליסה אחת לשנה, ופוליסה שנייה לשנתיים. איזו יקרה יותר?","options":[{"text":"הפוליסה לשנתיים"},{"text":"הפוליסה לשנה"},{"text":"שתיהן באותו מחיר, כי זה אותו רכב"}],"correct":0,"explain":{"right":"יותר זמן = יותר הזדמנויות שמשהו יקרה. כך גם באופציה: עוד זמן עד הפקיעה מייקר גם Call וגם Put.","wrong":"לחברת הביטוח שנתיים הן יותר זמן שבו משהו יכול לקרות, ולכן היא גובה יותר. באופציות זה אותו דבר: יותר זמן, אופציה יקרה יותר."},"source":"דוגמה מהחיים"},{"id":"2.2-q1","type":"mcq","prompt":"המניה עולה ממחיר $100 למחיר $105, וכל השאר נשאר. מה קורה למחירים?","price":{"set":{"S":105},"hide":true},"options":[{"text":"Call עולה, Put יורד"},{"text":"Call יורד, Put עולה"},{"text":"שניהם עולים"},{"text":"שניהם יורדים"}],"correct":0,"explain":{"right":"Call הוא זכות לקנות במחיר $100, והיא שווה יותר כשהמניה עולה: היה {call}, עכשיו {call@S=105}. Put הוא זכות למכור במחיר $100, והיא שווה פחות: היה {put}, עכשיו {put@S=105}.","wrong":"עלייה במניה מקרבת את ה־Call לכסף ומרחיקה את ה־Put. ה־Call עולה: היה {call}, עכשיו {call@S=105}, וה־Put יורד: היה {put}, עכשיו {put@S=105}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11","tip":"נחשו לפני שאתם בודקים. המספרים יופיעו אחרי הבדיקה."},{"id":"2.2-q2","type":"mcq","prompt":"התנודתיות (IV) עולה מ־25% ל־40%. המניה לא זזה. מה קורה?","price":{"set":{"iv":0.4},"hide":true},"options":[{"text":"Call עולה, Put יורד"},{"text":"Call יורד, Put עולה"},{"text":"שניהם עולים"},{"text":"שניהם יורדים"}],"correct":2,"explain":{"right":"יותר תנודתיות = סיכוי גבוה יותר לתנועה גדולה. למחזיק זה טוב בשני המקרים, כי ההפסד שלו מוגבל לפרמיה. Call: היה {call}, עכשיו {call@iv=0.4}. Put: היה {put}, עכשיו {put@iv=0.4}.","wrong":"תנודתיות מייקרת את **שתי** האופציות. מחזיק Call מרוויח מתנועה חזקה למעלה, ומחזיק Put מתנועה חזקה למטה, וההפסד של שניהם מוגבל. Call: {call@iv=0.4}, Put: {put@iv=0.4}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.2-q3","type":"mcq","prompt":"עוברים 20 ימים: נשארו 10 ימים לפקיעה במקום 30. המניה לא זזה. מה קורה?","price":{"set":{"days":10},"hide":true},"options":[{"text":"Call עולה, Put יורד"},{"text":"Call יורד, Put עולה"},{"text":"שניהם עולים"},{"text":"שניהם יורדים"}],"correct":3,"explain":{"right":"פחות זמן = פחות ערך זמן. Call: היה {call}, עכשיו {call@days=10}. Put: היה {put}, עכשיו {put@days=10}.","wrong":"כשהזמן עובר וכל השאר לא משתנה, ערך הזמן של שתיהן נשחק. Call יורד למחיר {call@days=10}, Put למחיר {put@days=10}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.2-q4","type":"mcq","prompt":"במקום מימוש $100 בוחרים מימוש $105. המניה במחיר $100. מה ההבדל במחיר?","price":{"set":{"K":105},"hide":true},"options":[{"text":"Call יקר יותר, Put זול יותר"},{"text":"Call זול יותר, Put יקר יותר"},{"text":"שניהם יקרים יותר"},{"text":"שניהם זולים יותר"}],"correct":1,"explain":{"right":"Call במימוש גבוה יותר רחוק יותר מהכסף, ולכן זול יותר: {call@K=105} במקום {call}. Put במימוש גבוה יותר נותן זכות למכור ביוקר, ולכן יקר יותר: {put@K=105}.","wrong":"מימוש גבוה יותר: Call פחות שווה (צריך שהמניה תעלה יותר), Put שווה יותר (מוכרים במחיר גבוה יותר). Call: {call@K=105}, Put: {put@K=105}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.2-q5","type":"mcq","prompt":"הריבית עולה מ־4% ל־8%. מה קורה?","price":{"set":{"r":0.08},"hide":true},"options":[{"text":"Call עולה, Put יורד"},{"text":"Call יורד, Put עולה"},{"text":"שניהם עולים"},{"text":"שניהם יורדים"}],"correct":0,"explain":{"right":"ההשפעה קטנה: Call היה {call}, עכשיו {call@r=0.08}, Put היה {put}, עכשיו {put@r=0.08}. מי שקונה Call במקום מניות משלם את המימוש רק בעתיד, ובינתיים הכסף יכול להרוויח ריבית. לכן ריבית גבוהה מייקרת Call ומוזילה Put. ומחזיק Put מקבל את המימוש רק בעתיד, וזה שווה פחות כשהריבית גבוהה.","wrong":"ריבית גבוהה מייקרת מעט את ה־Call ומוזילה מעט את ה־Put: {call@r=0.08} וגם {put@r=0.08}. מי שמחזיק Call דוחה את התשלום על המניות, והכסף בינתיים מרוויח ריבית."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.2-q6","type":"mcq","prompt":"המניה מתחילה לחלק דיבידנד בשיעור של 3% בשנה. מה קורה?","price":{"set":{"q":0.03},"hide":true},"options":[{"text":"Call עולה, Put יורד"},{"text":"Call יורד, Put עולה"},{"text":"שניהם עולים"},{"text":"שניהם יורדים"}],"correct":1,"explain":{"right":"בתשלום דיבידנד מחיר המניה יורד בערך בגובה הדיבידנד, ומחזיק האופציה לא מקבל אותו. Call: {call@q=0.03} במקום {call}. Put: {put@q=0.03} במקום {put}.","wrong":"דיבידנד מוריד את מחיר המניה ביום האקס־דיבידנד, ומחזיק אופציה לא מקבל אותו. לכן Call נעשה זול יותר ({call@q=0.03}), ו־Put יקר יותר ({put@q=0.03})."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"}],"summary":["**מחיר מניה גבוה יותר**: Call יקר יותר, Put זול יותר.","**מימוש גבוה יותר**: Call זול יותר, Put יקר יותר.","**יותר זמן** ו**יותר תנודתיות**: שניהם יקרים יותר.","**ריבית גבוהה**: Call מעט יקר יותר, Put מעט זול יותר. **דיבידנד**: Call זול יותר, Put יקר יותר."],"ready":true,"unit":"2"},{"id":"2.3","title":"תנודתיות היסטורית מול משתמעת","minutes":6,"objective":"להבין שתנודתיות היסטורית מודדת את העבר, ושתנודתיות משתמעת (IV) היא המחיר שהשוק גובה היום על תנועה, ולא תחזית מובטחת.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"2.3-c1","type":"concept","title":"שתי תנודתיות, שתי שאלות","body":"**תנודתיות היסטורית (HV)** עונה על השאלה: כמה המניה **זזה** בתקופה האחרונה? מחשבים אותה מהמחירים בעבר, ומציגים אותה כאחוז שנתי.\n\n**תנודתיות משתמעת (IV)** עונה על שאלה אחרת: כמה תנועה **השוק מתמחר עכשיו**? אי אפשר למדוד אותה ישירות. לוקחים את מחיר האופציה בשוק, מכניסים למודל התמחור את כל שאר הגורמים, ומחפשים איזו תנודתיות נותנת בדיוק את המחיר הזה.\n\nגם IV מוצגת כאחוז שנתי, ולכן אפשר להשוות אותה ל־HV.\n\nבמילים אחרות: IV היא **המחיר** של האופציה, כתוב באחוזים. היא לא תחזית, ובטח לא הבטחה.","source":"Hull, Options, Futures, and Other Derivatives, פרק 15; Natenberg, Option Volatility and Pricing"},{"id":"2.3-a1","type":"analogy","title":"ביטוח דירה בעונת הוריקנים","body":"בעיר חוף, **הנתונים** מראים שבשנים האחרונות היו מעט סופות. זו התנודתיות ההיסטורית.\n\nאבל השנה החזאים מזהירים מעונה סוערת, ומחיר ביטוח הדירה **היום** קפץ. המחיר הזה משקף את מה שחברות הביטוח מצפות לו קדימה. זו התנודתיות המשתמעת.","breaks":"את מחיר הביטוח קובעת חברה. IV נקבעת בשוק, מקונים ומוכרים של אופציות. ועוד: גם השוק יכול לטעות. העונה יכולה להיות שקטה יותר או סוערת יותר ממה שתומחר, ואז מי ששילם ביוקר או מכר בזול מגלה את זה בדיעבד."},{"id":"2.3-l1","type":"mcq","life":true,"prompt":"בשנים האחרונות היו בעיר מעט סופות, אבל השנה מחיר ביטוח הדירה קפץ, כי צופים עונה סוערת. מה מחיר הביטוח הגבוה אומר?","options":[{"text":"שהשוק מצפה לסיכון גבוה קדימה. זה לא מבטיח שתהיה סופה"},{"text":"שבטוח תהיה סופה השנה"},{"text":"שבשנים האחרונות היו הרבה סופות"}],"correct":0,"explain":{"right":"המחיר משקף ציפייה, לא ודאות. גם IV גבוהה אומרת שהשוק מתמחר תנועה גדולה, לא שהיא בטוח תקרה.","wrong":"המחיר הגבוה מראה ציפייה קדימה, לא את העבר ולא ודאות. כך גם IV: מחיר על תנועה, לא הבטחה לתנועה."},"source":"דוגמה מהחיים"},{"id":"2.3-q1","type":"iv-find","tip":"הזיזו את המחוון עד ששני המחירים שווים.","prompt":"Call במימוש $100, המניה במחיר $100 ונשארו 30 ימים. בשוק הוא נסחר במחיר {call@iv=0.35}. איזו תנודתיות משתמעת מתאימה למחיר הזה?","target":{"type":"call","iv":0.35},"explain":{"right":"ב־IV של 35% המודל נותן בדיוק את מחיר השוק. זה כל מה ש־IV היא: התנודתיות **שמשתמעת** מהמחיר.","wrong":"התשובה היא 35%: רק בתנודתיות הזו המודל נותן {call@iv=0.35}. ככה מוצאים IV: מתחילים מהמחיר בשוק ומחפשים את התנודתיות שמסבירה אותו."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.3-q2","type":"iv-find","prompt":"עכשיו מניה אחרת, ABC: גם היא במחיר $100, ויש עליה Put במימוש $100 ל־30 ימים. ה־Put נסחר במחיר {put@iv=0.18}. מצאו את ה־IV שלו.","target":{"type":"put","iv":0.18},"explain":{"right":"18%. מחיר נמוך יותר = IV נמוכה יותר. בשוק של ABC מתמחרים פחות תנועה מאשר ב־XYZ.","wrong":"התשובה היא 18%. ככל שמחיר האופציה בשוק נמוך יותר, גם ה־IV שמשתמעת ממנו נמוכה יותר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.3-q3","type":"mcq","prompt":"ב־XYZ ה־HV של החודש האחרון היא 20%, וה־IV של האופציות שעל הכסף היא 35%. מה הכי נכון לומר?","options":[{"text":"השוק מתמחר תנועות גדולות יותר ממה שהמניה עשתה לאחרונה, למשל לקראת אירוע"},{"text":"בטוח שהמניה תזוז יותר בחודש הקרוב"},{"text":"מי שיקנה אופציות עכשיו בטוח ירוויח"},{"text":"יש טעות בנתונים: שתי התנודתיות חייבות להיות שוות"}],"correct":0,"explain":{"right":"HV מתארת את העבר, IV את מה שהשוק מוכן לשלם היום. הפער יכול לנבוע מאירוע צפוי, כמו דוח, והוא לא מבטיח כלום.","wrong":"HV ו־IV עונות על שאלות שונות, ולא חייבות להיות שוות. IV גבוהה אומרת שהשוק מתמחר תנועה גדולה, לא שהיא בטוחה, ולא שמי שקונה ירוויח."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"2.3-q4","type":"mcq","prompt":"קניתם Call (מניה $100, מימוש $100, 30 ימים) כשה־IV הייתה 40%. למחרת המניה לא זזה, אבל ה־IV ירדה ל־25%. מה קרה לשווי ה־Call?","options":[{"text":"ירד: היה {call@iv=0.4}, ועכשיו בערך {call@iv=0.25,days=29}"},{"text":"נשאר אותו דבר, כי המניה לא זזה"},{"text":"עלה, כי עבר עוד יום"}],"correct":0,"explain":{"right":"כשה־IV יורדת, המחיר של האופציה יורד, גם אם המניה במקום. זה קורה הרבה אחרי אירועים כמו דוחות, ונלמד על זה לעומק ביחידה 7 (IV Crush).","wrong":"שווי אופציה תלוי גם ב־IV. ירידה מ־40% ל־25% מוזילה את ה־Call, גם בלי שהמניה זזה, וגם יום שעבר מוריד קצת ערך זמן."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"2.3-q5","type":"mcq","prompt":"מה המשמעות של IV גבוהה במיוחד באופציות של מניה?","options":[{"text":"שהאופציות יקרות יחסית, כי השוק מתמחר תנועה גדולה"},{"text":"שהמניה תעלה"},{"text":"שהמניה תרד"},{"text":"שהאופציות זולות במיוחד"}],"correct":0,"explain":{"right":"IV לא אומרת לאן. היא אומרת כמה תנועה מתומחרת, ולכן כמה יקרות האופציות. ו\"יקר\" לא אומר \"יקר מדי\": ייתכן שהתנועה אכן תהיה גדולה.","wrong":"IV לא מצביעה על כיוון. גבוהה פירושה שהשוק מתמחר תנועה גדולה, לאיזה צד שלא יהיה, ולכן האופציות יקרות יחסית."},"source":"Natenberg, Option Volatility and Pricing"}],"summary":["**HV**: כמה המניה זזה בעבר.","**IV**: כמה תנועה השוק **מתמחר** עכשיו. מחשבים אותה ממחיר האופציה.","IV גבוהה = אופציות יקרות. היא **לא** מצביעה על כיוון ולא מבטיחה תנועה.","כש־IV יורדת, מחיר האופציה יורד, גם אם המניה לא זזה."],"ready":true,"unit":"2"},{"id":"2.4","title":"IV במספרים: סטיית התקן","minutes":6,"objective":"להבין ש־IV היא סטיית תקן שנתית, לתרגם אותה לטווח תנועה צפוי לכל תקופה, ולדעת מה הטווח הזה אומר ומה הוא לא אומר.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"2.4-c1","type":"concept","title":"מניה עם IV של 25%: מה זה אומר?","body":"ניקח דוגמה שתלווה אותנו בכל השיעור: מניה שנסחרת במחיר $100, וה־IV של האופציות עליה היא 25%.\n\nבשיעור הקודם ראינו ש־IV היא התנודתיות שהשוק מתמחר. אבל 25% של מה?\n\n**IV היא סטיית תקן שנתית** של תשואות המניה. סטיית תקן היא מדד לפיזור: כמה רחוקה התוצאה בדרך כלל מהממוצע.\n\n**בדוגמה שלנו:** IV של 25% אומרת, בקירוב, שהשוק מתמחר תנועה של כ־25% במחיר המניה על פני שנה, למעלה או למטה. 25% מתוך $100 הם {sd@days=365}, כלומר טווח של {sdlo@days=365} עד {sdhi@days=365} בעוד שנה. זו סטיית תקן אחת, לא גבול: מיד נראה מה זה אומר.\n\nהטווח סימטרי סביב המחיר של היום: IV אומרת **כמה** המניה צפויה לזוז, לא **לאן**.\n\n**בגרף למטה:** אותה מניה. הזיזו את ה־IV ואת הימים ותראו איך הטווח משתנה.","price":{"mode":"sd","sliders":["iv","days"],"daysMax":180,"from":true,"daysMin":7,"ivMax":50},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-c4","type":"concept","title":"כלל ה־16: מ־IV לתנועה יומית","body":"IV היא מספר שנתי, וקשה להרגיש מה זה \"25% בשנה\". לכן סוחרים מתרגמים אותה קודם כל לתנועה של **יום אחד**, בעזרת מספר אחד: **16**.\n\n**IV של 16% = סטיית תקן יומית של 1%.**\nכלומר השוק מתמחר שהמניה תזוז ביום בערך 1%, למעלה או למטה.\n\nומה זה אומר בפועל? לפי המודל:\nבערך בשני שלישים מהימים המניה תזוז **פחות** מ־1%, לאחד הכיוונים.\nבערך ביום אחד מכל שלושה היא תזוז **יותר** מ־1%.\n\n**לכל IV אחרת מחלקים ב־16:**\nIV של 32% היא סטיית תקן יומית של 2%.\nIV של 48% היא סטיית תקן יומית של 3%.\n\n**מאיפה 16?** בשנה יש בערך 252 ימי מסחר, והשורש של 252 הוא בערך 16. למה דווקא שורש? נראה בהמשך השיעור.","source":"Natenberg, Option Volatility and Pricing"},{"id":"2.4-q5","type":"mcq","prompt":"IV של מניה היא 32%. לפי כלל ה־16, מה סטיית התקן היומית שלה?","options":[{"text":"בערך {sdd@iv=0.32}, למעלה או למטה"},{"text":"בערך 32%, למעלה או למטה"},{"text":"בערך 1%, למעלה או למטה"},{"text":"בערך 0.13%, למעלה או למטה"}],"correct":0,"explain":{"right":"`32% ÷ 16 = 2%`. IV של 16% היא 1% ביום, ו־32% היא פי 2. לפי המודל, בשני שלישים מהימים המניה תזוז פחות מ־2%.","wrong":"IV היא שנתית. ליום מחלקים ב־16: `32% ÷ 16 = 2%`. 1% ביום מתאים ל־IV של 16%, ו־32% זו סטיית התקן לשנה שלמה. 0.13% יוצא אם מחלקים ב־252 בלי שורש."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"2.4-c2","type":"concept","title":"מ־IV שנתית לטווח של 30 ימים","body":"כלל ה־16 מתרגם IV ליום אחד. אבל האופציה שלכם פוקעת בעוד 30 ימים. אז כמה המניה צפויה לזוז ב־30 ימים?\n\nמתרגמים בשלושה צעדים. הדוגמה: מניה במחיר $100, IV 25%, 30 ימים.\n\n**צעד 1: איזה חלק מהשנה זה?**\n`30 ÷ 365 ≈ 0.082`\n\n**צעד 2: מוציאים שורש.**\n`√0.082 ≈ 0.287`\n\n**צעד 3: מכפילים ב־IV.**\n`25% × 0.287 ≈ {sdp}`\n\n**התוצאה:** סטיית התקן ל־30 ימים היא {sdp}. על מניה של $100 זה בערך {sd}, למעלה או למטה.\n\nכלומר השוק מתמחר טווח של סטיית תקן אחת: {sdlo} עד {sdhi} בחודש הקרוב.","source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-a1","type":"analogy","title":"תחזית זמן נסיעה","body":"אפליקציית הניווט אומרת: \"40 דקות, בדרך כלל בין 33 ל־47\". היא לא יודעת בדיוק מתי תגיעו, אבל היא נותנת **טווח רגיל**.\n\nIV עושה דבר דומה למחיר המניה: היא נותנת טווח שבו המחיר נמצא \"בדרך כלל\" בסוף התקופה.","breaks":"באפליקציה הטווח מבוסס על נתוני תנועה. ב־IV הוא נגזר ממחיר שהשוק משלם, ויכול להיות גבוה או נמוך מדי. ועוד: גם בכביש תאונה יכולה להוסיף שעה, הרבה מעבר לטווח. במניות דוח מפתיע יכול להזיז את המחיר הרבה מעבר לטווח, וזה קורה יותר ממה שהמודל הפשוט צופה."},{"id":"2.4-l1","type":"mcq","life":true,"prompt":"האפליקציה אומרת: \"40 דקות, בדרך כלל בין 33 ל־47\". מה הכי נכון לומר?","options":[{"text":"רוב הנסיעות יסתיימו בטווח הזה, אבל לפעמים תגיעו מוקדם או מאוחר יותר"},{"text":"תגיעו בדיוק אחרי 40 דקות"},{"text":"אין סיכוי שזה ייקח יותר מ־47 דקות"}],"correct":0,"explain":{"right":"טווח רגיל הוא לא הבטחה. כך גם סטיית תקן של מניה: רוב המקרים בתוכה, חלק מחוץ לה.","wrong":"הטווח מתאר את המקרה הרגיל, לא את כל המקרים. כך גם סטיית תקן: היא לא מבטיחה שהמחיר יישאר בפנים."},"source":"דוגמה מהחיים"},{"id":"2.4-c2b","type":"concept","title":"למה שורש?","body":"למה לא פשוט לחלק את ה־IV ב־12 כדי לקבל חודש?\n\nכי תנועות לא מצטברות בקו ישר. יום אחד המניה עולה, יום אחר היא יורדת, וחלק מהתנועות **מבטלות זו את זו**. לכן הטווח גדל לאט יותר מהזמן.\n\n**הכלל: פי 4 זמן נותן רק פי 2 טווח.**\n\nבאותה מניה (מחיר $100, IV 25%):\nב־30 ימים: סטיית תקן של בערך {sd}.\nב־120 ימים: בערך {sd@days=120}. פי 4 זמן, פי 2 טווח.\nבשנה שלמה: {sd@days=365}, כלומר 25%, בדיוק ה־IV.\n\nלכן אי אפשר פשוט לחלק את ה־IV ב־12. חייבים את השורש. זה גם המקור של כלל ה־16: ליום אחד מחלקים בשורש של 252 ימי המסחר, ולא ב־252.\n\n**שימו לב:** לתקופות של שבועות וחודשים סופרים ימים קלנדריים (365). כלל ה־16 סופר רק ימי מסחר (252). לכן ליום בודד משתמשים בכלל ה־16. לתקופות ארוכות יותר ההבדל בין שתי הדרכים קטן.","source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-q1","type":"mcq","prompt":"מניה במחיר $100, ה־IV של האופציות שלה 25%. מה סטיית התקן של המניה ל־30 ימים, בערך?","price":{"mode":"sd","hide":true},"options":[{"text":"±{sd}"},{"text":"±{sd@days=365}"},{"text":"±$2.05"},{"text":"±$12.50"}],"correct":0,"explain":{"right":"`25% × √(30 ÷ 365) ≈ {sdp}`, ועל מניה של $100 זה בערך {sd}.","wrong":"IV היא לשנה. לחודש מכפילים בשורש חלק השנה: `25% × √(30 ÷ 365) ≈ {sdp}`, כלומר בערך {sd}. הסכום {sd@days=365} מתאים לשנה שלמה, $2.05 יוצא אם מכפילים בחלק השנה בלי שורש, ו־12.5% הם סתם חצי מה־IV."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-q2","type":"mcq","prompt":"מניה נסחרת במחיר $100. בשרשרת האופציות, ליד אופציה שפוקעת בעוד 30 ימים, כתוב שה־IV היא 25%.\n\nלאיזו תקופה מתייחסים ה־25%?","options":[{"text":"לשנה שלמה"},{"text":"ל־30 הימים שנשארו עד הפקיעה"},{"text":"ליום מסחר אחד"}],"correct":0,"explain":{"right":"IV תמיד מצוטטת במונחים שנתיים, גם כשהאופציה פוקעת בעוד 30 ימים. 25% בשנה הם {sd@days=365} על מניה של $100. ל־30 ימים צריך לתרגם: בערך {sdp}, כלומר {sd}.","wrong":"IV תמיד מצוטטת במונחים שנתיים, בלי קשר למועד הפקיעה. 25% הם לשנה שלמה: {sd@days=365} על מניה של $100. ל־30 הימים שעד הפקיעה צריך לתרגם: בערך {sdp}, כלומר {sd}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-q3","type":"mcq","prompt":"מניה במחיר $100. התקופה: 30 ימים. ה־IV עלתה מ־25% ל־50%. מה קורה לסטיית התקן ל־30 הימים?","options":[{"text":"היא גדלה פי 2"},{"text":"היא גדלה בערך פי 1.4 (השורש של 2)"},{"text":"היא לא משתנה, כי התקופה לא השתנתה"},{"text":"היא קטנה פי 2"}],"correct":0,"explain":{"right":"IV כפולה, טווח כפול: בערך {sdp@iv=0.5} במקום {sdp}. השורש חל רק על הזמן, לא על ה־IV.","wrong":"סטיית התקן לתקופה פרופורציונית ל־IV. IV כפולה נותנת טווח כפול: בערך {sdp@iv=0.5} במקום {sdp}. השורש חל רק על הזמן, לא על ה־IV."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-c3","type":"concept","title":"סטיית תקן אחת, שתיים, ומה שמעבר","body":"כבר ראינו בכלל ה־16 את \"שני השלישים\". זה נכון לכל תקופה: סטיית תקן היא לא גבול, היא אומרת באיזה חלק מהמקרים המחיר נשאר בתוך הטווח.\n\n**לפי המודל:**\nבטווח של סטיית תקן **אחת**: בערך שני שלישים מהמקרים (כ־68%).\nבטווח של **שתיים**: בערך 95% מהמקרים.\n\nכלומר גם לפי המודל, בערך פעם אחת מכל שלוש המחיר יוצא מטווח של סטיית תקן אחת. זה לא אירוע חריג.\n\n**ובמציאות?** תנועות קיצוניות קורות יותר ממה שהמודל צופה. לזה קוראים \"זנבות שמנים\" (Fat Tails). דוח מפתיע יכול להזיז מניה כמה סטיות תקן ביום אחד.\n\nלכן הטווח הוא קנה מידה, לא גדר.","source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-q4","type":"mcq","prompt":"מניה נסחרת במחיר $100, וה־IV שלה 25%. סטיית תקן אחת ל־30 ימים היא בערך {sd}, כלומר טווח של {sdlo} עד {sdhi}.\n\nלפי המודל, מה הסיכוי שבעוד 30 ימים המניה תהיה בתוך הטווח הזה?","options":[{"text":"בערך שני שלישים (כ־68%)"},{"text":"כמעט ודאי (כ־99%)"},{"text":"בערך חצי (כ־50%)"},{"text":"בערך 95%"}],"correct":0,"explain":{"right":"לפי המודל, בכשני שלישים מהמקרים המחיר נשאר בטווח של סטיית תקן אחת. בשליש הנותר הוא יוצא ממנו, למעלה או למטה.","wrong":"לפי המודל, בכשני שלישים מהמקרים (כ־68%) המחיר נשאר בטווח של סטיית תקן אחת. רק טווח של שתי סטיות תקן מכסה כ־95%."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 15"},{"id":"2.4-q6","type":"mcq","prompt":"ה־IV של מניה היא 25%. ביום אחד המניה זזה 8%. מה הכי נכון לומר?","options":[{"text":"נדיר מאוד לפי המודל, אבל במציאות זה קורה"},{"text":"זה בלתי אפשרי כש־IV היא 25%"},{"text":"זו תנועה רגילה, בתוך סטיית תקן יומית אחת"},{"text":"זה מוכיח שה־IV הייתה שגויה"}],"correct":0,"explain":{"right":"סטיית התקן היומית כאן היא בערך `25% ÷ 16 ≈ 1.6%`, אז 8% זה בערך 5 סטיות תקן. במודל כמעט בלתי אפשרי, במציאות זה קורה, למשל אחרי דוח. לכן כותבי אופציות מתייחסים לזנבות ברצינות.","wrong":"IV לא מגבילה את התנועה. היא קנה מידה. 8% ביום זה בערך 5 סטיות תקן יומיות: נדיר לפי המודל, אבל קורה במציאות. זה לא אומר להתעלם מ־IV, אלא לזכור שהזנבות שמנים."},"source":"Natenberg, Option Volatility and Pricing"}],"summary":["**IV היא סטיית תקן שנתית** של תשואות המניה, כפי שהשוק מתמחר אותה.","כלל ה־16: **IV של 16% היא סטיית תקן יומית של 1%**, למעלה או למטה. לכל IV אחרת מחלקים ב־16. (לפי 252 ימי מסחר)","לתקופה: **IV כפול השורש של (ימים חלקי 365)**. לחודש (30 ימים), IV של 25% נותנת סטיית תקן של כ־{sdp}.","במודל: כשני שלישים מהמקרים בטווח של סטיית תקן אחת, כ־95% בשתיים. במציאות הזנבות **שמנים** יותר."],"ready":true,"unit":"2"},{"id":"2.5","title":"ערך זמן ודעיכה","minutes":5,"objective":"להבין שדעיכת ערך הזמן אינה ליניארית: באופציה שעל הכסף היא מואצת לקראת הפקיעה, ובאופציה רחוקה מהכסף רוב הערך נעלם מוקדם יותר.","priceSet":{"S":100,"K":100,"days":60,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"2.5-c1","type":"concept","title":"הזמן לא נשחק בקצב קבוע","body":"ערך הזמן של אופציה נשחק ככל שהפקיעה מתקרבת, ומגיע לאפס ביום הפקיעה. אבל הקצב **לא קבוע**.\n\nכאן: Call במימוש $100, המניה במחיר $100, ונשארו 60 ימים. **הזיזו את מחוון הימים** לאט לכיוון 0, ושימו לב מתי השווי יורד הכי מהר.\n\nלקצב הזה קוראים **דעיכת זמן (Time Decay)**. ביחידה 3 נמדוד אותו במספר, Theta.","price":{"sliders":["days"],"show":["call"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.5-q1","type":"mcq","prompt":"Call על הכסף: מניה $100, מימוש $100, IV 25%, 60 ימים לפקיעה. הוא שווה {callx} לחוזה. באיזו תקופה של 10 ימים הוא מאבד יותר ערך, אם המניה לא זזה?","options":[{"text":"ב־10 הימים האחרונים: {diffx:call@days=10|days=0} לחוזה"},{"text":"ב־10 הימים הראשונים, מ־60 עד 50: {diffx:call@days=60|days=50} לחוזה"},{"text":"אותו סכום בכל תקופה של 10 ימים"}],"correct":0,"explain":{"right":"באופציה שעל הכסף הדעיכה מואצת לקראת הסוף: בין 60 ל־50 ימים היא מאבדת {diffx:call@days=60|days=50}, ובעשרת הימים האחרונים {diffx:call@days=10|days=0}.","wrong":"הדעיכה לא ליניארית. ב־Call על הכסף, 10 הימים האחרונים עולים {diffx:call@days=10|days=0} לחוזה, הרבה יותר מאשר {diffx:call@days=60|days=50} בהתחלה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"2.5-q2","type":"mcq","prompt":"למה Call על הכסף מאבד ערך הכי מהר דווקא בימים האחרונים?","options":[{"text":"כל ערכו הוא ערך זמן, ובימים האחרונים כמעט לא נשאר זמן לתנועה משמעותית"},{"text":"כי בסוף החודש הברוקר גובה עמלה"},{"text":"כי בימים האחרונים התנודתיות תמיד יורדת"}],"correct":0,"explain":{"right":"על הכסף אין ערך פנימי. כל השווי הוא הסיכוי לתנועה, וככל שנשאר פחות זמן, הסיכוי הזה מתכווץ מהר.","wrong":"אין כאן עמלה, והתנודתיות במחשבון קבועה. הסיבה: באופציה שעל הכסף כל השווי הוא ערך זמן, וכשנשארים ימים ספורים, הסיכוי לתנועה משמעותית מתכווץ מהר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"2.5-c2","type":"concept","title":"תלוי איפה האופציה עומדת","body":"הקצב של הדעיכה תלוי במרחק מהמימוש:\n\n**על הכסף**: כל השווי הוא ערך זמן, והדעיכה מואצת לקראת הסוף.\n**רחוק מהכסף**: השווי קטן מההתחלה, ורובו נעלם מוקדם, כשהסיכוי להגיע למימוש מתכווץ.\n**עמוק בתוך הכסף**: רוב השווי הוא ערך פנימי, שלא נשחק עם הזמן. ערך הזמן קטן, וגם הדעיכה.","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"2.5-q3","type":"mcq","tip":"אפשר לבדוק במחוון: הוא מוגדר כאן למימוש $110.","prompt":"עכשיו Call **מחוץ לכסף**: מימוש $110, המניה במחיר $100, IV 25%, 60 ימים לפקיעה. הוא שווה {callx@K=110} לחוזה. באיזו תקופה הוא מאבד יותר ערך?","price":{"sliders":["days"],"show":["call"],"set":{"K":110},"from":true},"options":[{"text":"ב־10 הימים הראשונים, מ־60 עד 50: {diffx:call@K=110,days=60|K=110,days=50} לחוזה"},{"text":"ב־10 הימים האחרונים: {diffx:call@K=110,days=10|K=110,days=0} לחוזה"},{"text":"אותו סכום בכל תקופה"}],"correct":0,"explain":{"right":"באופציה רחוקה מהכסף, **בדולרים**, רוב הערך נעלם מוקדם. באחוזים התמונה אחרת: ב־10 הימים האחרונים נמחק כמעט כל מה שנשאר.","wrong":"אצל אופציה רחוקה מהכסף התמונה הפוכה: בתחילה היא מאבדת {diffx:call@K=110,days=60|K=110,days=50}, ובסוף רק {diffx:call@K=110,days=10|K=110,days=0}, כי כבר אין הרבה ערך."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"2.5-q4","type":"mcq","prompt":"Call במימוש $100, המניה במחיר $115, IV 25%, ונשארו 60 ימים. מחיר האופציה {call@S=115}. כמה מזה הוא ערך זמן?","options":[{"text":"בערך {tvc@S=115} לאופציה. רוב השווי הוא ערך פנימי"},{"text":"כל {call@S=115}"},{"text":"אפס, כי היא בתוך הכסף"}],"correct":0,"explain":{"right":"הערך הפנימי הוא $15. השאר, {tvc@S=115}, הוא ערך זמן. באופציה עמוק בתוך הכסף ערך הזמן קטן, ולכן גם הדעיכה בה קטנה. חלק ממנו בכלל נובע מהריבית, ולא מהסיכוי לתנועה.","wrong":"ערך פנימי: `$115 − $100 = $15`. מה שמעבר לזה, {tvc@S=115}, הוא ערך הזמן. הוא קיים, אבל קטן."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.5-q5","type":"mcq","prompt":"מי \"מרוויח\" מדעיכת הזמן כשהמניה לא זזה?","options":[{"text":"הכותב: האופציה שהוא חייב בה שווה פחות. אבל הוא נושא את הסיכון שהמניה תזוז חזק"},{"text":"המחזיק, כי האופציה מתבגרת"},{"text":"אף אחד. דעיכה רק מוחקת כסף"},{"text":"הכותב, וזה רווח בטוח בלי סיכון"}],"correct":0,"explain":{"right":"מה שהמחזיק מאבד בערך זמן, הכותב מרוויח, כל עוד המניה לא זזה מספיק. זה לא כסף חינם: הכותב מקבל אותו בתמורה לסיכון. ביחידה 3 נראה את זה עם Theta ו־Gamma.","wrong":"ירידת ערך הזמן היא הפסד למחזיק ורווח לכותב. אבל לא בטוח: תנועה חזקה של המניה יכולה למחוק את כל הדעיכה ויותר. זו התמורה על הסיכון."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["ערך הזמן נשחק עד אפס בפקיעה, אבל **לא בקצב קבוע**.","באופציה **על הכסף** הדעיכה **מואצת** לקראת הסוף.","באופציה **רחוקה מהכסף** רוב הערך, בדולרים, נעלם **מוקדם**. באופציה **עמוק בתוך הכסף** יש מעט ערך זמן.","הדעיכה עוברת מהמחזיק לכותב, בתמורה לסיכון. היא לא כסף חינם."],"ready":true,"unit":"2"},{"id":"2.6","title":"הקשר בין Put ל־Call","minutes":5,"objective":"להבין באופן אינטואיטיבי למה Call, Put ומניה קשורים במחיר: Long Call ועוד Short Put באותו מימוש מתנהגים כמו החזקת המניה.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"combo":{"legs":[{"type":"call","side":"long"},{"type":"put","side":"short"}],"name":"Long Call + Short Put","desc":"קונים Call וכותבים Put, שניהם במימוש $100"},"items":[{"id":"2.6-c1","type":"concept","title":"שתי אופציות שמתנהגות כמו מניה","body":"קונים Call במימוש $100, וכותבים Put במימוש $100, באותה פקיעה. מה קורה בפקיעה?\n\nאם המניה **מעל** $100: ה־Call שווה את ההפרש, וה־Put פוקע. מרוויחים כל דולר שהמניה עלתה.\nאם המניה **מתחת** למימוש, $100: ה־Call פוקע, ובגלל ה־Put חייבים לקנות במחיר $100. מפסידים כל דולר שהמניה ירדה.\n\nבשני המקרים, זה כמו להחזיק 100 מניות שנקנו במחיר $100 (ההבדל הקטן, הריבית, בשאלה 2). לכן המחירים של Call, Put ומניה **קשורים זה לזה**, וזה נקרא **Put-Call Parity**.","source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.6-q1","type":"chart-mcq","start":110,"prompt":"זה הגרף בפקיעה של Long Call ועוד Short Put, שניהם במימוש $100. למה הוא דומה?","hint":"הזיזו את המחוון לשני הצדדים של $100.","options":[{"text":"להחזקה של 100 מניות: קו ישר, רווח למעלה והפסד למטה"},{"text":"ל־Long Call: הפסד מוגבל, רווח בלי תקרה"},{"text":"ל־Short Put: רווח מוגבל, והפסד גדול רק בירידה"}],"correct":0,"explain":{"right":"הקו ישר לאורך כל הדרך, בלי \"שבר\" במימוש. כך נראית מניה: כל דולר למעלה הוא רווח, כל דולר למטה הוא הפסד.","wrong":"שימו לב שאין רצפה: מתחת ל־100 ה־Put הכתוב מפסיד עוד ועוד. והקו לא נשבר במימוש. זה הגרף של החזקת מניה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.6-q2","type":"mcq","prompt":"Call ו־Put במימוש $100, המניה במחיר $100, 30 ימים לפקיעה, IV 25%, ריבית 4% בשנה. ה־Call שווה {call} לאופציה וה־Put שווה {put}. למה ה־Call קצת יקר יותר, למרות ששניהם בדיוק על הכסף?","options":[{"text":"בגלל הריבית: עם Call משלמים את מחיר המימוש רק בעתיד, ובינתיים הכסף מרוויח ריבית"},{"text":"כי Call תמיד יקר יותר מ־Put"},{"text":"כי השוק מצפה שהמניה תעלה"},{"text":"טעות במחשבון"}],"correct":0,"explain":{"right":"ההפרש, {cmp}, שווה בערך לריבית על $100 לחודש. בלי ריבית ובלי דיבידנד, Call ו־Put על הכסף היו שווים בדיוק.","wrong":"ההפרש לא נובע מציפייה לכיוון. הוא נובע מהריבית: מי שמחזיק Call במקום מניה דוחה את התשלום, והדחייה הזו שווה ריבית. כאן {cmp}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.6-q3","type":"mcq","prompt":"מה הקשר בין Put ל־Call עוזר לבדוק?","options":[{"text":"אם המחירים של Call, Put ומניה עקביים זה עם זה"},{"text":"לאן המניה תלך"},{"text":"איזו אופציה תרוויח יותר"}],"correct":0,"explain":{"right":"אם הקשר נשבר, אפשר לקנות את הזול מבין השניים, המניה או ה\"מניה\" מאופציות, ולמכור את היקר, ולהרוויח בלי סיכון (ארביטראז'). סוחרים מקצועיים עושים את זה מהר, ולכן בשוק נזיל הקשר נשמר, בגבולות המרווח והעלויות.","wrong":"הקשר לא אומר כלום על כיוון. הוא קובע שמחירי ה־Call, ה־Put והמניה חייבים להתאים זה לזה. אחרת יש הזדמנות לרווח בלי סיכון (ארביטראז'), שסוחרים מקצועיים סוגרים מהר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.6-c2","type":"concept","title":"בקירוב, לא בדיוק","body":"באופציות על מניות בארה\"ב, שהן אמריקאיות, הקשר בין Put ל־Call מתקיים **בקירוב**, לא בדיוק.\n\nוה\"מניה\" הסינתטית לא זהה למניה אמיתית: אין לה דיבידנד, יש לה פקיעה, וה־Put הכתוב דורש ביטחונות ויכול לקבל הקצאה מוקדמת. על הקצאה נלמד ביחידה 6.","source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.6-q4","type":"mcq","prompt":"המניה מתחילה לחלק דיבידנד. לפי מה שלמדתם בשיעור 2.2, מה קורה להפרש בין ה־Call ל־Put על הכסף?","options":[{"text":"הוא קטן: ה־Put מתייקר יחסית ל־Call"},{"text":"הוא גדל: ה־Call נעשה יקר יחסית"},{"text":"הוא לא משתנה"}],"correct":0,"explain":{"right":"דיבידנד מוזיל Call ומייקר Put. עם דיבידנד של 3% בשנה, ההפרש יורד: היה {cmp}, ועכשיו {cmp@q=0.03}.","wrong":"דיבידנד הולך למחזיק המניה, לא למחזיק ה־Call. לכן Call מוזל ו־Put מתייקר, וההפרש יורד: היה {cmp}, ועכשיו {cmp@q=0.03}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"2.6-q5","type":"mcq","prompt":"Long Call ועוד Short Put במימוש $100. המניה צונחת למחיר $70 בפקיעה. מה המצב?","options":[{"text":"הפסד גדול, כמו של מי שמחזיק את המניה: חייבים לקנות 100 מניות במחיר $100"},{"text":"ההפסד מוגבל לפרמיה של ה־Call"},{"text":"אין הפסד, כי שתי האופציות מגינות זו על זו"}],"correct":0,"explain":{"right":"ה־Short Put מחייב לקנות במחיר $100 מניה ששווה $70. זו לא הגנה, זו חשיפה מלאה, בדיוק כמו להחזיק את המניה.","wrong":"הצירוף הזה מתנהג כמו מניה, גם בירידה. ה־Put הכתוב מחייב לקנות 100 מניות במחיר $100, כשהן שוות $70."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"}],"summary":["**Long Call + Short Put** באותו מימוש ופקיעה מתנהגים כמו **החזקת מניה**.","לכן המחירים של Call, Put ומניה **קשורים**: Put-Call Parity.","על הכסף, ה־Call מעט יקר יותר בגלל **הריבית**. **דיבידנד** מקטין את ההפרש.","הקשר לא אומר כלום על **כיוון** המניה."],"ready":true,"unit":"2"},{"id":"2.7","title":"מרווח קנייה־מכירה ונזילות","minutes":5,"objective":"להכיר Bid ו־Ask, לחשב את העלות של כניסה ויציאה מיידיות, ולזהות אופציה לא נזילה לפי המרווח.","items":[{"id":"2.7-c1","type":"concept","title":"שני מחירים, לא אחד","body":"עד עכשיו דיברנו על \"המחיר\" של אופציה. בשוק יש בכל רגע **שני** מחירים:\n\n**Bid**: המחיר הגבוה ביותר שמישהו מוכן **לשלם** עכשיו. מי שמוכר מיד מקבל אותו.\n**Ask**: המחיר הנמוך ביותר שמישהו מוכן **למכור** בו עכשיו. מי שקונה מיד משלם אותו.\n\nההפרש ביניהם נקרא **מרווח (Bid-Ask Spread)**. את המחירים מציגים בעיקר **עושי שוק (Market Makers)**, והמרווח הוא התמורה שלהם על הסיכון שהם לוקחים כשהם מוכנים לקנות ולמכור בכל רגע.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"2.7-a1","type":"analogy","title":"דלפק המרה בשדה התעופה","body":"על הדלפק כתוב: **אנחנו קונים יורו: $1.05. אנחנו מוכרים יורו: $1.12.**\n\nרוצים לקנות יורו עכשיו? תשלמו את המחיר הגבוה, $1.12. רוצים למכור? תקבלו את הנמוך, $1.05. ההפרש הוא הרווח של הדלפק.\n\nבאופציות זה אותו דבר. **Ask** הוא המחיר שבו אפשר **לקנות** מיד. **Bid** הוא המחיר שבו אפשר **למכור** מיד. וההפרש ביניהם נקרא **מרווח (Bid-Ask Spread)**.","breaks":"בדלפק גורם אחד קובע את שני המחירים. באופציות, ה־Bid וה־Ask הם ההצעות הטובות ביותר מכל המשתתפים בשוק, בעיקר עושי שוק (Market Makers), והם זזים כל הזמן יחד עם מחיר המניה. ועוד הבדל: Bid ו־Ask תקפים רק לכמות שמוצגת לידם. בפקודה גדולה יותר, חלק יכול להתבצע במחיר גרוע יותר. ובניגוד לדלפק, אפשר להציע מחיר משלכם באמצע, בפקודה מוגבלת (Limit), אבל אז לא בטוח שהעסקה תתבצע. על זה בשיעור 6.3."},{"id":"2.7-l1","type":"mcq","life":true,"prompt":"בדלפק המרה בשדה התעופה בניו יורק כתוב: קונים יורו $1.05, מוכרים יורו $1.12. נשארו לכם יורו מהטיול, ואתם רוצים להמיר אותם לדולרים לפני הטיסה. כמה תקבלו על כל יורו?","options":[{"text":"$1.05"},{"text":"$1.12"},{"text":"$1.085, האמצע"},{"text":"כמה שאבקש"}],"correct":0,"explain":{"right":"אתם **מוכרים** יורו, אז מקבלים את המחיר הנמוך, $1.05. באופציות זה ה־**Bid**: מוכרים מיד, מקבלים Bid.","wrong":"אתם **מוכרים** יורו לדלפק, והוא קונה מכם במחיר הנמוך, $1.05. כך גם באופציות: מי שמוכר מיד מקבל את ה־**Bid**, ומי שקונה מיד משלם את ה־**Ask**."},"source":"דוגמה מהחיים"},{"id":"2.7-q1","type":"mcq","fmt":"usd","prompt":"אופציה מצוטטת Bid $1.80, Ask $2.40. קונים חוזה אחד מיד, ומיד מתחרטים ומוכרים. המחירים לא זזו. כמה הפסדתם, לפני עמלות?","options":[{"v":60},{"v":0},{"v":6},{"v":240}],"correct":0,"check":{"fn":"roundTrip","args":{"bid":1.8,"ask":2.4,"mult":100}},"explain":{"right":"קניתם במחיר $2.40 ומכרתם במחיר $1.80: `($2.40 − $1.80) × 100 = $60`. זו העלות של המרווח.","wrong":"קונים מיד ב־Ask ומוכרים מיד ב־Bid. ההפרש לאופציה $0.60, ולחוזה `$0.60 × 100 = $60`, גם בלי שום תנועה במחיר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"2.7-q2","type":"mcq","fmt":"pct","prompt":"באותה אופציה (Bid $1.80, Ask $2.40), כמה אחוז מהמחיר האמצעי, $2.10, הוא המרווח?","options":[{"v":29},{"v":3},{"v":60},{"v":14}],"correct":0,"check":{"fn":"spreadPct","args":{"bid":1.8,"ask":2.4}},"explain":{"right":"`$0.60 ÷ $2.10 ≈ 29%`. כדי רק לחזור לנקודת ההתחלה, האופציה צריכה להתייקר בכמעט שליש.","wrong":"מרווח $0.60 מתוך מחיר אמצעי של $2.10: `$0.60 ÷ $2.10 ≈ 29%`. זה מרווח רחב מאוד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"2.7-c2","type":"concept","title":"נזילות","body":"**אופציה נזילה** היא אופציה שנסחרים בה הרבה, ויש בה הרבה קונים ומוכרים. בדרך כלל המרווח בה צר, ואפשר להיכנס ולצאת בלי לשלם הרבה על המעבר.\n\n**אופציה לא נזילה**: מעט מסחר ומרווח רחב. כל כניסה ויציאה עולות הרבה, וקשה לדעת מה המחיר ה\"אמיתי\".\n\nמה שקובע הוא המרווח **ביחס למחיר**. מרווח של $0.05 זניח באופציה של $5, ומשמעותי מאוד באופציה של $0.20.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"2.7-q3","type":"mcq","prompt":"שתי אופציות. א: Bid $2.20, Ask $2.25. ב: Bid $1.80, Ask $2.40. איזו נזילה יותר, כנראה?","options":[{"text":"א, כי המרווח שלה צר מאוד ביחס למחיר"},{"text":"ב, כי המחיר שלה זול יותר"},{"text":"אי אפשר לדעת בלי לדעת לאן המניה תלך"}],"correct":0,"explain":{"right":"באופציה א המרווח $0.05, על מחיר של בערך $2.20, ובכניסה ויציאה מיידיות זה $5 לחוזה. באופציה ב זה $60 לחוזה.","wrong":"נזילות נמדדת במרווח ביחס למחיר, לא במחיר עצמו. באופציה א: $0.05 בלבד. באופציה ב: $0.60, פי 12."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"2.7-q4","type":"mcq","fmt":"usd","prompt":"אופציה מצוטטת Bid $0.15, Ask $0.25. כמה עולה כניסה ויציאה מיידיות של חוזה אחד?","options":[{"v":10},{"v":25},{"v":0},{"v":1}],"correct":0,"check":{"fn":"roundTrip","args":{"bid":0.15,"ask":0.25,"mult":100}},"explain":{"right":"`($0.25 − $0.15) × 100 = $10`. נשמע מעט, אבל זה 50% מהמחיר האמצעי, $0.20. באופציות זולות המרווח \"אוכל\" חלק גדול מההשקעה.","wrong":"`($0.25 − $0.15) × 100 = $10` לחוזה. ביחס למחיר האמצעי, $0.20, זה חצי מהשווי."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"2.7-q5","type":"mcq","prompt":"מה מהבאים הוא סימן לאופציה **לא** נזילה?","options":[{"text":"מרווח רחב ביחס למחיר, ומעט מסחר"},{"text":"האופציה היא Put ולא Call"},{"text":"המניה עלתה היום ב־2%"},{"text":"מימוש עגול, כמו $100"}],"correct":0,"explain":{"right":"המרווח והיקף המסחר הם הסימנים העיקריים. בשיעור 6.1 נראה איפה רואים אותם במסך הברוקר.","wrong":"סוג האופציה או תנועה של המניה ביום אחד לא אומרים כלום על נזילות. הסימנים: מרווח רחב ביחס למחיר, ומעט מסחר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["בכל רגע יש **שני מחירים**: **Bid** (למוכרים מיד) ו־**Ask** (לקונים מיד).","**המרווח** ביניהם הוא עלות אמיתית: כניסה ויציאה מיידיות עולות אותו.","מה שחשוב הוא המרווח **ביחס למחיר**. באופציות זולות הוא יכול להיות עשרות אחוזים.","**אופציה נזילה**: מרווח צר והרבה מסחר."],"ready":true,"unit":"2"},{"id":"3.1","title":"דלתא (Delta)","minutes":6,"objective":"להבין מה דלתא מודדת, להעריך בעזרתה שינוי במחיר אופציה כשהמניה זזה, ולתרגם אותה למספר מניות שקול.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"3.1-c1","type":"concept","title":"כמה האופציה זזה כשהמניה זזה","body":"**דלתא (Delta)** אומרת בערך בכמה ישתנה מחיר האופציה כשהמניה זזה בדולר אחד.\n\nב־**Call** הדלתא בין 0 ל־1: כשהמניה עולה, ה־Call עולה.\nב־**Put** היא בין 0 למינוס 1: כשהמניה עולה, ה־Put יורד.\n\nאופציה על הכסף: בערך 0.5, או מינוס 0.5 ב־Put. עמוק בתוך הכסף: קרוב ל־1 (ב־Put: קרוב למינוס 1). רחוק מחוץ לכסף: קרוב ל־0.\n\n**הזיזו את מחיר המניה** ותראו איך הדלתא משתנה.","price":{"sliders":["S"],"greeks":["delta"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.1-a1","type":"analogy","title":"שותף בחלק מהדירה","body":"נניח שאתם שותפים ב־50% מדירה. אם הדירה מתייקרת בסכום של $10,000, החלק שלכם עולה בסכום של $5,000.\n\nדלתא היא החלק שלכם בתנועה של המניה. Call עם דלתא 0.5 מתנהג, ברגע הזה, כמו חצי מניה.","breaks":"בדירה החלק שלכם קבוע. באופציה החלק משתנה כל הזמן: ב־Call הוא גדל כשהמניה עולה וקטן כשהיא יורדת, וגם הזמן והתנודתיות משנים אותו. לכן דלתא היא תמונה של הרגע, לא חוזה קבוע."},{"id":"3.1-l1","type":"mcq","life":true,"prompt":"אתם שותפים ב־30% מדירה. הדירה מתייקרת בסכום של $20,000. בכמה עולה החלק שלכם?","options":[{"text":"$6,000"},{"text":"$20,000"},{"text":"$3,000"}],"correct":0,"explain":{"right":"30% מתוך $20,000. כך משתמשים בדלתא: דלתא 0.3 × תנועה של $1 במניה = בערך $0.30 באופציה.","wrong":"החלק שלכם הוא 30%: `$20,000 × 0.3 = $6,000`. באותו אופן, דלתא 0.3 אומרת שהאופציה זזה בערך 30 סנט לכל דולר במניה."},"source":"דוגמה מהחיים"},{"id":"3.1-q1","type":"mcq","prompt":"Call על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%). הוא שווה {call} לאופציה, והדלתא שלו {d:call}. המניה עולה בדולר אחד. בערך בכמה עולה המחיר של ה־Call, לאופציה?","price":{"greeks":["delta"],"show":["call"]},"options":[{"text":"בערך {dS:call@dS=1}"},{"text":"$1.00"},{"text":"בערך $0.05"},{"text":"הוא לא זז"}],"correct":0,"explain":{"right":"דלתא × תנועת המניה: `{d:call} × $1 ≈ {dS:call@dS=1}`. בדיקה במודל: {call@S=101} במקום {call}.","wrong":"דלתא {d:call} אומרת שעל כל $1 במניה ה־Call זז בערך {dS:call@dS=1}. רק אופציה עמוק בתוך הכסף זזה כמעט דולר לדולר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.1-q2","type":"mcq","prompt":"Put על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%), דלתא {d:put}. המניה עולה בשני דולרים. מה קורה לחוזה אחד, בערך?","options":[{"text":"שינוי של {dSx:put@dS=2} לחוזה: ה־Put יורד"},{"text":"שינוי של {dSx:call@dS=2} לחוזה: ה־Put עולה"},{"text":"ה־Put לא זז, כי הוא Put"}],"correct":0,"explain":{"right":"דלתא שלילית: המניה עולה, ה־Put יורד. `{d:put} × $2 × 100`, כלומר בערך {dSx:put@dS=2}.","wrong":"ב־Put הדלתא שלילית, ולכן עלייה במניה מורידה את ה־Put: בערך {dSx:put@dS=2} לחוזה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.1-q3","type":"mcq","prompt":"יש לכם 5 חוזי Call עם דלתא {d:call}. לכמה מניות שקולה הפוזיציה, ברגע הזה?","options":[{"text":"בערך {sh:call@n=5} מניות"},{"text":"500 מניות"},{"text":"5 מניות"},{"text":"בערך 3 מניות"}],"correct":0,"explain":{"right":"`5 × 100 × {d:call}`, בערך {sh:call@n=5}. כלומר, לתנועה קטנה במניה, הפוזיציה מתנהגת בערך כמו {sh:call@n=5} מניות.","wrong":"כל חוזה הוא 100 מניות, וכל מניה \"שווה\" דלתא: `5 × 100 × {d:call}`, בערך {sh:call@n=5} מניות. לא 500, כי האופציה לא זזה דולר לדולר."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"3.1-q4","type":"mcq","prompt":"המניה במחיר $115, וה־Call במימוש $100. הדלתא שלו קרובה ל:","price":{"greeks":["delta"],"show":["call"],"set":{"S":115},"from":true,"hide":true},"options":[{"text":"קרוב ל־1: זז כמעט כמו המניה"},{"text":"בערך 0.5: חצי מתנועת המניה"},{"text":"קרוב ל־0: כמעט לא זז"}],"correct":0,"explain":{"right":"עמוק בתוך הכסף הדלתא {d:call@S=115}: האופציה מתנהגת כמעט כמו מניה.","wrong":"ב־Call עמוק בתוך הכסף הדלתא קרובה ל־1 ({d:call@S=115}). 0.5 זה על הכסף, ו־0 רחוק מחוץ לכסף."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.1-q5","type":"mcq","prompt":"Call על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%), שווה {callx} לחוזה, דלתא {d:call}. המניה קופצת מיד בעשרה דולרים, למחיר $110. לפי דלתא בלבד, ה־Call אמור לעלות {dSx:call@dS=10} לחוזה. במודל המלא הוא שווה עכשיו {callx@S=110}, כלומר עלה {diffx:call@S=110|S=100}. למה ההערכה לפי הדלתא קטנה מדי?","options":[{"text":"כי הדלתא עצמה גדלה בדרך למעלה, וההערכה מניחה שהיא קבועה"},{"text":"כי המודל טועה"},{"text":"כי עברו ימים בדרך"}],"correct":0,"explain":{"right":"דלתא טובה לתנועות קטנות. בתנועה גדולה היא משתנה בדרך, במחיר $110 היא כבר {d:call@S=110}. את הקצב שבו היא משתנה מודד הגמא, בשיעור הבא.","wrong":"שום זמן לא עבר בחישוב. ההבדל נובע מכך שהדלתא לא קבועה: ככל שהמניה עולה, היא גדלה, עד {d:call@S=110} במחיר $110. על זה בשיעור הבא, גמא."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["**דלתא**: בכמה האופציה זזה כשהמניה זזה בדולר אחד.","**Call**: בין 0 ל־1. **Put**: בין 0 למינוס 1. על הכסף בערך חצי.","דלתא × 100 × מספר החוזים = **מספר המניות השקול** של הפוזיציה.","דלתא טובה לתנועות **קטנות**. בתנועה גדולה היא משתנה בדרך."],"ready":true,"unit":"3"},{"id":"3.2","title":"גמא (Gamma)","minutes":6,"objective":"להבין שגמא מודדת כמה הדלתא משתנה, שהיא הכי גבוהה באופציה על הכסף קרוב לפקיעה, ושלמחזיק היא עובדת בעדו ולכותב נגדו.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"3.2-c1","type":"concept","title":"הקצב שבו הדלתא משתנה","body":"בשיעור הקודם ראינו שהדלתא לא קבועה. **גמא (Gamma)** אומרת בכמה הדלתא משתנה כשהמניה זזה בדולר אחד.\n\nכאן: Call על הכסף, דלתא {d:call}, גמא {gm:call}. אם המניה עולה בדולר אחד, הדלתא עולה בערך ל־{d:call@S=101}.\n\n**הזיזו את מחיר המניה ואת הימים**, ושימו לב מתי הגמא הכי גבוהה.","price":{"sliders":["S","days"],"greeks":["delta","gamma"],"show":["call"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.2-a1","type":"analogy","title":"מהירות ותאוצה","body":"דלתא היא כמו **המהירות** של המכונית: כמה מטרים היא עוברת בכל שנייה.\n\nגמא היא **התאוצה**: כמה המהירות משתנה. רכב שמאיץ חזק משנה מהירות מהר. אופציה עם גמא גבוהה משנה דלתא מהר.","breaks":"ברכב, התאוצה תלויה בנהג. באופציה הגמא תלויה במקום שבו המניה נמצאת ובזמן שנשאר: היא גבוהה ליד המימוש וקרוב לפקיעה, ונמוכה רחוק מהמימוש. ועוד: למי שכתב את האופציה הגמא שלילית, כאילו הרכב מאיץ דווקא בכיוון שלא רציתם. ועוד: מהירות נמדדת לשנייה, ודלתא נמדדת לכל דולר של תנועה במניה, לא לפי זמן."},{"id":"3.2-l1","type":"mcq","life":true,"prompt":"רכב נוסע במהירות 50 קמ\"ש ומאיץ ב־10 קמ\"ש בכל שנייה. מה המהירות אחרי שנייה אחת?","options":[{"text":"60 קמ\"ש"},{"text":"50 קמ\"ש"},{"text":"10 קמ\"ש"}],"correct":0,"explain":{"right":"מהירות ועוד תאוצה. באופציות: דלתא {d:call} ועוד גמא {gm:call} אחרי עלייה של דולר, בערך {d:call@S=101}.","wrong":"התאוצה מוסיפה 10 קמ\"ש לכל שנייה: 60. כך גם גמא מוסיפה לדלתא כשהמניה זזה."},"source":"דוגמה מהחיים"},{"id":"3.2-q1","type":"mcq","prompt":"Call על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%), דלתא {d:call}, גמא {gm:call}. המניה עולה בדולר אחד. מה תהיה הדלתא, בערך?","options":[{"text":"בערך {d:call@S=101}"},{"text":"{d:call}, כמו קודם"},{"text":"1.00"}],"correct":0,"explain":{"right":"דלתא ועוד גמא: `{d:call} + {gm:call}`, בערך {d:call@S=101}.","wrong":"הדלתא לא נשארת קבועה. היא גדלה בערך בגמא: `{d:call} + {gm:call}`, כלומר בערך {d:call@S=101}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.2-q2","type":"mcq","prompt":"איפה הגמא הכי גבוהה? בחרו מבין שלוש האפשרויות.","options":[{"text":"Call על הכסף, 5 ימים לפקיעה"},{"text":"Call על הכסף, 30 ימים לפקיעה"},{"text":"Call מחוץ לכסף, מימוש $110, 5 ימים לפקיעה"}],"correct":0,"explain":{"right":"על הכסף וקרוב לפקיעה: גמא {gm:call@days=5}, לעומת {gm:call} ב־30 ימים ו־{gm:call@K=110,days=5} מחוץ לכסף. שם הדלתא יכולה לקפוץ מכמעט 0 לכמעט 1 בתנועה קטנה.","wrong":"הגמא הכי גבוהה **על הכסף וקרוב לפקיעה**: {gm:call@days=5}. ב־30 ימים היא {gm:call}, ומחוץ לכסף כמעט אפס: {gm:call@K=110,days=5}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.2-c2","type":"concept","title":"בעד המחזיק, נגד הכותב","body":"למי שמחזיק אופציה (Long) הגמא **חיובית**: כשהמניה זזה לטובתו, החשיפה שלו גדלה והוא מרוויח מהר יותר. כשהיא זזה נגדו, החשיפה קטנה והוא מפסיד לאט יותר.\n\nלמי שכתב אופציה (Short) הגמא **שלילית**: תנועה חדה **נגדו** פוגעת בו יותר ויותר, ותנועה לטובתו מכניסה לו פחות ופחות, עד הפרמיה.\n\nלכן כותבים חשופים במיוחד לתנועות חדות, ובעיקר קרוב לפקיעה, כשהגמא הכי גבוהה.","source":"Natenberg, Option Volatility and Pricing"},{"id":"3.2-q3","type":"mcq","prompt":"כתבתם Call על הכסף, 5 ימים לפקיעה. מה הסיכון המרכזי מצד הגמא?","options":[{"text":"תנועה חדה למעלה: הדלתא השלילית שלכם גדלה מהר, וההפסד מואץ"},{"text":"שהמניה לא תזוז בכלל, ואז תפסידו את הפרמיה"},{"text":"אין סיכון מהגמא, כי לכותב היא חיובית"}],"correct":0,"explain":{"right":"לכותב הגמא שלילית. קרוב לפקיעה היא הכי גדולה, ולכן תנועה חדה מגדילה את החשיפה בדיוק כשהמחיר הולך נגדכם.","wrong":"לכותב הגמא **שלילית**. כשהמניה עולה, הדלתא השלילית שלכם גדלה: אתם בשורט על יותר ויותר מניות, וההפסד מואץ. שקט במניה דווקא טוב לכם."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"3.2-q4","type":"mcq","prompt":"Call על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%), שווה {callx} לחוזה. המניה קופצת מיד בעשרה דולרים. הערכה לפי דלתא בלבד: {dSx:call@dS=10} לחוזה. הערכה לפי דלתא וגמא: {dgx:call@dS=10}. במודל המלא הוא עולה {diffx:call@S=110|S=100}. מה אפשר ללמוד?","options":[{"text":"הוספת הגמא מקרבת את ההערכה למודל בתנועות גדולות"},{"text":"הגמא לא משנה כלום בתנועות גדולות"},{"text":"דלתא לבד מדויקת יותר מדלתא וגמא"}],"correct":0,"explain":{"right":"דלתא לבד מפספסת את העובדה שהחשיפה גדלה בדרך. עם גמא ההערכה קרובה הרבה יותר למודל.","wrong":"ההערכה עם הגמא ({dgx:call@dS=10}) קרובה למודל ({diffx:call@S=110|S=100}) הרבה יותר מדלתא לבד ({dSx:call@dS=10})."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["**גמא**: בכמה הדלתא משתנה כשהמניה זזה בדולר אחד.","הכי גבוהה **על הכסף וקרוב לפקיעה**.","**למחזיק** גמא חיובית: תנועה עוזרת לו. **לכותב** שלילית: תנועה חדה פוגעת בו יותר ויותר.","בתנועה גדולה, דלתא ועוד גמא נותנות הערכה טובה בהרבה מדלתא לבד."],"ready":true,"unit":"3"},{"id":"3.3","title":"תטא (Theta)","minutes":6,"objective":"להבין מי משלם ומי מקבל את ערך הזמן, ולמה תטא חיובית היא לא \"כסף חינם\": היא התמורה על גמא שלילית.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"3.3-c1","type":"concept","title":"כמה עולה יום אחד","body":"**תטא (Theta)** אומרת בכמה ישתנה מחיר האופציה כשעובר יום אחד, אם שום דבר אחר לא זז. כאן היא מחושבת לפי יום קלנדרי. יש ברוקרים שסופרים רק ימי מסחר.\n\nבשיעור 2.5 ראינו את הדעיכה. תטא היא אותה דעיכה במספר אחד.\n\nכאן: Call על הכסף, 30 ימים לפקיעה. התטא {thx:call} לחוזה ליום. **הזיזו את הימים** ותראו איך היא משתנה קרוב לפקיעה.","price":{"sliders":["days"],"greeks":["theta"],"show":["call","put"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.3-a1","type":"analogy","title":"השכרת רכב ליום","body":"שוכרים רכב ומשלמים לחברת ההשכרה סכום קבוע ליום. בתמורה, הרכב זמין לכם לכל נסיעה שתרצו.\n\nמחזיק אופציה דומה לשוכר: הוא \"משלם\" תטא כל יום, בתמורה לאפשרות להרוויח מתנועה של המניה. הכותב דומה לחברת ההשכרה: הוא \"גובה\" את התטא, ולוקח על עצמו את הסיכון.","breaks":"בהשכרה התעריף קבוע ומשלמים אותו כל יום. מחזיק אופציה שילם את כל הפרמיה מראש, ותטא היא הקצב שבו השווי של מה שקנה נשחק. והיא לא קבועה: היא גדלה קרוב לפקיעה ותלויה בתנודתיות. ועוד: לכותב אופציה אין ביטוח. תנועה חדה אחת יכולה למחוק יותר מכל התטא שנשארה עד הפקיעה."},{"id":"3.3-l1","type":"mcq","life":true,"prompt":"שכרתם רכב לשבוע, ובסוף לא נסעתם בכלל. מה קרה לכסף ששילמתם?","options":[{"text":"שילמתם על הזמינות, גם אם לא השתמשתם בה"},{"text":"חברת ההשכרה מחזירה את הכסף"},{"text":"לא שילמתם, כי לא נסעתם"}],"correct":0,"explain":{"right":"זה בדיוק תטא למחזיק: אם המניה לא זזה, ערך הזמן נשחק, והוא \"שילם על הזמינות\".","wrong":"משלמים על הזמן שהרכב היה זמין. כך גם מחזיק אופציה: אם המניה לא זזה, הוא מאבד את התטא כל יום."},"source":"דוגמה מהחיים"},{"id":"3.3-q1","type":"mcq","prompt":"Call על הכסף: מניה $100, מימוש $100, 30 ימים לפקיעה, IV 25%. הוא שווה {call} לאופציה ({callx} לחוזה), וה־Theta שלו {thx:call} לחוזה ליום. אם מחר המניה וה־IV לא זזות, מה יקרה לשווי החוזה, בערך?","options":[{"text":"ירד בערך בגובה התטא, לבערך {callx@days=29}"},{"text":"ירד ב־5 דולרים לאופציה, כלומר בערך $500 לחוזה"},{"text":"ירד בכל ערך הזמן, {callx}, כי עבר יום"},{"text":"לא ירד, כי המניה לא זזה"}],"correct":0,"explain":{"right":"התטא היא השינוי ליום לחוזה: היה {callx}, ועכשיו בערך {callx@days=29}. ההפסד היומי קטן, אבל הוא מצטבר, וקרוב לפקיעה הוא גדל.","wrong":"התטא כבר מוצגת לחוזה: בערך {thx:call} ליום. השווי יורד היה {callx}, ועכשיו בערך {callx@days=29}. ערך הזמן כולו נעלם רק לאורך כל הדרך עד הפקיעה, לא ביום אחד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19","price":{"greeks":["theta"],"show":["call"]}},{"id":"3.3-q2","type":"mcq","prompt":"Call על הכסף (מניה $100, מימוש $100, IV 25%). כשנשארו 30 ימים, ה־Theta שלו {thx:call} לחוזה ליום. מה קורה לתטא כשנשארים רק 5 ימים?","options":[{"text":"היא גדלה בערך מוחלט, לבערך {thx:call@days=5} ליום"},{"text":"היא קטנה, כי נשאר פחות זמן"},{"text":"היא לא משתנה"}],"correct":0,"explain":{"right":"על הכסף, הדעיכה מואצת לקראת הסוף (שיעור 2.5). התטא היא אותו דבר במספר: {thx:call@days=5} ליום, לעומת {thx:call} כשנשארו 30 ימים.","wrong":"באופציה על הכסף התטא **גדלה** לקראת הפקיעה: {thx:call@days=5} ליום כשנשארו 5 ימים, לעומת {thx:call} כשנשארו 30."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.3-c2","type":"concept","title":"תטא היא לא כסף חינם","body":"לכותב אופציה התטא **חיובית**: כל יום שעובר בלי תנועה, הוא מרוויח. זה נשמע כמו הכנסה קבועה.\n\nאבל אותו כותב מחזיק **גמא שלילית** (שיעור 3.2): תנועה חדה פוגעת בו, והפגיעה מואצת.\n\nתטא וגמא הן שני צדדים של אותה עסקה. מי שגובה תטא, מקבל אותה **בתמורה** לסיכון של תנועה. מי שמשלם תטא, קונה את האפשרות להרוויח מתנועה.","source":"Natenberg, Option Volatility and Pricing"},{"id":"3.3-q3","type":"mcq","prompt":"כתבתם Call על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%), וקיבלתם פרמיה של {callx} לחוזה. אין לו ערך פנימי, אז כל הפרמיה היא ערך זמן: זה המקסימום שתרוויחו אם המניה לא תזוז עד הפקיעה. עכשיו המניה קופצת מיד למחיר $105. ה־Call שווה עכשיו {callx@S=105} לחוזה, כלומר הפסד (לא ממומש) של {diffx:call@S=105|S=100} לכם. מה המסקנה?","options":[{"text":"קפיצה אחת יכולה למחוק יותר מכל הפרמיה שגביתם"},{"text":"התטא תמיד מכסה את הסיכון"},{"text":"לכותב אין סיכון כל עוד לא הגיעה הפקיעה"}],"correct":0,"explain":{"right":"כל מה שאפשר להרוויח מהזמן הוא {callx}. קפיצה אחת של חמישה דולרים עולה {diffx:call@S=105|S=100}, יותר מזה. זה הסיכון שבתמורה אליו הכותב גובה את התטא.","wrong":"התטא לא מכסה תנועה חדה. כל הפרמיה שגביתם היא {callx}, וקפיצה של חמישה דולרים עולה לכם {diffx:call@S=105|S=100}, יותר מכל מה שאפשר להרוויח מהזמן."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"3.3-q4","type":"mcq","prompt":"מי \"משלם\" תטא ומי \"מקבל\" אותה?","options":[{"text":"המחזיק משלם, הכותב מקבל, בתמורה לסיכון של תנועה"},{"text":"הכותב משלם, המחזיק מקבל, בתמורה לפרמיה ששילם"},{"text":"הברוקר מקבל אותה, כחלק מהעמלה"}],"correct":0,"explain":{"right":"ערך הזמן שהמחזיק מאבד הוא הרווח של הכותב, אם המניה לא זזה מספיק. כמעט תמיד זה הכיוון, ואף אחד לא מקבל אותה \"בחינם\".","wrong":"למחזיק התטא שלילית: הזמן עולה לו כסף. לכותב היא חיובית: הוא מרוויח מהזמן, אבל נושא את הסיכון של תנועה חדה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["**תטא**: בכמה האופציה מאבדת ערך כשעובר יום, אם שום דבר אחר לא זז.","באופציה על הכסף התטא **גדלה** קרוב לפקיעה.","**המחזיק משלם** תטא, **הכותב מקבל**.","תטא חיובית באה יחד עם **גמא שלילית**. זה לא כסף חינם."],"ready":true,"unit":"3"},{"id":"3.4","title":"וגה (Vega)","minutes":5,"objective":"להעריך כמה פוזיציה מרוויחה או מפסידה כשהתנודתיות המשתמעת משתנה, ולדעת איפה הוגה גדולה.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"3.4-c1","type":"concept","title":"רגישות לתנודתיות","body":"**וגה (Vega)** אומרת בכמה ישתנה מחיר האופציה כשה־IV זזה בנקודה אחת, למשל מ־25% ל־26%.\n\nלמחזיק אופציה הוגה **חיובית**: IV עולה, האופציה מתייקרת. לכותב היא **שלילית**.\n\nכאן: Call על הכסף, 30 ימים. הוגה {vgx:call} לחוזה לכל נקודת IV. **הזיזו את ה־IV ואת הימים** ותראו מתי הוגה גדולה.","price":{"sliders":["iv","days"],"greeks":["vega"],"show":["call"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.4-q1","type":"mcq","prompt":"Call על הכסף (מניה $100, מימוש $100, 30 ימים, IV 25%), שווה {callx} לחוזה. הוגה שלו {vgx:call} לחוזה לכל נקודת IV. ה־IV עולה בחמש נקודות, מ־25% ל־30%, והמניה לא זזה. בערך בכמה עולה החוזה?","options":[{"text":"בערך {vgd:call@dv=5}"},{"text":"בערך {vgx:call}"},{"text":"הוא לא משתנה, כי המניה לא זזה"}],"correct":0,"explain":{"right":"וגה × מספר הנקודות: `5 × {vgx:call}`, בערך {vgd:call@dv=5}. במודל המלא: {diffx:call@iv=0.30|iv=0.25}.","wrong":"הוגה היא לכל נקודה. חמש נקודות: `5 × {vgx:call}`, בערך {vgd:call@dv=5} לחוזה, גם בלי שהמניה זזה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.4-q2","type":"mcq","prompt":"לאיזו אופציה וגה גדולה יותר?","options":[{"text":"Call על הכסף, 90 ימים"},{"text":"Call על הכסף, 30 ימים"},{"text":"Call מחוץ לכסף, מימוש $115, 30 ימים"}],"correct":0,"explain":{"right":"ככל שנשאר יותר זמן, לתנודתיות יש יותר זמן להשפיע: {vgx:call@days=90} לחוזה ב־90 ימים, לעומת {vgx:call} ב־30. ורחוק מהמימוש היא קטנה: {vgx:call@K=115}.","wrong":"וגה גדלה עם הזמן לפקיעה, והיא הכי גדולה ליד המימוש: {vgx:call@days=90} ב־90 ימים, {vgx:call} ב־30 ימים, ו־{vgx:call@K=115} בלבד מחוץ לכסף."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.4-c2","type":"concept","title":"צודקים בכיוון, ומפסידים","body":"לפני אירוע, כמו דוח רבעוני, ה־IV בדרך כלל עולה, כי השוק מתמחר תנועה גדולה. אחרי האירוע, כשהאי־ודאות נגמרת, ה־IV יורדת בחדות.\n\nמי שקנה אופציה לפני האירוע יכול לצדוק בכיוון ועדיין להפסיד: הרווח מהתנועה קטן מההפסד מירידת ה־IV. לזה קוראים **IV Crush**, ונעמיק בו ביחידה 7.","source":"Natenberg, Option Volatility and Pricing"},{"id":"3.4-q3","type":"mcq","prompt":"לפני דוח קניתם Call על הכסף (מניה $100, מימוש $100, 30 ימים) כשה־IV הייתה 50%, ושילמתם {call@iv=0.5} לאופציה. למחרת המניה עלתה למחיר $103, אבל ה־IV ירדה ל־30%. ה־Call שווה עכשיו {call@S=103,iv=0.3,days=29}. מה קרה לחוזה?","options":[{"text":"שינוי של בערך {diffx:call@S=103,iv=0.3,days=29|iv=0.5} לחוזה: הפסד, למרות שהמניה עלתה"},{"text":"רווח, כי המניה עלתה"},{"text":"בלי שינוי: העלייה והירידה מתקזזות בדיוק"}],"correct":0,"explain":{"right":"הרווח מהדלתא קטן מההפסד מהוגה. ה־Call שווה עכשיו {call@S=103,iv=0.3,days=29}, פחות ממה ששילמתם.","wrong":"העלייה במניה הוסיפה, אבל ירידה של 20 נקודות IV הורידה יותר. ה־Call שווה עכשיו {call@S=103,iv=0.3,days=29}, פחות ממה ששילמתם, {call@iv=0.5}: שינוי של בערך {diffx:call@S=103,iv=0.3,days=29|iv=0.5} לחוזה."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"3.4-q4","type":"mcq","prompt":"כתבתם Put. ה־IV עולה חזק, והמניה לא זזה. מה קורה לכם?","options":[{"text":"הפסד: לכותב הוגה שלילית, וה־Put שכתבתם התייקר"},{"text":"רווח: IV גבוהה מייקרת את הפרמיה שקיבלתם"},{"text":"כלום: בלי תנועה במניה אין רווח ואין הפסד"}],"correct":0,"explain":{"right":"עליית IV מייקרת את האופציה שכתבתם. כדי לסגור, תצטרכו לשלם יותר.","wrong":"לכותב הוגה שלילית: IV עולה, האופציה שהוא כתב מתייקרת, והוא מפסיד, גם בלי תנועה במניה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["**וגה**: בכמה האופציה זזה כשה־IV זזה בנקודה אחת.","**מחזיק**: וגה חיובית. **כותב**: שלילית.","וגה גדולה יותר ככל שנשאר **יותר זמן**, והכי גדולה **ליד המימוש**.","אחרי אירוע ה־IV יכולה לרדת חזק, ואז אפשר לצדוק בכיוון ולהפסיד."],"ready":true,"unit":"3"},{"id":"3.5","title":"ריו (Rho) בקצרה","minutes":3,"objective":"לדעת מתי הריבית משפיעה על מחיר אופציה (פקיעות רחוקות) ומתי אפשר כמעט להתעלם ממנה.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"items":[{"id":"3.5-c1","type":"concept","title":"הריבית, במספר אחד","body":"**ריו (Rho)** אומרת בכמה ישתנה מחיר האופציה כשהריבית עולה בנקודת אחוז אחת, למשל מ־4% ל־5%.\n\nב־**Call** היא חיובית, וב־**Put** שלילית (שיעור 2.2).\n\nבאופציות קצרות היא קטנה מאוד: Call על הכסף, 30 ימים, ריו {rhx:call} לחוזה. בפקיעות רחוקות היא גדלה: אותו Call לשנה, {rhx:call@days=365}.","price":{"sliders":["days"],"greeks":["rho"],"show":["call","put"],"from":true},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.5-q1","type":"mcq","prompt":"הריבית עולה בנקודת אחוז אחת. איזה Call מושפע יותר?","options":[{"text":"Call לשנה"},{"text":"Call ל־30 ימים"},{"text":"שניהם באותה מידה"}],"correct":0,"explain":{"right":"ריבית משפיעה דרך הזמן: ככל שהתשלום על המימוש נדחה יותר, הדחייה שווה יותר. ב־30 ימים הריו {rhx:call} לחוזה, ובשנה {rhx:call@days=365}.","wrong":"ריו גדלה עם הזמן לפקיעה. ב־30 ימים היא {rhx:call}, ובשנה {rhx:call@days=365}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.5-q2","type":"mcq","prompt":"מה הסימן של הריו ב־Put?","options":[{"text":"שלילי: ריבית גבוהה מוזילה Put"},{"text":"חיובי: ריבית גבוהה מייקרת Put"},{"text":"אפס: ריבית לא משפיעה על Put"}],"correct":0,"explain":{"right":"מחזיק Put מקבל את המימוש רק בעתיד, וזה שווה פחות כשהריבית גבוהה. כאן: {rhx:put} לחוזה ב־30 ימים.","wrong":"ב־Put הריו שלילית: {rhx:put} לחוזה. ריבית גבוהה מוזילה Put (שיעור 2.2)."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.5-q3","type":"mcq","prompt":"אתם סוחרים בעיקר באופציות של פחות מחודשיים. כמה חשובה הריו בשבילכם?","options":[{"text":"מעט: ההשפעה קטנה, והריבית זזה לאט"},{"text":"הרבה: היא היוונית החשובה ביותר"},{"text":"רק ב־Put: ב־Call אין לה השפעה"}],"correct":0,"explain":{"right":"ריו {rhx:call} לחוזה לכל נקודת אחוז, פחות מיום אחד של תטא ({thx:call}). וריבית זזה נקודת אחוז שלמה לעיתים רחוקות, בדרך כלל לאורך חודשים, בזמן ש־IV יכולה לזוז כמה נקודות ביום. היא נעשית חשובה באופציות לשנה ויותר.","wrong":"בפקיעות קצרות הריו קטנה: {rhx:call} לחוזה לכל נקודת אחוז, פחות מיום אחד של תטא. היא חשובה בעיקר באופציות לשנה ויותר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["**ריו**: בכמה האופציה זזה כשהריבית עולה בנקודת אחוז אחת.","**Call**: חיובית. **Put**: שלילית.","בפקיעות קצרות היא **קטנה**. בפקיעות של שנה ויותר היא כבר משמעותית."],"ready":true,"unit":"3"},{"id":"3.6","title":"חזרה: היווניות ביחד","minutes":6,"objective":"לקרוא מסך יווניות של פוזיציה ולהעריך מה יקרה לה כשהמניה זזה, כשעובר יום וכשהתנודתיות משתנה.","priceSet":{"S":100,"K":100,"days":30,"iv":0.25,"r":0.04,"q":0},"positions":{"A":{"name":"פוזיציה A: קניתם 4 חוזי Call במימוש $100. הפסד מקסימלי: {pg:A.maxloss}","legs":[{"type":"call","side":"long","qty":4}]},"B":{"name":"פוזיציה B: כתבתם 4 חוזי Put במימוש $100. הפסד מקסימלי: {pg:B.maxloss}, אם המניה יורדת לאפס","legs":[{"type":"put","side":"short","qty":4}]}},"items":[{"id":"3.6-c1","type":"concept","title":"מסך היווניות של פוזיציה","body":"אצל הברוקר אפשר לראות את היווניות של כל הפוזיציה יחד. כל שורה היא חוזה מסוג אחד (רגל), ובשורה האחרונה הסכום.\n\n**Delta** כאן במונחי מניות: כמה דולרים מרוויחים או מפסידים כשהמניה זזה בדולר אחד.\n**Gamma** של הפוזיציה: בכמה מניות הדלתא שלה משתנה לכל דולר במניה.\n**Theta**: כמה דולרים עולה או מכניס יום אחד.\n**Vega**: כמה דולרים לכל נקודת IV.\n\nכך מעריכים תרחיש מיידי: דלתא × תנועת המניה, ועוד חצי גמא × תנועת המניה בריבוע, ועוד וגה × שינוי ה־IV. ואם עוברים ימים, גם תטא × ימים.\n\nשימו לב: ברוקרים שונים מציגים יווניות לאופציה או לחוזה, ולפי המודל וה־IV שלהם. בדקו את היחידות לפני שמחשבים.","posview":"A","source":"Hull, Options, Futures, and Other Derivatives, פרק 19 (קירוב טיילור)"},{"id":"3.6-q1","type":"mcq","posview":"A","prompt":"פוזיציה A. המניה עולה בדולר אחד, וכל השאר לא זז. בערך כמה מרוויחה הפוזיציה?","options":[{"text":"{pg:A.est@dS=1}"},{"text":"{pg:A.vegax}"},{"text":"{pg:A.thetax}"}],"correct":0,"explain":{"right":"הדלתא של הפוזיציה {pg:A.delta} מניות, כלומר בערך {pg:A.delta} דולר לכל דולר במניה. הגמא מוסיפה עוד קצת: `½ × {pg:A.gamma} × 1² ≈ {pg:A.gammaPart@dS=1}`. ביחד: {pg:A.est@dS=1}.","wrong":"לתנועה במניה מסתכלים על הדלתא: {pg:A.delta} מניות, כלומר בערך {pg:A.delta} דולר, ועוד מעט מהגמא, {pg:A.gammaPart@dS=1}. ביחד {pg:A.est@dS=1}. וגה ותטא עונות על שאלות אחרות."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"3.6-q2","type":"mcq","posview":"A","prompt":"פוזיציה A. עובר יום שקט: המניה וה־IV לא זזים. מה קורה?","options":[{"text":"שינוי של בערך {pg:A.thetax}: הזמן עולה לכם כסף"},{"text":"שינוי של בערך {pg:B.thetax}: הזמן מכניס לכם כסף"},{"text":"כלום, כי שום דבר לא זז"}],"correct":0,"explain":{"right":"מחזיק אופציות משלם תטא: {pg:A.thetax} ליום לכל הפוזיציה.","wrong":"גם כשהמחיר לא זז, הזמן עובר. ל־A, שמחזיקה אופציות, התטא שלילית: {pg:A.thetax} ליום."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.6-q3","type":"mcq","posview":"A","prompt":"פוזיציה A. התרחיש, באותו רגע: המניה עולה ב־5% (חמישה דולרים), וה־IV יורדת בשלוש נקודות, מ־25% ל־22%. בערך מה קורה לפוזיציה?","options":[{"text":"בערך {pg:A.est@dS=5,dv=-0.03}"},{"text":"בערך {pg:A.est@dS=5}: הירידה ב־IV לא משנה"},{"text":"בערך {pg:B.est@dS=5,dv=-0.03}"}],"correct":0,"explain":{"right":"`{pg:A.delta} × 5`, ועוד `½ × {pg:A.gamma} × 25`, ועוד `{pg:A.vegax} × −3`: בערך {pg:A.est@dS=5,dv=-0.03}. במודל המלא: {pg:A.act@dS=5,dv=-0.03}. ההערכה קרובה.","wrong":"מחברים את כל החלקים, כולל הוגה: דלתא × 5, ועוד חצי גמא × 25, ועוד וגה כפול מינוס 3. זה בערך {pg:A.est@dS=5,dv=-0.03}. בלי הוגה היה יוצא {pg:A.est@dS=5}, יותר מדי."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19 (קירוב טיילור)"},{"id":"3.6-q4","type":"mcq","posview":"B","prompt":"פוזיציה B: כתבתם 4 חוזי Put על הכסף. מה הסימנים של היווניות שלה?","options":[{"text":"Delta חיובית, Theta חיובית, Vega שלילית"},{"text":"Delta שלילית, Theta שלילית, Vega חיובית"},{"text":"Delta חיובית, Theta שלילית, Vega חיובית"}],"correct":0,"explain":{"right":"Put כתוב מרוויח כשהמניה עולה (דלתא חיובית, {pg:B.delta}), מרוויח מהזמן (תטא {pg:B.thetax}), ומפסיד כש־IV עולה (וגה {pg:B.vegax}).","wrong":"כותב Put רוצ
