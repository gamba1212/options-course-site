{"right":"ה־Put שכתבתם שווה $20, וקיבלתם $4: `($4 − $20) × 100 = −$1,600`. שלושה חודשים ברווח המלא הכניסו $1,200. חודש אחד מחק אותם, ועוד $400.","wrong":"ה־Put במימוש $95 שווה `$95 − $75 = $20`. קיבלתם $4 על שתי האופציות: `($4 − $20) × 100 = −$1,600`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-q7","type":"mcq","prompt":"למה סוחרים שכותבים Strangle רואים ברוב החודשים רווח?","options":[{"text":"כי טווח הרווח רחב. זה לא אומר כלום על גודל ההפסד מחוץ לטווח"},{"text":"כי כתיבת Strangle היא אסטרטגיה עם תוחלת חיובית מובטחת לאורך זמן"},{"text":"כי הברוקר סוגר את הפוזיציה לפני שהיא מספיקה להפסיד הרבה"}],"correct":0,"explain":{"right":"הפרמיה קטנה בדיוק כי הסיכוי לצאת מהטווח קטן. אחוז הצלחה גבוה הוא תכונה של המבנה. התוחלת נקבעת לפי ההפסדים הנדירים, ואותם לא רואים ברוב החודשים.","wrong":"אחוז ההצלחה נובע מהטווח הרחב, לא מיתרון של הכותב. אין תוחלת מובטחת, והברוקר לא שומר עליכם מהפסד."},"source":"Natenberg, Option Volatility and Pricing"}],"summary":["**Strangle:** Put ו־Call במימושים שונים, שניהם מחוץ לכסף. זול מ־Straddle, ודורש תנועה גדולה יותר.","**Long Strangle מפסיד** כשהמניה נשארת בין נקודות האיזון. בדוגמה: בין {st:lg.be} לבין {st:lg.be2}. הפסד מקסימלי: {st:lg.maxLoss}.","**Short Strangle:** רווח מקסימלי של {st:sg.maxProfit}, והפסד **בלתי מוגבל** כלפי מעלה.","אחוז הצלחה גבוה, **סיכון זנב**: ירידה חדה אחת מוחקת חודשים של פרמיות."],"ready":true,"unit":"5"},{"id":"5.8","title":"Iron Condor","minutes":6,"objective":"לבנות Iron Condor משני Spreads בקרדיט, לחשב קרדיט, הפסד מקסימלי וטווח רווח, ולהבין מה עלה לקנות את ההגנה.","strats":{"ic":{"name":"Iron Condor","desc":"Short Put $95, Long Put $90, Short Call $105, Long Call $110","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2},{"type":"put","side":"long","K":90,"prem":1},{"type":"call","side":"short","K":105,"prem":2},{"type":"call","side":"long","K":110,"prem":1}]},"sg":{"name":"Short Strangle","desc":"Short Put במימוש $95 ו־Short Call במימוש $105, כל אחד בפרמיה $2","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2},{"type":"call","side":"short","K":105,"prem":2}]}},"strat":"ic","items":[{"id":"5.8-c1","type":"concept","title":"Short Strangle עם הגנה משני הצדדים","body":"ה־Short Strangle מהשיעור הקודם הרוויח בטווח רחב, אבל ההפסד שלו היה בלתי מוגבל. **Iron Condor** הוא אותו רעיון, עם אופציה קנויה בכל צד שעוצרת את ההפסד.\n\nארבע רגליים, כשהמניה במחיר $100:\n**כותבים** Put במימוש $95, ומקבלים $2.\n**קונים** Put במימוש $90, ומשלמים $1.\n**כותבים** Call במימוש $105, ומקבלים $2.\n**קונים** Call במימוש $110, ומשלמים $1.\n\nזה בדיוק שני ה־Spreads בקרדיט משיעור 5.5: Bull Put Spread למטה, ו־Bear Call Spread למעלה.\n\n**קרדיט:** `$2 − $1 + $2 − $1 = $2`, כלומר $200.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.8-q1","type":"mcq","fmt":"usd","prompt":"פתחתם Iron Condor, כשהמניה במחיר $100:\nכתבתם Put במימוש $95 וקיבלתם $2\nקניתם Put במימוש $90 ושילמתם $1\nכתבתם Call במימוש $105 וקיבלתם $2\nקניתם Call במימוש $110 ושילמתם $1\n\nכמה קרדיט נשאר אצלכם?","options":[{"v":200},{"v":400},{"v":600},{"v":100}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ic","what":"credit"}},"explain":{"right":"קיבלתם $4 על שתי האופציות שכתבתם, ושילמתם $2 על שתי האופציות שקניתם: `($4 − $2) × 100 = $200`. זה הרווח המקסימלי.","wrong":"מסכמים את מה שקיבלתם ($2 ועוד $2) ומחסירים את מה ששילמתם ($1 ועוד $1): `($4 − $2) × 100 = $200`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.8-c2","type":"concept","title":"הגרף: שולחן שטוח, ושיפוע יורד בכל צד","body":"**בין $95 לבין $105:** כל ארבע האופציות פוקעות בלי ערך. הקרדיט שלכם: {st:ic.maxProfit}.\n\n**מתחת למחיר $90, או מעל $110:** אחד ה־Spreads בהפסד מלא. ההפרש בין המימושים, $5, פחות הקרדיט של $2: `($5 − $2) × 100 = $300`.\n\nלמה רק $300 ולא $600? כי המניה לא יכולה להיות גם מתחת למחיר $90 וגם מעל $110. בפקיעה רק צד אחד יכול להיות בהפסד.\n\n**נקודות איזון:** `$95 − $2 = $93` ו־`$105 + $2 = $107`.","strat":"ic","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.8-q2","type":"chart-mcq","fmt":"usd","start":88,"prompt":"פתחתם Iron Condor, וקיבלתם קרדיט נטו של $2 (לפני הכפלה ב־100):\nכתבתם Put במימוש $95\nקניתם Put במימוש $90\nכתבתם Call במימוש $105\nקניתם Call במימוש $110\n\nמה ההפסד המקסימלי?","hint":"הזיזו את המחוון לקצה, ימינה או שמאלה.","options":[{"v":300},{"v":200},{"v":600},{"v":500}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ic","what":"maxLoss"}},"explain":{"right":"ההפרש בין המימושים בכל צד הוא $5, והקרדיט $2: `($5 − $2) × 100 = $300`. בפקיעה רק צד אחד יכול להיות בהפסד.","wrong":"מפסידים את ההפרש בין המימושים של צד אחד, פחות הקרדיט: `($5 − $2) × 100 = $300`. בפקיעה שני הצדדים לא יכולים להפסיד יחד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.8-q3","type":"mcq","prompt":"פתחתם Iron Condor, וקיבלתם קרדיט נטו של $2 (לפני הכפלה ב־100):\nכתבתם Put במימוש $95\nקניתם Put במימוש $90\nכתבתם Call במימוש $105\nקניתם Call במימוש $110\n\nבאיזה טווח מחירים בפקיעה הפוזיציה מרוויחה?","options":[{"text":"בין {st:ic.be} לבין {st:ic.be2}"},{"text":"בין $90 לבין $110"},{"text":"בין $95 לבין $105 בלבד"}],"correct":0,"explain":{"right":"הקרדיט של $2 מרחיב את הטווח בכל צד: `$95 − $2 = $93` ו־`$105 + $2 = $107`.","wrong":"בין $95 לבין $105 מרוויחים את הקרדיט המלא. אבל הקרדיט של $2 מכסה גם את שני הדולרים הראשונים מעבר לכל מימוש: מרוויחים בין {st:ic.be} לבין {st:ic.be2}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.8-q4","type":"chart-guess","S":88,"prompt":"פתחתם Iron Condor, וקיבלתם קרדיט נטו של $2 (לפני הכפלה ב־100):\nכתבתם Put במימוש $95\nקניתם Put במימוש $90\nכתבתם Call במימוש $105\nקניתם Call במימוש $110\n\nאחרי דוח רע המניה בפקיעה במחיר $88. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"ic","what":"pnl","S":88},"expect":-300},"explain":{"right":"ה־Put שכתבתם שווה $7, וה־Put שקניתם שווה $2. ההפרש, $5, פחות הקרדיט: `($2 − $5) × 100 = −$300`. ההפסד נעצר שם, גם אם המניה תרד עוד.","wrong":"מתחת למחיר $90 ה־Put שקניתם מקזז כל ירידה נוספת. ההפסד הוא ההפרש בין המימושים פחות הקרדיט: `($2 − $5) × 100 = −$300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.8-q5","type":"mcq","prompt":"Short Strangle (Put במימוש $95, Call במימוש $105) נותן קרדיט של {st:sg.maxProfit}, עם הפסד בלתי מוגבל. Iron Condor על אותם מימושים, עם Put קנוי במימוש $90 ו־Call קנוי במימוש $110, נותן קרדיט של {st:ic.maxProfit}.\n\nויתרתם על $200 מהקרדיט. מה קיבלתם בתמורה?","options":[{"text":"תקרה להפסד: {st:ic.maxLoss} במקום בלתי מוגבל"},{"text":"סיכוי גבוה יותר לרווח בכל חודש"},{"text":"טווח רווח רחב יותר משני הצדדים"}],"correct":0,"explain":{"right":"שתי האופציות שקניתם הן ביטוח. הן עולות חצי מהקרדיט, מצמצמות מעט את טווח הרווח, ובתמורה ההפסד המקסימלי ידוע מראש.","wrong":"טווח הרווח דווקא מצטמצם מעט, כי הקרדיט קטן יותר. מה שקיבלתם הוא תקרה להפסד: {st:ic.maxLoss}, במקום הפסד בלתי מוגבל."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"}],"summary":["**Iron Condor:** Bull Put Spread ועוד Bear Call Spread. ארבע רגליים.","**רווח מקסימלי:** הקרדיט, {st:ic.maxProfit}, אם המניה נשארת בין המימושים שכתבתם.","**מתי מפסידים:** כשהמניה יוצאת מהטווח. בדוגמה: מתחת למחיר {st:ic.be} או מעל {st:ic.be2}. הפסד מקסימלי: {st:ic.maxLoss}.","ארבע רגליים הן גם ארבע עמלות וארבעה מרווחים. נחזור לזה ביחידה 6."],"ready":true,"unit":"5"},{"id":"5.9","title":"Butterfly","minutes":6,"objective":"לבנות Butterfly משלושה מימושים, לחשב מחיר, רווח מקסימלי ונקודות איזון, ולהבין למה יחס סיכון־סיכוי מפתה הוא לא יתרון.","strats":{"bf":{"name":"Butterfly","desc":"Long Call $95, שני Short Call $100, Long Call $105","K":100,"legs":[{"type":"call","side":"long","K":95,"prem":7},{"type":"call","side":"short","K":100,"prem":4,"qty":2},{"type":"call","side":"long","K":105,"prem":2}]}},"strat":"bf","items":[{"id":"5.9-c1","type":"concept","title":"הימור על מחיר יעד","body":"**Butterfly** הוא הימור שהמניה תהיה בפקיעה קרוב מאוד למחיר מסוים.\n\nשלושה מימושים, כשהמניה במחיר $100:\n**קונים** Call אחד במימוש $95, ומשלמים $7.\n**כותבים שני** Calls במימוש $100, ומקבלים $4 על כל אחד.\n**קונים** Call אחד במימוש $105, ומשלמים $2.\n\n**המחיר נטו:** `$7 − $8 + $2 = $1`, כלומר $100.\n\nאפשר לראות בזה שני Spreads שחולקים את המימוש האמצעי: Bull Call Spread (קונים $95, כותבים $100), ו־Bear Call Spread (כותבים $100, קונים $105).","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.9-q1","type":"mcq","fmt":"usd","prompt":"פתחתם Butterfly, כשהמניה במחיר $100:\nקניתם Call במימוש $95 ושילמתם $7\nכתבתם שני Calls במימוש $100 וקיבלתם $4 על כל אחד\nקניתם Call במימוש $105 ושילמתם $2\n\nכמה שילמתם נטו?","options":[{"v":100},{"v":500},{"v":900},{"v":300}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bf","what":"net"}},"explain":{"right":"שילמתם $7 ועוד $2, וקיבלתם פעמיים $4: `($9 − $8) × 100 = $100`. זה גם ההפסד המקסימלי.","wrong":"שילמתם `$7 + $2 = $9`, וקיבלתם `2 × $4 = $8`. ההפרש: `($9 − $8) × 100 = $100`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.9-c2","type":"concept","title":"הגרף: אוהל","body":"**המניה בדיוק במחיר $100:** ה־Call במימוש $95 שווה $5, וכל השאר פוקעות בלי ערך. `($5 − $1) × 100 = $400`. זה הרווח המקסימלי, והוא קיים **רק בנקודה אחת**.\n\n**המניה מתחת למחיר $95, או מעל $105:** ה־Butterfly לא שווה כלום. למשל במחיר $110: `$15 − 2 × $10 + $5 = $0`. הפסדתם את $100 ששילמתם.\n\n**נקודות איזון:** `$95 + $1 = $96` ו־`$105 − $1 = $104`.\n\nככל שהמניה מתרחקת מהמימוש האמצעי, הרווח יורד מהר: כל דולר של מרחק עולה $100.","strat":"bf","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.9-q2","type":"chart-mcq","fmt":"usd","start":100,"prompt":"פתחתם Butterfly, ושילמתם $1 נטו (לפני הכפלה ב־100):\nקניתם Call במימוש $95\nכתבתם שני Calls במימוש $100\nקניתם Call במימוש $105\n\nמה הרווח המקסימלי?","hint":"הזיזו את המחוון ומצאו את השיא.","options":[{"v":400},{"v":500},{"v":100},{"v":900}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bf","what":"maxProfit"}},"explain":{"right":"במחיר $100 בדיוק, ה־Call במימוש $95 שווה $5 והשאר לא שוות כלום: `($5 − $1) × 100 = $400`.","wrong":"השיא הוא במימוש האמצעי. שם ה־Call במימוש $95 שווה $5, ושילמתם $1: `($5 − $1) × 100 = $400`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.9-q3","type":"chart-guess","S":103,"prompt":"פתחתם Butterfly, ושילמתם $1 נטו (לפני הכפלה ב־100):\nקניתם Call במימוש $95\nכתבתם שני Calls במימוש $100\nקניתם Call במימוש $105\n\nבפקיעה המניה במחיר $103, קרוב ליעד. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"bf","what":"pnl","S":103},"expect":100},"explain":{"right":"ה־Call במימוש $95 שווה $8. שני ה־Calls שכתבתם שווים $3 כל אחד, $6 ביחד. `($8 − $6 − $1) × 100 = +$100`. פספוס של $3 מהיעד, והרווח ירד מסכום של $400 לסכום של $100.","wrong":"ה־Call במימוש $95 שווה $8, ושני ה־Calls במימוש $100 שווים $6 ביחד. שילמתם $1: `($8 − $6 − $1) × 100 = +$100`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.9-q4","type":"mcq","prompt":"פתחתם Butterfly, ושילמתם $1 נטו (לפני הכפלה ב־100):\nקניתם Call במימוש $95\nכתבתם שני Calls במימוש $100\nקניתם Call במימוש $105\n\nבאיזה טווח מחירים בפקיעה הפוזיציה מרוויחה?","options":[{"text":"בין {st:bf.be} לבין {st:bf.be2}"},{"text":"בין $95 לבין $105"},{"text":"רק במחיר $100 בדיוק"}],"correct":0,"explain":{"right":"`$95 + $1 = $96` ו־`$105 − $1 = $104`. טווח של $8 בלבד, והרווח המלא רק באמצע.","wrong":"במחיר $95 ובמחיר $105 ה־Butterfly לא שווה כלום, ואתם בהפסד של $100. האיזון דולר אחד פנימה מכל צד: בין {st:bf.be} לבין {st:bf.be2}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.9-q5","type":"mcq","prompt":"Butterfly שעולה $100, עם רווח מקסימלי של $400. \"מסכנים 1 כדי להרוויח 4\" נשמע מצוין. מה חסר בתיאור?","options":[{"text":"הרווח המלא קיים רק במחיר אחד, וטווח הרווח צר: תנועה רגילה מספיקה כדי להפסיד הכול"},{"text":"שום דבר: יחס של 1 ל־4 הוא יתרון ברור, ולכן התוחלת חיובית"},{"text":"רק שהרווח המקסימלי האמיתי הוא $500 ולא $400, כי לא מחסירים את המחיר"}],"correct":0,"explain":{"right":"זו התמונה ההפוכה מ־Spread בקרדיט: שם סיכוי גבוה ורווח קטן, כאן רווח גדול וסיכוי קטן. השוק מתמחר את שניהם. יחס מפתה לבדו לא אומר שהתוחלת חיובית (שיעור 4.3).","wrong":"יחס הסיכון־סיכוי הוא רק חצי מהתמונה. החצי השני הוא הסיכוי: ה־Butterfly מרוויח רק בטווח צר, ואת הרווח המלא רק בנקודה אחת."},"source":"Natenberg, Option Volatility and Pricing"}],"summary":["**Butterfly:** קונים מימוש נמוך, כותבים פעמיים את האמצעי, קונים מימוש גבוה.","**הפסד מקסימלי:** המחיר נטו ששילמתם. בדוגמה: {st:bf.maxLoss}.","**רווח מקסימלי:** {st:bf.maxProfit}, רק אם המניה בפקיעה בדיוק במימוש האמצעי.","**מתי מפסידים:** בכל מקום רחוק מהמימוש האמצעי. בדוגמה: מתחת למחיר {st:bf.be} או מעל {st:bf.be2}."],"ready":true,"unit":"5"},{"id":"5.10","title":"בחירת אסטרטגיה לפי השקפה","minutes":7,"objective":"להתאים מבנה להשקפה על שלושה צירים: כיוון, תנודתיות וזמן, ולזהות מתי כל מבנה מפסיד.","strats":{"ls":{"name":"Long Straddle","desc":"Long Call ו־Long Put במימוש $100, כל אחד בפרמיה $4","K":100,"legs":[{"type":"call","side":"long","K":100,"prem":4},{"type":"put","side":"long","K":100,"prem":4}]},"ic":{"name":"Iron Condor","desc":"Short Put $95, Long Put $90, Short Call $105, Long Call $110","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2},{"type":"put","side":"long","K":90,"prem":1},{"type":"call","side":"short","K":105,"prem":2},{"type":"call","side":"long","K":110,"prem":1}]},"bc":{"name":"Bull Call Spread","desc":"Long Call במימוש $100 בפרמיה $4, ו־Short Call במימוש $105 בפרמיה $2","K":100,"legs":[{"type":"call","side":"long","K":100,"prem":4},{"type":"call","side":"short","K":105,"prem":2}]},"bp":{"name":"Bear Put Spread","desc":"Long Put במימוש $100 בפרמיה $4, ו־Short Put במימוש $95 בפרמיה $2","K":100,"legs":[{"type":"put","side":"long","K":100,"prem":4},{"type":"put","side":"short","K":95,"prem":2}]},"cc":{"name":"Covered Call","desc":"100 מניות שנקנו במחיר $100, ו־Short Call במימוש $105 בפרמיה $2","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100},{"type":"call","side":"short","K":105,"prem":2}]},"bf":{"name":"Butterfly","desc":"Long Call $95, שני Short Call $100, Long Call $105","K":100,"legs":[{"type":"call","side":"long","K":95,"prem":7},{"type":"call","side":"short","K":100,"prem":4,"qty":2},{"type":"call","side":"long","K":105,"prem":2}]},"ss":{"name":"Short Straddle","desc":"Short Call ו־Short Put במימוש $100, כל אחד בפרמיה $4","K":100,"legs":[{"type":"call","side":"short","K":100,"prem":4},{"type":"put","side":"short","K":100,"prem":4}]}},"items":[{"id":"5.10-c1","type":"concept","title":"שלוש שאלות לפני שבוחרים מבנה","body":"בתשעה שיעורים למדתם יותר מעשרה מבנים. אף אחד מהם לא \"טוב\" או \"רע\". כל אחד הוא הימור אחר, והשאלה היא אם ההימור מתאים למה שאתם חושבים.\n\n**1. כיוון:** המניה תעלה, תרד, או תישאר במקום?\n\n**2. תנודתיות:** התנועה תהיה גדולה או קטנה ממה שהשוק מתמחר? וה־IV, תעלה או תרד?\n\n**3. זמן:** עד מתי זה אמור לקרות? והאם הזמן שעובר עובד בשבילכם או נגדכם?\n\nמבנה שמתאים בציר אחד ושגוי בציר אחר יכול להפסיד גם כשצדקתם. מי שקנה Call לפני דוח וצדק בכיוון, אבל ה־IV צנחה, מכיר את זה.","source":"Natenberg, Option Volatility and Pricing"},{"id":"5.10-c2","type":"concept","title":"המפה, חלק 1: כיוון","body":"זו מפה של התאמה בין השקפה למבנה. היא לא המלצה, ולכל שורה יש צד מפסיד.\n\n**חושבים שתעלה:**\nב־Long Call מפסידים כשהמניה לא עולה מספיק עד הפקיעה. התטא נגדכם.\nב־Bull Call Spread משלמים פחות, ויש תקרה לרווח. מפסידים מתחת לנקודת האיזון.\n\n**חושבים שתרד:**\nב־Long Put או ב־Bear Put Spread מפסידים כשהמניה לא יורדת מספיק.\n\n**חושבים שלא תרד הרבה:**\nב־Bull Put Spread או ב־Put מגובה מזומן מפסידים בירידה חדה.\n\n**חושבים שלא תעלה הרבה:**\nב־Bear Call Spread מפסידים בעלייה חדה.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.10-q3","type":"mcq","prompt":"סוחר חושב שמניה תעלה מעט בחודש הקרוב, ממחיר $100 לאזור $105. הוא מתלבט בין Long Call במימוש $100 במחיר $4, לבין Bull Call Spread (אותו Call, ועוד Short Call במימוש $105) במחיר $2 נטו. מה ה־Spread נותן לו, ומה הוא לוקח?","options":[{"text":"נקודת איזון נמוכה יותר והפסד מקסימלי קטן יותר, תמורת ויתור על כל עלייה מעל $105"},{"text":"רווח גדול יותר בכל תרחיש, כי הוא עולה חצי מה־Long Call"},{"text":"הגנה מפני ירידה במניה, כי יש בו גם אופציה כתובה"}],"correct":0,"explain":{"right":"ה־Spread מגיע לאיזון במחיר {st:bc.be} במקום $104, ומסכן {st:bc.maxLoss} במקום $400. אם ההשקפה היא \"עלייה מתונה\", הוויתור על מה שמעל $105 מתאים לה. אם המניה תזנק, ה־Long Call היה עדיף.","wrong":"ה־Spread זול יותר, ולכן נקודת האיזון נמוכה יותר וההפסד המקסימלי קטן יותר. המחיר: הרווח נעצר במימוש $105. הוא לא מרוויח יותר בכל תרחיש, והוא לא מגן מירידה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.10-c2b","type":"concept","title":"המפה, חלק 2: תנודתיות וזמן","body":"**חושבים שהתנועה תהיה גדולה ממה שהשוק מתמחר:**\nב־Long Straddle או ב־Long Strangle מפסידים כשהמניה נשארת במקום, או כשה־IV יורדת. הזמן עובד נגדכם: כל יום שקט עולה כסף.\n\n**חושבים שהמניה תזוז פחות ממה שמתומחר:**\nב־Iron Condor או ב־Butterfly מפסידים כשהמניה יוצאת מהטווח. ההפסד מוגבל.\nב־Short Straddle או ב־Short Strangle מפסידים באותו מצב, וההפסד בלתי מוגבל.\nבכל אלה הזמן עובד בשבילכם, והתנועה נגדכם.\n\n**ושאלת הזמן, בכל מבנה:** עד מתי זה אמור לקרות? מי שצדק בכיוון אחרי הפקיעה, הפסיד.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12; Natenberg, Option Volatility and Pricing"},{"id":"5.10-q1","type":"mcq","prompt":"אתם חושבים שהמניה תזוז חזק בחודש הקרוב, אבל לא יודעים לאיזה כיוון. איזה גרף מתאים להשקפה הזו?","options":[{"strat":"ls","label":"גרף בצורת V: הפסד באמצע, רווח בשני הקצוות"},{"strat":"ic","label":"גרף בצורת שולחן: רווח באמצע, הפסד מוגבל בשני הקצוות"},{"strat":"bc","label":"גרף עם רצפה משמאל ותקרה מימין"},{"strat":"cc","label":"גרף שיורד משמאל ונעצר בתקרה מימין"}],"correct":0,"explain":{"right":"זה Long Straddle: מרוויח מתנועה גדולה לכל כיוון, ומפסיד אם המניה נשארת קרוב למימוש.","wrong":"מחפשים גרף שמרוויח בשני הקצוות ומפסיד באמצע. זו צורת ה־V של Long Straddle."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.10-q2","type":"mcq","prompt":"אתם חושבים שהמניה תישאר קרוב למחיר $100 בחודש הקרוב, ורוצים שההפסד המקסימלי יהיה ידוע מראש. איזה גרף מתאים?","options":[{"strat":"ic","label":"גרף בצורת שולחן: רווח באמצע, הפסד מוגבל בשני הקצוות"},{"strat":"ss","label":"גרף בצורת V הפוך: רווח באמצע, הפסד שממשיך לגדול בקצוות"},{"strat":"ls","label":"גרף בצורת V: הפסד באמצע, רווח בשני הקצוות"},{"strat":"bp","label":"גרף עם תקרה משמאל ורצפה מימין"}],"correct":0,"explain":{"right":"זה Iron Condor: מרוויח כשהמניה נשארת בטווח, וההפסד בשני הצדדים נעצר. Short Straddle מרוויח באותו מצב, אבל ההפסד שלו לא מוגבל.","wrong":"מחפשים רווח באמצע והפסד שנעצר בשני הצדדים: זה Iron Condor. ב־Short Straddle (ה־V ההפוך) הרווח באמצע, אבל ההפסד ממשיך לגדול."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.10-q4","type":"mcq","prompt":"סוחרת חושבת שמניה תעלה אחרי הדוח הרבעוני, וקונה Call יום לפני הדוח. המניה אכן עולה 3%, אבל ה־Call מאבד מערכו. באיזה ציר היא טעתה?","options":[{"text":"תנודתיות: ה־IV הייתה גבוהה לפני הדוח וצנחה אחריו"},{"text":"כיוון: המניה הייתה צריכה לעלות הרבה יותר מהר"},{"text":"זמן: היא קנתה פקיעה רחוקה מדי בשביל דוח"}],"correct":0,"explain":{"right":"בכיוון היא צדקה. אבל Long Call הוא גם הימור על וגה: היא קנתה IV גבוהה, ואחרי הדוח ה־IV צנחה (IV Crush, שיעור 3.4). עלייה של 3% הייתה קטנה ממה שהשוק כבר תמחר.","wrong":"המניה עלתה, אז בכיוון היא צדקה. הבעיה בציר התנודתיות: היא שילמה על IV גבוהה שצנחה אחרי הדוח, והתנועה הייתה קטנה ממה שתומחר."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"5.10-q6","type":"mcq","prompt":"סוחר חשב שמניה תעלה, וקנה Call שפוקע בעוד שבועיים. בפקיעה המניה כמעט לא זזה, וה־Call פקע בלי ערך. שבוע אחר כך המניה עלתה 15%. באיזה ציר הוא טעה?","options":[{"text":"זמן: הוא צדק בכיוון, אבל התנועה הגיעה אחרי הפקיעה"},{"text":"כיוון: המניה הייתה צריכה לרדת לפני שעלתה"},{"text":"תנודתיות: ה־IV הייתה נמוכה מדי כשקנה"}],"correct":0,"explain":{"right":"לאופציה יש תאריך. מי שקונה אותה מהמר לא רק על כיוון, אלא גם על מתי. תנועה נכונה שמגיעה אחרי הפקיעה לא שווה כלום למחזיק.","wrong":"בכיוון הוא צדק: המניה עלתה. הבעיה הייתה הזמן. האופציה פקעה לפני שהתנועה הגיעה, ואחרי הפקיעה היא כבר לא קיימת."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"5.10-c2c","type":"concept","title":"המפה, חלק 3: כבר מחזיקים את המניה","body":"**מוכנים לוותר על עלייה תמורת פרמיה:**\nב־Covered Call מפסידים כשהמניה יורדת, כמעט כמו במניה לבדה, ומפספסים עליות מעל המימוש.\n\n**רוצים רצפה להפסד:**\nב־Protective Put מפסידים את הפרמיה כשהמניה לא יורדת, ומשלמים שוב בכל חידוש.\n\nאף אחד מהמבנים במפה לא מרוויח בכל מצב. בוחרים את המבנה שהצד המפסיד שלו הוא התרחיש שאתם הכי פחות מאמינים בו, ובודקים שאפשר לעמוד בהפסד אם הוא קורה בכל זאת.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.10-q5","type":"mcq","prompt":"סוחר כתב Strangle בחודש שעבר והרוויח. עכשיו הוא רוצה לכתוב שוב, \"כי זה עבד\". מה חסר בהחלטה שלו?","options":[{"text":"השקפה על התנועה ועל ה־IV עכשיו. חודש אחד לא מוכיח כלום"},{"text":"שום דבר: מבנה שעבד בחודש שעבר ימשיך לעבוד גם החודש"},{"text":"רק להגדיל את מספר החוזים, כי השיטה כבר הוכיחה את עצמה"}],"correct":0,"explain":{"right":"כתיבת Strangle מרוויחה ברוב החודשים בלי קשר לכישרון (שיעור 5.7). \"עבד לי\" הוא מדגם של עסקה אחת. בוחרים מבנה לפי ההשקפה על שלושת הצירים, לא לפי התוצאה האחרונה.","wrong":"רווח של חודש אחד במבנה שמרוויח ברוב החודשים לא מלמד כלום. ההחלטה צריכה להתחיל מהשקפה: כיוון, תנודתיות וזמן, ומההפסד המקסימלי."},"source":"עקרונות הקורס; שיעור 4.3"},{"id":"5.10-q7","type":"mcq","prompt":"ערוץ מסחר מפרסם \"אסטרטגיה שמרוויחה בכל מצב שוק\". לפי מה שלמדתם ביחידה הזו, מה נכון?","options":[{"text":"אין מבנה כזה: לכל מבנה יש תרחיש שבו הוא מפסיד"},{"text":"יש: Iron Condor, כי ההפסד שלו מוגבל משני הצדדים"},{"text":"יש: Covered Call, כי מקבלים פרמיה בכל מצב"}],"correct":0,"explain":{"right":"לכל גרף שראיתם יש אזור של הפסד. מי שמציג מבנה בלי להראות איפה הוא מפסיד, מסתיר חצי מהגרף.","wrong":"ב־Iron Condor ההפסד מוגבל, אבל הוא קיים, מחוץ לטווח. ב־Covered Call מקבלים פרמיה, וסופגים את ירידת המניה. אין מבנה בלי אזור של הפסד."},"source":"עקרונות הקורס"},{"id":"5.10-q8","type":"mcq","prompt":"לפני שפותחים פוזיציה, מה מהבאים **לא** חלק מהבדיקה?","options":[{"text":"מה הרוויח המבנה הזה בפעם האחרונה שהשתמשתם בו"},{"text":"מה ההפסד המקסימלי, וכמה חוזים מתאימים לתקציב הסיכון"},{"text":"מה ההשקפה על כיוון, תנודתיות וזמן, ואיפה המבנה מפסיד"}],"correct":0,"explain":{"right":"התוצאה האחרונה היא לא מידע על העסקה הבאה. מה שכן בודקים: השקפה על שלושת הצירים, איפה המבנה מפסיד, ההפסד המקסימלי, וגודל הפוזיציה (שיעור 4.2). ביחידה 6 נוסיף לרשימה את העלויות.","wrong":"הפסד מקסימלי, גודל פוזיציה והשקפה הם בדיוק הבדיקה. מה שלא שייך אליה הוא התוצאה של הפעם הקודמת."},"source":"עקרונות הקורס"}],"summary":["בוחרים מבנה לפי **שלושה צירים**: כיוון, תנודתיות וזמן.","מבנה שמתאים בציר אחד ושגוי באחר יכול להפסיד גם כשצדקתם.","**אין מבנה שמרוויח בכל מצב.** לכל גרף יש אזור של הפסד.","לפני כל פוזיציה: השקפה, איפה מפסידים, הפסד מקסימלי וגודל. לא \"מה עבד בפעם שעברה\"."],"ready":true,"unit":"5"},{"id":"6.1","title":"קריאת שרשרת אופציות","minutes":6,"objective":"לקרוא שרשרת אופציות: למצוא פקיעה ומימוש, לדעת באיזה מחיר קונים ומוכרים מיד (Ask ו־Bid), להבין למה Last לא תמיד מעודכן, ולהבחין בין Volume ל־Open Interest.","chainSet":{"ticker":"XYZ","S":102.4,"r":0.04,"iv":0.28,"strikes":[90,95,100,105,110,115],"expiries":[{"id":"30","label":"30 יום","days":30,"call":{"vol":[12,48,1320,2450,860,0],"oi":[410,950,5200,8730,3100,1240],"last":{"115":0.6}},"put":{"vol":[35,410,1880,620,95,8],"oi":[2050,4300,6900,2700,640,150]}},{"id":"58","label":"58 יום","days":58,"call":{"vol":[5,20,240,610,310,140],"oi":[300,820,2900,4100,2200,1050]},"put":{"vol":[10,90,330,150,40,2],"oi":[900,1600,3100,1300,400,90]}}],"skew":0.25},"items":[{"id":"6.1-c1","type":"concept","title":"המסך שבו הכול מתחיל","body":"כשנכנסים לאופציות אצל הברוקר, רואים טבלה שנקראת **שרשרת אופציות (Option Chain)**. היא מציגה, לנכס בסיס אחד, את כל האופציות שנסחרות עליו.\n\nלמעלה: שם המניה והמחיר שלה עכשיו, ובחירה של **תאריך פקיעה**. לכל פקיעה יש טבלה משלה.\nבכל שורה: **מחיר מימוש**, ולידו המחירים של האופציה.\nאפשר לעבור בין Calls ל־Puts. בהרבה פלטפורמות במחשב רואים את שניהם יחד: Calls משמאל, Puts מימין, והמימושים באמצע.\n\nכל המחירים בשרשרת הם **לאופציה**. חוזה אחד הוא 100 מניות (שיעור 1.6).","chain":{"exp":"30","view":"call"},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10; OCC, Characteristics and Risks of Standardized Options"},{"id":"6.1-q1","type":"mcq","tip":"אפשר ללחוץ על Calls ו־Puts שבראש הטבלה.","prompt":"XYZ נסחרת במחיר {S}. עברו ל־Puts בשרשרת. אילו שורות מוצללות עכשיו, כלומר בתוך הכסף?","chain":{"exp":"30","view":"call","lockExp":true,"cols":["bid","ask"]},"options":[{"text":"מימוש $105 ומעלה: $105, $110, $115"},{"text":"מימוש $100 ומטה: $90, $95, $100"},{"text":"רק מימוש $100, הכי קרוב למחיר"},{"text":"אף שורה. Put אף פעם לא מוצלל"}],"correct":0,"explain":{"right":"Put הוא זכות **למכור** במחיר המימוש. הוא בתוך הכסף כשהמימוש **מעל** מחיר המניה, כאן $105 ומעלה. ב־Calls זה הפוך: המוצללות הן $90 עד $100.","wrong":"Put בתוך הכסף כשהמימוש **מעל** מחיר המניה ({S}), כלומר $105 ומעלה. ההצללה מתהפכת כשעוברים בין Calls ל־Puts (שיעור 1.5)."},"source":"OCC, Characteristics and Risks of Standardized Options: In-the-money"},{"id":"6.1-c2","type":"concept","title":"Bid, Ask ומרווח על המסך","body":"את **Bid** ו־**Ask** הכרתם בשיעור 2.7: מוכרים מיד, מקבלים Bid. קונים מיד, משלמים Ask. בשרשרת הם מופיעים בעמודות נפרדות.\n\nבשורה המסומנת, Call במימוש $105: Bid {c105.bid}, Ask {c105.ask}. ה־**מרווח (Bid-Ask Spread)** הוא {c105.spread} לאופציה. חוזה אחד בקנייה מיידית: `{c105.ask} × 100 = {c105.cost}`.\n\nלחישוב, מניחים Ask בקנייה ו־Bid במכירה.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"highlight":{"type":"call","K":105}},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-q2","type":"chain-tap","tip":"לוחצים על תא בטבלה כדי לבחור אותו.","prompt":"אתם רוצים **לקנות עכשיו** Call במימוש $105, בפקיעה של 30 יום. לחצו על המחיר שתשלמו.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true},"answer":{"exp":"30","type":"call","K":105,"col":"ask"},"explain":{"right":"קונים מיד ב־Ask: {c105.ask} לאופציה. זו ההצעה הזולה ביותר שמוצגת כרגע למכירה.","wrong":"קנייה מיידית היא במחיר ה־**Ask**, {c105.ask}. ה־Bid ({c105.bid}) הוא מה שהייתם **מקבלים** אילו מכרתם, ו־Last הוא מחיר של עסקה שכבר הייתה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-q3","type":"mcq","prompt":"כמה יעלה **חוזה אחד** של ה־Call הזה (מימוש $105) בקנייה מיידית, לפני עמלות?","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"highlight":{"type":"call","K":105},"cols":["bid","ask","last"]},"options":[{"text":"{c105.cost}"},{"text":"{c105.ask}","why":"{c105.ask} זה המחיר **לאופציה**. חוזה הוא 100 מניות: `{c105.ask} × 100 = {c105.cost}`."},{"text":"{c105.proceeds}","why":"זה Bid כפול 100, כלומר מה שהייתם **מקבלים** במכירה. בקנייה משלמים Ask: `{c105.ask} × 100 = {c105.cost}`."},{"text":"{c105.lastCost}","why":"זה Last כפול 100, המחיר של העסקה האחרונה. בקנייה מיידית משלמים Ask: `{c105.ask} × 100 = {c105.cost}`."}],"correct":0,"explain":{"right":"Ask כפול 100 מניות: `{c105.ask} × 100 = {c105.cost}` לחוזה, לפני עמלות.","wrong":"בקנייה משלמים **Ask**, והמחיר בשרשרת הוא **לאופציה**: `{c105.ask} × 100 = {c105.cost}` לחוזה."},"source":"OCC, Characteristics and Risks of Standardized Options: Premium"},{"id":"6.1-q4","type":"chain-tap","tip":"שימו לב: השרשרת פתוחה על Calls.","prompt":"יש לכם Put במימוש $100, בפקיעה של 30 יום, ואתם רוצים **למכור אותו עכשיו**. לחצו על המחיר שתקבלו.","chain":{"exp":"30","view":"call","lockExp":true},"answer":{"exp":"30","type":"put","K":100,"col":"bid"},"explain":{"right":"עברתם ל־Puts ובחרתם ב־Bid: {p100.bid} לאופציה, כלומר {p100.proceeds} לחוזה לפני עמלות.","wrong":"צריך לעבור ל־**Puts**, ובשורה של מימוש $100 לבחור ב־**Bid**: מוכרים מיד, מקבלים Bid. כאן {p100.bid} לאופציה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-c3","type":"concept","title":"Last: מה שהיה, לא מה שיש","body":"**Last** הוא המחיר של **העסקה האחרונה** שבוצעה באופציה. היא יכולה להיות מלפני שעות, או מאתמול, כשהמניה הייתה במחיר אחר.\n\nבשורה המסומנת, Call במימוש $115: היום עוד לא נסחר בו אף חוזה (Volume 0). ה־Last שלו, {c115.last}, הוא מעסקה קודמת, ועכשיו Bid {c115.bid} ו־Ask {c115.ask}. מי שמסתכל רק על Last חושב שהאופציה שווה יותר ממה שאפשר לקבל עליה עכשיו.\n\nהמחיר שאפשר לסחור בו **עכשיו** נמצא ב־Bid וב־Ask.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"highlight":{"type":"call","K":115},"cols":["bid","ask","last","vol"]},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-q5","type":"mcq","prompt":"ה־Call במימוש $115: Last {c115.last}, Bid {c115.bid}, Ask {c115.ask}. אם תמכרו אותו עכשיו במכירה מיידית, כמה תקבלו לאופציה?","options":[{"text":"{c115.bid}"},{"text":"{c115.last}","why":"Last הוא עסקה שכבר הייתה. עכשיו אף אחד לא מציע לקנות במחיר הזה: ה־Bid הגבוה ביותר הוא {c115.bid}."},{"text":"{c115.ask}","why":"Ask הוא המחיר שבו אפשר **לקנות** מיד. במכירה מיידית מקבלים את ה־Bid, {c115.bid}."},{"text":"{c115.mid}","why":"זה האמצע בין Bid ל־Ask. אפשר לנסות למכור בו בפקודה מוגבלת, אבל זה לא מובטח. במכירה מיידית מקבלים את ה־Bid, {c115.bid}."}],"correct":0,"explain":{"right":"מוכרים מיד, מקבלים **Bid**: {c115.bid}. ה־Last הגבוה יותר הוא היסטוריה.","wrong":"במכירה מיידית מקבלים את ה־**Bid**, {c115.bid}. Last ({c115.last}) הוא מחיר של עסקה קודמת, ולא הצעה שקיימת עכשיו."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-c4","type":"concept","title":"Volume ו־Open Interest","body":"**Volume**: כמה חוזים נסחרו **היום**. המספר מתחיל מאפס בכל יום מסחר.\n\n**Open Interest (OI)**: כמה חוזים היו **פתוחים** בסוף יום המסחר הקודם: חוזים שנפתחו ועדיין קיימים, כלומר לא נסגרו, לא מומשו ולא פקעו. המסלקה (OCC) מחשבת אותו אחרי הסגירה, והוא מתפרסם לפני פתיחת יום המסחר הבא. במהלך היום הוא לא משתנה.\n\nלמה זה חשוב? באופציה שנסחרת הרבה ויש בה הרבה חוזים פתוחים, בדרך כלל קל יותר לקנות ולמכור, והמרווח צר יותר. את זה ראינו ביחידה 2.","chain":{"exp":"30","view":"call","lockExp":true,"cols":["bid","ask","vol","oi"]},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-q6","type":"chain-tap","prompt":"בפקיעה של 30 יום: לחצו על תא כלשהו בשורת ה־Call שיש בה **הכי הרבה חוזים פתוחים**.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"cols":["bid","ask","vol","oi"]},"answer":{"exp":"30","type":"call","K":105,"col":"row"},"explain":{"right":"מימוש $105, עם OI של {c105.oi} חוזים. חוזים פתוחים נמדדים בעמודת **OI**, לא ב־Volume.","wrong":"חוזים פתוחים מופיעים בעמודת **OI**. הכי גבוה: מימוש $105, עם {c105.oi}. Volume סופר רק את מה שנסחר היום."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-q7","type":"mcq","prompt":"ב־Call במימוש $115: Volume {c115.vol}, OI {c115.oi}. מה זה אומר?","options":[{"text":"היום עוד לא נסחר בו אף חוזה, אבל {c115.oi} חוזים פתוחים מימים קודמים"},{"text":"אין באופציה הזו אף חוזה פתוח"},{"text":"{c115.oi} חוזים נסחרו בה היום"},{"text":"האופציה כבר פקעה"}],"correct":0,"explain":{"right":"Volume סופר רק את **היום**, ו־OI סופר את כל החוזים שעדיין **פתוחים**. אפשר שלא יהיה מסחר היום וחוזים פתוחים יישארו.","wrong":"Volume 0 אומר שהיום עוד לא נסחר אף חוזה. OI אומר שיש {c115.oi} חוזים שנפתחו בימים קודמים ועדיין פתוחים. אלה שני מספרים שונים."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-c5","type":"concept","title":"פקיעה קרובה, פקיעה רחוקה","body":"בראש השרשרת בוחרים **תאריך פקיעה**, ולכל פקיעה יש טבלה משלה. נסו לעבור בין 30 יום ל־58 יום.\n\nבאופציות אמריקאיות על מניות, אותו מימוש בפקיעה רחוקה יותר עולה לפחות כמו בפקיעה הקרובה, ובדרך כלל **יותר**. הסיבה היא **ערך זמן** (שיעור 1.5): יש יותר זמן שבו המניה יכולה לזוז. בשאלה הבאה תראו את זה בטבלה.","chain":{"exp":"30","view":"call","cols":["bid","ask"]},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"6.1-q8","type":"chain-tap","prompt":"עברו לפקיעה של **58 יום** ולחצו על המחיר שתשלמו על Call במימוש $105 בקנייה מיידית.","chain":{"exp":"30","view":"call","lockView":true},"answer":{"exp":"58","type":"call","K":105,"col":"ask"},"explain":{"right":"בפקיעה של 58 יום, Ask {58:c105.ask}, לעומת {30:c105.ask} בפקיעה של 30 יום. ה־Call הזה מחוץ לכסף, אז הערך הפנימי שלו $0 בשתי הפקיעות. כמעט כל ההפרש הוא **ערך זמן**.","wrong":"צריך לבחור למעלה **58 יום**, ובשורה של מימוש $105 ללחוץ על **Ask**: {58:c105.ask}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.1-q10","type":"mcq","prompt":"קניתם Call במימוש $105 (30 יום) בקנייה מיידית, ב־Ask. כעבור שנייה התחרטתם ומכרתם מיד, ב־Bid. המניה לא זזה, וגם ה־Bid וה־Ask לא השתנו. כמה הפסדתם על החוזה, לפני עמלות?","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"highlight":{"type":"call","K":105},"cols":["bid","ask"]},"options":[{"text":"{c105.spreadCost}"},{"text":"$0. שום דבר לא זז","why":"המניה לא זזה, אבל קניתם ב־Ask ומכרתם ב־Bid. ההפרש, {c105.spread} לאופציה, הוא {c105.spreadCost} לחוזה."},{"text":"{c105.spread}","why":"זה ההפרש **לאופציה**. לחוזה של 100 מניות זה {c105.spreadCost}."},{"text":"{c105.cost}","why":"לא הפסדתם את כל הפרמיה: קיבלתם בחזרה {c105.proceeds} כשמכרתם. ההפסד הוא רק המרווח, {c105.spreadCost}."}],"correct":0,"explain":{"right":"קניתם במחיר {c105.cost} ומכרתם במחיר {c105.proceeds}. ההפרש, {c105.spreadCost}, הוא **המרווח**: עלות אמיתית שמשלמים בכל כניסה ויציאה מיידית.","wrong":"קנייה ב־Ask ומכירה ב־Bid עולות את המרווח: {c105.spread} לאופציה, כלומר {c105.spreadCost} לחוזה, גם אם המחירים לא זזו בכלל."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["**שרשרת אופציות** מציגה, לכל פקיעה ולכל מימוש, את המחירים של Call ו־Put.","קונים מיד ב־**Ask**, מוכרים מיד ב־**Bid**. ההפרש, **המרווח**, הוא עלות אמיתית.","המחירים בשרשרת הם **לאופציה**. חוזה הוא פי 100.","**Last** הוא העסקה האחרונה, ולא בהכרח המחיר עכשיו.","**Volume**: מה שנסחר היום. **OI**: חוזים פתוחים, מתעדכן פעם ביום."],"ready":true,"unit":"6"},{"id":"6.2","title":"פקודות פתיחה וסגירה","minutes":5,"objective":"להבחין בין Buy to Open, Sell to Close, Sell to Open ו־Buy to Close, ולדעת איזו פקודה מתאימה לכל מצב.","items":[{"id":"6.2-c1","type":"concept","title":"שתי שאלות לפני כל פקודה","body":"בפקודת אופציה אצל הברוקר עונים על שתי שאלות:\n\n**1. קונים או מוכרים?** Buy או Sell.\n**2. פותחים פוזיציה חדשה או סוגרים פוזיציה קיימת?** to Open או to Close.\n\nמכאן ארבע פקודות:\n**Buy to Open**: קונים אופציה ופותחים Long.\n**Sell to Close**: מוכרים אופציה שקניתם, והפוזיציה נסגרת.\n**Sell to Open**: כותבים אופציה חדשה ופותחים Short.\n**Buy to Close**: קונים בחזרה אופציה שכתבתם, וההתחייבות נגמרת.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.2-q1","type":"order-build","tip":"בוחרים שורה עליונה (Buy או Sell) ושורה תחתונה (Open או Close).","prompt":"אין לכם אופציות על XYZ, ואתם רוצים **לקנות** Call. איזו פקודה שולחים?","target":{"act":"buy","eff":"open","what":"XYZ Call"},"explain":{"right":"קונים, ופותחים פוזיציה חדשה: **Buy to Open**. אחרי הביצוע יש לכם Long Call.","wrong":"לא הייתה לכם פוזיציה, אז פותחים. ואתם קונים. לכן **Buy to Open**."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.2-q2","type":"order-build","prompt":"לפני שבוע קניתם Call על XYZ. עכשיו אתם רוצים **לצאת** ממנו ולקבל את מה שהוא שווה בשוק. איזו פקודה?","target":{"act":"sell","eff":"close","what":"XYZ Call"},"explain":{"right":"מוכרים את האופציה שיש לכם, והפוזיציה נסגרת: **Sell to Close**.","wrong":"יש לכם Long Call. כדי לצאת ממנו **מוכרים** אותו, וזו **סגירה** של פוזיציה קיימת: **Sell to Close**."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.2-q3","type":"order-build","prompt":"אין לכם אופציות על XYZ, ואתם רוצים **לכתוב** Put ולקבל עליו פרמיה. איזו פקודה?","target":{"act":"sell","eff":"open","what":"XYZ Put"},"explain":{"right":"כתיבה היא מכירה שפותחת פוזיציה חדשה: **Sell to Open**. אחרי הביצוע יש לכם Short Put, עם התחייבות לקנות 100 מניות אם תקבלו הקצאה.","wrong":"לכתוב זה **למכור** אופציה שלא הייתה לכם, ולכן **לפתוח** פוזיציה: **Sell to Open**."},"source":"OCC, Characteristics and Risks of Standardized Options: Opening and closing transactions"},{"id":"6.2-q4","type":"order-build","prompt":"לפני חודש כתבתם Call על XYZ. עכשיו אתם רוצים **לסיים את ההתחייבות** לפני הפקיעה. איזו פקודה?","target":{"act":"buy","eff":"close","what":"XYZ Call"},"explain":{"right":"קונים בחזרה את האופציה שכתבתם: **Buy to Close**. מרגע הביצוע אי אפשר יותר להקצות לכם אותה.","wrong":"יש לכם Short Call. כדי לסגור אותו **קונים** את אותה אופציה בחזרה: **Buy to Close**."},"source":"OCC, Characteristics and Risks of Standardized Options: Opening and closing transactions"},{"id":"6.2-c2","type":"concept","title":"למה זה חשוב","body":"**Sell to Close** ו־**Sell to Open** נשמעים דומה, אבל הם הפוכים:\nהראשון **מסיים** זכות שיש לכם.\nהשני **יוצר** התחייבות חדשה, ודורש מהברוקר הרשאה מתאימה ולפעמים ביטחונות. נלמד עליהם בשיעורים 6.6 ו־6.7.\n\nכשסוגרים עם Sell to Close או Buy to Close, הרווח או ההפסד נקבעים לפי ההפרש בין מחיר הפתיחה למחיר הסגירה. לא צריך לחכות לפקיעה.","source":"OCC, Characteristics and Risks of Standardized Options: Opening and closing transactions"},{"id":"6.2-q5","type":"mcq","prompt":"מה ההבדל בין **Sell to Close** ל־**Sell to Open**?","options":[{"text":"Sell to Close מוכר אופציה שיש לכם ומסיים את הפוזיציה. Sell to Open כותב אופציה חדשה ויוצר התחייבות"},{"text":"אין הבדל. שתיהן מכירה, והברוקר מחליט מה לעשות"},{"text":"Sell to Open מוכר אופציה שיש לכם. Sell to Close כותב אופציה חדשה"},{"text":"Sell to Close מיועדת רק ל־Put, ו־Sell to Open רק ל־Call"}],"correct":0,"explain":{"right":"שתיהן מכירה, אבל אחת **סוגרת** זכות שיש לכם, והשנייה **פותחת** התחייבות חדשה.","wrong":"Close סוגר פוזיציה קיימת, Open פותח חדשה. Sell to Close מסיים Long שיש לכם. Sell to Open כותב אופציה ופותח Short, עם התחייבות."},"source":"OCC, Characteristics and Risks of Standardized Options: Opening and closing transactions"},{"id":"6.2-q6","type":"mcq","fmt":"pnl","prompt":"כתבתם Put בפקודת Sell to Open וקיבלתם פרמיה של $2 לאופציה. כעבור שבועיים סגרתם בפקודת Buy to Close במחיר $0.80 לאופציה. מה הרווח או ההפסד לחוזה, לפני עמלות?","options":[{"v":120},{"v":200},{"v":-80},{"v":280}],"correct":0,"check":{"fn":"tradePnL","args":{"side":"short","open":2,"close":0.8,"mult":100}},"explain":{"right":"קיבלתם $2 ושילמתם $0.80 כדי לסגור: `($2 − $0.80) × 100 = $120` לחוזה. לא חיכיתם לפקיעה.","wrong":"בכתיבה מקבלים בפתיחה ומשלמים בסגירה: `($2 − $0.80) × 100 = $120` רווח לחוזה. הפרמיה המלאה ($200) נשארת רק אם האופציה פוקעת בלי ערך."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.2-q7","type":"mcq","prompt":"שלחתם Buy to Close על Short Call שכתבתם, והפקודה בוצעה. מה המצב עכשיו?","options":[{"text":"אין לכם יותר פוזיציה באופציה הזו, וההתחייבות נגמרה"},{"text":"יש לכם עכשיו Long Call"},{"text":"עדיין אפשר להקצות לכם את ה־Call עד הפקיעה"},{"text":"קניתם 100 מניות XYZ"}],"correct":0,"explain":{"right":"Buy to Close מקזז את ה־Short Call. הפוזיציה נסגרה, ואי אפשר יותר להקצות לכם אותה.","wrong":"Close סוגר את מה שהיה. קניתם בחזרה את האופציה שכתבתם, אז ה־Short Call התאפס. לא נפתח Long חדש ולא נקנו מניות."},"source":"OCC, Characteristics and Risks of Standardized Options: Opening and closing transactions"}],"summary":["כל פקודה עונה על שתי שאלות: **קונים או מוכרים**, ו**פותחים או סוגרים**.","**Buy to Open** פותח Long, ו־**Sell to Close** סוגר אותו.","**Sell to Open** כותב אופציה ופותח Short, ו־**Buy to Close** סוגר אותו.","אפשר לסגור כל פוזיציה לפני הפקיעה. הרווח הוא ההפרש בין מחיר הפתיחה למחיר הסגירה."],"ready":true,"unit":"6"},{"id":"6.3","title":"פקודות שוק, מוגבלות ומשולבות","minutes":6,"objective":"להבין מה מבטיחה פקודת שוק ומה מבטיחה פקודה מוגבלת, למה באופציות פקודת שוק עלולה לעלות ביוקר, ומה זו פקודה משולבת של Spread.","chainSetFrom":"6.1","spread":{"exp":"30","type":"call","long":100,"short":105,"name":"Bull Call Spread","desc":"קונים Call במימוש $100, כותבים Call במימוש $105"},"items":[{"id":"6.3-c1","type":"concept","title":"שתי פקודות, שתי הבטחות","body":"**פקודת שוק (Market)**: \"תבצעו עכשיו, במחיר הכי טוב שיש\". היא כמעט תמיד מתבצעת, אבל **המחיר לא מובטח**. בקנייה בדרך כלל משלמים את ה־Ask, ואם המחיר זז או שהכמות גדולה, אפילו יותר.\n\n**פקודה מוגבלת (Limit)**: \"תבצעו רק במחיר הזה או טוב ממנו\". בקנייה זה מחיר מקסימלי, במכירה מחיר מינימלי. **המחיר מובטח, הביצוע לא**: אם אף אחד לא מסכים למחיר, הפקודה מחכה ואולי לא תתבצע.\n\nבאופציות המרווח בין Bid ל־Ask לרוב רחב יותר, יחסית למחיר, מאשר במניות, ולכן ההבדל בין השתיים מורגש.","source":"Hull, Options, Futures, and Other Derivatives, פרק 2; SEC Investor.gov: Types of Orders"},{"id":"6.3-a1","type":"analogy","title":"שליח לשוק הפשפשים","body":"שלחתם חבר לקנות בשבילכם מנורה בשוק הפשפשים.\n\nאם אמרתם לו **\"תקנה, לא משנה כמה\"**, הוא יחזור עם מנורה, אבל אולי ישלם יותר ממה שציפיתם. זו **פקודת שוק**.\n\nאם אמרתם **\"תקנה רק אם זה עד $40\"**, לא תשלמו מעל $40, אבל אולי הוא יחזור בידיים ריקות. זו **פקודה מוגבלת**.","breaks":"בשוק הפשפשים החבר יכול להתמקח. בבורסה אין מיקוח: פקודה מוגבלת פשוט ממתינה בבורסה, ברשימת הפקודות הפתוחות, עד שמישהו מסכים למחיר, ויכולה להתבצע גם חלקית, רק על חלק מהחוזים. ומחיר ה\"מנורה\" באופציות זז כל הזמן יחד עם המניה."},{"id":"6.3-l1","type":"mcq","life":true,"prompt":"אמרתם לחבר: \"תקנה את המנורה רק אם זה עד $40\". המוכר מבקש $45 ולא מוריד. מה יקרה?","options":[{"text":"החבר יחזור בלי מנורה"},{"text":"החבר יקנה במחיר $45, כי העיקר לקנות"},{"text":"החבר יקנה במחיר $40, והמוכר יוותר על ההפרש"},{"text":"החבר יקנה חצי מנורה"}],"correct":0,"explain":{"right":"הגבלתם את המחיר, אז אין עסקה מעל $40. כך גם פקודה מוגבלת: המחיר מובטח, הביצוע לא.","wrong":"בפקודה מוגבלת לא משלמים יותר מהגבול. אם המוכר לא מסכים, אין עסקה, והחבר חוזר בלי מנורה."},"source":"דוגמה מהחיים"},{"id":"6.3-q1","type":"mcq","prompt":"אתם שולחים **פקודת שוק** לקנות Call במימוש $105 (30 יום). באיזה מחיר צפוי הביצוע, אם השוק לא זז?","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"highlight":{"type":"call","K":105},"cols":["bid","ask"]},"options":[{"text":"בערך {c105.ask}, ה־Ask"},{"text":"בערך {c105.bid}, ה־Bid"},{"text":"בדיוק {c105.mid}, האמצע"}],"correct":0,"explain":{"right":"פקודת שוק בקנייה מתבצעת בדרך כלל ב־Ask, {c105.ask}. לפעמים קצת טוב יותר, ואם המחיר זז, גם גרוע יותר.","wrong":"פקודת שוק לוקחת את ההצעה הזמינה. בקנייה זה ה־Ask, {c105.ask}. Bid הוא מחיר למוכרים, והאמצע לא מובטח לאף אחד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"6.3-q2","type":"mcq","prompt":"Call במימוש $105 (30 יום): Bid {c105.bid}, Ask {c105.ask}. אתם שולחים **פקודה מוגבלת** לקנות אותו במחיר {c105.mid}, באמצע בין Bid ל־Ask. מה יכול לקרות?","options":[{"text":"היא תתבצע במחיר {c105.mid} או טוב ממנו, או שלא תתבצע בכלל"},{"text":"היא תתבצע מיד במחיר {c105.mid}, מובטח"},{"text":"היא תתבצע במחיר {c105.ask} אם אין מוכר באמצע"},{"text":"הברוקר יבטל אותה, כי אסור לבקש מחיר בין Bid ל־Ask"}],"correct":0,"explain":{"right":"פקודה מוגבלת מגינה על המחיר: לא תשלמו יותר מהמחיר {c105.mid}. החיסרון: ייתכן שהיא תחכה, ואולי לא תתבצע בכלל.","wrong":"בפקודה מוגבלת לא משלמים מעל הגבול, גם אם אין מוכר. היא מתבצעת במחיר {c105.mid} או טוב ממנו, ואם אף אחד לא מסכים, היא ממתינה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"6.3-q3","type":"mcq","prompt":"Call במימוש $115 (30 יום): Bid {c115.bid}, Ask {c115.ask}. למה פקודת שוק בקנייה יקרה כאן במיוחד, יחסית למחיר האופציה?","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"highlight":{"type":"call","K":115},"cols":["bid","ask","vol","oi"]},"options":[{"text":"המרווח, {c115.spread}, הוא חלק גדול מהמחיר של האופציה עצמה"},{"text":"פקודת שוק על אופציה זולה תמיד נדחית"},{"text":"באופציות מחוץ לכסף אסור לשלוח פקודת שוק"},{"text":"היא לא יקרה: מרווח של {c115.spread} זניח בכל אופציה"}],"correct":0,"explain":{"right":"האופציה עולה סנטים, והמרווח ביניהם הוא חלק גדול מהמחיר. מי שקונה ב־Ask ומוכר ב־Bid מפסיד חלק ניכר מההשקעה רק על הכניסה והיציאה.","wrong":"המרווח, {c115.spread}, נראה קטן בדולרים, אבל ביחס לאופציה שעולה {c115.ask} הוא חלק גדול מהמחיר. זה המחיר של פקודת שוק באופציה זולה או לא נזילה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"6.3-c2","type":"concept","title":"פקודה משולבת: Spread בפקודה אחת","body":"ב־Spread יש לפחות שתי רגליים. למשל ה־Bull Call Spread משיעור 5.4: קונים Call במימוש $100, וכותבים Call במימוש $105.\n\nאפשר לשלוח שתי פקודות נפרדות, אבל אז אחת יכולה להתבצע והשנייה לא, ונשארים עם חצי פוזיציה.\n\n**פקודה משולבת (Combo)** שולחת את שתי הרגליים יחד, עם **מחיר נטו** אחד: כמה משלמים בסך הכול.\n\nבדרך כלל זו פקודה \"מובטחת\": או ששתי הרגליים מתבצעות יחד, במחיר הנטו שקבעתם או טוב ממנו, או שאף אחת לא. \"מובטחת\" כאן אומר שלא תישארו עם רגל אחת. זה לא אומר שהפקודה תתבצע.\n\nאצל חלק מהברוקרים יש גם סוג \"לא מובטח\", שבו רגל אחת יכולה להתבצע לבד. בדקו איזה סוג אתם שולחים.","source":"Cboe Rule 5.33 (Complex Orders); Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"6.3-q4","type":"mcq","prompt":"למה לשלוח Spread כ**פקודה משולבת** ולא כשתי פקודות נפרדות?","options":[{"text":"שתי הרגליים מתבצעות יחד, במחיר הנטו שקבעתם או טוב ממנו, או שאף אחת לא"},{"text":"פקודה משולבת תמיד מתבצעת במחיר טוב יותר"},{"text":"בפקודה משולבת אין מרווח בין Bid ל־Ask"},{"text":"פקודה משולבת פוטרת מהצורך בהרשאה לאופציות"}],"correct":0,"explain":{"right":"בפקודה משולבת מובטחת לא נשארים עם רגל אחת בלי השנייה, וקובעים מראש מחיר נטו. אצל חלק מהברוקרים יש גם גרסה לא מובטחת, אז כדאי לבדוק.","wrong":"פקודה משולבת לא מבטיחה מחיר טוב יותר ולא מבטלת מרווחים. מה שהיא כן נותנת: שתי הרגליים יחד, במחיר נטו אחד, או כלום."},"source":"Cboe Rule 5.33 (Complex Orders)"},{"id":"6.3-q5","type":"mcq","prompt":"אתם שולחים את ה־Spread כפקודה משולבת מוגבלת: קונים Call במימוש $100 וכותבים Call במימוש $105, במחיר נטו של {sp.debit} (לפני הכפלה ב־100). מה זה אומר?","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"cols":["bid","ask"]},"options":[{"text":"תשלמו לכל היותר {sp.debitCost} לחוזה על שתי הרגליים יחד, או שהפקודה לא תתבצע"},{"text":"תשלמו {sp.debit} על כל רגל בנפרד"},{"text":"הפקודה תתבצע בוודאות, במחיר של {sp.debitCost} לחוזה"},{"text":"הרגל הראשונה תתבצע מיד, והשנייה כשיגיע המחיר"}],"correct":0,"explain":{"right":"המחיר הנטו הוא מה שמשלמים על החבילה: Ask של הרגל הראשונה פחות Bid של השנייה, כאן `{c100.ask} − {c105.bid} = {sp.debit}`. לא תשלמו יותר מזה, וייתכן שהפקודה תחכה.","wrong":"מחיר נטו הוא הסכום על שתי הרגליים יחד: `{c100.ask} − {c105.bid} = {sp.debit}`, וכפול 100: {sp.debitCost}. בפקודה מוגבלת זה המקסימום, ואם השוק לא מסכים, הפקודה לא מתבצעת."},"source":"Cboe Rule 5.33 (Complex Orders)"},{"id":"6.3-s1","type":"spot-guru","prompt":"מצאו את המשפטים המטעים בפוסט על פקודות. יש בו גם משפטים נכונים.","channel":"ערוץ \"טריידר מהיר\"","claims":[{"t":"אני תמיד שולח פקודת שוק. ככה אף פעם לא מפספסים, ואין שום חיסרון.","bad":true,"why":"פקודת שוק כמעט תמיד מתבצעת, אבל המחיר לא מובטח. באופציות עם מרווח רחב זה יכול לעלות הרבה."},{"t":"פקודה מוגבלת לפעמים לא מתבצעת בכלל.","bad":false,"why":"נכון. המחיר מובטח, הביצוע לא."},{"t":"אם שמים פקודה מוגבלת באמצע, השוק תמיד ימלא אותה תוך דקה.","bad":true,"why":"אין הבטחה כזו. אם אף אחד לא מסכים למחיר, הפקודה ממתינה ואולי לא תתבצע."},{"t":"ב־Spread, פקודה משולבת עוזרת לא להישאר עם רגל אחת.","bad":false,"why":"נכון, בפקודה משולבת מובטחת. אצל חלק מהברוקרים יש גם גרסה לא מובטחת."}],"explain":{"right":"זיהיתם את שתי ההבטחות שאין להן כיסוי: פקודת שוק \"בלי חיסרון\" ופקודה מוגבלת שמתבצעת \"תמיד\".","wrong":"המטעים: פקודת שוק \"בלי שום חיסרון\" (המחיר לא מובטח) ופקודה מוגבלת שמתבצעת \"תמיד\" (הביצוע לא מובטח). השניים האחרים נכונים."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 2"}],"summary":["**פקודת שוק**: הביצוע כמעט מובטח, **המחיר לא**. בקנייה משלמים בדרך כלל Ask.","**פקודה מוגבלת**: **המחיר מובטח**, הביצוע לא.","באופציות זולות או לא נזילות המרווח הוא חלק גדול מהמחיר, ופקודת שוק מרגישה את זה.","**פקודה משולבת** שולחת כמה רגליים יחד, במחיר נטו אחד, או כלום."],"ready":true,"unit":"6","chainSet":{"ticker":"XYZ","S":102.4,"r":0.04,"iv":0.28,"strikes":[90,95,100,105,110,115],"expiries":[{"id":"30","label":"30 יום","days":30,"call":{"vol":[12,48,1320,2450,860,0],"oi":[410,950,5200,8730,3100,1240],"last":{"115":0.6}},"put":{"vol":[35,410,1880,620,95,8],"oi":[2050,4300,6900,2700,640,150]}},{"id":"58","label":"58 יום","days":58,"call":{"vol":[5,20,240,610,310,140],"oi":[300,820,2900,4100,2200,1050]},"put":{"vol":[10,90,330,150,40,2],"oi":[900,1600,3100,1300,400,90]}}],"skew":0.25}},{"id":"6.4","title":"בונים Spread בשרשרת","minutes":6,"objective":"לבנות Bull Call Spread מתוך שרשרת אופציות: למצוא את המחיר של כל רגל, לחשב את המחיר נטו, ולקרוא את הגרף בפקיעה.","chainSetFrom":"6.1","spread":{"exp":"30","type":"call","long":100,"short":105,"name":"Bull Call Spread","desc":"קונים Call במימוש $100, כותבים Call במימוש $105"},"items":[{"id":"6.4-c1","type":"concept","title":"מהגרף לשרשרת","body":"בשיעור 5.4 למדתם **Bull Call Spread**: קונים Call, וכותבים Call במימוש גבוה יותר, באותה פקיעה.\n\nעכשיו נבנה אותו מתוך השרשרת של XYZ: קונים Call במימוש $100, וכותבים Call במימוש $105, בפקיעה של 30 יום.\n\nבשיעור 5.4 המניה הייתה במחיר $100 והמחירים היו עגולים. כאן XYZ במחיר {S}, קונים ב־Ask וכותבים ב־Bid, ולכן המספרים יוצאים אחרים. השיטה אותה שיטה: מוצאים את המחיר של כל רגל, מחשבים נטו, וקוראים את הגרף.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"cols":["bid","ask"]},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.4-q1","type":"chain-tap","tip":"רגל ראשונה: קונים. רגל שנייה: כותבים.","prompt":"רגל ראשונה: **קונים** Call במימוש $100. לחצו על המחיר שתשלמו בקנייה מיידית.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"cols":["bid","ask"]},"answer":{"exp":"30","type":"call","K":100,"col":"ask"},"explain":{"right":"קונים ב־Ask: {c100.ask} לאופציה.","wrong":"בקנייה משלמים **Ask**. ב־Call במימוש $100: {c100.ask} לאופציה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.4-q2","type":"chain-tap","prompt":"רגל שנייה: **כותבים** Call במימוש $105 (Sell to Open). לחצו על המחיר שתקבלו במכירה מיידית.","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"cols":["bid","ask"]},"answer":{"exp":"30","type":"call","K":105,"col":"bid"},"explain":{"right":"כותבים, כלומר מוכרים, ב־Bid: {c105.bid} לאופציה.","wrong":"כתיבה היא מכירה, ובמכירה מיידית מקבלים **Bid**. ב־Call במימוש $105: {c105.bid} לאופציה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.4-q3","type":"mcq","prompt":"קניתם Call במימוש $100 ב־Ask, {c100.ask}, וכתבתם Call במימוש $105 ב־Bid, {c105.bid}. כמה עולה ה־Spread נטו, לחוזה, לפני עמלות?","options":[{"text":"{sp.debitCost}"},{"text":"{sp.longCost}"},{"text":"{sp.shortCredit}"}],"correct":0,"explain":{"right":"`{c100.ask} − {c105.bid} = {sp.debit}`, כלומר {sp.debitCost} לחוזה. Long Call לבד היה עולה {sp.longCost}.","wrong":"משלמים על הרגל הראשונה ומקבלים על השנייה: `{c100.ask} − {c105.bid} = {sp.debit}`, פי 100: {sp.debitCost}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.4-q4","type":"chart-mcq","start":110,"prompt":"זה הגרף בפקיעה של ה־Spread: קניתם Call במימוש $100, כתבתם Call במימוש $105, ושילמתם נטו {sp.debitCost} לחוזה. מה הרווח או ההפסד לחוזה אם בפקיעה המניה במחיר $110?","hint":"הזיזו את המחוון. שימו לב לקו מימין למחיר $105.","options":[{"text":"רווח של {sp.maxProfit}"},{"text":"רווח של {sp.shortCredit}"},{"text":"הפסד של {sp.maxLoss}"},{"text":"רווח בלי תקרה"}],"correct":0,"explain":{"right":"מעל $105 הקו שטוח: כל דולר שה־Call הראשון מרוויח, ה־Call שכתבתם מפסיד. הרווח המקסימלי הוא {sp.maxProfit}.","wrong":"מעל $105 שתי הרגליים מתקזזות, והקו שטוח. הרווח נעצר על {sp.maxProfit}: ההפרש בין המימושים, $5, פחות {sp.debit} ששילמתם, פי 100."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.4-q5","type":"chart-mcq","start":95,"prompt":"אותו Spread (קניתם Call במימוש $100, כתבתם Call במימוש $105, שילמתם נטו {sp.debitCost} לחוזה). מה הרווח או ההפסד לחוזה אם בפקיעה המניה במחיר $95?","options":[{"text":"הפסד של {sp.maxLoss}"},{"text":"הפסד של {sp.longCost}"},{"text":"$0"}],"correct":0,"explain":{"right":"מתחת למחיר $100 שתי האופציות פוקעות בלי ערך, ומפסידים את מה ששילמתם נטו: {sp.maxLoss}. זה ההפסד המקסימלי. ובפקיעה ה־Spread מפסיד בכל מחיר מתחת למחיר {sp.be}: המימוש $100 ועוד {sp.debit} ששילמתם.","wrong":"מתחת למחיר $100 שתי האופציות פוקעות בלי ערך. ההפסד הוא מה ששילמתם נטו, {sp.maxLoss}, ולא המחיר של Long Call לבד ({sp.longCost})."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"6.4-q6","type":"mcq","fmt":"usd","chain":{"exp":"30","view":"call","lockExp":true,"lockView":true,"cols":["bid","ask"]},"prompt":"ב־Spread משלמים מרווח על שתי רגליים. ב־Call במימוש $100 המרווח בין Bid ל־Ask הוא {c100.spread} לאופציה, וב־Call במימוש $105 הוא {c105.spread}. נכנסתם ל־Spread ומיד יצאתם ממנו, והמחירים לא זזו. כמה הפסדתם בגלל המרווחים, לחוזה אחד מכל רגל?","options":[{"v":30},{"v":20},{"v":10},{"v":15}],"correct":0,"check":{"fn":"spreadSum","args":{"a":"@c100.spread","b":"@c105.spread"}},"explain":{"right":"בכל רגל קונים ב־Ask ומוכרים ב־Bid, או להפך: `({c100.spread} + {c105.spread}) × 100 = $30`. בפוזיציה של שתי רגליים משלמים שני מרווחים.","wrong":"מחברים את המרווחים של שתי הרגליים ומכפילים ב־100: `({c100.spread} + {c105.spread}) × 100 = $30`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["בונים Spread מהשרשרת רגל אחרי רגל: את הקנויה ב־**Ask**, את הכתובה ב־**Bid**.","בדוגמה: עולה {sp.debitCost} במקום {sp.longCost}. ההפסד המקסימלי, בפקיעה ולפני עמלות, {sp.maxLoss}, וה־Spread מפסיד בכל מחיר מתחת למחיר {sp.be}.","הרווח המקסימלי: {sp.maxProfit}. אותה צורה כמו בשיעור 5.4, עם מחירים של שוק.","בכל רגל משלמים מרווח. ב־Spread משלמים אותו פעמיים."],"ready":true,"unit":"6","chainSet":{"ticker":"XYZ","S":102.4,"r":0.04,"iv":0.28,"strikes":[90,95,100,105,110,115],"expiries":[{"id":"30","label":"30 יום","days":30,"call":{"vol":[12,48,1320,2450,860,0],"oi":[410,950,5200,8730,3100,1240],"last":{"115":0.6}},"put":{"vol":[35,410,1880,620,95,8],"oi":[2050,4300,6900,2700,640,150]}},{"id":"58","label":"58 יום","days":58,"call":{"vol":[5,20,240,610,310,140],"oi":[300,820,2900,4100,2200,1050]},"put":{"vol":[10,90,330,150,40,2],"oi":[900,1600,3100,1300,400,90]}}],"skew":0.25}},{"id":"6.5","title":"עלויות","minutes":7,"objective":"לחשב את העלות הכוללת של עסקה, עמלות ומרווחים, כאחוז מהרווח האפשרי, ולראות למה היא כבדה במיוחד באסטרטגיות של הרבה רגליים.","items":[{"id":"6.5-c1","type":"concept","title":"שתי עלויות בכל עסקה","body":"עד עכשיו כל המספרים בקורס היו \"לפני עמלות\". במציאות כל עסקה עולה כסף, עוד לפני שהשוק זז.\n\n**1. עמלה.** הברוקר גובה סכום קבוע לכל חוזה, בכל פעולה: גם בפתיחה וגם בסגירה. בדוגמאות כאן נשתמש בעמלה של $1 לחוזה. אצל כל ברוקר המחיר שונה, ויש ברוקרים שגובים עמלת מינימום לפקודה.\n\n**2. המרווח.** בשיעור 2.7 ראינו שקונים במחיר ה־Ask ומוכרים במחיר ה־Bid. ההפרש ביניהם הוא עלות, גם אם אף אחד לא שולח עליה חשבונית.\n\nושני דברים שקל לשכוח:\n**כל רגל משלמת לחוד.** פוזיציה של ארבע רגליים, כמו Iron Condor, משלמת ארבע עמלות וארבעה מרווחים בכניסה, ושוב ביציאה אם סוגרים לפני הפקיעה. אופציה שפוקעת בלי ערך לא משלמת עלות סגירה.\n**העלות ודאית, והרווח לא.** את העמלה והמרווח משלמים בכל עסקה, גם בעסקאות המפסידות.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q1","type":"mcq","fmt":"usd","prompt":"פתחתם פוזיציה של ארבע רגליים, חוזה אחד בכל רגל, ואחר כך סגרתם את כולה. העמלה היא $1 לחוזה בכל פעולה. כמה עמלות שילמתם בסך הכול?","options":[{"v":8},{"v":4},{"v":1},{"v":2}],"correct":0,"check":{"fn":"feeTotal","args":{"per":1,"contracts":1,"legs":4,"trips":2}},"explain":{"right":"ארבע רגליים, פעמיים (פתיחה וסגירה): `4 × 2 × $1 = $8`.","wrong":"כל רגל משלמת עמלה גם בפתיחה וגם בסגירה: `4 × 2 × $1 = $8`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q2","type":"mcq","fmt":"usd","prompt":"אופציה מצוטטת עם Bid של $1.90 ו־Ask של $2.10. קניתם חוזה אחד במחיר ה־Ask, ומיד מכרתם אותו במחיר ה־Bid. כמה הפסדתם בגלל המרווח, לפני עמלות?","options":[{"v":20},{"v":2},{"v":200},{"v":10}],"correct":0,"check":{"fn":"roundTrip","args":{"ask":2.1,"bid":1.9}},"explain":{"right":"קניתם במחיר $2.10 ומכרתם במחיר $1.90: `($2.10 − $1.90) × 100 = $20`. המחיר לא זז, והכסף הלך.","wrong":"ההפרש בין ה־Ask ל־Bid הוא $0.20 לאופציה, וחוזה הוא 100 מניות: `($2.10 − $1.90) × 100 = $20`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-c2","type":"concept","title":"מודדים עלות מול הרווח האפשרי","body":"$8 עמלות נשמע זניח. השאלה היא ביחס למה.\n\nקחו את ה־Iron Condor משיעור 5.8: ארבע רגליים, ורווח מקסימלי של $200.\n**עמלות:** $8, פתיחה וסגירה.\n**מרווחים:** נניח שבכל רגל המרווח הוא $0.10. לעומת מחיר האמצע, כל קנייה או מכירה עולה חצי מהמרווח: $0.05 לאופציה, כלומר $5 לחוזה. ארבע רגליים, פעמיים: `4 × 2 × $5 = $40`.\n**סך הכול: $48.**\n\nכמעט רבע מהרווח המקסימלי הלך על עלויות, עוד לפני שהשוק עשה משהו. ואם העסקה מפסידה, העלויות מתווספות להפסד.\n\n**מה מגדיל את משקל העלויות:**\nהרבה רגליים.\nרווח קטן לעסקה.\nאופציות לא נזילות, עם מרווח רחב.\nמסחר תכוף.","source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q3","type":"mcq","fmt":"pct","prompt":"Iron Condor עם ארבע רגליים, והרווח המקסימלי שלו $200. העלויות בפתיחה ובסגירה לפני הפקיעה: עמלות של $8 ומרווחים של $40. איזה חלק מהרווח המקסימלי הולך על עלויות?","options":[{"v":24},{"v":48},{"v":4},{"v":20}],"correct":0,"check":{"fn":"pctOf","args":{"part":48,"whole":200}},"explain":{"right":"סך העלויות: `$8 + $40 = $48`. מתוך הרווח המקסימלי: `$48 ÷ $200 = 24%`. גם אם הכול הולך לפי התוכנית, כמעט רבע מהרווח כבר שולם.","wrong":"מחברים את העלויות, `$8 + $40 = $48`, ומחלקים ברווח המקסימלי: `$48 ÷ $200 = 24%`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q4","type":"mcq","fmt":"pct","prompt":"קניתם 10 חוזים של Call זול במחיר $0.05 לאופציה, כלומר $5 לחוזה, ובסך הכול $50. העמלה היא $1 לחוזה, בקנייה ובמכירה: $20 בסך הכול. מה גודל העמלות ביחס לסכום ששילמתם על האופציות?","options":[{"v":40},{"v":2},{"v":20},{"v":10}],"correct":0,"check":{"fn":"pctOf","args":{"part":20,"whole":50}},"explain":{"right":"`$20 ÷ $50 = 40%`. באופציות זולות מאוד העמלה היא חלק גדול מהעסקה, והאופציה צריכה לעלות הרבה רק כדי לכסות אותה.","wrong":"העמלות הן $20 והאופציות עלו $50: `$20 ÷ $50 = 40%`. ככל שהאופציה זולה יותר, העמלה כבדה יותר ביחס אליה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q7","type":"mcq","prompt":"Butterfly (שיעור 5.9) בנוי מארבעה חוזים: Call קנוי אחד, שני Calls כתובים, ו־Call קנוי נוסף. הפוזיציה כולה עולה $100. למה העלויות חשובות כאן במיוחד?","options":[{"text":"ארבעה חוזים משלמים עמלה ומרווח בכניסה וביציאה, וזה חלק גדול מפוזיציה של $100"},{"text":"הן לא חשובות, כי הפוזיציה זולה והעמלה קטנה בהתאם"},{"text":"כי ב־Butterfly העמלה מחושבת לפי הרווח המקסימלי, ולא לפי מספר החוזים"}],"correct":0,"explain":{"right":"עלויות נמדדות מול גודל העסקה. כאן יש ארבעה חוזים ופוזיציה קטנה: כמה עשרות דולרים של עמלות ומרווחים הם חלק ניכר מהסכום ששילמתם, $100.","wrong":"דווקא כי הפוזיציה זולה, העלויות כבדות: ארבעה חוזים, עמלה ומרווח על כל אחד, מול פוזיציה של $100 בלבד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q5","type":"mcq","prompt":"שני סוחרים משלמים אותה עמלה לחוזה. מי מהם מושפע יותר מעלויות?","options":[{"text":"מי שפותח וסוגר כל שבוע פוזיציות של ארבע רגליים, עם רווח מקסימלי קטן"},{"text":"מי שקונה Call אחד נזיל פעם בחודשיים"},{"text":"שניהם באותה מידה, כי העמלה לחוזה זהה"}],"correct":0,"explain":{"right":"הרבה רגליים, הרבה עסקאות ורווח קטן לעסקה: שלושת הדברים שמגדילים את משקל העלויות. בסוף השנה הן יכולות לקבוע אם הסוחר מרוויח או מפסיד.","wrong":"העמלה לחוזה זהה, אבל מספר החוזים והעסקאות לא. ארבע רגליים כל שבוע הן מאות עמלות ומרווחים בשנה, מול רווח קטן בכל עסקה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 10"},{"id":"6.5-q6","type":"mcq","prompt":"ערוץ מסחר מפרסם: \"האסטרטגיה שלנו הרוויחה $100 בעסקה ממוצעת!\" מה צריך לשאול קודם כול?","options":[{"text":"האם זה אחרי עמלות ומרווחים, ולפי אילו מחירי ביצוע"},{"text":"מה הייתה העסקה הכי רווחית של הערוץ"},{"text":"באיזה ברוקר הערוץ ממליץ להשתמש"}],"correct":0,"explain":{"right":"תוצאות שמחושבות לפי מחיר האמצע ובלי עמלות נראות טוב על הנייר. בפוזיציה של ארבע רגליים, העלויות יכולות למחוק חצי מהרווח הזה או יותר.","wrong":"השאלה הראשונה היא אם הרווח מחושב אחרי עלויות אמיתיות. תוצאות לפי מחיר האמצע ובלי עמלות לא משקפות את מה שסוחר מקבל בפועל."},"source":"עקרונות הקורס; Hull, Options, Futures, and Other Derivatives, פרק 10"}],"summary":["בכל עסקה משלמים **עמלה** ו**מרווח**, בפתיחה ובסגירה, לכל רגל לחוד.","מודדים עלות **כאחוז מהרווח האפשרי**, לא כסכום בדולרים.","הרבה רגליים, רווח קטן, אופציות לא נזילות ומסחר תכוף מגדילים את משקל העלויות.","העלות ודאית. הרווח לא."],"ready":true,"unit":"6"},{"id":"6.6","title":"ביטחונות (Margin)","minutes":7,"objective":"להבין מה הברוקר דורש כביטחון מכותב אופציות, למה הדרישה משתנה כשהמניה זזה, ומה קורה ב־Margin Call.","items":[{"id":"6.6-c1","type":"concept","title":"למה הברוקר רוצה ביטחונות","body":"מי שקונה אופציה משלם את הפרמיה במלואה, ובזה נגמר הסיכון שלו. הברוקר לא צריך ממנו שום דבר נוסף.\n\nמי ש**כותב** אופציה לקח על עצמו חובה שעלולה לעלות הרבה כסף. הברוקר רוצה לוודא שיהיה מאיפה לשלם, ולכן הוא \"נועל\" חלק מהכסף בחשבון. לסכום הזה קוראים **ביטחונות (Margin)**.\n\nכמה נועלים? תלוי בפוזיציה:\n**Put מגובה מזומן:** כל הסכום שיידרש לקניית המניות, מימוש × 100.\n**כתיבה חשופה** (Naked Put או Naked Call): רק חלק מהסכום, לפי נוסחה. בערך 20% משווי המניות, ועוד הפרמיה.\n**Spread בקרדיט** (שיעור 5.5): ההפרש בין המימושים × 100. הפרמיה שקיבלתם מקוזזת, כך שמכספכם ננעל ההפסד המקסימלי.\n\nאלה דרישות המינימום. ברוקר רשאי לדרוש יותר, ולשנות את הדרישה בלי הודעה מוקדמת.","source":"FINRA Rule 4210; Cboe Margin Manual"},{"id":"6.6-q1","type":"mcq","fmt":"usd","prompt":"אתם כותבים Put אחד במימוש $50 כ־Put מגובה מזומן, כלומר מחזיקים בחשבון את כל הסכום שיידרש לקניית המניות. כמה כסף זה?","options":[{"v":5000},{"v":50},{"v":1000},{"v":500}],"correct":0,"check":{"fn":"notional","args":{"K":50,"mult":100}},"explain":{"right":"בהקצאה קונים 100 מניות במחיר המימוש: `$50 × 100 = $5,000`. כשכל הסכום בחשבון לא יהיה Margin Call. אבל ההפסד האפשרי לא השתנה: אם המניה צונחת, אתם עדיין קונים אותה במחיר $50.","wrong":"חוזה אחד הוא 100 מניות, ובהקצאה קונים אותן במחיר המימוש: `$50 × 100 = $5,000`."},"source":"Cboe Margin Manual"},{"id":"6.6-c2","type":"concept","title":"כתיבה חשופה: הנוסחה","body":"בכתיבה חשופה על מניה, דרישת המינימום לחוזה אחד היא:\n\n**מחיר האופציה היום, ועוד 20% ממחיר המניה, פחות הסכום מחוץ לכסף.** הכול כפול 100.\n\nהסכום מחוץ לכסף הוא המרחק בין מחיר המניה למימוש, כשהאופציה מחוץ לכסף.\n\nדוגמה: מניה במחיר $100. כתבתם Put במימוש $95, והוא נסחר במחיר $2.\n\n**מחיר האופציה:** $2.\n**20% ממחיר המניה:** $20.\n**הסכום מחוץ לכסף:** `$100 − $95 = $5`.\n\n`$2 + $20 − $5 = $17`, כפול 100: **$1,700**.","source":"FINRA Rule 4210; Cboe Margin Manual"},{"id":"6.6-q2","type":"mcq","fmt":"usd","prompt":"מניה נסחרת במחיר $100. כתבתם Naked Call במימוש $105 וקיבלתם פרמיה של $2. לפי הנוסחה (מחיר האופציה, ועוד 20% ממחיר המניה, פחות הסכום מחוץ לכסף, כפול 100), מה דרישת הביטחונות?","options":[{"v":1700},{"v":200},{"v":10500},{"v":2200}],"correct":0,"check":{"fn":"nakedMargin","args":{"type":"call","S":100,"K":105,"prem":2}},"explain":{"right":"20% ממחיר המניה הם $20, וה־Call מחוץ לכסף בסכום של $5: `$2 + $20 − $5 = $17`, כפול 100 זה $1,700.","wrong":"מחשבים לאופציה אחת ואז כופלים ב־100: `$2 + $20 − $5 = $17`, כלומר $1,700. הסכום $2,200 יוצא אם שוכחים להפחית את הסכום מחוץ לכסף."},"source":"FINRA Rule 4210; Cboe Margin Manual"},{"id":"6.6-c2b","type":"concept","title":"שתי מסקנות מהנוסחה","body":"בדוגמה: Naked Put במימוש $95 על מניה במחיר $100, פרמיה של $2. הדרישה: $1,700.\n\n**1. הביטחונות הם לא תקרת ההפסד.** הדרישה היא $1,700. ההפסד המקסימלי של אותה פוזיציה הוא $9,300 (שיעור 4.1).\n\n**2. הדרישה משתנה כל יום.** היא תלויה במחיר המניה ובמחיר האופציה. כשהמניה יורדת, ה־Put מתייקר והוא כבר לא מחוץ לכסף, ולכן הדרישה **עולה**. בדיוק כשהפוזיציה מפסידה.\n\nלכן Short Strangle ו־Short Straddle (שיעורים 5.6 ו־5.7), שהם שתי כתיבות חשופות, יכולים לדרוש יותר ויותר ביטחונות בדיוק כשהמניה בורחת לאחד הצדדים.","source":"FINRA Rule 4210; Cboe Margin Manual"},{"id":"6.6-q5","type":"mcq","fmt":"usd","prompt":"המניה נסחרת במחיר $100. כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה. הברוקר דרש ביטחונות של $1,700. מה ההפסד המקסימלי של הפוזיציה, לחוזה אחד?","options":[{"v":9300},{"v":1700},{"v":1500},{"v":200}],"correct":0,"check":{"fn":"maxLoss","args":{"type":"put","side":"short","K":95,"prem":2,"mult":100}},"explain":{"right":"`($95 − $2) × 100 = $9,300`. הביטחונות הם רק פיקדון. אם המניה ממשיכה לרדת, ההפסד ממשיך הרבה מעבר לסכום הזה.","wrong":"הביטחונות ($1,700) הם לא תקרת ההפסד. ההפסד המקסימלי נשאר `($95 − $2) × 100 = $9,300`."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"6.6-q3","type":"mcq","fmt":"usd","prompt":"כתבתם Put במימוש $95 כשהמניה נסחרה במחיר $100, ודרישת הביטחונות הייתה $1,700. עכשיו המניה ירדה למחיר $85, וה־Put נסחר במחיר $11. הוא כבר בתוך הכסף, אז אין מה להפחית.\n\nלפי הנוסחה (מחיר האופציה היום, ועוד 20% ממחיר המניה, כפול 100), מה דרישת הביטחונות עכשיו?","options":[{"v":2800},{"v":1700},{"v":1100},{"v":1900}],"correct":0,"check":{"fn":"nakedMargin","args":{"type":"put","S":85,"K":95,"prem":11}},"explain":{"right":"20% ממחיר $85 הם $17, והאופציה שווה עכשיו $11: `$11 + $17 = $28`, כפול 100 זה $2,800. הדרישה עלתה בדיוק כשהפוזיציה מפסידה.","wrong":"מחשבים מחדש לפי המחירים של היום: `$11 + $17 = $28`, כלומר $2,800. הדרישה לא נשארת $1,700: היא עולה כשהמניה זזה נגדכם."},"source":"FINRA Rule 4210; Cboe Margin Manual"},{"id":"6.6-c3","type":"concept","title":"Margin Call","body":"כשהמניה זזה נגד הכותב, קורים שני דברים יחד: הפוזיציה מפסידה, כך ששווי החשבון יורד, ודרישת הביטחונות עולה.\n\n**דוגמה:** בחשבון $3,000. כתבתם Put, והדרישה הייתה $1,700. המניה ירדה: הפוזיציה הפסידה $900, ובחשבון נשארו $2,100. הדרישה עלתה בינתיים לסכום של $2,800. חסרים $700.\n\nזה **Margin Call**: דרישה מהברוקר להפקיד כסף או לצמצם פוזיציות.\n\n**מה חשוב לדעת:**\nהברוקר לא חייב לחכות. לפי הסכם החשבון, הוא רשאי לסגור פוזיציות בלי לשאול ובלי להודיע מראש.\nהוא סוגר במחיר השוק, לעיתים קרובות ברגע גרוע, כשהמרווחים רחבים.\nאתם לא בוחרים אילו פוזיציות ייסגרו.\nיש ברוקרים שסוגרים אוטומטית, בלי Margin Call בכלל.\n\nלכן \"יש לי מספיק ביטחונות היום\" היא לא תשובה לשאלה אם הפוזיציה בגודל נכון. התשובה לזה היא ההפסד המקסימלי, משיעור 4.2.","source":"FINRA Rule 4210; SEC, Investor Bulletin: Understanding Margin Accounts"},{"id":"6.6-q4","type":"mcq","prompt":"קיבלתם Margin Call ולא הפקדתם כסף. מה הברוקר רשאי לעשות?","options":[{"text":"לסגור פוזיציות בחשבון במחיר השוק, בלי לבקש אישור"},{"text":"לחכות עד שתחליטו איזו פוזיציה לסגור"},{"text":"רק לחסום פתיחה של פוזיציות חדשות"}],"correct":0,"explain":{"right":"לפי הסכם החשבון, הברוקר רשאי לסגור פוזיציות כדי לכסות את החוסר, בלי אישור ובלי הודעה מראש, ובמחיר שיהיה באותו רגע.","wrong":"הברוקר לא חייב לחכות ולא חייב לשאול. הוא רשאי לסגור פוזיציות במחיר השוק כדי לכסות את החוסר, והוא בוחר אילו."},"source":"SEC, Investor Bulletin: Understanding Margin Accounts"},{"id":"6.6-q6","type":"mcq","fmt":"usd","prompt":"Bull Put Spread משיעור 5.5: כתבתם Put במימוש $95 וקניתם Put במימוש $90, וקיבלתם $1 נטו (לפני הכפלה ב־100).\n\nכמה כסף משלכם הברוקר נועל לחוזה אחד, אחרי קיזוז הפרמיה נטו שקיבלתם?","options":[{"v":400},{"v":9300},{"v":500},{"v":100}],"correct":0,"check":{"fn":"creditSpreadRisk","args":{"width":5,"credit":1}},"explain":{"right":"הדרישה היא ההפרש בין המימושים, $500, והפרמיה שקיבלתם מקוזזת ממנה: `($5 − $1) × 100 = $400`. זה בדיוק ההפסד המקסימלי, והוא לא גדל כשהמניה זזה. זה ההבדל המרכזי מכתיבה חשופה. ההפסד המקסימלי עדיין אפשרי במלואו.","wrong":"הדרישה היא ההפרש בין המימושים, $500, ואחרי קיזוז הפרמיה של $100 ננעלים מכספכם `($5 − $1) × 100 = $400`. הסכום $9,300 הוא ההפסד המקסימלי של Naked Put במימוש $95, בלי ה־Put הקנוי."},"source":"Cboe Margin Manual"},{"id":"6.6-q7","type":"mcq","prompt":"במסך הברוקר מופיע \"כוח קנייה\" (Buying Power): הסכום שפנוי לפתיחת פוזיציות חדשות, לפי דרישת הביטחונות. הוא מספיק לכתיבת 10 חוזי Naked Put. מה זה אומר?","options":[{"text":"שהברוקר מרשה את זה היום. זה לא אומר שהגודל מתאים לחשבון"},{"text":"שהברוקר בדק את החשבון ומצא שהסיכון סביר בשבילכם"},{"text":"שההפסד המקסימלי של 10 החוזים מכוסה במלואו בחשבון"}],"correct":0,"explain":{"right":"כוח קנייה מחושב לפי דרישת המינימום של היום. הוא מגן על הברוקר, לא עליכם, ויכול להצטמצם מחר. את הגודל קובעים לפי ההפסד המקסימלי.","wrong":"כוח קנייה הוא הגבול של הברוקר, לפי דרישת הביטחונות של היום. הוא לא בדיקת התאמה ולא כיסוי של ההפסד המקסימלי. את הגודל קובעים אתם, לפי ההפסד המקסימלי."},"source":"FINRA Rule 4210"}],"summary":["**ביטחונות (Margin):** כסף שהברוקר נועל כדי לוודא שכותב יעמוד בחובה שלו.","בכתיבה חשופה הדרישה היא רק חלק מההפסד האפשרי, והיא **עולה כשהמניה זזה נגדכם**.","ב־**Margin Call** הברוקר רשאי לסגור פוזיציות בלי לשאול.","ביטחונות וכוח קנייה הם הגבול של הברוקר. **הם לא ההפסד המקסימלי.**"],"ready":true,"unit":"6"},{"id":"6.7","title":"רמות הרשאה לאופציות","minutes":5,"objective":"להבין שהברוקר מאשר מסחר באופציות לפי רמות, מה בדרך כלל כל רמה מאפשרת, ולמה כתיבה חשופה דורשת את הרמה הגבוהה.","items":[{"id":"6.7-c1","type":"concept","title":"הברוקר צריך לאשר","body":"בארה\"ב, ברוקר חייב לאשר חשבון למסחר באופציות לפני העסקה הראשונה, ולתת לכם את מסמך הסיכונים של OCC. הוא שואל על ניסיון, הכנסה, נכסים ומטרות, ולפי זה נותן **רמת הרשאה** (Options Approval Level). בנק או ברוקר ישראלי עושים תהליך אישור משלהם.\n\nמספר הרמות ומה כלול בכל אחת **משתנים מברוקר לברוקר**. בדרך כלל כל רמה כוללת את מה שברמות שמתחתיה. החלוקה הנפוצה בערך כזו:\n**רמה 1** (הנמוכה): Covered Call (שיעור 5.1), ולפעמים גם Put מגובה מזומן (שיעור 5.3).\n**רמה 2**: קנייה של Call ו־Put.\n**רמה 3**: Spreads. בדרך כלל דורשת חשבון מרג'ין: חשבון שבו הברוקר מחזיק ביטחונות (שיעור 6.6).\n**רמה 4** (הגבוהה): **כתיבה חשופה**, כמו Naked Call.","source":"FINRA Rule 2360(b)(16) (Opening of Accounts); OCC, Characteristics and Risks of Standardized Options"},{"id":"6.7-a1","type":"analogy","title":"דרגות ברישיון נהיגה","body":"רישיון לרכב פרטי לא מאפשר לנהוג במשאית, ורישיון למשאית לא מאפשר לנהוג באוטובוס. ככל שהרכב כבד יותר והנזק האפשרי גדול יותר, צריך דרגה גבוהה יותר.\n\nרמות הרשאה לאופציות בנויות בהיגיון דומה: קודם מה שמכוסה במלואו במניות או במזומן, אחר כך קנייה, ובסוף כתיבה חשופה, שבה ההפסד האפשרי הכי גדול.","breaks":"דרגות הרישיון קבועות בחוק ושוות לכולם. רמות ההרשאה נקבעות על ידי כל ברוקר, והן שונות בין ברוקרים. ועוד: רישיון ניתן אחרי מבחן מעשי. הרשאה לאופציות ניתנת לפי שאלון, והיא לא אומרת שאתם יודעים לנהל את הסיכון."},{"id":"6.7-l1","type":"mcq","life":true,"prompt":"יש לכם רישיון לרכב פרטי בלבד. חבר מבקש שתסיעו את האוטובוס של הקבוצה לטיול. מה המצב?","options":[{"text":"אסור לכם לנהוג באוטובוס, כי הרישיון לא כולל אותו"},{"text":"מותר, כי יש לכם רישיון נהיגה"},{"text":"מותר, אם נוהגים לאט"}],"correct":0,"explain":{"right":"כל דרגה מאפשרת רק את מה שכלול בה. גם ברוקר לא יאפשר פקודה שדורשת רמה שאין לכם, למשל Sell to Open על Call בלי מניות.","wrong":"רישיון מאפשר רק את הדרגה שלו. כך גם הרשאה לאופציות: עם רמה נמוכה הברוקר ידחה פקודה שדורשת רמה גבוהה."},"source":"דוגמה מהחיים"},{"id":"6.7-q1","type":"mcq","prompt":"איזו מהפעולות דורשת בדרך כלל את רמת ההרשאה **הגבוהה ביותר**?","options":[{"text":"כתיבת Naked Call: Call בלי מניות"},{"text":"קניית Call"},{"text":"קניית Put"},{"text":"Covered Call: כתיבת Call על מניות שיש לכם"}],"correct":0,"explain":{"right":"ב־Naked Call ההפסד לא מוגבל (שיעור 1.4), והוא דורש ביטחונות. לכן הוא ברמה הגבוהה.","wrong":"ברמה הגבוהה נמצאת הכתיבה החשופה. ב־Naked Call ההפסד בלתי מוגבל, כי המניה יכולה לעלות בלי תקרה. בקניית Call או Put ההפסד מוגבל לפרמיה."},"source":"FINRA Rule 2360; OCC, Characteristics and Risks of Standardized Options"},{"id":"6.7-q2","type":"mcq","prompt":"למה Covered Call נמצא בדרך כלל ברמה **נמוכה**, למרות שזו כתיבה של Call?","options":[{"text":"המניות שכבר יש לכם מכסות את ההתחייבות למסור 100 מניות"},{"text":"כי ב־Covered Call אי אפשר לקבל הקצאה"},{"text":"כי ב־Covered Call אין שום סיכון"}],"correct":0,"explain":{"right":"אם תקבלו הקצאה, תמסרו מניות שכבר יש לכם. אין סיכון של הפסד בלתי מוגבל מעליית המניה. נשאר הסיכון של ירידת המניה עצמה.","wrong":"ב־Covered Call עדיין אפשר לקבל הקצאה, ויש סיכון: המניה יכולה לרדת. אבל המניות שיש לכם מכסות את ההתחייבות, ולכן אין סיכון של הפסד בלתי מוגבל, כמו ב־Naked Call."},"source":"OCC, Characteristics and Risks of Standardized Options: Covered call writing"},{"id":"6.7-q3","type":"mcq","prompt":"עברתם לברוקר אחר. אצל הקודם הייתה לכם \"רמה 2\". מה נכון?","options":[{"text":"צריך לבקש הרשאה מחדש, ו\"רמה 2\" אצל החדש יכולה לכלול דברים אחרים"},{"text":"\"רמה 2\" זהה בכל הברוקרים, אז ההרשאה עוברת אוטומטית"},{"text":"הרשאה לאופציות נדרשת רק פעם אחת בחיים"}],"correct":0,"explain":{"right":"כל ברוקר קובע את הרמות ומאשר בעצמו. כדאי לקרוא מה בדיוק כלול בכל רמה אצלו.","wrong":"אין חלוקה אחידה. כל ברוקר מאשר חשבון בעצמו, ומה שנקרא \"רמה 2\" אצל אחד יכול להיות שונה אצל אחר."},"source":"FINRA Rule 2360(b)(16) (Opening of Accounts)"},{"id":"6.7-q4","type":"mcq","prompt":"הברוקר אישר לכם את הרמה הגבוהה, כולל כתיבה חשופה. מה זה אומר?","options":[{"text":"שמותר לכם לשלוח את הפקודות האלה. זה לא אומר שהן מתאימות לכם או בטוחות"},{"text":"שהברוקר בדק ומצא שהאסטרטגיות האלה בטוחות עבורכם"},{"text":"שההפסד שלכם בכתיבה חשופה מוגבל לביטחונות שהפקדתם"}],"correct":0,"explain":{"right":"הרשאה היא היתר טכני, לא המלצה ולא ביטוח. ההפסד בכתיבה חשופה יכול להיות גדול בהרבה מהביטחונות.","wrong":"האישור מבוסס על שאלון, והוא לא בודק שאתם יודעים לנהל את הסיכון. ההפסד בכתיבה חשופה לא מוגבל לביטחונות: ב־Naked Call הוא בלתי מוגבל."},"source":"OCC, Characteristics and Risks of Standardized Options: Risks of option writers"},{"id":"6.7-q5","type":"mcq","prompt":"ההרשאה שלכם כוללת Covered Call וקנייה של Call ו־Put, אבל לא כתיבת Put. שלחתם **Sell to Open** על Put. מה צפוי לקרות?","options":[{"text":"הברוקר ידחה את הפקודה, כי כתיבת Put לא כלולה בהרשאה שלכם"},{"text":"הפקודה תתבצע, כי Put הוא אופציה כמו כל אופציה"},{"text":"הפקודה תהפוך אוטומטית ל־Buy to Open"}],"correct":0,"explain":{"right":"Sell to Open הוא כתיבה. אם היא לא כלולה ברמה שלכם, הברוקר ידחה את הפקודה.","wrong":"Sell to Open פותח Short Put, כלומר כתיבה. ההרשאה שלכם לא כוללת כתיבת Put, ולכן הברוקר ידחה את הפקודה. הוא לא משנה אותה בשבילכם."},"source":"FINRA Rule 2360"}],"summary":["ברוקר בארה\"ב חייב **לאשר** חשבון לאופציות, לפי **רמות הרשאה**.","הרמות **שונות בין ברוקרים**, אבל העיקרון קבוע: ככל שההפסד האפשרי גדול יותר, הרמה גבוהה יותר.","**כתיבה חשופה** נמצאת ברמה הגבוהה, כי ההפסד בה יכול להיות בלתי מוגבל.","הרשאה היא **היתר**, לא המלצה ולא ביטוח."],"ready":true,"unit":"6"},{"id":"6.8","title":"מה קורה בפקיעה","minutes":6,"objective":"להכיר מימוש אוטומטי (אופציה בתוך הכסף בסכום של $0.01 ומעלה), להבין שחשבון קטן עלול להתעורר עם 100 מניות או דרישת ביטחונות, ושמחיר המניה יכול לזוז גם אחרי סגירת המסחר.","items":[{"id":"6.8-c1","type":"concept","title":"מימוש אוטומטי","body":"ביום הפקיעה, אחרי סגירת המסחר, המסלקה (OCC) בודקת כל אופציה על מניה או תעודת סל.\n\nאופציה שנסגרה **בתוך הכסף, אפילו בסנט אחד ($0.01)**, ממומשת אוטומטית. אלא אם ביקשתם מהברוקר אחרת.\n\nזה נקרא **מימוש אוטומטי**. לא צריך לעשות כלום כדי שהוא יקרה, וזו בדיוק הבעיה: הוא קורה גם אם שכחתם.","source":"OCC, Characteristics and Risks of Standardized Options; OCC Rule 805 (Expiration Date Exercise Procedure)"},{"id":"6.8-c1b","type":"concept","title":"מה מופיע בחשבון אחרי מימוש","body":"מימוש של חוזה אחד הוא עסקה של 100 מניות במחיר המימוש:\n\n**Long Call שמומש:** קניתם 100 מניות במחיר המימוש.\n\n**Long Put שמומש:** מכרתם 100 מניות במחיר המימוש. אם לא היו לכם מניות, נפתחה פוזיציית Short במניה: מכרתם מניות שאין לכם. לזה קוראים **מכירה בחסר**, ואם המניה עולה, ההפסד בלי תקרה.\n\nבצד השני, הכותבים מקבלים **הקצאה** ומבצעים את העסקה ההפוכה.","source":"OCC, Characteristics and Risks of Standardized Options; OCC Rule 805 (Expiration Date Exercise Procedure)"},{"id":"6.8-a1","type":"analogy","title":"מנוי שמתחדש מעצמו","body":"יש לכם מנוי לחדר כושר שמתחדש אוטומטית בסוף השנה, אלא אם ביטלתם מראש. שכחתם לבטל? בבוקר אחרי, החיוב כבר בחשבון.\n\nאופציה בתוך הכסף בפקיעה עובדת דומה: אם לא עשיתם כלום, היא ממומשת אוטומטית, ובחשבון מופיעות מניות או פוזיציה חדשה.","breaks":"חידוש מנוי עולה סכום קבוע וקטן. מימוש של אופציה אחת הוא עסקה של 100 מניות, ששווה פי 100 ממחיר המימוש, הרבה יותר מהפרמיה ששילמתם. ובניגוד למנוי, המימוש האוטומטי קורה רק אם האופציה בתוך הכסף."},{"id":"6.8-l1","type":"mcq","life":true,"prompt":"המנוי שלכם מתחדש אוטומטית ב־1 בינואר, אלא אם ביטלתם עד 31 בדצמבר. שכחתם. מה קורה?","options":[{"text":"המנוי מתחדש, והחיוב יורד מהחשבון"},{"text":"המנוי מתבטל, כי לא אישרתם"},{"text":"חדר הכושר שולח שאלה ומחכה לתשובה"}],"correct":0,"explain":{"right":"ברירת המחדל קובעת. כך גם במימוש אוטומטי: אם האופציה בתוך הכסף ולא ביקשתם אחרת, היא ממומשת.","wrong":"כשיש חידוש אוטומטי, ברירת המחדל קורית אם לא עשיתם כלום. באופציות זה מימוש אוטומטי של כל אופציה בתוך הכסף."},"source":"דוגמה מהחיים"},{"id":"6.8-q1","type":"mcq","fmt":"usd","prompt":"יש לכם Long Call על XYZ במימוש $100. ביום הפקיעה המניה נסגרת במחיר $100.50, ולא עשיתם כלום. כמה תשלמו על המניות במימוש האוטומטי של חוזה אחד?","options":[{"v":10000},{"v":50},{"v":100},{"v":10050}],"correct":0,"check":{"fn":"notional","args":{"K":100,"mult":100}},"explain":{"right":"ה־Call בתוך הכסף בסכום של $0.50, אז הוא ממומש אוטומטית: קונים 100 מניות במחיר המימוש. `$100 × 100 = $10,000`.","wrong":"במימוש קונים 100 מניות במחיר **המימוש**, לא במחיר השוק: `$100 × 100 = $10,000`. הרווח של $0.50 למניה הוא רק ההפרש."},"source":"OCC, Characteristics and Risks of Standardized Options: Exercise"},{"id":"6.8-q2","type":"mcq","prompt":"Long Call במימוש $100, והמניה נסגרת ביום הפקיעה **בדיוק** במחיר $100. מה קורה במימוש האוטומטי?","options":[{"text":"האופציה לא ממומשת אוטומטית, כי היא לא בתוך הכסף"},{"text":"היא ממומשת, כי היא על הכסף"},{"text":"היא ממומשת חצי: 50 מניות"}],"correct":0,"explain":{"right":"מימוש אוטומטי קורה רק כשהאופציה בתוך הכסף בסכום של $0.01 לפחות. על הכסף היא פשוט פוקעת, אלא אם המחזיק מבקש לממש.","wrong":"הסף הוא $0.01 **בתוך** הכסף. מחיר שווה למימוש לא עובר אותו, ולכן אין מימוש אוטומטי."},"source":"OCC Rule 805 (Expiration Date Exercise Procedure)"},{"id":"6.8-q3","type":"mcq","prompt":"בחשבון שלכם $2,000. יש לכם Long Call במימוש $50, והוא בתוך הכסף ביום הפקיעה. מה עלול לקרות אם לא תעשו כלום?","options":[{"text":"המימוש דורש $5,000. הברוקר עלול לדרוש ביטחונות, או לסגור את הפוזיציה בעצמו"},{"text":"שום דבר מיוחד: בלי מספיק כסף האופציה פשוט פוקעת, והרווח נכנס לחשבון"},{"text":"המסלקה תממש רק את החלק שיש לו כיסוי בחשבון, כלומר 40 מניות"}],"correct":0,"explain":{"right":"מימוש הוא קנייה של 100 מניות: `$50 × 100 = $5,000`. בחשבון של $2,000 זה יוצר חוסר, וברוקרים רבים סוגרים פוזיציות כאלה בעצמם, או לא מממשים אותן, או דורשים ביטחונות.","wrong":"באופציות על מניות אין \"תשלום הרווח\" בפקיעה: יש קנייה של 100 מניות במחיר המימוש, `$50 × 100 = $5,000`. כשאין כסף, נוצרת דרישת ביטחונות, או שהברוקר סוגר את הפוזיציה."},"source":"OCC, Characteristics and Risks of Standardized Options; Regulation T; FINRA Rule 4210"},{"id":"6.8-c2","type":"concept","title":"המניה ממשיכה לזוז אחרי הסגירה","body":"המסחר באופציות הפוקעות על מניות ותעודות סל נעצר ב־16:00 שעון ניו יורק (בדרך כלל 23:00 בישראל). אבל **המניה ממשיכה להיסחר במסחר המאוחר (After Hours)**, למשל אחרי דוח או חדשות.\n\nאחרי הסגירה יש למחזיקים עוד זמן קצר להודיע לברוקר שהם רוצים אחרת מברירת המחדל. זה עובד לשני הכיוונים: אפשר לבקש לממש אופציה שנסגרה קצת מחוץ לכסף, ואפשר לבקש **לא** לממש אופציה בתוך הכסף. לכן כותב שחשב שהוא בטוח עלול לקבל הקצאה.\n\nבבוקר שאחרי, החשבון יכול להיראות אחרת ממה שציפיתם. נרחיב על זה בשיעור 6.10.","source":"FINRA Rule 2360(b)(23); OCC Rule 805"},{"id":"6.8-q4","type":"mcq","prompt":"כתבתם Call במימוש $100. ביום הפקיעה המניה נסגרת במחיר $99.80, מחוץ לכסף. אחרי הסגירה יוצאות חדשות טובות, והמניה עולה במסחר המאוחר למחיר $101. מה יכול לקרות?","options":[{"text":"מחזיק של ה־Call יכול להודיע שהוא מממש, וייתכן שתקבלו הקצאה"},{"text":"שום דבר. מה שקובע הוא רק מחיר הסגירה"},{"text":"האופציה ממומשת חלקית, לפי השעה"}],"correct":0,"explain":{"right":"מימוש אוטומטי לפי הסגירה הוא רק ברירת מחדל. מחזיק יכול לבקש לממש גם אופציה שנסגרה מחוץ לכסף, וכותב עלול לגלות בבוקר שקיבל הקצאה.","wrong":"מחיר הסגירה קובע את ברירת המחדל בלבד. אחרי הסגירה למחזיקים יש זמן קצר להודיע על מימוש, ואם המניה קפצה, חלקם י
