ה שהמניה תעלה או תעמוד, ושהזמן יעבור: דלתא {pg:B.delta}, תטא {pg:B.thetax}. ועליית IV מייקרת את מה שכתב: וגה {pg:B.vegax}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"3.6-q5","type":"mcq","prompt":"ה־IV יורדת בחדות, והמניה לא זזה. איזו פוזיציה מרוויחה: A (קניתם 4 Call) או B (כתבתם 4 Put, במסך למטה)?","options":[{"text":"B, הכותבת: הוגה שלה שלילית"},{"text":"A, הקונה: הוגה שלה חיובית"},{"text":"שתיהן"}],"correct":0,"explain":{"right":"ירידת IV מוזילה אופציות. מי שכתב, מרוויח. מי שקנה, מפסיד.","wrong":"וגה חיובית מרוויחה מעליית IV, לא מירידה. כאן B, עם וגה {pg:B.vegax}, מרוויחה, ו־A מפסידה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19","posview":"B"},{"id":"3.6-q6","type":"mcq","prompt":"A: קניתם 4 חוזי Call במימוש $100. B: כתבתם 4 חוזי Put במימוש $100. (מניה $100, מימוש $100, 30 ימים, IV 25%.) הדלתא של A {pg:A.delta} מניות, ושל B {pg:B.delta}. המניה צונחת מיד בעשרה דולרים. לפי המודל, A משתנה ב־{pg:A.act@dS=-10} ו־B ב־{pg:B.act@dS=-10}. למה B נפגעת יותר, למרות שהדלתא של שתיהן דומה?","options":[{"text":"לגמא של B שלילית: ככל שהמניה יורדת, החשיפה שלה גדלה"},{"text":"כי B מחזיקה יותר חוזים"},{"text":"כי התטא של B שלילית"}],"correct":0,"explain":{"right":"ל־A גמא חיובית: בירידה הדלתא שלה קטנה, וההפסד מואט, עד לכל היותר הפרמיה. ל־B גמא שלילית: בירידה ה־Puts נכנסים לכסף והחשיפה גדלה.","wrong":"לשתיהן 4 חוזים, ול־B התטא דווקא חיובית. ההבדל הוא הגמא: ל־A חיובית, וההפסד מואט. ל־B שלילית, וההפסד מואץ."},"source":"Natenberg, Option Volatility and Pricing"}],"summary":["במסך הפוזיציה **הדלתא** במניות, **התטא** בדולרים ליום, **הוגה** בדולרים לנקודת IV.","תרחיש: דלתא × תנועה, ועוד חצי גמא × תנועה בריבוע, ועוד וגה × שינוי IV, ועוד תטא × ימים.","**קונה** אופציות: גמא וגם וגה חיוביות, תטא שלילית. **כותב**: הפוך.","שתי פוזיציות עם דלתא דומה יכולות להתנהג אחרת לגמרי בתנועה חדה."],"ready":true,"unit":"3"},{"id":"4.1","title":"הפסד מקסימלי ותרחישי קצה","minutes":7,"objective":"לחשב את ההפסד המקסימלי של פוזיציה לפני שנכנסים אליה, להבין מהו פער פתיחה (Gap) ולמה פקודת Stop לא מגינה מפניו.","params":{"pos":{"type":"put","side":"short","K":95,"prem":2,"mult":100}},"items":[{"id":"4.1-c1","type":"concept","title":"השאלה הראשונה: כמה אפשר להפסיד?","body":"לפני ששואלים \"כמה אפשר להרוויח\", שואלים: **מה הכי הרבה שאפשר להפסיד כאן, והאם החשבון שלי עומד בזה?**\n\nאת התשובות כבר ראיתם ביחידה 1, לחוזה אחד:\n**Long Call או Long Put:** הפרמיה ששילמתם. לא יותר.\n**Short Put:** (מימוש − פרמיה) × 100. מוגבל, אבל גדול.\n**Naked Call:** בלתי מוגבל.\n\nההפסד המקסימלי הוא לא תחזית. הוא התרחיש הגרוע ביותר. אצל קונים הוא שכיח: כל אופציה שפוקעת מחוץ לכסף מפסידה את כל הפרמיה. אצל כותבים הוא נדיר, אבל קורה. פוזיציה שהתרחיש הגרוע שלה מוחק את החשבון היא פוזיציה גדולה מדי, גם אם הסיכוי קטן.","source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"4.1-q1","type":"mcq","fmt":"usd","prompt":"כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה, כלומר $200 לחוזה. מה ההפסד המקסימלי לחוזה אחד?","options":[{"v":9300},{"v":200},{"v":9500},{"v":300}],"correct":0,"check":{"fn":"maxLoss","args":{"type":"put","side":"short","K":95,"prem":2,"mult":100}},"explain":{"right":"התרחיש הגרוע: המניה יורדת לאפס, ואתם קונים אותה במחיר $95. הפרמיה מקזזת מעט: `($95 − $2) × 100 = $9,300`.","wrong":"הפרמיה של $200 היא הרווח המקסימלי, לא ההפסד. בתרחיש הגרוע המניה שווה אפס ואתם קונים אותה במחיר המימוש: `($95 − $2) × 100 = $9,300`."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"4.1-c2","type":"concept","title":"פער פתיחה (Gap)","body":"מניה לא חייבת לעבור דרך כל מחיר בדרך למטה. היא יכולה להיסגר במחיר $100, ולהיפתח למחרת במחיר $80. בין שני המחירים לא הייתה אף עסקה. לזה קוראים **פער פתיחה (Gap)**.\n\nזה קורה בעיקר כשחדשות יוצאות אחרי סגירת המסחר: דוח רבעוני, הודעה של רגולטור, או הצעת רכש (הצעה לקנות את החברה במחיר גבוה ממחיר השוק).\n\nפער יכול להיות לשני הכיוונים: למטה, וזה פוגע במי שכתב Put, או למעלה, וזה פוגע במי שכתב Call.\n\n**ואי אפשר לצאת באמצע.** אופציות על מניות כמעט לא נסחרות בלילה. מי שכתב אופציה לא יכול לסגור אותה עד הפתיחה, ואז המחיר כבר אחרי הפער.","source":"Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"4.1-a1","type":"analogy","title":"מעלית שמדלגת על קומות","body":"אתם במעלית בקומה 10, ותכננתם לרדת בקומה 9 אם משהו ישתבש. אבל זו מעלית אקספרס: היא יורדת ישר מקומה 10 לקומה 5, בלי לעצור בדרך.\n\nהתוכנית \"לרדת בקומה 9\" הייתה טובה, אבל המעלית פשוט לא עצרה שם.\n\nכך עובד פער פתיחה: המחיר שבו תכננתם לצאת לא נסחר בכלל.","breaks":"במעלית יודעים מראש באילו קומות היא עוצרת. בשוק לא יודעים מתי יהיה פער ומה גודלו. מה שכן יודעים מראש: מתי יוצא דוח רבעוני. ועוד הבדל: מעלית מדלגת רק למטה, ומניה יכולה לקפוץ גם למעלה, וזה פוגע במי שכתב Call."},{"id":"4.1-l1","type":"mcq","life":true,"prompt":"תכננתם לרדת מהמעלית בקומה 9. המעלית ירדה ישר מקומה 10 לקומה 5. איפה תרדו?","options":[{"text":"בקומה 5, המקום הראשון שבו המעלית עוצרת"},{"text":"בקומה 9, כי כך תכננתם"},{"text":"בקומה 10, כי המעלית לא זזה בשבילכם"}],"correct":0,"explain":{"right":"יוצאים במקום הראשון שאפשר. כך גם בפער פתיחה: אי אפשר לצאת במחיר שלא נסחר, רק במחיר הראשון שזמין אחריו.","wrong":"אי אפשר לרדת בקומה שהמעלית לא עוצרת בה. יוצאים בקומה 5, המקום הראשון שאפשר. כך גם בפער פתיחה: יוצאים במחיר הראשון שזמין."},"source":"דוגמה מהחיים"},{"id":"4.1-q2","type":"chart-guess","prompt":"כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה. המניה נסגרה במחיר $100, ואחרי דוח רע היא נפתחה במחיר $85 ונשארה שם עד הפקיעה. נחשו: מה הרווח או ההפסד לחוזה אחד?","pos":{"type":"put","side":"short","K":95,"prem":2,"mult":100},"S":85,"check":{"fn":"positionPnL","args":{"type":"put","side":"short","K":95,"prem":2,"mult":100,"S":85},"expect":-800},"explain":{"right":"במחיר $85 ה־Put שווה $10 בפקיעה, וקיבלתם רק $2: `($2 − $10) × 100 = −$800`. הפסד של פי 4 מהפרמיה שקיבלתם.","wrong":"במחיר $85 ה־Put שכתבתם שווה `$95 − $85 = $10` בפקיעה. קיבלתם פרמיה של $2, ולכן: `($2 − $10) × 100 = −$800`."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"4.1-c3","type":"concept","title":"למה פקודת Stop לא מגינה בפער","body":"סוחרים רבים סומכים על **פקודת Stop**: הוראה למכור אם המחיר יורד לרמה מסוימת, למשל $95.\n\nאבל פקודת Stop לא מבטיחה מחיר. כשהמחיר מגיע לרמה, היא הופכת לפקודת שוק (פקודה שמתבצעת מיד, במחיר הזמין), ומתבצעת **במחיר הבא שזמין**.\n\nאם המניה נסגרה במחיר $100 ונפתחה במחיר $80, הפקודה מתבצעת סביב $80, לא במחיר $95.\n\nפקודת Stop מגבילה הפסד רק כשהמחיר זז ברצף. בפער היא לא מגינה.","source":"Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"4.1-q3","type":"mcq","prompt":"קניתם מניה במחיר $100 והצבתם פקודת Stop במחיר $95. אחרי הסגירה יצא דוח רע, והמניה נפתחה למחרת במחיר $80. באיזה מחיר, בערך, תתבצע המכירה?","options":[{"text":"סביב $80, המחיר הראשון שזמין אחרי הפתיחה"},{"text":"במחיר $95, כי זה המחיר שנקבע בפקודה"},{"text":"הפקודה מתבטלת, כי המחיר דילג עליה"}],"correct":0,"explain":{"right":"כשהמחיר יורד מתחת לרמת ה־Stop, הפקודה הופכת לפקודת שוק ומתבצעת במחיר הזמין. בפער זה המחיר שאחרי הפער, סביב $80.","wrong":"פקודת Stop לא מבטיחה מחיר. כשהמחיר עובר את הרמה, היא הופכת לפקודת שוק ומתבצעת במחיר הזמין: סביב $80, לא $95."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 2"},{"id":"4.1-q4","type":"mcq","fmt":"pnl","prompt":"כתבתם Call במימוש $105 בלי שיש לכם מניות, וקיבלתם פרמיה של $2 לאופציה. המניה נסגרה במחיר $100. בלילה פורסמה הצעה לקנות את החברה, והמניה נפתחה במחיר $130 ונשארה שם עד הפקיעה. מה התוצאה לחוזה אחד?","options":[{"v":-2300},{"v":200},{"v":-2500},{"v":-500}],"correct":0,"check":{"fn":"positionPnL","args":{"type":"call","side":"short","K":105,"prem":2,"mult":100,"S":130}},"explain":{"right":"במחיר $130 ה־Call שווה $25 בפקיעה, וקיבלתם $2: `($2 − $25) × 100 = −$2,300`. ב־Naked Call אין תקרה: ככל שהקפיצה גדולה יותר, ההפסד גדול יותר.","wrong":"פער יכול להיות גם כלפי מעלה, וזה פוגע בכותב Call. במחיר $130 ה־Call שווה `$130 − $105 = $25`, ולכן: `($2 − $25) × 100 = −$2,300`."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"4.1-q5","type":"mcq","prompt":"באיזו מהפוזיציות האלה פער פתיחה לא יכול לגרום להפסד גדול מהסכום ששילמתם בכניסה?","options":[{"text":"Long Put: ההפסד המקסימלי הוא הפרמיה ששולמה"},{"text":"Short Put, עם תוכנית לסגור אותו אם המניה תרד"},{"text":"Naked Call על מניה יציבה"}],"correct":0,"explain":{"right":"מי שקנה אופציה שילם את ההפסד המקסימלי מראש. המניה יכולה לקפוץ לכל מחיר, והוא לא יפסיד יותר מהפרמיה. לכותב אין הגנה כזו.","wrong":"רק בקנייה ההפסד המקסימלי הוא סכום שכבר שילמתם: הפרמיה. תוכנית לסגור לא עוזרת בפער, ו\"מניה יציבה\" היא יציבה עד שיוצאות חדשות."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"4.1-q6","type":"mcq","prompt":"סוחר כותב Put על מניה ומקבל $200. מחר אחרי הסגירה החברה מפרסמת דוח רבעוני. מה נכון לגבי הסיכון שלו?","options":[{"text":"פער פתיחה אחרי הדוח סביר יותר מביום רגיל, ופקודת Stop לא תגביל את ההפסד"},{"text":"הסיכון זהה לכל יום אחר, כי הפרמיה הגבוהה כבר מפצה על כל מה שעלול לקרות"},{"text":"אין סיכון מיוחד, כי אם הדוח רע אפשר לסגור את הפוזיציה במסחר המאוחר"}],"correct":0,"explain":{"right":"דוחות הם מהסיבות הנפוצות לפערים. הפרמיה אולי גבוהה יותר לפני דוח, אבל ההפסד האפשרי עדיין גדול ממנה בהרבה, ואי אפשר לצאת באמצע הפער.","wrong":"אופציות על מניות כמעט לא נסחרות במסחר המאוחר, ולכן אי אפשר לסגור עד הפתיחה. ופרמיה גבוהה יותר לפני דוח לא מקטינה את ההפסד האפשרי: פער אחרי דוח יכול להיות גדול ממנה בהרבה."},"source":"OCC, Characteristics and Risks of Standardized Options"}],"summary":["לפני כל פוזיציה שואלים: **מה ההפסד המקסימלי, והאם החשבון עומד בו?**","**פער פתיחה (Gap):** המחיר מדלג בין סגירה לפתיחה, בלי עסקאות באמצע. נפוץ אחרי דוחות.","**פקודת Stop לא מגינה בפער:** היא מתבצעת במחיר הראשון שזמין.","רק בקניית אופציה ההפסד המקסימלי הוא סכום שכבר שילמתם: **הפרמיה**."],"ready":true,"unit":"4"},{"id":"4.2","title":"גודל פוזיציה","minutes":6,"objective":"לקבוע כמה חוזים לפי ההפסד המקסימלי ביחס לגודל החשבון, ולא לפי הפרמיה.","items":[{"id":"4.2-c1","type":"concept","title":"גודל נקבע לפי ההפסד, לא לפי הפרמיה","body":"הטעות הנפוצה: לקבוע כמה חוזים לפי הפרמיה. \"הפרמיה רק $100, אז אכתוב 10 חוזים.\"\n\nהפרמיה לא אומרת כמה אפשר להפסיד. ההפסד המקסימלי אומר. ובכתיבה אפשר להפסיד אפילו יותר ממה שיש בחשבון, ולהישאר חייבים לברוקר.\n\n**גודל פוזיציה נקבע בשלושה צעדים:**\n**1. תקציב סיכון:** איזה חלק מהחשבון אתם מוכנים להפסיד בעסקה אחת. מחליטים על זה מראש, לא בזמן העסקה.\n**2. הפסד מקסימלי לחוזה:** כמו שחישבנו בשיעור הקודם.\n**3. מספר החוזים:** תקציב הסיכון חלקי ההפסד המקסימלי לחוזה, מעוגל **למטה**. יצא פחות מחוזה אחד? התשובה היא אפס: הפוזיציה גדולה מדי לחשבון.\n\nהקורס לא קובע בשבילכם את האחוז. אבל שימו לב לחשבון: מי שמסכן 2% בעסקה צריך הרבה הפסדים ברצף כדי להיפגע קשה. מי שמסכן 25% צריך מעט מאוד.","source":"עקרונות הקורס"},{"id":"4.2-a1","type":"analogy","title":"תקציב לטיול של עשרה ימים","body":"יצאתם לטיול של עשרה ימים עם $1,000. ביום הראשון ראיתם מסעדה מפתה והוצאתם $600.\n\nהארוחה אולי הייתה מצוינת. אבל עכשיו נשארו $400 לתשעה ימים, וכל הפתעה קטנה, מונית או כרטיס שאבד, כבר מסכנת את כל הטיול.\n\nמי שמחלק את התקציב מראש, למשל עד $100 ליום, יכול לספוג יום יקר בלי שהטיול ייגמר.","breaks":"בטיול יודעים כמה ימים נשארו. במסחר לא יודעים כמה הפסדים יבואו ברצף. ועוד: בטיול הכסף שהוצאתם קנה משהו. בעסקה מפסידה הוא פשוט נעלם. לכן במסחר מחלקים את התקציב בזהירות רבה יותר."},{"id":"4.2-l1","type":"mcq","life":true,"fmt":"usd","prompt":"יש לכם $1,000 לטיול של עשרה ימים, והוצאתם $600 ביום הראשון. כמה נשאר, בממוצע, לכל אחד מתשעת הימים הנותרים?","options":[{"text":"בערך $44 ליום"},{"text":"$100 ליום, כמו שתכננתם"},{"text":"$400 ליום"}],"correct":0,"explain":{"right":"`$400 ÷ 9 ≈ $44`. הוצאה אחת גדולה שינתה את כל שאר הטיול. כך גם עסקה אחת גדולה מדי משנה את כל מה שהחשבון יכול לעשות אחריה.","wrong":"נשארו $400 לתשעה ימים: `$400 ÷ 9 ≈ $44` ליום. הוצאה אחת גדולה קובעת את כל שאר הטיול."},"source":"דוגמה מהחיים"},{"id":"4.2-q1","type":"mcq","fmt":"usd","prompt":"בחשבון שלכם $10,000, והחלטתם מראש לא לסכן יותר מ־1% מהחשבון בעסקה אחת. מה תקציב הסיכון לעסקה?","options":[{"v":100},{"v":1000},{"v":10},{"v":500}],"correct":0,"check":{"fn":"riskBudget","args":{"account":10000,"pct":1}},"explain":{"right":"`$10,000 × 1% = $100`. זה הסכום המרבי שהעסקה יכולה להפסיד, לא הסכום שמשלמים עליה.","wrong":"1% מתוך $10,000: `$10,000 × 1% = $100`."},"source":"עקרונות הקורס"},{"id":"4.2-q2","type":"mcq","fmt":"num","prompt":"בחשבון $20,000, ותקציב הסיכון הוא 2% לעסקה, כלומר $400. אתם רוצים לקנות Call שהפרמיה שלו $2 לאופציה, כלומר הפסד מקסימלי של $200 לחוזה. כמה חוזים לכל היותר מתאימים לתקציב?","options":[{"v":2},{"v":20},{"v":100},{"v":4}],"correct":0,"check":{"fn":"contractsFor","args":{"account":20000,"pct":2,"lossPer":200}},"explain":{"right":"`$400 ÷ $200 = 2` חוזים. אם שניהם יפקעו בלי ערך, הפסדתם בדיוק את תקציב הסיכון.","wrong":"מחלקים את תקציב הסיכון בהפסד המקסימלי לחוזה: `$400 ÷ $200 = 2` חוזים."},"source":"עקרונות הקורס"},{"id":"4.2-q3","type":"mcq","fmt":"pct","prompt":"בחשבון $10,000. כתבתם Put אחד במימוש $50 וקיבלתם פרמיה של $1 לאופציה, כלומר $100. ההפסד המקסימלי הוא $4,900. איזה חלק מהחשבון נמצא בסיכון?","options":[{"v":49},{"v":1},{"v":5},{"v":100}],"correct":0,"check":{"fn":"pctOf","args":{"part":4900,"whole":10000}},"explain":{"right":"`$4,900 ÷ $10,000 = 49%`. הפרמיה היא רק 1% מהחשבון, אבל הסיכון הוא כמעט חצי ממנו. לכן מודדים לפי ההפסד ולא לפי הפרמיה.","wrong":"מודדים לפי ההפסד המקסימלי, לא לפי הפרמיה: `$4,900 ÷ $10,000 = 49%`. הפרמיה של $100 היא רק 1%, וזה בדיוק מה שמטעה."},"source":"OCC, Characteristics and Risks of Standardized Options"},{"id":"4.2-q4","type":"mcq","fmt":"usd","prompt":"סוחר מסכן בכל עסקה 25% **ממה שנשאר בחשבון**. הוא התחיל עם $10,000 והפסיד 4 עסקאות ברצף.\n\nכמה נשאר לו?","options":[{"v":3164},{"v":0},{"v":7500},{"v":2500}],"correct":0,"check":{"fn":"afterLosses","args":{"account":10000,"pct":25,"n":4}},"explain":{"right":"אחרי כל הפסד נשארים 75% ממה שהיה: $7,500, אחר כך $5,625, אחר כך $4,219, ולבסוף $3,164. סוחר שמסכן 2% בכל עסקה היה נשאר אחרי אותו רצף עם בערך $9,224.","wrong":"כל הפסד מוריד 25% ממה שנשאר, לא מהסכום המקורי. נשארים $7,500, אחר כך $5,625, אחר כך $4,219, ולבסוף $3,164."},"source":"עקרונות הקורס"},{"id":"4.2-c2","type":"concept","title":"חמש פוזיציות שהן בעצם אחת","body":"נניח שחילקתם את הסיכון יפה: חמש פוזיציות, כל אחת מסכנת 2% מהחשבון. נשמע מפוזר.\n\nאבל אם כל החמש הן Short Put על מניות טכנולוגיה, ביום שבו כל הסקטור צונח, כל החמש מפסידות יחד. בפועל זו פוזיציה אחת שמסכנת 10%.\n\nלכן בודקים גם את **הסיכון המצטבר**: מה קורה לכל הפוזיציות יחד אם השוק כולו יורד חזק, ולא רק כל אחת לחוד.\n\nועוד נקודה: רצף הפסדים הוא לא סימן שמשהו נשבר. גם שיטה טובה מפסידה כמה פעמים ברצף. גודל הפוזיציה הוא מה שקובע אם שורדים את הרצף.","source":"עקרונות הקורס"},{"id":"4.2-q5","type":"mcq","prompt":"סוחר מחזיק חמש פוזיציות Short Put על חמש מניות שבבים שונות. כל אחת מסכנת 3% מהחשבון. מה הסיכון האמיתי שלו ביום שבו כל הסקטור צונח?","options":[{"text":"עד 15%, כי המניות נוטות לרדת יחד והסיכונים מצטברים"},{"text":"3%, כי כל פוזיציה נפרדת"},{"text":"פחות מ־3%, כי חמש מניות זה פיזור"}],"correct":0,"explain":{"right":"מניות מאותו סקטור נוטות לזוז יחד, במיוחד בירידות חדות. חמש פוזיציות דומות מתנהגות כמו אחת גדולה, והסיכון יכול להגיע עד `5 × 3% = 15%`.","wrong":"פיזור עוזר רק כשהפוזיציות לא זזות יחד. חמש מניות מאותו סקטור יורדות יחד ביום רע, והסיכון מצטבר: הוא יכול להגיע עד `5 × 3% = 15%`."},"source":"עקרונות הקורס"},{"id":"4.2-q6","type":"mcq","prompt":"פרסומת: \"כתבו 10 חוזי Put, קבלו $1,000 פרמיה כל חודש, וצריך רק $10,000 בחשבון!\" כל חוזה במימוש $50, ולכן ההפסד המקסימלי של כל חוזה הוא בערך $4,900. מה חסר בפרסומת?","options":[{"text":"ההפסד המקסימלי של 10 חוזים הוא בערך $49,000, כמעט פי 5 מהחשבון"},{"text":"שום דבר: $1,000 על $10,000 זו תשואה של 10% לחודש"},{"text":"רק העמלות, שמקטינות מעט את הרווח"}],"correct":0,"explain":{"right":"`10 × $4,900 = $49,000`. הפרסומת מודדת לפי הפרמיה, ומסתירה שירידה חדה אחת יכולה למחוק את החשבון ועוד להשאיר חוב לברוקר.","wrong":"הפרסומת מציגה רק את הפרמיה. ההפסד המקסימלי הוא `10 × $4,900 = $49,000`, כמעט פי 5 מהחשבון. זה הנתון שחסר."},"source":"OCC, Characteristics and Risks of Standardized Options"}],"summary":["גודל פוזיציה נקבע לפי **ההפסד המקסימלי**, לא לפי הפרמיה.","**מספר החוזים:** תקציב הסיכון חלקי ההפסד המקסימלי לחוזה, מעוגל למטה.","פוזיציות דומות מפסידות יחד. בודקים גם את **הסיכון המצטבר**.","רצף הפסדים קורה גם בשיטה טובה. הגודל קובע אם שורדים אותו."],"ready":true,"unit":"4"},{"id":"4.3","title":"אחוז הצלחה מול תוחלת","minutes":7,"objective":"לחשב תוחלת של עסקה, להבין למה אחוז הצלחה גבוה יכול להסתכם בהפסד, ולדעת מה רושמים ביומן מסחר.","items":[{"id":"4.3-c1","type":"concept","title":"90% הצלחה, ועדיין מפסידים","body":"\"90% מהעסקאות שלי מרוויחות\" נשמע מצוין. אבל חסר כאן חצי מהמידע: **כמה מרוויחים כשמרוויחים, וכמה מפסידים כשמפסידים.**\n\nהמספר שמחבר את הכול נקרא **תוחלת**: התוצאה הממוצעת לעסקה, אם חוזרים עליה הרבה פעמים.\n\n**תוחלת =**\n**(סיכוי לרווח × רווח ממוצע)**\n**− (סיכוי להפסד × הפסד ממוצע)**\n\nדוגמה: עסקה שמרוויחה $100 ב־90% מהמקרים, ומפסידה $1,000 ב־10% מהמקרים.\n`90% × $100 = $90`\n`10% × $1,000 = $100`\n`$90 − $100 = −$10`\n\nתשע עסקאות מתוך עשר מרוויחות, ועדיין מפסידים בממוצע $10 לעסקה.","source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-q1","type":"mcq","fmt":"pnl","prompt":"עסקה מרוויחה $100 ב־90% מהמקרים, ומפסידה $1,000 ב־10% מהמקרים. מה התוחלת לעסקה?","options":[{"v":-10},{"v":90},{"v":100},{"v":-900}],"correct":0,"check":{"fn":"expectancy","args":{"winPct":90,"win":100,"loss":1000}},"explain":{"right":"`90% × $100 = $90`, ו־`10% × $1,000 = $100`. ההפרש: `$90 − $100 = −$10` לעסקה, בממוצע.","wrong":"מחשבים כל צד לחוד: `90% × $100 = $90` ו־`10% × $1,000 = $100`. התוחלת היא ההפרש: `$90 − $100 = −$10`."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-q2","type":"mcq","fmt":"pnl","prompt":"עסקה מרוויחה $500 ב־40% מהמקרים, ומפסידה $200 ב־60% מהמקרים. מה התוחלת לעסקה?","options":[{"v":80},{"v":-80},{"v":300},{"v":-20}],"correct":0,"check":{"fn":"expectancy","args":{"winPct":40,"win":500,"loss":200}},"explain":{"right":"`40% × $500 = $200`, ו־`60% × $200 = $120`. ההפרש: `$200 − $120 = +$80`. רוב העסקאות מפסידות, והתוחלת חיובית.","wrong":"`40% × $500 = $200` ו־`60% × $200 = $120`. התוחלת: `$200 − $120 = +$80`. אחוז הצלחה נמוך לא אומר תוחלת שלילית."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-a1","type":"analogy","title":"חברת ביטוח","body":"חברת ביטוח מוכרת פוליסה נגד רעידת אדמה, ומקבלת $1,000 בשנה. ב־49 שנים מתוך 50 אין רעידה, והיא שומרת את הכסף. \"אחוז הצלחה\" של 98%.\n\nבשנה אחת יש רעידה, והיא משלמת $60,000.\n\nבחמישים שנה היא גבתה $50,000 ושילמה $60,000. 98% הצלחה, והפסד כולל של $10,000.\n\nחברת ביטוח אמיתית יודעת את זה, ולכן היא מתמחרת לפי התוחלת, לא לפי מספר השנים השקטות.","breaks":"חברת ביטוח מבטחת אלפי בתים בערים שונות, והנזקים לא קורים בכולם יחד. כותב אופציות על כמה מניות חשוף לירידה אחת של כל השוק, שפוגעת בכל הפוזיציות יחד. ועוד: לחברת ביטוח יש נתונים של עשרות שנים. לסוחר יש בדרך כלל כמה חודשים, שבהם אולי \"הרעידה\" עוד לא קרתה."},{"id":"4.3-l1","type":"mcq","life":true,"fmt":"pnl","prompt":"חברת ביטוח גבתה $1,000 בשנה במשך 50 שנה, כלומר $50,000. בשנה אחת מתוכן היא שילמה $60,000 על רעידת אדמה. מה התוצאה הכוללת שלה?","options":[{"text":"הפסד של $10,000"},{"text":"רווח של $50,000"},{"text":"רווח של $49,000"}],"correct":0,"explain":{"right":"`$50,000 − $60,000 = −$10,000`. 49 שנים טובות מתוך 50, ועדיין הפסד. מה שקבע הוא גודל ההפסד, לא מספר ההצלחות.","wrong":"מסכמים הכול: גבתה $50,000 ושילמה $60,000. `$50,000 − $60,000 = −$10,000`. מספר השנים הטובות לא משנה אם השנה הרעה גדולה מספיק."},"source":"דוגמה מהחיים"},{"id":"4.3-c1b","type":"concept","title":"למה כתיבת אופציות נראית כל כך טוב","body":"מי שכותב אופציות רחוקות מהכסף מרוויח ברוב הפעמים: האופציה פוקעת בלי ערך, והפרמיה נשארת אצלו.\n\nזה לא כישרון. זה המבנה: הפרמיה קטנה **בדיוק כי** הסיכוי להפסד קטן. רווח קטן ברוב הפעמים, והפסד גדול מדי פעם.\n\nאם התוחלת של מבנה כזה חיובית או שלילית, זה תלוי במספרים: כמה פעמים מפסידים, וכמה מפסידים בכל פעם. אחוז ההצלחה לבדו לא עונה על זה.","source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-q3","type":"mcq","prompt":"סוחר כותב Put רחוק מהכסף ומקבל פרמיה קטנה. ברוב החודשים האופציה פוקעת בלי ערך והוא שומר את הפרמיה. מה אפשר להסיק מאחוז ההצלחה הגבוה שלו?","options":[{"text":"רק שההפסדים נדירים. כדי לדעת אם זה משתלם צריך גם את גודל ההפסד כשהוא קורה"},{"text":"שהאסטרטגיה רווחית לאורך זמן, כי רוב החודשים נגמרים ברווח"},{"text":"שהסוחר יודע לבחור מניות שלא יורדות מתחת למימוש"}],"correct":0,"explain":{"right":"אחוז הצלחה גבוה הוא תכונה של המבנה, לא של הסוחר: הפרמיה קטנה בדיוק כי הסיכוי להפסד קטן. מה שקובע הוא התוחלת, ולשם כך צריך את גודל ההפסד.","wrong":"כל מי שכותב אופציות רחוקות מהכסף מקבל אחוז הצלחה גבוה. זה נובע מהמבנה. בלי לדעת כמה מפסידים בפעם שזה משתבש, אי אפשר לדעת אם זה משתלם."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-c2","type":"concept","title":"יומן מסחר: למדוד את עצמכם","body":"את התוחלת של עצמכם אי אפשר לנחש. צריך למדוד, ולשם כך רושמים **כל** עסקה, גם את המפסידות.\n\n**מה רושמים:**\nמה פתחתם, מתי, ובאיזה מחיר.\nמה היה ההפסד המקסימלי.\nאיך נסגר, ומה התוצאה **אחרי עמלות**.\n\n**מה מחשבים מדי כמה עשרות עסקאות:**\nאחוז ההצלחה.\nהרווח הממוצע בעסקה מרוויחה.\nההפסד הממוצע בעסקה מפסידה.\nומהם, את התוחלת.","source":"עקרונות הקורס"},{"id":"4.3-q4","type":"mcq","fmt":"pnl","prompt":"ביומן המסחר שלכם 10 עסקאות: 8 הרוויחו $150 כל אחת, ו־2 הפסידו $700 כל אחת. מה התוצאה הכוללת?","options":[{"v":-200},{"v":1200},{"v":500},{"v":-1400}],"correct":0,"check":{"fn":"journalTotal","args":{"wins":8,"win":150,"losses":2,"loss":700}},"explain":{"right":"`8 × $150 = $1,200`, ו־`2 × $700 = $1,400`. התוצאה: `$1,200 − $1,400 = −$200`. 80% הצלחה, והפסד כולל.","wrong":"מסכמים את שני הצדדים: `8 × $150 = $1,200` רווחים, ו־`2 × $700 = $1,400` הפסדים. התוצאה: `$1,200 − $1,400 = −$200`."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-c2b","type":"concept","title":"שתי אזהרות על המדידה","body":"**מדגם קטן מטעה.** עשר עסקאות של כתיבת אופציות יכולות להיות כולן מרוויחות, ועדיין להיות חלק משיטה מפסידה. ההפסד הגדול פשוט עוד לא הגיע.\n\n**השוק לא חייב לכם תוחלת חיובית.** מחירי האופציות נקבעים על ידי משתתפים מקצועיים, ואין סיבה להניח שמבנה פשוט נותן תוחלת חיובית. אחרי עלויות (עמלות ומרווחים, יחידה 6) היא יכולה בקלות להיות אפס או שלילית.","source":"עקרונות הקורס"},{"id":"4.3-q5","type":"mcq","prompt":"חבר מספר: \"פתחתי חשבון לפני חודשיים, כתבתי Puts כל שבוע, וכל 8 העסקאות הרוויחו.\" מה הכי נכון לומר על השיטה שלו?","options":[{"text":"8 עסקאות הן מדגם קטן מדי. במבנה כזה, רצף רווחים הוא מה שרואים גם בשיטה מפסידה"},{"text":"8 מתוך 8 זה רצף ארוך מספיק כדי להוכיח שהשיטה עובדת"},{"text":"השיטה בוודאות מפסידה, כי כתיבת Puts תמיד מפסידה בסוף"}],"correct":0,"explain":{"right":"כתיבת אופציות מרוויחה ברוב הפעמים, אז 8 רווחים ברצף לא מלמדים הרבה. השאלה היא מה קורה בשבוע שבו השוק יורד חזק, והשבוע הזה עוד לא נכלל במדגם.","wrong":"אי אפשר להסיק לשום כיוון מ־8 עסקאות. רצף רווחים הוא הצפוי במבנה כזה, בין אם התוחלת חיובית ובין אם שלילית. צריך מדגם גדול, ובעיקר לדעת את גודל ההפסד כשהוא מגיע."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"4.3-s1","type":"spot-guru","prompt":"מצאו את הגורו: סמנו כל משפט מטעה בפוסט. יש בו גם משפטים נכונים.","channel":"ערוץ \"95% הצלחה באופציות\"","claims":[{"t":"95% מהעסקאות שלנו נסגרות ברווח. המספרים מדברים בעד עצמם!","bad":true,"why":"אחוז הצלחה לבד לא אומר כלום. חסר גודל ההפסד ב־5% הנותרים, ובלעדיו אי אפשר לחשב תוחלת."},{"t":"כתיבת אופציות רחוקות מהכסף מרוויחה ברוב הפעמים.","bad":false,"why":"זה נכון, וזה נובע מהמבנה: הפרמיה קטנה כי הסיכוי להפסד קטן. השאלה היא כמה מפסידים כשזה קורה."},{"t":"12 חודשים רצופים של רווח, אז השיטה מוכחת.","bad":true,"why":"מדגם קטן. בשיטה שמפסידה הרבה לעיתים רחוקות, 12 חודשים טובים הם בדיוק מה שרואים לפני ההפסד הגדול."},{"t":"ההפסדים שלנו קטנים, כי אנחנו תמיד יוצאים בזמן עם Stop.","bad":true,"why":"פקודת Stop לא מגינה בפער פתיחה (שיעור 4.1), ואופציות לא נסחרות בלילה. \"תמיד יוצאים בזמן\" היא הבטחה שאי אפשר לקיים."}],"explain":{"right":"מצאתם את כל הטענות המטעות. אחוז הצלחה בלי גודל ההפסד, מדגם קטן, והבטחה לצאת תמיד בזמן: שלושה סימנים קלאסיים.","wrong":"עברו על ההסברים ליד כל משפט. משפט מטעה מציג אחוז הצלחה בלי גודל ההפסד, מסתמך על תקופה קצרה, או מבטיח משהו שאי אפשר לקיים."},"source":"עקרונות הקורס; שיעורים 4.1 ו־4.3"}],"summary":["**תוחלת** = (סיכוי לרווח × רווח ממוצע), פחות (סיכוי להפסד × הפסד ממוצע).","אחוז הצלחה גבוה יכול להסתכם בהפסד, אם ההפסדים גדולים מספיק.","**יומן מסחר:** רושמים כל עסקה, אחרי עמלות, ומחשבים תוחלת.","מדגם קטן מטעה, במיוחד בכתיבת אופציות."],"ready":true,"unit":"4"},{"id":"5.1","title":"Covered Call","minutes":7,"objective":"להבין ש־Covered Call הוא החלפה: מקבלים פרמיה, ומוותרים על כל עלייה מעל המימוש. לחשב רווח מקסימלי, נקודת איזון והפסד מקסימלי.","strats":{"cc":{"name":"Covered Call","desc":"100 מניות שנקנו במחיר $100, ו־Short Call במימוש $105 בפרמיה $2","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100},{"type":"call","side":"short","K":105,"prem":2}]},"st":{"name":"100 מניות","desc":"100 מניות שנקנו במחיר $100","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100}]}},"strat":"cc","items":[{"id":"5.1-c1","type":"concept","title":"מה זה Covered Call","body":"ביחידה הזו כל הדוגמאות הן על אותה מניה, שנסחרת במחיר **$100**. כל האופציות פוקעות בעוד בערך חודש.\n\nיש לכם 100 מניות שקניתם במחיר $100. אתם כותבים עליהן Call במימוש $105, ומקבלים פרמיה של $2 לאופציה, כלומר $200.\n\nזה **Covered Call**. \"מכוסה\", כי אם תקבלו הקצאה, יש לכם את המניות למסור. אין כאן הסיכון הבלתי מוגבל של Naked Call.\n\n**מה החלפתם:** קיבלתם $200 עכשיו. בתמורה ויתרתם על כל עלייה מעל $105.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-c1b","type":"concept","title":"שלושה תרחישים בפקיעה","strat":"cc","body":"יש לכם 100 מניות שקניתם במחיר $100, וכתבתם Call במימוש $105 בפרמיה של $2.\n\n**המניה מעל $105:** מקבלים הקצאה ומוכרים במחיר $105. הרווח נעצר שם, לא משנה כמה המניה עלתה.\n\n**המניה בין $100 לבין $105:** ה־Call פוקע. נשארתם עם המניות, עם העלייה שלהן ועם $200.\n\n**המניה מתחת למחיר $100:** ה־Call פוקע, ואתם מפסידים על המניות כמו כל מחזיק. הפרמיה מרככת את ההפסד בסכום של $2 למניה בלבד.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-a1","type":"analogy","title":"אופציה על הדירה שלכם","body":"יש לכם דירה ששווה $100,000. מישהו משלם לכם $2,000 תמורת הזכות לקנות אותה במחיר $105,000 בחודש הקרוב.\n\nאם מחיר הדירה קופץ ל־130 אלף דולר, הוא יקנה אותה במחיר $105,000. את שאר העלייה הוא מקבל, לא אתם.\n\nאם מחיר הדירה יורד ל־80 אלף דולר, הוא לא יקנה. נשארתם עם $2,000, ועם דירה ששווה 20 אלף דולר פחות.","breaks":"דירה לא יורדת 20% בין לילה. מניה כן, אחרי דוח רע. ועוד: מכרתם רק את העליות. את כל הירידות השארתם אצלכם. זה מה שחסר כשקוראים ל־Covered Call \"הכנסה\"."},{"id":"5.1-l1","type":"mcq","life":true,"prompt":"קיבלתם $2,000 תמורת הזכות לקנות את הדירה שלכם במחיר $105,000. מחיר הדירה ירד, והיא שווה עכשיו $80,000. מה המצב שלכם?","options":[{"text":"נשארתם עם הדירה, שירדה בערכה, ועם $2,000"},{"text":"הקונה חייב לקנות את הדירה במחיר $105,000"},{"text":"לא הפסדתם כלום, כי קיבלתם $2,000"}],"correct":0,"explain":{"right":"הזכות היא של הקונה, והוא לא יממש אותה כשהדירה שווה פחות. הירידה כולה אצלכם, והסכום $2,000 מקזז רק חלק קטן ממנה.","wrong":"לקונה יש זכות, לא חובה, והוא לא יקנה במחיר $105,000 דירה ששווה $80,000. נשארתם עם הדירה ועם הירידה שלה. הסכום $2,000 מקזז רק חלק קטן."},"source":"דוגמה מהחיים"},{"id":"5.1-q1","type":"chart-mcq","fmt":"usd","start":110,"prompt":"יש לכם 100 מניות שקניתם במחיר $100, וכתבתם Call במימוש $105 בפרמיה של $2 לאופציה. מה הרווח המקסימלי של הפוזיציה?","hint":"הזיזו את המחוון ימינה, מעבר למחיר $105.","options":[{"v":700},{"v":200},{"v":500},{"text":"בלתי מוגבל","unlimited":true}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"cc","what":"maxProfit"}},"explain":{"right":"מעל $105 מוכרים את המניות במחיר $105: רווח של $5 למניה, ועוד הפרמיה של $2. `($5 + $2) × 100 = $700`. גם אם המניה תגיע למחיר $150, זה הרווח.","wrong":"הרווח נעצר במימוש. מוכרים במחיר $105 מניות שנקנו במחיר $100, ומוסיפים את הפרמיה: `($5 + $2) × 100 = $700`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-q2","type":"chart-guess","S":90,"prompt":"יש לכם 100 מניות שקניתם במחיר $100, וכתבתם Call במימוש $105 בפרמיה של $2 לאופציה. בפקיעה המניה במחיר $90. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"cc","what":"pnl","S":90},"expect":-800},"explain":{"right":"על המניות הפסדתם $10 למניה, והפרמיה החזירה $2: `(−$10 + $2) × 100 = −$800`. בלי ה־Call הייתם מפסידים $1,000. הפרמיה ריככה, לא הגנה.","wrong":"המניות ירדו בסכום של $10 למניה, וה־Call פקע בלי ערך כך שהפרמיה של $2 נשארה אצלכם: `(−$10 + $2) × 100 = −$800`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-q3","type":"mcq","fmt":"price","prompt":"יש לכם 100 מניות שקניתם במחיר $100, וכתבתם Call במימוש $105 בפרמיה של $2 לאופציה. באיזה מחיר מניה בפקיעה הפוזיציה באיזון?","options":[{"v":98},{"v":100},{"v":103},{"v":107}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"cc","what":"be"}},"explain":{"right":"הפרמיה מורידה את מחיר הקנייה בפועל: `$100 − $2 = $98`. מתחת למחיר הזה הפוזיציה מפסידה.","wrong":"הפרמיה שקיבלתם מקזזת $2 מירידת המניה, ולכן נקודת האיזון היא `$100 − $2 = $98`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-q4","type":"mcq","fmt":"usd","prompt":"יש לכם 100 מניות שקניתם במחיר $100, וכתבתם Call במימוש $105 בפרמיה של $2 לאופציה. מה ההפסד המקסימלי של הפוזיציה?","options":[{"v":9800},{"v":200},{"v":500},{"v":10000}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"cc","what":"maxLoss"}},"explain":{"right":"אם המניה יורדת לאפס, הפסדתם את כל מה ששילמתם עליה, פחות הפרמיה: `($100 − $2) × 100 = $9,800`. כמעט כל הסיכון של המניה נשאר אצלכם.","wrong":"ה־Call לא מגן מירידה. אם המניה יורדת לאפס מפסידים `($100 − $2) × 100 = $9,800`. רק $200 מתוך $10,000 מכוסים."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-q5","type":"mcq","fmt":"pnl","prompt":"יש לכם 100 מניות שקניתם במחיר $100, וכתבתם Call במימוש $105 בפרמיה של $2 לאופציה. החברה קיבלה הצעת רכש, ובפקיעה המניה במחיר $130. מי שהחזיק רק את המניות הרוויח {st:st.pnl@S=130}. כמה הרווחתם אתם?","options":[{"v":700},{"v":3000},{"v":3200},{"v":2500}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"cc","what":"pnl","S":130}},"explain":{"right":"קיבלתם הקצאה ומכרתם במחיר $105: `($5 + $2) × 100 = $700`. ויתרתם על $2,500 של עלייה (ממחיר $105 עד $130) תמורת פרמיה של $200. בסך הכול הרווחתם $2,300 פחות ממי שהחזיק רק מניות.","wrong":"ה־Call שכתבתם מחייב אתכם למכור במחיר $105, לא משנה כמה המניה עלתה: `($5 + $2) × 100 = $700`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.1-q6","type":"mcq","prompt":"פוסט ברשת: \"Covered Call זו הכנסה חודשית מהמניות שלכם, כמו שכר דירה\". מה חסר בתיאור הזה?","options":[{"text":"הפרמיה היא תשלום על ויתור על העליות, וכל סיכון הירידה נשאר אצלכם"},{"text":"שום דבר: הפרמיה נכנסת כל חודש בלי קשר למה שקורה למניה"},{"text":"רק שצריך לשלם עמלה על כל כתיבה"}],"correct":0,"explain":{"right":"שכר דירה לא מגביל את עליית ערך הדירה. הפרמיה כן מגבילה את עליית המניה, ולא מגינה מירידה. מי שכותב כל חודש אוסף פרמיות קטנות, מפספס את העליות הגדולות, וסופג את הירידות הגדולות.","wrong":"הפרמיה היא לא הכנסה בחינם. היא המחיר שהשוק משלם לכם כדי לקבל את העליות מעל המימוש, והירידות נשארות כולן אצלכם."},"source":"עקרונות הקורס; Hull, Options, Futures, and Other Derivatives, פרק 12"}],"summary":["**Covered Call:** 100 מניות ועוד Short Call. מקבלים פרמיה ומוותרים על העלייה מעל המימוש.","**רווח מקסימלי:** (מימוש − מחיר הקנייה + פרמיה) × 100. בדוגמה: {st:cc.maxProfit}.","**מתי מפסידים:** כשהמניה יורדת מתחת למחיר הקנייה פחות הפרמיה. בדוגמה: מתחת למחיר {st:cc.be}.","**הפסד מקסימלי:** כמעט כמו במניה לבד. בדוגמה: {st:cc.maxLoss}."],"ready":true,"unit":"5"},{"id":"5.2","title":"Protective Put","minutes":7,"objective":"להבין ש־Protective Put הוא ביטוח על מניה: קובע רצפה להפסד, ועולה פרמיה. לחשב הפסד מקסימלי ונקודת איזון.","strats":{"pp":{"name":"Protective Put","desc":"100 מניות שנקנו במחיר $100, ו־Long Put במימוש $95 בפרמיה $2","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100},{"type":"put","side":"long","K":95,"prem":2}]},"pp100":{"name":"Protective Put","desc":"100 מניות שנקנו במחיר $100, ו־Long Put במימוש $100 בפרמיה $4","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100},{"type":"put","side":"long","K":100,"prem":4}]},"st":{"name":"100 מניות","desc":"100 מניות שנקנו במחיר $100","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100}]}},"strat":"pp","items":[{"id":"5.2-c1","type":"concept","title":"ביטוח על מניה","body":"יש לכם 100 מניות שקניתם במחיר $100. אתם חוששים מירידה חדה, אבל לא רוצים למכור.\n\nאתם קונים Put במימוש $95 ומשלמים $2 לאופציה, כלומר $200. זה **Protective Put**.\n\n**מה קניתם:** הזכות למכור את המניות במחיר $95, לא משנה כמה הן ירדו. זו **רצפה**.\n\n**שלושה תרחישים בפקיעה:**\n\n**המניה צונחת, למשל למחיר $70:** מממשים את ה־Put ומוכרים במחיר $95. הפסדתם $5 למניה, ועוד $2 על ה־Put.\n\n**המניה לא זזה:** ה־Put פוקע בלי ערך. הפסדתם את עלות הביטוח, $200.\n\n**המניה עולה:** מרוויחים מהעלייה, פחות $2 ששילמתם על ה־Put.\n\nבניגוד לפקודת Stop, הרצפה הזו מחזיקה גם בפער פתיחה (שיעור 4.1). על זה משלמים.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-a1","type":"analogy","title":"ביטוח רכב עם השתתפות עצמית","body":"רכב ששווה $10,000. הביטוח עולה $200. אם יש נזק, אתם משלמים את $500 הראשונים, וחברת הביטוח את השאר.\n\nהרכב נהרס לגמרי? הפסדתם $700: ההשתתפות העצמית ועלות הביטוח. לא $10,000.\n\nלא קרה כלום? הפסדתם $200, עלות הביטוח.","breaks":"ביטוח רכב קונים פעם בשנה. Put פוקע אחרי כמה שבועות, ואם רוצים להישאר מוגנים צריך לקנות חדש, שוב ושוב. ומחיר הביטוח קופץ בדיוק כשכולם מפחדים: כשה־IV עולה, ה־Put מתייקר."},{"id":"5.2-l1","type":"mcq","life":true,"prompt":"רכב ששווה $10,000. ביטוח שעולה $200, עם השתתפות עצמית של $500. הרכב נהרס לגמרי. כמה הפסדתם בסך הכול?","options":[{"text":"$700: ההשתתפות העצמית ועלות הביטוח"},{"text":"$10,000: כל שווי הרכב שנהרס"},{"text":"$200: רק עלות הביטוח ששילמתם"}],"correct":0,"explain":{"right":"`$500 + $200 = $700`. זה ההפסד המקסימלי, לא משנה כמה גדול הנזק. כך גם ב־Protective Put: המרחק עד המימוש, ועוד הפרמיה.","wrong":"הביטוח מכסה הכול מעבר להשתתפות העצמית. אתם משלמים `$500 + $200 = $700`, וזה המקסימום."},"source":"דוגמה מהחיים"},{"id":"5.2-q1","type":"chart-mcq","fmt":"usd","start":90,"prompt":"יש לכם 100 מניות שקניתם במחיר $100, וקניתם Put במימוש $95 בפרמיה של $2 לאופציה. מה ההפסד המקסימלי של הפוזיציה?","hint":"הזיזו את המחוון שמאלה, מתחת למחיר $95.","options":[{"v":700},{"v":200},{"v":500},{"v":9800}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"pp","what":"maxLoss"}},"explain":{"right":"המרחק ממחיר הקנייה למימוש הוא $5, ועוד $2 פרמיה: `($5 + $2) × 100 = $700`. גם אם המניה תרד לאפס.","wrong":"ה־Put מאפשר למכור במחיר $95. מפסידים $5 למניה עד המימוש, ועוד $2 ששילמתם על ה־Put: `($5 + $2) × 100 = $700`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-q2","type":"chart-guess","S":88,"prompt":"יש לכם 100 מניות שקניתם במחיר $100, וקניתם Put במימוש $95 בפרמיה של $2 לאופציה. אחרי דוח רע המניה נפתחה במחיר $88 ונשארה שם עד הפקיעה. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"pp","what":"pnl","S":88},"expect":-700},"explain":{"right":"מממשים את ה־Put ומוכרים במחיר $95: `(−$5 − $2) × 100 = −$700`. בלי ה־Put ההפסד היה $1,200. הרצפה החזיקה גם בפער.","wrong":"ה־Put נותן למכור במחיר $95 גם כשהמניה במחיר $88. ההפסד: $5 עד המימוש ועוד $2 פרמיה, `(−$5 − $2) × 100 = −$700`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-q3","type":"mcq","fmt":"price","prompt":"יש לכם 100 מניות שקניתם במחיר $100, וקניתם Put במימוש $95 בפרמיה של $2 לאופציה. באיזה מחיר מניה בפקיעה הפוזיציה באיזון?","options":[{"v":102},{"v":100},{"v":98},{"v":97}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"pp","what":"be"}},"explain":{"right":"המניה צריכה לעלות מספיק כדי לכסות את עלות הביטוח: `$100 + $2 = $102`.","wrong":"שילמתם $2 על ה־Put, אז המניה צריכה לעלות בסכום הזה כדי להחזיר אותו: `$100 + $2 = $102`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-q4","type":"mcq","fmt":"pnl","prompt":"יש לכם 100 מניות שקניתם במחיר $100, וקניתם Put במימוש $95 בפרמיה של $2 לאופציה. בפקיעה המניה בדיוק במחיר $100. מה התוצאה?","options":[{"v":-200},{"v":0},{"v":-700},{"v":200}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"pp","what":"pnl","S":100}},"explain":{"right":"המניה לא זזה, וה־Put פקע בלי ערך: `−$2 × 100 = −$200`. ביטוח שלא השתמשו בו עולה כסף.","wrong":"על המניות לא הרווחתם ולא הפסדתם, אבל ה־Put פקע בלי ערך: `−$2 × 100 = −$200`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-q5","type":"mcq","prompt":"יש לכם 100 מניות שקניתם במחיר $100. Put במימוש $95 עולה $2, והפסד מקסימלי איתו הוא {st:pp.maxLoss}. Put במימוש $100 עולה $4. מה משתנה אם קונים את ה־Put במימוש $100?","options":[{"text":"ההפסד המקסימלי יורד לסכום של {st:pp100.maxLoss}, אבל נקודת האיזון עולה למחיר {st:pp100.be}"},{"text":"ההפסד המקסימלי קטן לאפס, כי המימוש שווה למחיר הקנייה של המניות"},{"text":"שום דבר לא משתנה חוץ מהמחיר: שני ה־Puts נותנים אותה הגנה"}],"correct":0,"explain":{"right":"Put שהמימוש שלו שווה למחיר הקנייה הוא ביטוח בלי השתתפות עצמית: מפסידים רק את הפרמיה, `$4 × 100 = $400`. אבל הוא יקר יותר, והמניה צריכה לעלות יותר כדי להגיע לאיזון.","wrong":"Put במימוש $100 מבטל את ההשתתפות העצמית, אבל עולה $4: ההפסד המקסימלי הוא {st:pp100.maxLoss}, ונקודת האיזון עולה למחיר {st:pp100.be}. הגנה טובה יותר עולה יותר."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-q6","type":"mcq","prompt":"סוחר מחזיק 100 מניות במחיר $100, וקונה כל חודש Put חדש במחיר $2 לאופציה. המניה לא זזה כל השנה. כמה עלתה לו ההגנה?","options":[{"text":"$2,400 בשנה, שהם 24% משווי המניות"},{"text":"$200, כי משלמים רק פעם אחת"},{"text":"כלום, כי ה־Puts לא מומשו"}],"correct":0,"explain":{"right":"`$200 × 12 = $2,400`, מתוך מניות ששוות $10,000. הגנה קבועה ב־Puts קצרים היא יקרה מאוד.","wrong":"כל Put פוקע אחרי חודש, וצריך לקנות חדש: `$200 × 12 = $2,400` בשנה, 24% משווי המניות."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.2-q7","type":"mcq","prompt":"הגרף של Protective Put: הפסד מוגבל למטה, ורווח שעולה בלי תקרה כשהמניה עולה. לאיזו פוזיציה בודדת שלמדתם הוא דומה?","options":[{"text":"Long Call"},{"text":"Short Put"},{"text":"Long Put"}],"correct":0,"explain":{"right":"בשיעור 2.6 ראינו: Long Call ועוד Short Put מתנהגים כמו מניה. מעבירים צד: מניה ועוד Long Put מתנהגים בפקיעה כמו Long Call באותו מימוש.","wrong":"הפסד מוגבל ורווח בלי תקרה כשהמניה עולה: זה הגרף של Long Call. לפי הקשר משיעור 2.6, מניה ועוד Long Put שווים בפקיעה ל־Long Call באותו מימוש."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"}],"summary":["**Protective Put:** 100 מניות ועוד Long Put. ה־Put קובע רצפה למחיר המכירה.","**הפסד מקסימלי:** (מחיר הקנייה − מימוש + פרמיה) × 100. בדוגמה: {st:pp.maxLoss}.","**מתי מפסידים:** כשהמניה בפקיעה מתחת למחיר הקנייה ועוד הפרמיה. בדוגמה: מתחת למחיר {st:pp.be}.","הרצפה מחזיקה גם בפער פתיחה. המחיר: פרמיה שמשלמים בכל פעם מחדש."],"ready":true,"unit":"5"},{"id":"5.3","title":"Put מגובה מזומן","minutes":6,"objective":"להבין ש־Put מגובה מזומן הוא התחייבות לקנות מניה במחיר המימוש, שהסיכון שלה דומה להחזקת המניה, ולחשב נקודת איזון והפסד מקסימלי.","strats":{"csp":{"name":"Put מגובה מזומן","desc":"Short Put במימוש $95 בפרמיה $2, עם $9,500 מזומן בחשבון","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2}]},"cc95":{"name":"Covered Call","desc":"100 מניות שנקנו במחיר $100, ו־Short Call במימוש $95 בפרמיה $7","K":100,"legs":[{"type":"stock","side":"long","K":100,"prem":100},{"type":"call","side":"short","K":95,"prem":7}]}},"strat":"csp","items":[{"id":"5.3-c1","type":"concept","title":"מקבלים תשלום על התחייבות לקנות","body":"המניה נסחרת במחיר $100. אתם כותבים Put במימוש $95, ומקבלים פרמיה של $2 לאופציה, כלומר $200. בחשבון אתם מחזיקים $9,500 במזומן, כל הסכום שיידרש אם תקבלו הקצאה.\n\nזה **Put מגובה מזומן** (Cash-Secured Put).\n\n**שני תרחישים בפקיעה:**\n\n**המניה מעל $95:** ה־Put פוקע. נשארתם עם $200, ובלי מניות.\n\n**המניה מתחת למחיר $95:** מקבלים הקצאה וקונים 100 מניות במחיר $95. בגלל הפרמיה, המחיר בפועל הוא $93.\n\nהמזומן בחשבון מבטיח שיהיה לכם במה לשלם על המניות. הוא לא מקטין את ההפסד: אם המניה צונחת למחיר $60, אתם עדיין קונים אותה במחיר $95.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.3-q1","type":"chart-mcq","fmt":"usd","start":105,"prompt":"המניה נסחרת במחיר $100. כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה. מה הרווח המקסימלי של הפוזיציה?","hint":"הזיזו את המחוון ימינה. מה קורה לרווח מעל $95?","options":[{"v":200},{"v":9500},{"v":700},{"text":"בלתי מוגבל","unlimited":true}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"csp","what":"maxProfit"}},"explain":{"right":"הרווח המקסימלי של כותב הוא הפרמיה: `$2 × 100 = $200`. גם אם המניה תעלה למחיר $150, זה כל מה שתקבלו.","wrong":"כותב אופציה מרוויח לכל היותר את הפרמיה: `$2 × 100 = $200`. מהעלייה של המניה הוא לא מרוויח."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.3-q2","type":"mcq","fmt":"price","prompt":"המניה נסחרת במחיר $100. כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה. באיזה מחיר מניה בפקיעה הפוזיציה באיזון?","options":[{"v":93},{"v":95},{"v":97},{"v":98}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"csp","what":"be"}},"explain":{"right":"קונים במחיר $95, אבל קיבלתם $2: `$95 − $2 = $93`. זה המחיר שבו קניתם בפועל, ומתחתיו מפסידים.","wrong":"הפרמיה מורידה את מחיר הקנייה בפועל: `$95 − $2 = $93`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.3-q3","type":"chart-guess","S":87,"prompt":"המניה נסחרה במחיר $100. כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה. בפקיעה המניה במחיר $87. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"csp","what":"pnl","S":87},"expect":-600},"explain":{"right":"קניתם במחיר $95 מניה ששווה $87, וקיבלתם $2: `(−$8 + $2) × 100 = −$600`. הפסד של פי 3 מהפרמיה.","wrong":"בהקצאה קונים במחיר $95 מניה ששווה $87: הפסד של $8 למניה, פחות הפרמיה של $2. `(−$8 + $2) × 100 = −$600`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.3-q4","type":"mcq","fmt":"usd","prompt":"המניה נסחרת במחיר $100. כתבתם Put במימוש $95 וקיבלתם פרמיה של $2 לאופציה, והחזקתם $9,500 במזומן. מה ההפסד המקסימלי?","options":[{"v":9300},{"v":200},{"v":9500},{"v":600}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"csp","what":"maxLoss"}},"explain":{"right":"אם המניה יורדת לאפס, קניתם במחיר $95 משהו ששווה אפס, פחות הפרמיה: `($95 − $2) × 100 = $9,300`. המזומן בחשבון לא שינה את זה.","wrong":"\"מגובה מזומן\" אומר רק שיש לכם כסף לשלם. ההפסד המקסימלי נשאר `($95 − $2) × 100 = $9,300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.3-c2","type":"concept","title":"אותו גרף כמו Covered Call","body":"בשיעור 5.1 ראינו Covered Call. הפעם נבנה אותו במימוש $95: 100 מניות שנקנו במחיר $100, ו־Short Call במימוש $95. ה־Call הזה עולה $7: $5 ערך פנימי ועוד $2 ערך זמן.\n\n**מעל $95:** מקבלים הקצאה ומוכרים במחיר $95 מניות שנקנו במחיר $100. `(−$5 + $7) × 100 = $200`. בדיוק כמו ה־Put שכתבנו.\n\n**מתחת למחיר $95:** מפסידים דולר על כל דולר של ירידה, שוב בדיוק כמו ה־Put.","source":"Hull, Options, Futures, and Other Derivatives, פרקים 11 ו־12"},{"id":"5.3-c2a","type":"concept","title":"המספרים, זה מול זה","body":"**Covered Call במימוש $95:**\nרווח מקסימלי: {st:cc95.maxProfit}\nנקודת איזון: {st:cc95.be}\nהפסד מקסימלי: {st:cc95.maxLoss}\n\n**Put מגובה מזומן במימוש $95:**\nרווח מקסימלי: {st:csp.maxProfit}\nנקודת איזון: {st:csp.be}\nהפסד מקסימלי: {st:csp.maxLoss}\n\nזהים. זה הקשר בין Put ל־Call משיעור 2.6.","source":"Hull, Options, Futures, and Other Derivatives, פרקים 11 ו־12"},{"id":"5.3-q5","type":"mcq","prompt":"Covered Call במימוש $95 (100 מניות ועוד Short Call) ו־Put מגובה מזומן במימוש $95, על אותה מניה ולאותה פקיעה. מה נכון לגבי הרווח וההפסד שלהם בפקיעה?","options":[{"text":"הם זהים: אותו רווח מקסימלי, אותה נקודת איזון, אותו הפסד מקסימלי"},{"text":"ה־Covered Call בטוח יותר, כי יש בו מניות שמגבות את הפוזיציה"},{"text":"ה־Put מסוכן יותר, כי כתיבת Put היא תמיד פוזיציה חשופה"}],"correct":0,"explain":{"right":"מניה פחות Call שווה בפקיעה ל־Short Put באותו מימוש. שתי הפוזיציות מרוויחות סכום קטן וקבוע אם המניה מעל המימוש, ומפסידות עם המניה מתחתיו.","wrong":"בפקיעה שתי הפוזיציות נותנות בדיוק אותה תוצאה בכל מחיר. השם שונה, הסיכון זהה (שיעור 2.6)."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 11"},{"id":"5.3-c2b","type":"concept","title":"אז למה אחד נחשב שמרני והשני מסוכן?","body":"מי שאומר ש־Covered Call \"שמרני\" וש־Short Put \"מסוכן\" מדבר על אותו גרף. בשתי הפוזיציות הרווח קטן וקבוע, והירידה כמעט כולה שלכם.\n\n**ההבדל האמיתי הוא לא בגרף.** ב־Covered Call כבר שילמתם על המניות. ב־Short Put, מי שלא מחזיק את כל המזומן יכול לכתוב יותר חוזים מאותו חשבון, ולהפסיד יותר ממה שיש בו.\n\nלכן השאלה החשובה היא לא איך קוראים לפוזיציה, אלא מה ההפסד המקסימלי שלה ביחס לחשבון (שיעור 4.2).","source":"Hull, Options, Futures, and Other Derivatives, פרקים 11 ו־12"},{"id":"5.3-q6","type":"mcq","prompt":"פוסט ברשת: \"כתבו Put ותקבלו כסף על זה שאתם מחכים לקנות מניה בהנחה\". המניה נסחרת במחיר $100, והמימוש $95. באיזה מצב ה\"הנחה\" הזו לא שווה הרבה?","options":[{"text":"כשהמניה צונחת למחיר $70: אתם קונים במחיר $95 מניה שכל השאר קונים במחיר $70"},{"text":"כשהמניה נשארת במחיר $100: הפרמיה אבדה, ולא קיבלתם מניות"},{"text":"אין מצב כזה: תמיד קונים בזול יותר ממחיר השוק של היום"}],"correct":0,"explain":{"right":"ה\"הנחה\" היא מול המחיר של היום, לא מול המחיר ביום ההקצאה. בירידה חדה אתם מחויבים למחיר שנקבע מראש, והפרמיה של $2 מכסה רק חלק קטן מההפרש.","wrong":"ההתחייבות היא לקנות במחיר $95 בכל מצב. אם המניה במחיר $70, שילמתם $25 יותר מהשוק על כל מניה, וקיבלתם רק $2. ואם המניה נשארת במחיר $100, הפרמיה נשארת אצלכם: שם לא הפסדתם כלום."},"source":"עקרונות הקורס; Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.3-q7","type":"mcq","prompt":"המניה נסחרת במחיר $100. כתבתם Put במימוש $95 וקיבלתם $2 לאופציה. החברה פרסמה דוח מצוין, ובפקיעה המניה במחיר $130. מה הרווחתם?","options":[{"text":"$200. את העלייה של $30 למניה פספסתם"},{"text":"$3,000, כמו מי שהחזיק את המניה"},{"text":"$3,200: העלייה ועוד הפרמיה"}],"correct":0,"explain":{"right":"כותב Put לא מחזיק מניות, ולכן לא מרוויח מהעלייה. הוא מקבל את הפרמיה, {st:csp.maxProfit}, וזהו. מי שרצה את המניה ו\"חיכה להנחה\" נשאר בלעדיה.","wrong":"ב־Short Put הרווח המקסימלי הוא הפרמיה: {st:csp.maxProfit}. את העלייה מקבל רק מי שמחזיק את המניה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"}],"summary":["**Put מגובה מזומן:** Short Put, עם כל הכסף לקניית המניות בחשבון.","**מתי מפסידים:** כשהמניה בפקיעה מתחת למימוש פחות הפרמיה. בדוגמה: מתחת למחיר {st:csp.be}.","**הפסד מקסימלי:** (מימוש − פרמיה) × 100. בדוגמה: {st:csp.maxLoss}.","בפקיעה זה **אותו גרף** כמו Covered Call באותו מימוש."],"ready":true,"unit":"5"},{"id":"5.4","title":"Spreads בדביט","minutes":7,"objective":"לבנות Bull Call Spread ו־Bear Put Spread, לחשב את המחיר נטו, ההפסד המקסימלי, הרווח המקסימלי ונקודת האיזון, ולהבין שאפשר לצדוק בכיוון ועדיין להפסיד.","strats":{"bc":{"name":"Bull Call Spread","desc":"Long Call במימוש $100 בפרמיה $4, ו־Short Call במימוש $105 בפרמיה $2","K":100,"legs":[{"type":"call","side":"long","K":100,"prem":4},{"type":"call","side":"short","K":105,"prem":2}]},"lc":{"name":"Long Call","desc":"Long Call במימוש $100 בפרמיה $4","K":100,"legs":[{"type":"call","side":"long","K":100,"prem":4}]},"bp":{"name":"Bear Put Spread","desc":"Long Put במימוש $100 בפרמיה $4, ו־Short Put במימוש $95 בפרמיה $2","K":100,"legs":[{"type":"put","side":"long","K":100,"prem":4},{"type":"put","side":"short","K":95,"prem":2}]}},"strat":"bc","items":[{"id":"5.4-c1","type":"concept","title":"מה זה Spread","body":"עד עכשיו כל פוזיציה הייתה אופציה אחת, או אופציה ומניה. **Spread** הוא פוזיציה שבנויה משתי אופציות מאותו סוג על אותה מניה: קונים אחת, וכותבים אחרת שמממנת חלק מהמחיר.\n\nכל אופציה בפוזיציה נקראת **רגל**.\n\n(לא לבלבל עם המרווח בין Bid ל־Ask משיעור 2.7, שגם לו קוראים Spread.)\n\n**ועוד שתי מילים שיחזרו בשמות:**\n**Bull:** מבנה שמרוויח כשהמניה עולה.\n**Bear:** מבנה שמרוויח כשהמניה יורדת.\nהמילה שאחריהן, Call או Put, אומרת רק מאילו אופציות המבנה בנוי.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-c1b","type":"concept","title":"Bull Call Spread","body":"המניה במחיר $100, ואתם חושבים שהיא תעלה.\n\n**רגל 1:** קונים Call במימוש $100, ומשלמים $4.\n**רגל 2:** כותבים Call במימוש $105, ומקבלים $2.\n\nשילמתם $4 וקיבלתם $2. ה**מחיר נטו** הוא $2, וכפול 100: $200.\n\nמשלמים כסף בכניסה, ולכן קוראים לזה Spread ב**דביט**.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-a1","type":"analogy","title":"שותף שלוקח את מה שמעל","body":"קניתם זכות להרוויח מעליית מחיר של דירה מעל $100,000. הזכות עלתה $4,000.\n\nחבר מציע: \"תן לי את כל העלייה **מעל** $105,000, ואני משלם לך עכשיו $2,000\". הסכמתם.\n\nעכשיו העסקה עולה לכם רק $2,000, וגם ההפסד המקסימלי ירד. אבל אם המחיר יזנק, כל מה שמעל $105,000 הולך לחבר.","breaks":"החבר בדוגמה מחכה לסוף. ב־Spread, ה־Call שכתבתם הוא אופציה אמריקאית, ומי שמחזיק אותה יכול לממש בכל יום (שיעור 1.6). וגם המחירים לא מוסכמים בין חברים: קונים במחיר ה־Ask וכותבים במחיר ה־Bid (שיעור 2.7)."},{"id":"5.4-l1","type":"mcq","life":true,"prompt":"הסכמתם לתת לחבר את כל העלייה מעל $105,000. הזכות שלכם מתחילה במחיר $100,000, והדירה שווה עכשיו $130,000. כמה מהעלייה נשאר אצלכם?","options":[{"text":"$5,000: העלייה שבין $100,000 לבין $105,000"},{"text":"$30,000: כל העלייה, כי הזכות המקורית שלכם"},{"text":"$15,000: חצי מהעלייה, והחצי השני לחבר"}],"correct":0,"explain":{"right":"כל מה שמעל $105,000 הולך לחבר. זו התקרה. ב־Bull Call Spread הרווח המקסימלי מוגבל להפרש בין שני המימושים, פחות מה ששילמתם נטו.","wrong":"מכרתם לחבר את כל מה שמעל $105,000, אז הוא שלו. אצלכם נשארת רק העלייה שבין $100,000 לבין $105,000: $5,000. ב־Spread זו התקרה על הרווח."},"source":"דוגמה מהחיים"},{"id":"5.4-q1","type":"mcq","fmt":"usd","prompt":"המניה במחיר $100. קניתם Call במימוש $100 ושילמתם $4 לאופציה. כתבתם Call במימוש $105 וקיבלתם $2 לאופציה. כמה שילמתם נטו על ה־Spread, לחוזה אחד?","options":[{"v":200},{"v":400},{"v":600},{"v":500}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bc","what":"net"}},"explain":{"right":"שילמתם $4 וקיבלתם $2: `($4 − $2) × 100 = $200`. זה גם ההפסד המקסימלי: אם שתי האופציות פוקעות בלי ערך, זה מה שהפסדתם.","wrong":"מחסירים את מה שקיבלתם ממה ששילמתם: `($4 − $2) × 100 = $200`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-c2","type":"concept","title":"הגרף: רצפה ותקרה","body":"ל־Bull Call Spread יש גם רצפה וגם תקרה.\n\n**המניה מתחת למחיר $100:** שתי האופציות פוקעות בלי ערך. הפסדתם את מה ששילמתם: {st:bc.maxLoss}. זה ההפסד המקסימלי.\n\n**המניה מעל $105:** ה־Call שקניתם שווה $5 יותר מה־Call שכתבתם, לא משנה כמה המניה עלתה. למשל במחיר $120: ה־Call שקניתם שווה $20, וזה שכתבתם שווה $15. ההפרש בין המימושים, $5, פחות $2 ששילמתם: `($5 − $2) × 100 = $300`. זה הרווח המקסימלי.\n\n**באמצע:** נקודת האיזון היא המימוש הנמוך ועוד המחיר נטו: `$100 + $2 = $102`.\n\nשימו לב: בין $100 לבין $102 המניה **עלתה**, ואתם עדיין **מפסידים**.","strat":"bc","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-q2","type":"chart-mcq","fmt":"usd","start":110,"prompt":"המניה נסחרה במחיר $100. בניתם Bull Call Spread: קניתם Call במימוש $100 במחיר $4, וכתבתם Call במימוש $105 במחיר $2. מה הרווח המקסימלי?","hint":"הזיזו את המחוון ימינה, מעבר למחיר $105.","options":[{"v":300},{"v":500},{"v":200},{"text":"בלתי מוגבל","unlimited":true}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bc","what":"maxProfit"}},"explain":{"right":"ההפרש בין המימושים הוא $5, ושילמתם $2 נטו: `($5 − $2) × 100 = $300`.","wrong":"מעל $105 ה־Spread שווה בדיוק את ההפרש בין המימושים, $5. מזה מחסירים את מה ששילמתם: `($5 − $2) × 100 = $300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-q3","type":"chart-mcq","fmt":"pnl","start":101,"prompt":"המניה נסחרה במחיר $100. בניתם Bull Call Spread: קניתם Call במימוש $100 במחיר $4, וכתבתם Call במימוש $105 במחיר $2. חשבתם שהמניה תעלה, והיא עלתה: בפקיעה היא במחיר $101. מה התוצאה?","options":[{"v":-100},{"v":100},{"v":-200},{"v":300}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bc","what":"pnl","S":101}},"explain":{"right":"ה־Call שקניתם שווה $1, ושילמתם $2 נטו: `($1 − $2) × 100 = −$100`. צדקתם בכיוון, אבל לא מספיק: נקודת האיזון היא $102.","wrong":"במחיר $101 ה־Call במימוש $100 שווה $1, וה־Call במימוש $105 לא שווה כלום. שילמתם $2 נטו: `($1 − $2) × 100 = −$100`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-q4","type":"mcq","fmt":"pnl","prompt":"המניה זינקה, ובפקיעה היא במחיר $120. מי שקנה רק Call במימוש $100 במחיר $4 הרוויח {st:lc.pnl@S=120}. סוחר אחר החזיק Bull Call Spread: אותו Call קנוי, ועוד Call כתוב במימוש $105 במחיר $2.\n\nמה הרוויח הסוחר השני?","options":[{"v":300},{"v":1600},{"v":1800},{"v":500}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bc","what":"pnl","S":120}},"explain":{"right":"ה־Spread נעצר ברווח המקסימלי, {st:bc.maxProfit}. זה המחיר של ההוזלה: שילמתם $200 במקום $400, וויתרתם על כל מה שמעל $105.","wrong":"מעל $105 הרווח של ה־Spread כבר לא גדל: הוא נשאר {st:bc.maxProfit}. ה־Call שכתבתם מקזז כל עלייה נוספת."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-c3","type":"concept","title":"Bear Put Spread: אותו רעיון, כלפי מטה","body":"מי שחושב שהמניה תרד יכול לבנות את אותו מבנה מ־Puts.\n\n**Bear Put Spread**, כשהמניה במחיר $100:\n**רגל 1:** קונים Put במימוש $100, ומשלמים $4.\n**רגל 2:** כותבים Put במימוש $95, ומקבלים $2.\n\nהמחיר נטו: $2, כלומר $200.\n\n**הפסד מקסימלי:** {st:bp.maxLoss}, אם המניה מעל $100 בפקיעה.\n**רווח מקסימלי:** {st:bp.maxProfit}, אם המניה מתחת למחיר $95.\n**נקודת איזון:** המימוש הגבוה פחות המחיר נטו, `$100 − $2 = $98`.","strat":"bp","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-q5","type":"chart-guess","strat":"bp","S":92,"prompt":"בניתם Bear Put Spread: קניתם Put במימוש $100 במחיר $4, וכתבתם Put במימוש $95 במחיר $2. בפקיעה המניה במחיר $92. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"bp","what":"pnl","S":92},"expect":300},"explain":{"right":"מתחת למחיר $95 ה־Spread שווה את ההפרש בין המימושים, $5, ושילמתם $2: `($5 − $2) × 100 = +$300`. זה הרווח המקסימלי.","wrong":"ה־Put שקניתם שווה $8, וה־Put שכתבתם שווה $3. ההפרש הוא $5, ושילמתם $2 נטו: `($5 − $2) × 100 = +$300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.4-q6","type":"mcq","fmt":"price","strat":"bp","prompt":"בניתם Bear Put Spread: קניתם Put במימוש $100 במחיר $4, וכתבתם Put במימוש $95 במחיר $2. באיזה מחיר מניה בפקיעה הפוזיציה באיזון?","options":[{"v":98},{"v":100},{"v":93},{"v":96}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bp","what":"be"}},"explain":{"right":"ה־Put שקניתם צריך להיות שווה $2 כדי להחזיר את מה ששילמתם: `$100 − $2 = $98`. בין $98 לבין $100 המניה ירדה, ואתם עדיין מפסידים.","wrong":"נקודת האיזון היא המימוש של ה־Put שקניתם פחות המחיר נטו: `$100 − $2 = $98`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"}],"summary":["**Spread בדביט:** קונים אופציה, וכותבים אופציה רחוקה יותר שמוזילה אותה.","**הפסד מקסימלי:** המחיר נטו ששילמתם. בדוגמה: {st:bc.maxLoss}.","**רווח מקסימלי:** (ההפרש בין המימושים − המחיר נטו) × 100. בדוגמה: {st:bc.maxProfit}.","**מתי מפסידים:** גם כשצדקתם בכיוון, אם המניה לא עברה את נקודת האיזון. ב־Bull Call: {st:bc.be}. ב־Bear Put: {st:bp.be}."],"ready":true,"unit":"5"},{"id":"5.5","title":"Spreads בקרדיט","minutes":7,"objective":"לבנות Bull Put Spread ו־Bear Call Spread, לחשב קרדיט, הפסד מקסימלי ונקודת איזון, ולהבין למה סיכוי גבוה לרווח הוא לא תוחלת חיובית.","strats":{"bps":{"name":"Bull Put Spread","desc":"Short Put במימוש $95 בפרמיה $2, ו־Long Put במימוש $90 בפרמיה $1","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2},{"type":"put","side":"long","K":90,"prem":1}]},"bcs":{"name":"Bear Call Spread","desc":"Short Call במימוש $105 בפרמיה $2, ו־Long Call במימוש $110 בפרמיה $1","K":100,"legs":[{"type":"call","side":"short","K":105,"prem":2},{"type":"call","side":"long","K":110,"prem":1}]},"np":{"name":"Naked Put","desc":"Short Put במימוש $95 בפרמיה $2","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2}]},"bcd":{"name":"Bull Call Spread","desc":"Long Call במימוש $90 בפרמיה $11, ו־Short Call במימוש $95 בפרמיה $7","K":100,"legs":[{"type":"call","side":"long","K":90,"prem":11},{"type":"call","side":"short","K":95,"prem":7}]}},"strat":"bps","items":[{"id":"5.5-c1","type":"concept","title":"הופכים את הסדר: כותבים, וקונים הגנה","body":"ב־Spread בדביט קנינו אופציה וכתבנו רחוקה יותר. ב־Spread ב**קרדיט** עושים הפוך: **כותבים** את האופציה הקרובה לכסף, ו**קונים** רחוקה יותר כהגנה.\n\n**Bull Put Spread**, כשהמניה במחיר $100:\n**רגל 1:** כותבים Put במימוש $95, ומקבלים $2.\n**רגל 2:** קונים Put במימוש $90, ומשלמים $1.\n\nקיבלתם $2 ושילמתם $1. נשאר אצלכם $1 נטו, וכפול 100: $100. זה ה**קרדיט**.\n\nלמה Bull, אם זה בנוי מ־Puts? כי המבנה מרוויח כשהמניה **לא יורדת**: כתבתם Put, ואתם רוצים שהוא יפקע בלי ערך.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q1","type":"mcq","fmt":"usd","prompt":"המניה במחיר $100. כתבתם Put במימוש $95 וקיבלתם $2 לאופציה. קניתם Put במימוש $90 ושילמתם $1 לאופציה. כמה קרדיט נשאר אצלכם, לחוזה אחד?","options":[{"v":100},{"v":300},{"v":200},{"v":500}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bps","what":"credit"}},"explain":{"right":"`($2 − $1) × 100 = $100`. זה גם הרווח המקסימלי של הפוזיציה.","wrong":"מחסירים את מה ששילמתם ממה שקיבלתם: `($2 − $1) × 100 = $100`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-c1b","type":"concept","title":"שלושה אזורים בפקיעה","strat":"bps","body":"Bull Put Spread: כתבתם Put במימוש $95 וקניתם Put במימוש $90. הקרדיט נטו: $1, כלומר $100.\n\n**המניה מעל $95:** שתי האופציות פוקעות. הקרדיט שלכם, $100. זה הרווח המקסימלי.\n\n**בין $90 לבין $95:** כל דולר מתחת למחיר $95 עולה לכם $100. נקודת האיזון: `$95 − $1 = $94`.\n\n**מתחת למחיר $90:** ה־Put שקניתם עוצר את ההפסד. למשל במחיר $85: ה־Put שכתבתם שווה $10, וזה שקניתם שווה $5. מפסידים את ההפרש, $5, פחות הקרדיט: `($5 − $1) × 100 = $400`. זה ההפסד המקסימלי.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q2","type":"chart-mcq","fmt":"usd","start":92,"prompt":"בניתם Bull Put Spread: כתבתם Put במימוש $95 במחיר $2, וקניתם Put במימוש $90 במחיר $1. מה ההפסד המקסימלי?","hint":"הזיזו את המחוון שמאלה, מתחת למחיר $90.","options":[{"v":400},{"v":100},{"v":500},{"v":9300}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bps","what":"maxLoss"}},"explain":{"right":"ההפרש בין המימושים הוא $5, וקיבלתם קרדיט של $1: `($5 − $1) × 100 = $400`. ה־Put שקניתם עוצר את ההפסד שם, גם אם המניה תרד לאפס.","wrong":"מתחת למחיר $90 ה־Put שקניתם מקזז כל ירידה נוספת. מפסידים את ההפרש בין המימושים פחות הקרדיט: `($5 − $1) × 100 = $400`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q3","type":"mcq","fmt":"price","prompt":"בניתם Bull Put Spread: כתבתם Put במימוש $95 במחיר $2, וקניתם Put במימוש $90 במחיר $1. באיזה מחיר מניה בפקיעה הפוזיציה באיזון?","options":[{"v":94},{"v":95},{"v":93},{"v":91}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"bps","what":"be"}},"explain":{"right":"המימוש של ה־Put שכתבתם, פחות הקרדיט: `$95 − $1 = $94`. מתחת למחיר הזה מפסידים.","wrong":"הקרדיט של $1 מכסה את הדולר הראשון של הירידה מתחת למימוש: `$95 − $1 = $94`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-c2","type":"concept","title":"מסכנים $400 כדי להרוויח $100","body":"ב־Bull Put Spread שבנינו, המניה במחיר $100 והפוזיציה מרוויחה כל עוד היא נשארת מעל $94. המניה יכולה לעלות, לא לזוז, ואפילו לרדת קצת. הסיכוי לרווח גבוה.\n\nאבל שימו לב ליחס: הרווח המקסימלי הוא {st:bps.maxProfit}, וההפסד המקסימלי הוא {st:bps.maxLoss}. הפסד מלא אחד מוחק ארבעה רווחים מלאים.\n\nזו בדיוק הדוגמה משיעור 4.3: הרבה רווחים קטנים, ומדי פעם הפסד גדול. סיכוי גבוה לרווח הוא תכונה של המבנה. הוא לא אומר שהתוחלת חיובית.\n\nוזה גם לא מקרה: השוק מתמחר את הקרדיט לפי הסיכוי. Spread עם סיכוי גבוה יותר לרווח נותן קרדיט קטן יותר.","source":"Natenberg, Option Volatility and Pricing; Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q4","type":"mcq","fmt":"pnl","prompt":"Bull Put Spread עם רווח מקסימלי של $100 והפסד מקסימלי של $400. נניח שב־80% מהמקרים הוא מסתיים ברווח המלא, וב־20% בהפסד המלא. מה התוחלת לעסקה, לפני עלויות?","options":[{"v":0},{"v":80},{"v":100},{"v":-20}],"correct":0,"check":{"fn":"expectancy","args":{"winPct":80,"win":100,"loss":400}},"explain":{"right":"`80% × $100 = $80`, ו־`20% × $400 = $80`. התוחלת: `$80 − $80 = $0`. 80% הצלחה, ואפס בממוצע. ואחרי עמלות ומרווחים על שתי רגליים, פחות מאפס.","wrong":"`80% × $100 = $80` ו־`20% × $400 = $80`. התוחלת היא ההפרש: `$80 − $80 = $0`. אחוז הצלחה של 80% לא מספיק כשההפסד גדול פי 4 מהרווח."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"5.5-c3","type":"concept","title":"Bear Call Spread: אותו מבנה, מהצד השני","body":"מי שחושב שהמניה **לא תעלה** הרבה בונה את אותו מבנה מ־Calls.\n\n**Bear Call Spread**, כשהמניה במחיר $100:\n**רגל 1:** כותבים Call במימוש $105, ומקבלים $2.\n**רגל 2:** קונים Call במימוש $110, ומשלמים $1.\n\nהקרדיט: $1, כלומר $100.\n\n**רווח מקסימלי:** {st:bcs.maxProfit}, אם המניה מתחת למחיר $105 בפקיעה.\n**הפסד מקסימלי:** {st:bcs.maxLoss}, אם המניה מעל $110.\n**נקודת איזון:** `$105 + $1 = $106`.\n\nה־Call שקניתם הוא מה שהופך Naked Call, עם הפסד בלתי מוגבל, לפוזיציה עם הפסד מוגבל.","strat":"bcs","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q5","type":"chart-guess","strat":"bcs","S":112,"prompt":"בניתם Bear Call Spread: כתבתם Call במימוש $105 במחיר $2, וקניתם Call במימוש $110 במחיר $1. אחרי הצעה לקנות את החברה, המניה בפקיעה במחיר $112. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"bcs","what":"pnl","S":112},"expect":-400},"explain":{"right":"מעל $110 ההפסד נעצר: ההפרש בין המימושים, $5, פחות הקרדיט של $1. `($1 − $5) × 100 = −$400`. בלי ה־Call שקניתם, ההפסד היה ממשיך לגדול.","wrong":"ה־Call שכתבתם שווה $7, וה־Call שקניתם שווה $2. ההפרש הוא $5, וקיבלתם $1: `($1 − $5) × 100 = −$400`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q6","type":"mcq","prompt":"המניה במחיר $100. כתבתם Put במימוש $95 וקיבלתם $2. אפשר להשאיר אותו כ־Naked Put, או לקנות גם Put במימוש $90 במחיר $1 ולהפוך אותו ל־Bull Put Spread. מה ההבדל?","options":[{"text":"ב־Spread הרווח המקסימלי יורד, {st:bps.maxProfit} במקום {st:np.maxProfit}, וגם ההפסד המקסימלי יורד, {st:bps.maxLoss} במקום {st:np.maxLoss}"},{"text":"אין הבדל בסיכון. ה־Spread פשוט מרוויח פחות, כי משלמים $1 על ה־Put הנוסף"},{"text":"ה־Spread מסוכן יותר, כי יש בו שתי רגליים ולכן שני מקורות להפסד"}],"correct":0,"explain":{"right":"ויתרתם על $100 מהפרמיה, וקניתם בזה תקרה להפסד. ב־Naked Put ההפסד ממשיך לגדול ככל שהמניה יורדת. ב־Spread הוא נעצר: {st:bps.maxLoss}, ולא יותר.","wrong":"ה־Put שקניתם עולה $1, ולכן הרווח המקסימלי קטן: {st:bps.maxProfit} במקום {st:np.maxProfit}. בתמורה, ההפסד המקסימלי קטן בהרבה: {st:bps.maxLoss} במקום {st:np.maxLoss}."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.5-q7","type":"mcq","prompt":"Bull Put Spread מהשיעור, עם Put כתוב במימוש $95 ו־Put קנוי במימוש $90: רווח מקסימלי של $100, הפסד מקסימלי של $400.\nBull Call Spread על אותם מימושים (Call קנוי במימוש $90, Call כתוב במימוש $95) עולה $4 נטו (לפני הכפלה ב־100).\n\nמה הרווח וההפסד המקסימליים של ה־Bull Call Spread?","options":[{"text":"בדיוק אותו דבר: רווח מקסימלי של {st:bcd.maxProfit} והפסד מקסימלי של {st:bcd.maxLoss}"},{"text":"הפוך: רווח מקסימלי של $400 והפסד מקסימלי של $100, כי משלמים במקום לקבל"},{"text":"אי אפשר להשוות, כי האחת בקרדיט והשנייה בדביט, וזה סיכון אחר"}],"correct":0,"explain":{"right":"אותם מימושים, אותו גרף בפקיעה. זה שוב הקשר בין Put ל־Call (שיעור 2.6). \"קרדיט\" לא אומר שמקבלים כסף חינם, ו\"דביט\" לא אומר שמסכנים יותר. ההבדל מחוץ לגרף: ב־Spread של ה־Calls הרגל הכתובה בתוך הכסף, ולכן חשופה יותר להקצאה לפני הפקיעה. נלמד על זה ביחידה 6.","wrong":"ה־Spread ב־Calls עולה $400 וזה ההפסד המקסימלי שלו. הרווח המקסימלי: `($5 − $4) × 100 = $100`. בדיוק כמו ה־Spread ב־Puts. אותם מימושים נותנים אותו גרף."},"source":"Hull, Options, Futures, and Other Derivatives, פרקים 11 ו־12"},{"id":"5.5-q8","type":"mcq","prompt":"פרסומת: \"Spreads בקרדיט: הכנסה שבועית עם 85% הצלחה!\" לפי מה שלמדתם, מה צריך לבדוק לפני שמתרשמים?","options":[{"text":"מה היחס בין ההפסד המקסימלי לקרדיט, ומה התוחלת אחרי עלויות"},{"text":"האם 85% גבוה יותר מאחוז ההצלחה של קניית מניות"},{"text":"כמה שבועות בשנה אפשר לחזור על העסקה"}],"correct":0,"explain":{"right":"אחוז הצלחה גבוה הוא תכונה של המבנה. דוגמה: קרדיט של $100 והפסד מקסימלי של $600. `85% × $100 = $85`, ו־`15% × $600 = $90`. התוחלת: `$85 − $90 = −$5`, עוד לפני עמלות.","wrong":"אחוז הצלחה לבדו לא אומר כלום (שיעור 4.3). צריך לדעת כמה מפסידים ב־15% הנותרים, ומה נשאר אחרי עמלות ומרווחים על שתי רגליים."},"source":"עקרונות הקורס; שיעור 4.3"}],"summary":["**Spread בקרדיט:** כותבים אופציה, וקונים אופציה רחוקה יותר שמגבילה את ההפסד.","**רווח מקסימלי:** הקרדיט. **הפסד מקסימלי:** (ההפרש בין המימושים − הקרדיט) × 100. בדוגמה: {st:bps.maxLoss}.","**מתי מפסידים:** כשהמניה זזה נגדכם ועוברת את נקודת האיזון. ב־Bull Put: מתחת למחיר {st:bps.be}. ב־Bear Call: מעל {st:bcs.be}.","סיכוי גבוה לרווח הוא תכונה של המבנה, **לא תוחלת חיובית**."],"ready":true,"unit":"5"},{"id":"5.6","title":"Straddle","minutes":7,"objective":"להבין ש־Long Straddle הוא הימור על תנועה גדולה לכל כיוון, ש־Short Straddle הוא הימור על שקט עם הפסד בלתי מוגבל, ולחשב את שתי נקודות האיזון.","strats":{"ls":{"name":"Long Straddle","desc":"Long Call ו־Long Put במימוש $100, כל אחד בפרמיה $4","K":100,"legs":[{"type":"call","side":"long","K":100,"prem":4},{"type":"put","side":"long","K":100,"prem":4}]},"ss":{"name":"Short Straddle","desc":"Short Call ו־Short Put במימוש $100, כל אחד בפרמיה $4","K":100,"legs":[{"type":"call","side":"short","K":100,"prem":4},{"type":"put","side":"short","K":100,"prem":4}]}},"strat":"ls","items":[{"id":"5.6-c1","type":"concept","title":"לא יודעים לאן, אבל חושבים שתהיה תנועה","body":"עד עכשיו לכל פוזיציה היה כיוון מועדף. **Straddle** הוא הימור על **גודל התנועה**, בלי כיוון.\n\n**Long Straddle**, כשהמניה במחיר $100:\n**רגל 1:** קונים Call במימוש $100, ומשלמים $4.\n**רגל 2:** קונים Put במימוש $100, ומשלמים $4.\n\nשילמתם יחד $8, וכפול 100: $800.\n\nאם המניה עולה חזק, ה־Call מרוויח. אם היא יורדת חזק, ה־Put מרוויח. אבל לפחות אחת משתי האופציות פוקעת בלי ערך, ולכן התנועה צריכה לכסות את המחיר של **שתיהן**.\n\n**שתי נקודות איזון:** `$100 − $8 = $92` ו־`$100 + $8 = $108`.\n**הפסד מקסימלי:** $800, אם המניה בפקיעה בדיוק במחיר $100.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.6-q1","type":"mcq","fmt":"usd","prompt":"המניה במחיר $100. קניתם Call במימוש $100 במחיר $4, וגם Put במימוש $100 במחיר $4. כמה שילמתם על ה־Straddle, לחוזה אחד מכל סוג?","options":[{"v":800},{"v":400},{"v":0},{"v":1600}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ls","what":"net"}},"explain":{"right":"`($4 + $4) × 100 = $800`. זה גם ההפסד המקסימלי.","wrong":"קניתם שתי אופציות ושילמתם על שתיהן: `($4 + $4) × 100 = $800`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.6-q2","type":"chart-guess","S":110,"prompt":"המניה נסחרה במחיר $100. פתחתם Long Straddle: קניתם Call ו־Put במימוש $100, כל אחד במחיר $4. בפקיעה המניה במחיר $110. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"ls","what":"pnl","S":110},"expect":200},"explain":{"right":"ה־Call שווה $10, ה־Put פקע, ושילמתם $8: `($10 − $8) × 100 = +$200`. המניה עלתה 10%, ונשאר רווח של $200.","wrong":"ה־Call שווה $10 וה־Put לא שווה כלום. שילמתם $8 על שניהם: `($10 − $8) × 100 = +$200`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.6-q3","type":"chart-mcq","fmt":"pnl","start":105,"prompt":"המניה נסחרה במחיר $100. פתחתם Long Straddle: קניתם Call ו־Put במימוש $100, כל אחד במחיר $4. חשבתם שהמניה תזוז, והיא זזה: בפקיעה היא במחיר $105, עלייה של 5%. מה התוצאה?","options":[{"v":-300},{"v":500},{"v":100},{"v":-800}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ls","what":"pnl","S":105}},"explain":{"right":"ה־Call שווה $5, ושילמתם $8: `($5 − $8) × 100 = −$300`. תנועה של 5% לא הספיקה. נקודת האיזון העליונה היא $108.","wrong":"ה־Call שווה $5 וה־Put פקע. שילמתם $8: `($5 − $8) × 100 = −$300`. כדי להרוויח המניה צריכה לעבור את $108 או לרדת מתחת למחיר $92."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.6-c2","type":"concept","title":"מה צריך לקרות כדי להרוויח","body":"מחיר ה־Straddle משקף את **התנועה שהשוק מתמחר** עד הפקיעה. בדוגמה: $8, כלומר בערך 8% לכל כיוון. ככל שה־IV גבוהה יותר, ה־Straddle יקר יותר (שיעור 2.4).\n\nלכן קונה Straddle לא מהמר ש\"תהיה תנועה\". הוא מהמר שהתנועה תהיה **גדולה ממה שהשוק כבר תמחר**.","source":"Natenberg, Option Volatility and Pricing"},{"id":"5.6-q4","type":"mcq","prompt":"סוחר קונה Straddle יום לפני דוח רבעוני, כי \"אחרי דוח המניה תמיד זזה\". מה הוא מפספס?","options":[{"text":"ה־IV כבר גבוהה וה־Straddle יקר: צריך תנועה גדולה ממה שתומחר"},{"text":"שום דבר: אם המניה זזה אחרי הדוח, ה־Straddle מרוויח"},{"text":"שאחרי דוח המניה בדרך כלל לא זזה בכלל"}],"correct":0,"explain":{"right":"לפני דוח ה־IV עולה, ואיתה מחיר ה־Straddle. אחרי הדוח היא צונחת. כדי להרוויח, התנועה צריכה להיות גדולה ממה שהשוק תמחר מראש, ולא סתם \"תנועה\".","wrong":"המניה אולי תזוז, אבל זה כבר במחיר. לפני דוח ה־Straddle יקר כי ה־IV גבוהה, ורק תנועה גדולה ממה שתומחר משאירה רווח."},"source":"Natenberg, Option Volatility and Pricing"},{"id":"5.6-c2b","type":"concept","title":"מה עובד נגד הקונה בינתיים","body":"**תטא.** הקונה מחזיק שתי אופציות, ושתיהן מאבדות ערך זמן בכל יום שהמניה לא זזה.\n\n**וגה.** אם ה־IV יורדת, שתי האופציות מוזלות יחד. זה מה שקורה אחרי דוח: ה־IV צונחת (IV Crush, שיעור 3.4), וה־Straddle יכול להפסיד גם אם המניה זזה.","source":"Natenberg, Option Volatility and Pricing; Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"5.6-q7","type":"mcq","prompt":"קניתם Straddle במימוש $100, 30 ימים לפקיעה. עבר שבוע, המניה עדיין במחיר $100, וה־IV לא השתנתה. מה קרה לשווי הפוזיציה?","options":[{"text":"הוא ירד: שתי האופציות איבדו שבוע של ערך זמן"},{"text":"הוא לא השתנה, כי המניה וה־IV לא זזו"},{"text":"הוא עלה, כי הפקיעה מתקרבת והתנועה קרובה"}],"correct":0,"explain":{"right":"ב־Long Straddle התטא שלילית פעמיים: שתי האופציות מאבדות ערך זמן. כל יום בלי תנועה עולה כסף, והקצב מואץ לקראת הפקיעה (שיעור 2.5).","wrong":"גם כשהמניה לא זזה, הזמן עובר. שתי האופציות שקניתם מאבדות ערך זמן כל יום, ולכן הפוזיציה שווה פחות."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"5.6-c3","type":"concept","title":"Short Straddle: הצד השני","body":"מי שכותב את שתי האופציות מקבל את אותם $800, ומהמר שהמניה **לא תזוז**.\n\n**Short Straddle:** כותבים Call במימוש $100 וגם Put במימוש $100, ומקבלים $4 על כל אחד.\n\n**רווח מקסימלי:** $800, אם המניה בפקיעה בדיוק במחיר $100.\n**נקודות איזון:** $92 מלמטה, $108 מלמעלה. ביניהן מרוויחים.\n**הפסד מקסימלי כלפי מעלה:** בלתי מוגבל.\n**הפסד מקסימלי כלפי מטה:** `($100 − $8) × 100 = $9,200`, אם המניה יורדת לאפס.","strat":"ss","source":"Hull, Options, Futures, and Other Derivatives, פרקים 12 ו־19"},{"id":"5.6-q5","type":"chart-mcq","fmt":"usd","strat":"ss","start":112,"prompt":"המניה נסחרה במחיר $100. פתחתם Short Straddle: כתבתם Call ו־Put במימוש $100, וקיבלתם $4 על כל אחד. מה ההפסד המקסימלי של הפוזיציה?","hint":"הזיזו את המחוון ימינה. האם הקו נעצר?","options":[{"text":"בלתי מוגבל","unlimited":true},{"v":800},{"v":9200},{"v":1600}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"ss","what":"maxLoss"}},"explain":{"right":"יש כאן Naked Call. אם המניה ממשיכה לעלות, ההפסד ממשיך לגדול בלי תקרה. הפרמיה של $800 היא כל מה שעומד מולו.","wrong":"הפוזיציה כוללת Call כתוב בלי מניות ובלי Call קנוי שמגן. כלפי מעלה ההפסד בלתי מוגבל. $9,200 הוא ההפסד המקסימלי רק כלפי מטה."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.6-q6","type":"chart-guess","strat":"ss","S":88,"prompt":"המניה נסחרה במחיר $100. פתחתם Short Straddle: כתבתם Call ו־Put במימוש $100, וקיבלתם $4 על כל אחד, $800 בסך הכול. אחרי דוח רע המניה בפקיעה במחיר $88. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"ss","what":"pnl","S":88},"expect":-400},"explain":{"right":"ה־Put שכתבתם שווה $12, וקיבלתם $8: `($8 − $12) × 100 = −$400`. כל הפרמיה נמחקה, ועוד $400 הפסד, בירידה אחת של 12%.","wrong":"ה־Put שכתבתם שווה `$100 − $88 = $12`, וה־Call פקע. קיבלתם $8 על שניהם: `($8 − $12) × 100 = −$400`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.6-c3b","type":"concept","title":"תטא חיובית, גמא שלילית","body":"בכל יום שקט, כותב ה־Straddle מרוויח את התטא של שתי האופציות. זה נראה כמו כסף שנכנס מעצמו.\n\nבשיעור 3.3 ראינו שזה לא כסף חינם: תטא חיובית היא התשלום על **גמא שלילית**. כשהמניה זזה חזק, הפוזיציה מפסידה, והקצב גדל ככל שהתנועה נמשכת.\n\nהכותב מקבל מעט בכל יום שקט, ומשלם הרבה ביום אחד סוער.","source":"Hull, Options, Futures, and Other Derivatives, פרק 19"},{"id":"5.6-q8","type":"mcq","prompt":"המניה נסחרת במחיר $100. כתבתם Straddle במימוש $100 וקיבלתם $800. שבועיים עברו בשקט, והפוזיציה ברווח. מה נכון לגבי הסיכון שנשאר?","options":[{"text":"הוא לא ירד: תנועה חדה אחת יכולה למחוק את הרווח ויותר"},{"text":"הוא ירד לאפס, כי רוב ערך הזמן כבר נגבה"},{"text":"הוא קיים רק כלפי מטה, כי המניה לא יכולה לעלות בלי גבול"}],"correct":0,"explain":{"right":"הרווח מהתטא מצטבר לאט. הגמא השלילית נשארת עד הפקיעה, ואפילו גדלה כשהפקיעה מתקרבת והמניה על הכסף (שיעור 3.2). ההפסד כלפי מעלה עדיין בלתי מוגבל.","wrong":"שבועיים שקטים לא משנים את המבנה: כלפי מעלה ההפסד עדיין בלתי מוגבל, וגמא של אופציה על הכסף גדלה כשהפקיעה מתקרבת (שיעור 3.2)."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 19"}],"summary":["**Long Straddle:** Call ועוד Put באותו מימוש. הימור על תנועה גדולה, לכל כיוון.","**מתי מפסידים:** כשהמניה נשארת בין שתי נקודות האיזון. בדוגמה: בין {st:ls.be} לבין {st:ls.be2}. הפסד מקסימלי: {st:ls.maxLoss}.","כדי להרוויח, התנועה צריכה להיות **גדולה ממה שהשוק תמחר**. תטא ו־IV Crush עובדים נגד הקונה.","**Short Straddle:** רווח מקסימלי של {st:ss.maxProfit}, והפסד **בלתי מוגבל** כלפי מעלה."],"ready":true,"unit":"5"},{"id":"5.7","title":"Strangle","minutes":7,"objective":"להבין במה Strangle שונה מ־Straddle: זול יותר, ודורש תנועה גדולה יותר. ולהבין את סיכון הזנב של Short Strangle.","strats":{"lg":{"name":"Long Strangle","desc":"Long Put במימוש $95 ו־Long Call במימוש $105, כל אחד בפרמיה $2","K":100,"legs":[{"type":"put","side":"long","K":95,"prem":2},{"type":"call","side":"long","K":105,"prem":2}]},"sg":{"name":"Short Strangle","desc":"Short Put במימוש $95 ו־Short Call במימוש $105, כל אחד בפרמיה $2","K":100,"legs":[{"type":"put","side":"short","K":95,"prem":2},{"type":"call","side":"short","K":105,"prem":2}]},"ls":{"name":"Long Straddle","desc":"Long Call ו־Long Put במימוש $100, כל אחד בפרמיה $4","K":100,"legs":[{"type":"call","side":"long","K":100,"prem":4},{"type":"put","side":"long","K":100,"prem":4}]}},"strat":"lg","items":[{"id":"5.7-c1","type":"concept","title":"Straddle זול יותר, ומה זה עולה","body":"ה־Straddle מהשיעור הקודם עלה $800. אפשר לבנות את אותו רעיון בזול יותר, אם קונים אופציות **מחוץ לכסף**.\n\n**Long Strangle**, כשהמניה במחיר $100:\n**רגל 1:** קונים Put במימוש $95, ומשלמים $2.\n**רגל 2:** קונים Call במימוש $105, ומשלמים $2.\n\nשילמתם יחד $4, וכפול 100: $400. חצי מה־Straddle.\n\n**המחיר של ההנחה:** המניה צריכה קודם להגיע לאחד המימושים, ורק אז האופציה מתחילה להיות שווה משהו.\n\n**נקודות איזון:** `$95 − $4 = $91` ו־`$105 + $4 = $109`. רחוקות יותר מאשר ב־Straddle ($92 מלמטה, $108 מלמעלה).\n**הפסד מקסימלי:** $400, בכל מקום בין $95 לבין $105. לא רק בנקודה אחת.","source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-q1","type":"chart-mcq","fmt":"usd","start":100,"prompt":"Long Strangle: המניה במחיר $100. קניתם Put במימוש $95 במחיר $2, ו־Call במימוש $105 במחיר $2. מה ההפסד המקסימלי?","hint":"הזיזו את המחוון בין $95 לבין $105.","options":[{"v":400},{"v":200},{"v":800},{"v":1000}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"lg","what":"maxLoss"}},"explain":{"right":"`($2 + $2) × 100 = $400`. מפסידים אותו בכל מחיר בין $95 לבין $105, כי שתי האופציות פוקעות בלי ערך.","wrong":"ההפסד המקסימלי הוא מה ששילמתם על שתי האופציות: `($2 + $2) × 100 = $400`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-q2","type":"mcq","fmt":"price","prompt":"המניה נסחרה במחיר $100. פתחתם Long Strangle: קניתם Put במימוש $95 במחיר $2, ו־Call במימוש $105 במחיר $2. מעל איזה מחיר מניה בפקיעה הפוזיציה מתחילה להרוויח?","options":[{"v":109},{"v":105},{"v":107},{"v":104}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"lg","what":"be","i":1}},"explain":{"right":"ה־Call צריך להיות שווה $4 כדי להחזיר את מה ששילמתם על שתי האופציות: `$105 + $4 = $109`.","wrong":"במחיר $105 ה־Call רק מתחיל להיות שווה משהו. הוא צריך לכסות את הפרמיה של שתי האופציות, $4: `$105 + $4 = $109`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-q3","type":"mcq","fmt":"pnl","prompt":"המניה הייתה במחיר $100, ובפקיעה היא במחיר $106. מי שקנה Straddle במימוש $100 במחיר $8 סיים עם {st:ls.pnl@S=106}. סוחר אחר קנה Strangle: Put במימוש $95 ו־Call במימוש $105, במחיר $4 בסך הכול.\n\nמה התוצאה של הסוחר השני?","options":[{"v":-300},{"v":-200},{"v":200},{"v":-400}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"lg","what":"pnl","S":106}},"explain":{"right":"ה־Call במימוש $105 שווה $1, ושילמתם $4: `($1 − $4) × 100 = −$300`. ה־Strangle עלה חצי, אבל באותה תנועה הוא הפסיד יותר מה־Straddle.","wrong":"במחיר $106 ה־Call במימוש $105 שווה רק $1. שילמתם $4 על שתי האופציות: `($1 − $4) × 100 = −$300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-q4","type":"chart-guess","S":112,"prompt":"המניה נסחרה במחיר $100. פתחתם Long Strangle: קניתם Put במימוש $95 במחיר $2, ו־Call במימוש $105 במחיר $2. המניה זינקה, ובפקיעה היא במחיר $112. נחשו: מה הרווח או ההפסד?","check":{"fn":"legsStat","args":{"strat":"lg","what":"pnl","S":112},"expect":300},"explain":{"right":"ה־Call שווה $7, ושילמתם $4: `($7 − $4) × 100 = +$300`. נדרשה עלייה של 12% כדי להרוויח $300.","wrong":"ה־Call במימוש $105 שווה `$112 − $105 = $7`. שילמתם $4 על שתי האופציות: `($7 − $4) × 100 = +$300`."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-c2","type":"concept","title":"Short Strangle: טווח רחב, זנב ארוך","body":"מי שכותב את שתי האופציות מקבל $400, ומרוויח כל עוד המניה נשארת בין $91 לבין $109. זה טווח רחב, ולכן ברוב החודשים הפוזיציה מרוויחה.\n\n**Short Strangle:** כותבים Put במימוש $95 ו־Call במימוש $105.\n\n**רווח מקסימלי:** $400.\n**הפסד מקסימלי כלפי מעלה:** בלתי מוגבל.\n**הפסד מקסימלי כלפי מטה:** `($95 − $4) × 100 = $9,100`, אם המניה יורדת לאפס.","strat":"sg","source":"Hull, Options, Futures, and Other Derivatives, פרק 12; Natenberg, Option Volatility and Pricing"},{"id":"5.7-q5","type":"chart-mcq","fmt":"usd","strat":"sg","start":100,"prompt":"Short Strangle: המניה במחיר $100. כתבתם Put במימוש $95 ו־Call במימוש $105, וקיבלתם $2 על כל אחד. מה הרווח המקסימלי?","options":[{"v":400},{"v":200},{"v":1000},{"text":"בלתי מוגבל","unlimited":true}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"sg","what":"maxProfit"}},"explain":{"right":"הרווח המקסימלי של כותב הוא הפרמיה: `($2 + $2) × 100 = $400`, אם המניה בפקיעה בין $95 לבין $105.","wrong":"כותב מרוויח לכל היותר את הפרמיה שקיבל: `($2 + $2) × 100 = $400`. מה שבלתי מוגבל כאן הוא ההפסד."},"source":"Hull, Options, Futures, and Other Derivatives, פרק 12"},{"id":"5.7-c2b","type":"concept","title":"סיכון זנב","body":"Short Strangle הוא הדוגמה הכי ברורה למה שלמדנו בשיעור 4.3: אחוז הצלחה גבוה, והפסד נדיר וגדול.\n\nחודש אחרי חודש של עד $400, ואז פער פתיחה אחד שמוחק את כולם. לזה קוראים **סיכון זנב**: הפסד נדיר, וגדול מאוד.\n\nוזה גם שתי כתיבות חשופות. הברוקר דורש עליהן ביטחונות, והדרישה עולה בדיוק כשהמניה זזה נגדכם. נלמד על זה ביחידה 6.","source":"Natenberg, Option Volatility and Pricing"},{"id":"5.7-q6","type":"mcq","fmt":"pnl","prompt":"המניה נסחרה במחיר $100. פתחתם Short Strangle: כתבתם Put במימוש $95 ו־Call במימוש $105, וקיבלתם $400 בסך הכול. שלושה חודשים ברצף זה עבד, ברווח המלא. בחודש הרביעי יצא דוח רע, והמניה בפקיעה במחיר $75. מה התוצאה של החודש הרביעי?","options":[{"v":-1600},{"v":-400},{"v":400},{"v":-2000}],"correct":0,"check":{"fn":"legsStat","args":{"strat":"sg","what":"pnl","S":75}},"explain":
