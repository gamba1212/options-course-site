    };
    app.querySelectorAll('[data-bs]').forEach(function (b) { b.onclick = function () { if (L.checked) return; L.bside = b.getAttribute('data-bs'); render(); }; });
    app.querySelectorAll('[data-bt]').forEach(function (b) { b.onclick = function () { if (L.checked) return; L.btype = b.getAttribute('data-bt'); render(); }; });
    app.querySelectorAll('[data-oa]').forEach(function (b) { b.onclick = function () { if (L.checked) return; L.oact = b.getAttribute('data-oa'); render(); }; });
    app.querySelectorAll('[data-oe]').forEach(function (b) { b.onclick = function () { if (L.checked) return; L.oeff = b.getAttribute('data-oe'); render(); }; });
    app.querySelectorAll('[data-pk]').forEach(function (inp) { inp.oninput = function () { var k = inp.getAttribute('data-pk'), f = PSL[k]; L.px[k] = f.fromUI(+inp.value); if (!L.moved) { L.moved = true; var cb = document.getElementById('check'); if (cb && it.type === 'iv-find') cb.disabled = false; } var w = document.getElementById('pricewrap'); if (w) w.innerHTML = priceInner(it); var lab = document.getElementById('pl-' + k); if (lab) lab.innerHTML = f.label(L.px[k]); }; });
    var tdays = document.getElementById('tdays');
    if (tdays) tdays.oninput = function () { L.days = it.timeSet.days0 - (+tdays.value); var w = document.getElementById('timewrap'); if (w) w.innerHTML = timeInner(it); };
    app.querySelectorAll('[data-cexp]').forEach(function (b) { b.onclick = function () { L.cv.exp = b.getAttribute('data-cexp'); render(); }; });
    app.querySelectorAll('[data-cview]').forEach(function (b) { b.onclick = function () { L.cv.view = b.getAttribute('data-cview'); render(); }; });
    app.querySelectorAll('[data-ck]').forEach(function (b) { b.onclick = function () { if (L.checked) return; L.tap = { exp: L.cv.exp, type: L.cv.view, K: +b.getAttribute('data-ck'), col: b.getAttribute('data-ccol') }; render(); }; });
    app.querySelectorAll('.claim').forEach(function (b) { b.onclick = function () { if (L.checked) return; var i = +b.getAttribute('data-c'); L.marks[i] = !L.marks[i]; render(); }; });
    var px = document.getElementById('px');
    if (px) px.oninput = function () {
      L.S = +px.value;
      if (!L.moved) { L.moved = true; var cb = document.getElementById('check'); if (cb && it.type === 'chart-target') cb.disabled = false; }
      var v = pnlAt(posOf(it), L.S);
      document.getElementById('svgwrap').innerHTML = chartSVG(it);
      document.getElementById('pxv').textContent = '$' + L.S;
      var pv = document.getElementById('pnlv'); pv.innerHTML = hideReadout(it) ? '' : iso(fmt(v, 'pnl')) + ' לחוזה';
      pv.style.color = v > 0 ? 'var(--pri-dark)' : (v < 0 ? 'var(--loss-dark)' : 'var(--ink)');
    };
  }

  function confirmExit() {
    var d = document.createElement('div');
    d.className = 'sheet-wrap';
    d.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="exit-t"><b id="exit-t" style="font-size:18px">לצאת מהשיעור?</b><p style="margin:0;font-size:15px;line-height:1.5">ההתקדמות נשמרת, ואפשר לחזור ולהמשיך מאותה נקודה.</p><button type="button" class="btn pri block" id="stay">להמשיך בשיעור</button><button type="button" class="btn ghost block" id="leave">לצאת</button></div>';
    app.appendChild(d);
    document.getElementById('stay').onclick = function () { d.remove(); };
    document.getElementById('leave').onclick = function () { if (!L.isReview) savePause(); L = null; renderHome(); };
    document.getElementById('stay').focus();
  }

  function savePause() {
    P.paused = L && !L.isReview ? { id: L.lesson.id, queue: L.queue, pos: L.pos, firstTry: L.firstTry, order: L.order, seen: L.seen || {}, completed: L.completed, total: L.total } : null;
    save();
  }
  function resumeIfPaused(id) {
    var z = P.paused; if (!z || z.id !== id) return false;
    var lesson = findLesson(id); if (!lesson || !lesson.ready) return false;
    L = { lesson: lesson, queue: z.queue, pos: z.pos, firstTry: z.firstTry || {}, order: z.order || {}, seen: z.seen || {}, completed: z.completed, total: z.total, picked: null, checked: false, moved: false, S: null, isReview: false };
    P.paused = null; save(); prepItem(); render(); top(); return true;
  }
  function renderNoHearts() {
    app.innerHTML = '<div class="screen"><div class="done-wrap"><h1 class="center" style="margin:40px 0 0;font-size:26px">נגמרו הלבבות</h1>' + gammaSay(GLINES.nohearts[0], 'md') +
      '<div class="card"><p style="margin:0;font-size:16px;line-height:1.6">כל טעות הגיעה עם הסבר. כדי להחזיר לבבות, תרגלו את השאלות שטעיתם בהן: כל תשובה נכונה בתרגול מחזירה לב אחד, והתרגול עצמו לא עולה לבבות. מחר הלבבות מתמלאים מחדש.</p></div>' +
      (P.paused ? '<div class="card"><p style="margin:0;font-size:15px">השיעור ' + P.paused.id + ' נשמר, ותוכלו להמשיך אותו מאותה נקודה.</p></div>' : '') +
      '<div class="grow"></div>' + (P.review.length ? '<button type="button" class="btn pri block" id="again">לתרגול החוזר</button>' : '<div class="disc">אין כרגע שאלות לתרגול. הלבבות יתמלאו מחר.</div>') + '<button type="button" class="btn ghost block" id="home">חזרה למסלול</button></div></div>';
    var ag = document.getElementById('again'); if (ag) ag.onclick = function () { L = null; startReview(); };
    document.getElementById('home').onclick = function () { L = null; renderHome(); };
  }

  function renderComplete(gained, firstOk, graded) {
    // השיעור הבא לפי הסדר בסילבוס, אחרי השיעור שהסתיים (ולא השיעור הראשון שעוד לא הושלם)
    var curIdx = L.isReview ? -1 : UNIT.lessons.map(function (l) { return l.id; }).indexOf(L.lesson.id);
    var nextReady = L.isReview ? null : UNIT.lessons.slice(curIdx + 1).filter(function (l) { return l.ready; })[0];
    var resumeL = L.isReview && P.paused ? findLesson(P.paused.id) : null;
    var myUnit = !L.isReview && (UNIT.units || [UNIT]).filter(function (u) { return u.lessons.some(function (l) { return l.id === L.lesson.id; }); })[0];
    var unitEnd = !!(myUnit && myUnit.recap && myUnit.lessons.every(function (l) { return !l.ready || P.done[l.id]; }) && (!nextReady || nextReady.unit !== myUnit.id));
    var newCards = L.isReview ? [] : (UNIT.glossary || []).filter(function (t) { return t.lesson === L.lesson.id; });
    var mine = L.isReview ? 0 : L.lesson.items.filter(function (it) { return P.review.indexOf(it.id) >= 0; }).length;
    var sum = L.isReview ? '' : '<section class="card list"><h2 style="margin:0 0 10px;font-size:17px">מה למדתם</h2>' + L.lesson.summary.map(function (s) { return '<p>' + md(s) + '</p>'; }).join('') + '</section>';
    app.innerHTML = '<div class="screen"><div class="done-wrap"><div class="big-check done-gamma host wave">' + gammaSVG('') + '<div class="bubble"><b>גמא:</b> ' + esc(pick(L.isReview ? GLINES.review : (nextReady ? GLINES.done : GLINES.done.filter(function (x) { return x.indexOf('הבא') < 0; })))) + '</div></div>' +
      '<h1 class="center" style="margin:0;font-size:28px">' + (L.isReview ? 'התרגול הושלם' : 'השיעור הושלם') + '</h1>' + (L.isReview ? '' : '<div class="center hint" style="font-size:15px">' + L.lesson.id + ' ' + esc(L.lesson.title) + '</div>') +
      '<div class="stats3"><div class="card"><b style="color:var(--pri)" dir="ltr">+' + gained + '</b><span>XP</span></div><div class="card"><b style="color:var(--streak)">' + P.streak + '</b><span>ימי רצף</span></div><div class="card"><b dir="ltr">' + firstOk + '/' + graded + '</b><span>נכון בניסיון הראשון</span></div></div>' +
      sum + (newCards.length ? '<div class="card"><p style="margin:0;font-size:15px">נוספו למילון: <b>' + newCards.map(function (t) { return esc(t.term); }).join(', ') + '</b></p></div>' : '') + (mine ? '<div class="card"><p style="margin:0;font-size:15px">' + (mine === 1 ? 'שאלה אחת שטעיתם בה בשיעור הזה נשמרה' : mine + ' שאלות שטעיתם בהן בשיעור הזה נשמרו') + ' לתרגול החוזר. חזרה אחרי יום עוזרת לזכור.</p></div>' : '') +
      (L.isReview ? '<div class="card"><p style="margin:0;font-size:15px">' + (L.heartsGained ? 'החזרתם ' + plural(L.heartsGained, 'לב אחד', 'לבבות') + '. ' : '') + 'יש לכם עכשיו ' + plural(P.hearts, 'לב אחד', 'לבבות') + '.</p></div>' : '') +
      '<div class="grow"></div><div class="disc">תרגול לימודי בלבד. אין בקורס המלצה לפעולה בניירות ערך.</div>' +
      '<div class="actions">' + (resumeL ? '<button type="button" class="btn pri block" id="resume">חזרה לשיעור ' + resumeL.id + '</button>' : '') +
      (unitEnd ? '<button type="button" class="btn pri block" id="rcend">סיכום היחידה בפחות מדקה</button>' : '') +
      (nextReady ? '<button type="button" class="btn ' + (unitEnd ? 'ghost' : 'pri') + ' block" id="nextl">לשיעור הבא: ' + nextReady.id + '</button>' : '') +
      '<button type="button" class="btn ' + (nextReady || resumeL || unitEnd ? 'ghost' : 'pri') + ' block" id="home">חזרה למסלול</button></div></div></div>';
    document.getElementById('home').onclick = function () { L = null; renderHome(); };
    if (nextReady) document.getElementById('nextl').onclick = function () { L = null; startLesson(nextReady.id); };
    var rce = document.getElementById('rcend'); if (rce) rce.onclick = function () { L = null; startRecap(myUnit); };
    if (resumeL) document.getElementById('resume').onclick = function () { L = null; if (P.hearts > 0) resumeIfPaused(resumeL.id); else renderHome(); };
  }

  function render() { if (L) renderLesson(); else renderHome(); }
  // לבדיקות אוטומטיות: הפריט הנוכחי
  window.__ocCur = function () { return L && L.queue ? cur() : null; };
  function top() { try { window.scrollTo(0, 0); } catch (e) {} }
  app.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('.term-link'); if (b) { e.preventDefault(); showTerm(+b.getAttribute('data-term')); } });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { var w = app.querySelector('.sheet-wrap'); if (w) { w.remove(); return; } }
    var b = e.target.closest && e.target.closest('.term-link'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); showTerm(+b.getAttribute('data-term')); }
  });
  render();
})();
</script>
</body>
</html>
